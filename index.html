function CoachView({ athletes, onOpenAthlete, onAddAthlete, onOpenExerciseLibrary, onOpenDishLibrary, onOpenGyms }) {
  const [showAdd, setShowAdd] = useState(false);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [error, setError] = useState(false);

  function handleAdd() {
    if (!name.trim() || !phone.trim()) {
      setError(true);
      return;
    }
    onAddAthlete(name.trim(), phone.trim());
    setName("");
    setPhone("");
    setError(false);
    setShowAdd(false);
  }

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Coach</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        Gère le programme, les séances reçues et les objectifs de chacun de tes suivis.
      </div>

      <div style={S.programList}>
        {athletes.map((a) => (
          <button key={a.id} style={S.sessionLogRow} onClick={() => onOpenAthlete(a.id)}>
            <div>
              <div style={S.exRowName}>{a.name}</div>
              <div style={S.caption}>{a.programs.length} séance(s) · {a.sessions.length} reçue(s)</div>
            </div>
            <span style={S.caption}>→</span>
          </button>
        ))}
        {athletes.length === 0 && <div style={S.caption}>Aucun suivi pour l'instant.</div>}
      </div>

      {showAdd ? (
        <div style={S.newBlockRow}>
          <input
            style={S.textInput}
            placeholder="Nom du suivi (ex : Baptiste)"
            value={name}
            onChange={(e) => setName(e.target.value)}
          />
          <input
            style={S.textInput}
            placeholder="Numéro WhatsApp (ex : 0612345678)"
            value={phone}
            onChange={(e) => setPhone(e.target.value.replace(/[^0-9+]/g, ""))}
          />
          {error && <div style={S.exportStatusError}>Le nom et le numéro sont obligatoires — ils serviront à tous les envois par WhatsApp.</div>}
          <button style={S.goalSaveBtn} onClick={handleAdd}>
            <Check size={16} />
          </button>
        </div>
      ) : (
        <button style={S.createBtn} onClick={() => setShowAdd(true)}>
          <Plus size={16} /> Ajouter un suivi
        </button>
      )}

      <div style={S.exportBox}>
        <div style={S.exportLabel}>Bibliothèques</div>
        <div style={{ ...S.caption, marginBottom: 10 }}>
          Des exercices, des plats et des salles de sport réutilisables pour construire tes programmes plus vite.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <button style={{ ...S.exportBtnGhost, flex: 1 }} onClick={onOpenExerciseLibrary}>
            Exercices
          </button>
          <button style={{ ...S.exportBtnGhost, flex: 1 }} onClick={onOpenDishLibrary}>
            Plats
          </button>
        </div>
        <button style={{ ...S.exportBtnGhost, width: "100%" }} onClick={onOpenGyms}>
          Salles de sport
        </button>
      </div>
    </div>
  );
}

/* ---------- Coach : détail d'un suivi ---------- */


function AthleteDetailView({ athlete, onBack, onUpdateAthlete, onDeleteAthlete, exerciseLibrary, dishLibrary, gymMachines, onSaveToLibrary }) {
  const [programForm, setProgramForm] = useState(null);
  const [viewingSession, setViewingSession] = useState(null);
  const [viewingExercise, setViewingExercise] = useState(null);
  const [showImportSession, setShowImportSession] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [justImportedSession, setJustImportedSession] = useState(null);
  const [goalDrafts, setGoalDrafts] = useState({});
  const [confirmDeleteAthlete, setConfirmDeleteAthlete] = useState(false);
  const [openProgram, setOpenProgram] = useState(null);
  const [confirmDeleteProgram, setConfirmDeleteProgram] = useState(null);
  const [athleteSection, setAthleteSection] = useState("programmes");
  const [athleteMainSection, setAthleteMainSection] = useState(null); // null | "programme" | "nutrition"
  const [mealForm, setMealForm] = useState(null);
  const [openMeal, setOpenMeal] = useState(null);
  const [openMealDay, setOpenMealDay] = useState(1);
  const [showAthleteShoppingList, setShowAthleteShoppingList] = useState(false);
  const [showImportNutriLog, setShowImportNutriLog] = useState(false);
  const [editingStepGoal, setEditingStepGoal] = useState(false);
  const [stepGoalDraft, setStepGoalDraft] = useState(athlete.stepGoal || "");
  const [showImportStepLog, setShowImportStepLog] = useState(false);
  const [importStepLogText, setImportStepLogText] = useState("");
  const [importStepLogStatus, setImportStepLogStatus] = useState(null);

  function saveAthleteStepGoal() {
    onUpdateAthlete(athlete.id, { stepGoal: stepGoalDraft });
    setEditingStepGoal(false);
  }

  function exportAthleteStepGoal() {
    const text = `👟 Objectif de pas quotidien : ${stepGoalDraft || athlete.stepGoal} pas/jour\n` + packPayload("STEPGOAL", { goal: stepGoalDraft || athlete.stepGoal });
    window.location.href = buildWhatsAppLink(athlete.phone || "", text);
  }

  function processStepLogImport(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "STEPLOG" || !parsed.data.logs) {
      setImportStepLogStatus("error");
      setTimeout(() => setImportStepLogStatus(null), 2500);
      return;
    }
    const existingDates = new Set((athlete.stepLogs || []).map((l) => l.date));
    const newOnes = parsed.data.logs.filter((l) => !existingDates.has(l.date));
    const next = [...(athlete.stepLogs || []), ...newOnes];
    onUpdateAthlete(athlete.id, { stepLogs: next });
    setImportStepLogStatus("ok");
    setImportStepLogText("");
    setShowImportStepLog(false);
    setTimeout(() => setImportStepLogStatus(null), 2500);
  }

  async function handlePasteStepLog() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStepLogStatus("error");
        setTimeout(() => setImportStepLogStatus(null), 2500);
        return;
      }
      processStepLogImport(text);
    } catch (e) {
      setImportStepLogStatus("clipboard-error");
      setTimeout(() => setImportStepLogStatus(null), 2500);
    }
  }
  const [importNutriLogText, setImportNutriLogText] = useState("");
  const [importNutriLogStatus, setImportNutriLogStatus] = useState(null);

  function processNutriLogImport(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "NUTRILOG" || !parsed.data.logs) {
      setImportNutriLogStatus("error");
      setTimeout(() => setImportNutriLogStatus(null), 2500);
      return;
    }
    const next = [...(athlete.nutritionLogs || []), ...parsed.data.logs];
    onUpdateAthlete(athlete.id, { nutritionLogs: next });
    setImportNutriLogStatus("ok");
    setImportNutriLogText("");
    setShowImportNutriLog(false);
    setTimeout(() => setImportNutriLogStatus(null), 2500);
  }

  async function handlePasteNutriLog() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportNutriLogStatus("error");
        setTimeout(() => setImportNutriLogStatus(null), 2500);
        return;
      }
      processNutriLogImport(text);
    } catch (e) {
      setImportNutriLogStatus("clipboard-error");
      setTimeout(() => setImportNutriLogStatus(null), 2500);
    }
  }
  const [openMealDish, setOpenMealDish] = useState(null);
  const [confirmDeleteMeal, setConfirmDeleteMeal] = useState(null);
  const [selectedAthleteBlockId, setSelectedAthleteBlockId] = useState(null);
  const [showNewAthleteBlock, setShowNewAthleteBlock] = useState(false);
  const [newAthleteBlockName, setNewAthleteBlockName] = useState("");
  const [confirmDeleteAthleteBlock, setConfirmDeleteAthleteBlock] = useState(false);
  const [editingAthleteBlockName, setEditingAthleteBlockName] = useState(false);
  const [athleteBlockNameDraft, setAthleteBlockNameDraft] = useState("");
  const [showImportProgram, setShowImportProgram] = useState(false);
  const [importProgramText, setImportProgramText] = useState("");
  const [importProgramStatus, setImportProgramStatus] = useState(null);

  function renameAthleteBlock() {
    if (!athleteBlockNameDraft.trim() || !selectedAthleteBlock) return;
    const next = athleteBlocks.map((b) => (b.id === selectedAthleteBlock.id ? { ...b, name: athleteBlockNameDraft.trim() } : b));
    onUpdateAthlete(athlete.id, { blocks: next });
    setEditingAthleteBlockName(false);
  }

  function processProgramImport(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "PROGRAM" || !parsed.data.programs) {
      setImportProgramStatus("error");
      setTimeout(() => setImportProgramStatus(null), 2500);
      return;
    }
    const newPrograms = parsed.data.programs.map((p) => ({ ...p, id: uid(), blockId: selectedAthleteBlock?.id || "athlete-block" }));
    const next = [...athlete.programs, ...newPrograms];
    onUpdateAthlete(athlete.id, { programs: next });
    setImportProgramStatus("ok");
    setImportProgramText("");
    setShowImportProgram(false);
    setTimeout(() => setImportProgramStatus(null), 2500);
  }

  async function handlePasteProgram() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportProgramStatus("error");
        setTimeout(() => setImportProgramStatus(null), 2500);
        return;
      }
      processProgramImport(text);
    } catch (e) {
      setImportProgramStatus("clipboard-error");
      setTimeout(() => setImportProgramStatus(null), 2500);
    }
  }

  const [editingAthleteProfile, setEditingAthleteProfile] = useState(false);
  const [athleteProfileDraft, setAthleteProfileDraft] = useState({});
  const [showImportProfile, setShowImportProfile] = useState(false);
  const [importProfileText, setImportProfileText] = useState("");
  const [importProfileStatus, setImportProfileStatus] = useState(null);

  function openEditAthleteProfile() {
    setAthleteProfileDraft(athlete.profile || {});
    setEditingAthleteProfile(true);
  }
  function saveAthleteProfile() {
    onUpdateAthlete(athlete.id, { profile: athleteProfileDraft });
    setEditingAthleteProfile(false);
  }
  function updateAthleteProfileField(field, value) {
    setAthleteProfileDraft((p) => ({ ...p, [field]: value }));
  }
  function updateAthleteProfileAvailability(day, value) {
    setAthleteProfileDraft((p) => ({ ...p, availability: { ...(p.availability || {}), [day]: value } }));
  }

  function processProfileImport(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "MYPROFILE" || !parsed.data.profile) {
      setImportProfileStatus("error");
      setTimeout(() => setImportProfileStatus(null), 2500);
      return;
    }
    onUpdateAthlete(athlete.id, { profile: parsed.data.profile });
    setImportProfileStatus("ok");
    setImportProfileText("");
    setShowImportProfile(false);
    setTimeout(() => setImportProfileStatus(null), 2500);
  }

  async function handlePasteProfile() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportProfileStatus("error");
        setTimeout(() => setImportProfileStatus(null), 2500);
        return;
      }
      processProfileImport(text);
    } catch (e) {
      setImportProfileStatus("clipboard-error");
      setTimeout(() => setImportProfileStatus(null), 2500);
    }
  }


  const athleteBlocks = athlete.blocks && athlete.blocks.length
    ? athlete.blocks
    : [{ id: "athlete-block", name: athlete.name, active: true }];
  const activeAthleteBlock = athleteBlocks.find((b) => b.active) || athleteBlocks[0];
  const selectedAthleteBlock = athleteBlocks.find((b) => b.id === selectedAthleteBlockId) || activeAthleteBlock;

  const fakeNutritionBlocks = [{ id: "athlete-nutrition-block", name: athlete.name, active: true }];

  const exerciseIndex = useMemo(() => {
    const idx = {};
    Object.entries(athlete.knownExercises || {}).forEach(([exId, def]) => {
      idx[exId] = { id: exId, ...def };
    });
    athlete.programs.forEach((p) => p.exercises.forEach((e) => (idx[e.id] = { ...e, programName: p.name })));
    return idx;
  }, [athlete.programs, athlete.knownExercises]);

  const athleteMealsByDay = useMemo(() => {
    const map = {};
    (athlete.meals || []).forEach((m) => {
      const d = m.day || 1;
      if (!map[d]) map[d] = [];
      map[d].push(m);
    });
    return map;
  }, [athlete.meals]);
  const athleteDayNumbers = Object.keys(athleteMealsByDay).map(Number).sort((a, b) => a - b);
  const athleteMaxDay = athleteDayNumbers.length ? Math.max(...athleteDayNumbers) : 0;

  function addProgram(program) {
    const next = [...athlete.programs, { ...program, blockId: selectedAthleteBlock?.id || "athlete-block" }];
    onUpdateAthlete(athlete.id, { programs: next });
    setProgramForm(null);
  }
  function updateProgramForAthlete(updated) {
    const next = athlete.programs.map((p) => (p.id === updated.id ? { ...p, ...updated } : p));
    onUpdateAthlete(athlete.id, { programs: next });
    setProgramForm(null);
  }
  function deleteProgramForAthlete(id) {
    const next = athlete.programs.filter((p) => p.id !== id);
    onUpdateAthlete(athlete.id, { programs: next });
  }

  function handleCreateAthleteBlock() {
    if (!newAthleteBlockName.trim()) return;
    const block = { id: uid(), name: newAthleteBlockName.trim(), active: false };
    const next = [...athleteBlocks, block];
    onUpdateAthlete(athlete.id, { blocks: next });
    setSelectedAthleteBlockId(block.id);
    setNewAthleteBlockName("");
    setShowNewAthleteBlock(false);
  }

  function handleSetActiveAthleteBlock(id) {
    const next = athleteBlocks.map((b) => ({ ...b, active: b.id === id }));
    onUpdateAthlete(athlete.id, { blocks: next });
  }

  function handleDeleteAthleteBlock() {
    if (!selectedAthleteBlock || athleteBlocks.length <= 1) return;
    const next = athleteBlocks.filter((b) => b.id !== selectedAthleteBlock.id);
    const nextPrograms = athlete.programs.filter((p) => p.blockId !== selectedAthleteBlock.id);
    onUpdateAthlete(athlete.id, { blocks: next, programs: nextPrograms });
    setSelectedAthleteBlockId(next[0]?.id || null);
    setConfirmDeleteAthleteBlock(false);
  }

  function handleExportProgram() {
    const blockPrograms = athlete.programs.filter((p) => p.blockId === selectedAthleteBlock?.id);
    const blockName = `${selectedAthleteBlock?.name || "Programme"} — ${athlete.name}`;
    const data = { block: { name: blockName }, programs: blockPrograms, coachName: "" };
    const text = programSummaryText(blockName, blockPrograms) + "\n" + packPayload("PROGRAM", data);
    window.location.href = buildWhatsAppLink(athlete.phone || "", text);
  }

  function addMealForAthlete(meal) {
    const next = [...(athlete.meals || []), { ...meal, blockId: "athlete-nutrition-block" }];
    onUpdateAthlete(athlete.id, { meals: next });
    setMealForm(null);
  }
  function updateMealForAthlete(updated) {
    const next = (athlete.meals || []).map((m) => (m.id === updated.id ? { ...m, ...updated } : m));
    onUpdateAthlete(athlete.id, { meals: next });
    setMealForm(null);
  }
  function deleteMealForAthlete(id) {
    const next = (athlete.meals || []).filter((m) => m.id !== id);
    onUpdateAthlete(athlete.id, { meals: next });
  }
  function handleExportMealPlan() {
    const blockName = `Programme nutrition — ${athlete.name}`;
    const data = { block: { name: blockName }, meals: athlete.meals || [], coachName: "" };
    const text = mealPlanSummaryText(blockName, athlete.meals || []) + "\n" + packPayload("MEALPLAN", data);
    window.location.href = buildWhatsAppLink(athlete.phone || "", text);
  }

  function processSessionImport(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "SESSION" || !parsed.data.session) {
      setImportStatus("error");
      setTimeout(() => setImportStatus(null), 2500);
      return;
    }
    const next = [...athlete.sessions, parsed.data.session];
    const nextKnown = { ...(athlete.knownExercises || {}), ...(parsed.data.exerciseNames || {}) };
    onUpdateAthlete(athlete.id, { sessions: next, knownExercises: nextKnown });
    setJustImportedSession(parsed.data.session);
    setGoalDrafts({});
    setImportStatus("ok");
    setImportText("");
    setShowImportSession(false);
    setTimeout(() => setImportStatus(null), 2500);
  }

  function handleImportSession() {
    processSessionImport(importText);
  }

  async function handlePasteSessionClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStatus("error");
        setTimeout(() => setImportStatus(null), 2500);
        return;
      }
      processSessionImport(text);
    } catch (e) {
      setImportStatus("clipboard-error");
      setTimeout(() => setImportStatus(null), 2500);
    }
  }

  function saveGoal(exId, text) {
    const next = { ...athlete.goals };
    if (text) next[exId] = text;
    else delete next[exId];
    onUpdateAthlete(athlete.id, { goals: next });
  }

  function handleExportGoals() {
    const text = goalsSummaryText(athlete.name, athlete.goals, exerciseIndex) + "\n" + packPayload("GOALS", { goals: athlete.goals });
    window.location.href = buildWhatsAppLink(athlete.phone || "", text);
  }

  if (programForm) {
    return (
      <ProgramForm
        mode={programForm.mode}
        initialProgram={programForm.program}
        defaultBlockId={selectedAthleteBlock?.id}
        blocks={athleteBlocks}
        exerciseLibrary={exerciseLibrary}
        gymMachines={gymMachines}
        onCancel={() => setProgramForm(null)}
        onCreate={addProgram}
        onUpdate={updateProgramForAthlete}
        onSaveToLibrary={onSaveToLibrary}
      />
    );
  }

  if (mealForm) {
    return (
      <MealForm
        mode={mealForm.mode}
        initialMeal={mealForm.meal}
        defaultBlockId="athlete-nutrition-block"
        defaultDay={mealForm.day}
        blocks={fakeNutritionBlocks}
        dishLibrary={dishLibrary}
        onCancel={() => setMealForm(null)}
        onCreate={addMealForAthlete}
        onUpdate={updateMealForAthlete}
      />
    );
  }

  if (showAthleteShoppingList) {
    return (
      <ShoppingListView
        blockName={`Programme nutrition — ${athlete.name}`}
        meals={athlete.meals || []}
        onBack={() => setShowAthleteShoppingList(false)}
      />
    );
  }

  if (viewingExercise) {
    return (
      <ExerciseHistory
        exercise={viewingExercise}
        sessions={athlete.sessions}
        onBack={() => setViewingExercise(null)}
        coachGoalValue={athlete.goals[viewingExercise.id]}
        onSaveCoachGoal={(text) => saveGoal(viewingExercise.id, text)}
      />
    );
  }

  if (viewingSession) {
    return (
      <SessionDetailView
        session={viewingSession}
        exerciseIndex={exerciseIndex}
        onBack={() => setViewingSession(null)}
        onOpenExercise={(ex) => setViewingExercise(ex)}
        coachPhone=""
        onSaveCoachPhone={() => {}}
        coachDisplayName=""
        onSaveCoachDisplayName={() => {}}
      />
    );
  }

  return (
    <div style={S.page}>
      <button
        style={S.backBtn}
        onClick={() => (athleteMainSection ? setAthleteMainSection(null) : onBack())}
      >
        <ChevronLeft size={18} /> {athleteMainSection ? athlete.name : "Coach"}
      </button>
      <div style={S.pageTitle}>{athleteMainSection ? (athleteMainSection === "programme" ? "Programme" : athleteMainSection === "nutrition" ? "Nutrition" : "Fiche du suivi") : athlete.name}</div>
      {!athleteMainSection && athlete.phone && (
        <div style={{ ...S.caption, marginBottom: 10 }}>{athlete.phone}</div>
      )}

      {!athleteMainSection && (
        <div style={S.athleteSectionList}>
          <button style={S.heroCard} onClick={() => { setAthleteMainSection("programme"); setAthleteSection("programmes"); }}>
            <div>
              <div style={S.heroTitle}>Programme</div>
              <div style={S.caption}>{athlete.programs.length} séance(s) · {athlete.sessions.length} reçue(s)</div>
            </div>
            <div style={S.heroGo}>
              <Dumbbell size={22} strokeWidth={2.2} />
            </div>
          </button>
          <button style={S.heroCard} onClick={() => { setAthleteMainSection("nutrition"); setAthleteSection("nutrition"); }}>
            <div>
              <div style={S.heroTitle}>Nutrition</div>
              <div style={S.caption}>{(athlete.meals || []).length} repas</div>
            </div>
            <div style={S.heroGo}>
              <Apple size={22} strokeWidth={2.2} />
            </div>
          </button>
          <button style={S.heroCard} onClick={() => setAthleteMainSection("fiche")}>
            <div>
              <div style={S.heroTitle}>Fiche du suivi</div>
              <div style={S.caption}>{athlete.profile ? "Renseignée" : "Non renseignée"}</div>
            </div>
            <div style={S.heroGo}>
              <Clipboard size={22} strokeWidth={2.2} />
            </div>
          </button>
        </div>
      )}

      {athleteMainSection === "nutrition" && (
        <div style={S.blockChipsRow}>
          {[
            { id: "nutrition", label: "Nutrition" },
            { id: "suivi-nutrition", label: "Suivi de nutrition" },
          ].map((s) => (
            <button
              key={s.id}
              style={{ ...S.blockChip, ...(athleteSection === s.id ? S.blockChipSelected : {}) }}
              onClick={() => setAthleteSection(s.id)}
            >
              {s.label}
            </button>
          ))}
        </div>
      )}

      {athleteMainSection === "programme" && (
        <>
          <div style={S.blockChipsRow}>
            {athleteBlocks.map((b) => (
              <button
                key={b.id}
                style={{ ...S.blockChip, ...((selectedAthleteBlock?.id === b.id) ? S.blockChipSelected : {}) }}
                onClick={() => setSelectedAthleteBlockId(b.id)}
              >
                {b.active && <span style={S.activeDot} />}
                {b.name}
              </button>
            ))}
            <button style={S.blockChipAdd} onClick={() => setShowNewAthleteBlock((v) => !v)}>
              <Plus size={14} />
            </button>
            {selectedAthleteBlock && (
              <button
                style={S.blockChipAdd}
                onClick={() => { setAthleteBlockNameDraft(selectedAthleteBlock.name); setEditingAthleteBlockName(true); }}
              >
                <Pencil size={14} />
              </button>
            )}
          </div>

          {editingAthleteBlockName && (
            <div style={S.newBlockRow}>
              <input
                style={S.textInput}
                placeholder="Nom du programme"
                value={athleteBlockNameDraft}
                onChange={(e) => setAthleteBlockNameDraft(e.target.value)}
              />
              <button style={S.goalSaveBtn} onClick={renameAthleteBlock}>
                <Check size={16} />
              </button>
            </div>
          )}

          {showNewAthleteBlock && (
            <div style={S.newBlockRow}>
              <input
                style={S.textInput}
                placeholder="Nom du programme (ex : Bloc force)"
                value={newAthleteBlockName}
                onChange={(e) => setNewAthleteBlockName(e.target.value)}
              />
              <button style={S.goalSaveBtn} onClick={handleCreateAthleteBlock}>
                <Check size={16} />
              </button>
            </div>
          )}

          {selectedAthleteBlock && selectedAthleteBlock.id !== activeAthleteBlock?.id && (
            <div style={S.notActiveBanner}>
              <span>Ce programme n'est pas suivi actuellement.</span>
              <button style={S.activateBtn} onClick={() => handleSetActiveAthleteBlock(selectedAthleteBlock.id)}>
                Suivre ce programme
              </button>
            </div>
          )}

          {athleteBlocks.length > 1 && (
            confirmDeleteAthleteBlock ? (
              <div style={S.confirmDeleteRow}>
                <span style={S.caption}>Supprimer « {selectedAthleteBlock?.name} » et toutes ses séances ?</span>
                <button style={S.confirmDeleteBtn} onClick={handleDeleteAthleteBlock}>
                  Oui, supprimer
                </button>
                <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteAthleteBlock(false)}>
                  Annuler
                </button>
              </div>
            ) : (
              <button style={{ ...S.exportBtnGhost, marginBottom: 10 }} onClick={() => setConfirmDeleteAthleteBlock(true)}>
                <Trash2 size={13} style={{ verticalAlign: "-2px", marginRight: 4 }} />Supprimer ce programme
              </button>
            )
          )}

          {athlete.programs.filter((p) => p.blockId === selectedAthleteBlock?.id).map((p) => (
            <div key={p.id} style={S.programBlock}>
              <button style={S.programBlockHeader} onClick={() => setOpenProgram(openProgram === p.id ? null : p.id)}>
                <span style={S.programBlockTitle}>{p.name}</span>
                <span style={S.caption}>{openProgram === p.id ? "−" : "+"}</span>
              </button>
              {openProgram === p.id && (
                <div style={S.programBlockBody}>

                        <div style={S.exRowName}>{ex.name}</div>

                          <div style={S.caption}>{ex.sets}×{ex.repMin}-{ex.repMax} reps</div>

                          <div style={{ ...S.caption, color: "#FFC233", marginTop: 2 }}><Target size={11} style={{ verticalAlign: "-1px", marginRight: 3 }} />{athlete.goals[ex.id]}</div>

                      <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteProgram(null)}>
                        Annuler
                      </button>
                    </div>

                    <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteProgram(p.id)}>
                      <Trash2 size={13} /> Supprimer
                    </button>

          </button>

              <div style={S.goalInputLabel}>Texte reçu (WhatsApp, ami, autre coach...) :</div>

              </button>
              {importProgramStatus === "ok" && <div style={S.exportStatus}>Séance(s) importée(s) ✓</div>}
              {importProgramStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
              {importProgramStatus === "clipboard-error" && (
                <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
              )}
              <textarea
                style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
                rows={3}
                placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
                value={importProgramText}
                onChange={(e) => setImportProgramText(e.target.value)}

                <button style={S.exportBtnGhost} onClick={() => processProgramImport(importProgramText)}>

                </button>

            <button style={{ ...S.exportBtnGhost, marginTop: 8 }} onClick={() => setShowImportProgram(true)}>

            </button>

          {athlete.programs.filter((p) => p.blockId === selectedAthleteBlock?.id).length > 0 && (
            <button style={{ ...S.exportBtn, marginTop: 10 }} onClick={handleExportProgram}>

            </button>
          )}
        </>
      )}

      {athleteMainSection === "programme" && (
        <>
          <div style={S.homeCategoryLabel}>Suivi du programme</div>
          <div style={S.sectionLabel}>Séances reçues</div>
          <div style={S.programList}>
            {[...athlete.sessions].sort((a, b) => (a.date < b.date ? 1 : -1)).map((s) => (
              <button key={s.id} style={S.sessionLogRow} onClick={() => setViewingSession(s)}>

              {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
              {importStatus === "clipboard-error" && (
                <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>

                </button>
                <button style={S.exportBtnGhost} onClick={() => setJustImportedSession(null)}>

              </div>
            </div>

          <div style={S.sectionLabel}>Objectifs</div>

          {Object.keys(athlete.goals || {}).length > 0 && (

            </button>

          <div style={S.sectionLabel}>Objectif de pas quotidien</div>

          </div>
          {editingStepGoal && (
            <div style={S.segmentsBox}>

                <button style={S.createBtn} onClick={saveAthleteStepGoal}>Enregistrer</button>
                <button style={S.exportBtnGhost} onClick={() => setEditingStepGoal(false)}>Annuler</button>

          {athlete.stepGoal && (
            <button style={{ ...S.exportBtn, marginTop: 8 }} onClick={exportAthleteStepGoal}>

            </button>
          )}

          <div style={{ ...S.sectionLabel, marginTop: 14 }}>Suivi de pas reçu</div>
          {showImportStepLog ? (
            <div style={S.segmentsBox}>
              <div style={S.goalInputLabel}>Reçu de {athlete.name} sur WhatsApp :</div>
              <button style={S.createBtn} onClick={handlePasteStepLog}>
                <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller et importer
              </button>
              {importStepLogStatus === "ok" && <div style={S.exportStatus}>Suivi importé ✓</div>}
              {importStepLogStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu.</div>}
              {importStepLogStatus === "clipboard-error" && <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle manuellement.</div>}
              <textarea style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }} rows={3} value={importStepLogText} onChange={(e) => setImportStepLogText(e.target.value)} />
              {importStepLogText && (
                <button style={S.exportBtnGhost} onClick={() => processStepLogImport(importStepLogText)}>
                  Importer ce texte
                </button>
              )}
            </div>
          ) : (
            <button style={S.exportBtnGhost} onClick={() => setShowImportStepLog(true)}>
              <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Importer un suivi de pas reçu
            </button>
          )}
          <div style={{ marginTop: 8 }}>
            {[...(athlete.stepLogs || [])].sort((a, b) => (a.date < b.date ? 1 : -1)).map((l) => (
              <div key={l.id} style={S.exRow}>
                <div style={S.caption}>{fmtDate(l.date)}</div>
                <div style={{ fontWeight: 700 }}>
                  {l.steps} pas{athlete.stepGoal ? (l.steps >= Number(athlete.stepGoal) ? " — objectif atteint" : "") : ""}
                </div>
              </div>
            ))}
            {(athlete.stepLogs || []).length === 0 && <div style={S.caption}>Aucun suivi de pas reçu pour l'instant.</div>}
          </div>
        </>
      )}

      {athleteMainSection === "nutrition" && athleteSection === "nutrition" && (
        <>
          {athleteMaxDay > 0 && (
            <div style={{ ...S.caption, marginBottom: 10 }}>
              Ce programme boucle après le Jour {athleteMaxDay} — il recommence ensuite au Jour 1.
            </div>
          )}
          {(athlete.meals || []).length > 0 && (
            <button style={{ ...S.exportBtnGhost, marginBottom: 10 }} onClick={() => setShowAthleteShoppingList(true)}>
              <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Extraire la liste de courses
            </button>
          )}
          {(athlete.meals || []).length === 0 && <div style={{ ...S.caption, margin: "12px 0" }}>Pas encore de repas dans ce programme.</div>}

          {athleteDayNumbers.map((day) => (
            <div key={day} style={S.programBlock}>
              <button style={S.programBlockHeader} onClick={() => setOpenMealDay(openMealDay === day ? null : day)}>
                <span style={S.programBlockTitle}>
                  Jour {day}
                  {sumMealsCalories(athleteMealsByDay[day]) != null && (
                    <span style={{ ...S.caption, marginLeft: 8, color: "#FFC233" }}>
                      {sumMealsCalories(athleteMealsByDay[day])} kcal
                      {sumMealsMacros(athleteMealsByDay[day]) && ` · P${sumMealsMacros(athleteMealsByDay[day]).protein} G${sumMealsMacros(athleteMealsByDay[day]).carbs} L${sumMealsMacros(athleteMealsByDay[day]).fat}`}
                    </span>
                  )}
                </span>
                <span style={S.caption}>{openMealDay === day ? "−" : "+"}</span>
              </button>
              {openMealDay === day && (
                <div style={S.programBlockBody}>
                  {athleteMealsByDay[day].map((meal) => (
                    <div key={meal.id} style={S.dishRow}>
                      <button style={S.dishHeaderBtn} onClick={() => setOpenMeal(openMeal === meal.id ? null : meal.id)}>
                        <span style={S.exRowName}>{meal.name}</span>
                        <span style={S.caption}>{openMeal === meal.id ? "−" : "+"}</span>
                      </button>
                      {openMeal === meal.id && (
                        <div style={S.dishDetail}>
                          {meal.dishes.map((dish) => {
                            const key = `${meal.id}-${dish.id}`;
                            return (
                              <div key={dish.id} style={{ marginBottom: 4 }}>
                                <button style={S.dishHeaderBtn} onClick={() => setOpenMealDish(openMealDish === key ? null : key)}>
                                  <span style={S.caption}>{dish.name}</span>
                                  <span style={S.caption}>{openMealDish === key ? "−" : "+"}</span>
                                </button>
                                {openMealDish === key && (
                                  <div style={S.dishDetail}>
                                    {dish.ingredients.length === 0 && <div style={S.caption}>Aucun détail ajouté.</div>}
                                    {dish.ingredients.map((ing) => (
                                      <div key={ing.id} style={S.caption}>• {ing.text}</div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                          {meal.dishes.length === 0 && <div style={S.caption}>Aucun plat dans ce repas.</div>}
                          <button style={S.editProgramBtn} onClick={() => setMealForm({ mode: "edit", meal })}>
                            Modifier ce repas
                          </button>
                          {confirmDeleteMeal === meal.id ? (
                            <div style={S.confirmDeleteRow}>
                              <span style={S.caption}>Supprimer « {meal.name} » ?</span>
                              <button style={S.confirmDeleteBtn} onClick={() => { deleteMealForAthlete(meal.id); setConfirmDeleteMeal(null); }}>
                                Oui, supprimer
                              </button>
                              <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteMeal(null)}>
                                Annuler
                              </button>
                            </div>
                          ) : (
                            <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteMeal(meal.id)}>
                              <Trash2 size={13} /> Supprimer
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  ))}
                  <button style={S.editProgramBtn} onClick={() => setMealForm({ mode: "create", meal: null, day })}>
                    <Plus size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Ajouter un repas au Jour {day}
                  </button>
                </div>
              )}
            </div>
          ))}

          <button style={S.createBtn} onClick={() => setMealForm({ mode: "create", meal: null, day: athleteMaxDay + 1 })}>
            <Plus size={16} /> {athleteMaxDay > 0 ? `Ajouter un Jour ${athleteMaxDay + 1}` : "Ajouter le premier jour"}
          </button>

          {(athlete.meals || []).length > 0 && (
            <button style={{ ...S.exportBtn, marginTop: 10 }} onClick={handleExportMealPlan}>
              <Smartphone size={15} style={{ verticalAlign: "-3px", marginRight: 6 }} />Envoyer le plan nutrition par WhatsApp
            </button>
          )}
        </>
      )}

      {athleteMainSection === "nutrition" && athleteSection === "suivi-nutrition" && (
        <>
          {showImportNutriLog ? (
            <div style={S.segmentsBox}>
              <div style={S.goalInputLabel}>Reçu de {athlete.name} sur WhatsApp :</div>
              <button style={S.createBtn} onClick={handlePasteNutriLog}>
                <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller et importer
              </button>
              {importNutriLogStatus === "ok" && <div style={S.exportStatus}>Suivi importé ✓</div>}
              {importNutriLogStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
              {importNutriLogStatus === "clipboard-error" && (
                <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
              )}
              <textarea
                style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
                rows={3}
                placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
                value={importNutriLogText}
                onChange={(e) => setImportNutriLogText(e.target.value)}
              />
              {importNutriLogText && (
                <button style={S.exportBtnGhost} onClick={() => processNutriLogImport(importNutriLogText)}>
                  Importer ce texte
                </button>
              )}
            </div>
          ) : (
            <button style={S.exportBtnGhost} onClick={() => setShowImportNutriLog(true)}>
              <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Importer un suivi reçu
            </button>
          )}

          <div style={{ height: 10 }} />

          {[...(athlete.nutritionLogs || [])].reverse().map((log) => (
            <div key={log.id} style={S.exRow}>
              <div style={S.exRowName}>{log.mealName}</div>
              <div style={S.caption}>
                {log.date} — {mealLogStatusLabel(log.status)}{log.note ? ` : ${log.note}` : ""}
              </div>
            </div>
          ))}
          {(athlete.nutritionLogs || []).length === 0 && (
            <div style={{ ...S.caption, marginTop: 10 }}>Aucun suivi reçu pour l'instant.</div>
          )}
        </>
      )}

      {athleteMainSection === "fiche" && (
        <>
          <div style={{ ...S.caption, marginBottom: 12 }}>
            Renseigne-la toi-même, ou importe-la si {athlete.name} te l'a envoyée depuis son "Ma fiche".
          </div>

          <div style={S.profileTopBar}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={S.profileTopValue}>
                {athlete.profile?.weight ? `${athlete.profile.weight} kg. ` : ""}
                {athlete.profile?.issues ? `Problèmes : ${athlete.profile.issues}. ` : ""}
                {athlete.profile?.allergies ? `Allergies : ${athlete.profile.allergies}. ` : ""}
                {athlete.profile?.runningSpot ? `Course à pied : ${athlete.profile.runningSpot}. ` : ""}
                {!athlete.profile && "Rien de renseigné"}
              </div>
            </div>
            <button style={S.blockChipAdd} onClick={openEditAthleteProfile}>
              <Pencil size={14} />
            </button>
          </div>

          {editingAthleteProfile && (
            <div style={S.segmentsBox}>
              <div style={S.goalInputLabel}>Poids actuel (kg)</div>
              <input
                style={S.textInput}
                type="number"
                value={athleteProfileDraft.weight || ""}
                onChange={(e) => updateAthleteProfileField("weight", e.target.value)}
              />

              <div style={S.goalInputLabel}>Disponibilités pour la salle</div>
              {WEEK_DAYS.map((day) => (
                <div key={day} style={S.availabilityRow}>
                  <span style={S.availabilityDayLabel}>{day}</span>
                  <input
                    style={{ ...S.textInput, flex: 1, marginBottom: 0 }}
                    placeholder="ex : 18h-20h"
                    value={(athleteProfileDraft.availability || {})[day] || ""}
                    onChange={(e) => updateAthleteProfileAvailability(day, e.target.value)}
                  />
                </div>
              ))}

              <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Parc ou chemin pour courir à proximité</div>
              <input
                style={S.textInput}
                placeholder="ex : Parc des Buttes-Chaumont à 5 min, boucle de 4km"
                value={athleteProfileDraft.runningSpot || ""}
                onChange={(e) => updateAthleteProfileField("runningSpot", e.target.value)}
              />

              <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Problèmes musculaires / articulaires</div>
              <textarea
                style={{ ...S.commentInput, marginBottom: 8 }}
                rows={2}
                placeholder="ex : épaule droite fragile, éviter le squat profond..."
                value={athleteProfileDraft.issues || ""}
                onChange={(e) => updateAthleteProfileField("issues", e.target.value)}
              />
              <div style={S.goalInputLabel}>Allergies</div>
              <input style={S.textInput} placeholder="ex : arachides, lactose..." value={athleteProfileDraft.allergies || ""} onChange={(e) => updateAthleteProfileField("allergies", e.target.value)} />
              <div style={S.goalInputLabel}>Aliments évités par conviction</div>
              <input style={S.textInput} placeholder="ex : viande rouge, poisson..." value={athleteProfileDraft.dislikes || ""} onChange={(e) => updateAthleteProfileField("dislikes", e.target.value)} />
              <div style={S.goalInputLabel}>Aliments préférés</div>
              <input style={S.textInput} placeholder="ex : pâtes, poulet..." value={athleteProfileDraft.favorites || ""} onChange={(e) => updateAthleteProfileField("favorites", e.target.value)} />
              <label style={S.supersetCheckRow}>
                <input type="checkbox" checked={!!athleteProfileDraft.bigEater} onChange={(e) => updateAthleteProfileField("bigEater", e.target.checked)} />
                Gros(se) mangeur(se)
              </label>

              <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                <button style={S.createBtn} onClick={saveAthleteProfile}>Enregistrer</button>
                <button style={S.exportBtnGhost} onClick={() => setEditingAthleteProfile(false)}>Annuler</button>
              </div>
            </div>
          )}

          {showImportProfile ? (
            <div style={S.segmentsBox}>
              <div style={S.goalInputLabel}>Reçu de {athlete.name} sur WhatsApp :</div>
              <button style={S.createBtn} onClick={handlePasteProfile}>
                <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller et importer
              </button>
              {importProfileStatus === "ok" && <div style={S.exportStatus}>Fiche importée ✓</div>}
              {importProfileStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
              {importProfileStatus === "clipboard-error" && (
                <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
              )}
              <textarea
                style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
                rows={3}
                placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
                value={importProfileText}
                onChange={(e) => setImportProfileText(e.target.value)}
              />
              {importProfileText && (
                <button style={S.exportBtnGhost} onClick={() => processProfileImport(importProfileText)}>
                  Importer ce texte
                </button>
              )}
            </div>
          ) : (
            <button style={S.exportBtnGhost} onClick={() => setShowImportProfile(true)}>
              <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Importer la fiche reçue
            </button>
          )}
        </>
      )}

      {!athleteMainSection && (
        <div style={{ marginTop: 24 }}>
          {confirmDeleteAthlete ? (
            <div style={S.confirmDeleteRow}>
              <span style={S.caption}>Supprimer le suivi « {athlete.name} » et toutes ses données ?</span>
              <button style={S.confirmDeleteBtn} onClick={() => onDeleteAthlete(athlete.id)}>
                Oui, supprimer
              </button>
              <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteAthlete(false)}>
                Annuler
              </button>
            </div>
          ) : (
            <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteAthlete(true)}>
              <Trash2 size={13} /> Supprimer ce suivi
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- Sélecteur générique de bibliothèque (exercices ou plats) ---------- */

function LibraryPicker({ library, title, groupKey, onPick, onCancel, excludedAllergens = [] }) {
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState(null);

  useEffect(() => {
    window.scrollTo(0, 0);
  }, []);

  const groups = useMemo(() => {
    const set = new Set(library.map((item) => item[groupKey]).filter(Boolean));
    return Array.from(set).sort();
  }, [library, groupKey]);

  const filtered = library.filter((item) => {
    if (filter && item[groupKey] !== filter) return false;
    if (search.trim() && !item.name.toLowerCase().includes(search.trim().toLowerCase())) return false;
    if (excludedAllergens.length && item.allergens?.some((a) => excludedAllergens.includes(a))) return false;
    return true;
  });

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{title}</div>

      <div style={{ position: "relative", marginBottom: 8 }}>
        <Search size={15} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#8A5F58" }} />
        <input
          style={{ ...S.textInput, paddingLeft: 34 }}
          placeholder="Rechercher"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      {groups.length > 0 && (
        <div style={S.blockChipsRow}>
          <button style={{ ...S.blockChip, ...(!filter ? S.blockChipSelected : {}) }} onClick={() => setFilter(null)}>
            Tous
          </button>
          {groups.map((g) => (
            <button key={g} style={{ ...S.blockChip, ...(filter === g ? S.blockChipSelected : {}) }} onClick={() => setFilter(g)}>
              {g}
            </button>
          ))}
        </div>
      )}

      <div style={S.programList}>
        {filtered.map((item) => (
          <button key={item.id} style={S.sessionLogRow} onClick={() => onPick(item)}>
            <div>
              <div style={S.exRowName}>{item.name}</div>
              <div style={S.caption}>
                {item[groupKey]}
                {item.allergens?.length ? ` · Allergènes : ${item.allergens.join(", ")}` : ""}
              </div>
            </div>
          </button>
        ))}
        {filtered.length === 0 && (
          <div style={S.caption}>Rien à afficher — ajoute des éléments à la bibliothèque depuis Paramètres.</div>
        )}
      </div>
    </div>
  );
}

function WeightView({ weightLogs, onAdd, onDelete, onBack }) {
  const [weight, setWeight] = useState("");
  const sorted = [...weightLogs].sort((a, b) => (a.date < b.date ? 1 : -1));
  const chartData = [...weightLogs].sort((a, b) => (a.date < b.date ? -1 : 1)).map((l) => ({ date: fmtDate(l.date), weight: l.weight }));

  function handleAdd() {
    const val = Number(weight);
    if (!val) return;
    onAdd(val);
    setWeight("");
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Accueil
      </button>
      <div style={S.pageTitle}>Poids</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        Pèse-toi quand tu veux — pas de fréquence imposée. Une pesée hebdomadaire, toujours dans les mêmes conditions, donne souvent une tendance plus fiable qu'un suivi quotidien.
      </div>

      <div style={S.goalInputRow}>
        <input
          style={S.goalInput}
          type="number"
          placeholder="Poids du jour (kg)"
          value={weight}
          onChange={(e) => setWeight(e.target.value)}
        />
        <button style={S.goalSaveBtn} onClick={handleAdd}>
          <Check size={16} />
        </button>
      </div>

      {chartData.length > 0 && (
        <div style={S.chartCard}>
          <MiniLineChart data={chartData} dataKey="weight" height={180} />
        </div>
      )}

      <div style={S.sectionLabel}>Historique</div>
      <div style={S.programList}>
        {sorted.map((l) => (
          <div key={l.id} style={{ ...S.exRow, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={S.caption}>{fmtDate(l.date)}</div>
              <div style={{ fontWeight: 700 }}>{l.weight} kg</div>
            </div>
            <button style={S.setRemoveBtn} onClick={() => onDelete(l.id)}>

/* ---------- Suivi des pas ---------- */

function StepsView({ stepGoal, onSetStepGoal, stepLogs, onLogSteps, coachDisplayName, coachPhone, onBack }) {
  const [goalDraft, setGoalDraft] = useState(stepGoal || "");
  const [editingGoal, setEditingGoal] = useState(!stepGoal);
  const [stepsDraft, setStepsDraft] = useState("");
  const [importText, setImportText] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [importStatus, setImportStatus] = useState(null);

  function exportStepLogs() {
    const text = `👟 Suivi de pas\n` + stepLogs.map((l) => `${l.date} : ${l.steps} pas`).join("\n") + "\n" + packPayload("STEPLOG", { logs: stepLogs });
    window.location.href = buildWhatsAppLink("", text);
  }

  const todayStr = new Date().toISOString().slice(0, 10);
  const todayLog = stepLogs.find((l) => l.date === todayStr);
  const sorted = [...stepLogs].sort((a, b) => (a.date < b.date ? 1 : -1));
  const chartData = [...stepLogs].sort((a, b) => (a.date < b.date ? -1 : 1)).map((l) => ({ date: fmtDate(l.date), steps: l.steps }));

  function handleLogSteps() {
    const val = Number(stepsDraft);
    if (!val && val !== 0) return;
    onLogSteps(val);
    setStepsDraft("");
  }

  function processImport(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "STEPGOAL" || !parsed.data.goal) {
      setImportStatus("error");
      setTimeout(() => setImportStatus(null), 2500);
      return;
    }
    onSetStepGoal(parsed.data.goal);
    setImportStatus("ok");
    setImportText("");
    setShowImport(false);
    setTimeout(() => setImportStatus(null), 2500);
  }

  async function handlePasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStatus("error");
        setTimeout(() => setImportStatus(null), 2500);
        return;
      }
      processImport(text);
    } catch (e) {
      setImportStatus("clipboard-error");
      setTimeout(() => setImportStatus(null), 2500);
    }
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Accueil
      </button>
      <div style={S.pageTitle}>Pas</div>

      <div style={S.profileTopBar}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.profileTopLabel}>Objectif quotidien</div>
          <div style={S.profileTopValue}>{stepGoal ? `${stepGoal} pas / jour` : "Non renseigné"}</div>
        </div>
        <button style={S.blockChipAdd} onClick={() => setEditingGoal(true)}>
          <Pencil size={14} />
        </button>
      </div>
      {editingGoal && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Objectif de pas par jour</div>
          <input style={S.textInput} type="number" placeholder="ex : 8000" value={goalDraft} onChange={(e) => setGoalDraft(e.target.value)} />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={() => { onSetStepGoal(goalDraft); setEditingGoal(false); }}>Enregistrer</button>
            {stepGoal && <button style={S.exportBtnGhost} onClick={() => setEditingGoal(false)}>Annuler</button>}
          </div>
        </div>
      )}

      {showImport ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Reçu de {coachRef(coachDisplayName)} sur WhatsApp :</div>
          <button style={S.createBtn} onClick={handlePasteClipboard}>
            <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller et importer
          </button>
          {importStatus === "ok" && <div style={S.exportStatus}>Objectif importé ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu.</div>}
          {importStatus === "clipboard-error" && <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle manuellement.</div>}
          <textarea style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }} rows={3} value={importText} onChange={(e) => setImportText(e.target.value)} />
          {importText && <button style={S.exportBtnGhost} onClick={() => processImport(importText)}>Importer ce texte</button>}
        </div>
      ) : (
        <button style={{ ...S.exportBtnGhost, marginBottom: 10 }} onClick={() => setShowImport(true)}>
          <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Importer un objectif reçu
        </button>
      )}

      <div style={S.goalInputLabel}>Pas réalisés aujourd'hui</div>
      <div style={S.goalInputRow}>
        <input
          style={S.goalInput}
          type="number"
          placeholder={todayLog ? String(todayLog.steps) : "ex : 6500"}
          value={stepsDraft}
          onChange={(e) => setStepsDraft(e.target.value)}
        />
        <button style={S.goalSaveBtn} onClick={handleLogSteps}>
          <Check size={16} />
        </button>
      </div>
      {todayLog && (
        <div style={{ ...S.caption, marginBottom: 10 }}>
          Déjà enregistré aujourd'hui : {todayLog.steps} pas{stepGoal ? (todayLog.steps >= Number(stepGoal) ? " — objectif atteint ✓" : ` — objectif : ${stepGoal}`) : ""}
        </div>
      )}

      {chartData.length > 0 && (
        <div style={S.chartCard}>
          <MiniLineChart data={chartData} dataKey="steps" height={180} />
        </div>
      )}

      <div style={S.sectionLabel}>Historique</div>
      <div style={S.programList}>
        {sorted.map((l) => (
          <div key={l.id} style={S.exRow}>
            <div style={S.caption}>{fmtDate(l.date)}</div>
            <div style={{ fontWeight: 700 }}>{l.steps} pas</div>
          </div>
        ))}
        {sorted.length === 0 && <div style={S.caption}>Aucun jour enregistré.</div>}
      </div>

      {stepLogs.length > 0 && coachPhone && (
        <button style={{ ...S.exportBtn, marginTop: 10 }} onClick={exportStepLogs}>
          <Smartphone size={15} style={{ verticalAlign: "-3px", marginRight: 6 }} />Envoyer mon suivi à {coachRef(coachDisplayName, "mon coach")}
        </button>
      )}
    </div>
  );
}

/* ---------- Historique des repas ---------- */

function MealHistoryView({ mealLogs, onBack }) {
  const sorted = [...(mealLogs || [])].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const grouped = [];
  sorted.forEach((log) => {
    let group = grouped.find((g) => g.date === log.date);
    if (!group) {
      group = { date: log.date, logs: [] };
      grouped.push(group);
    }
    group.logs.push(log);
  });

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Nutrition
      </button>
      <div style={S.pageTitle}>Historique des repas</div>

      {grouped.map((group) => (
        <div key={group.date} style={{ marginBottom: 16 }}>
          <div style={S.sectionLabel}>{fmtDate(group.date)}</div>
          {group.logs.map((log) => (
            <div key={log.id} style={S.exRow}>
              <div style={S.exRowName}>{log.mealName}</div>
              <div style={S.caption}>
                {mealLogStatusLabel(log.status)}
                {log.changes?.length ? ` — ${log.changes.map((c) => `${c.dish} → ${c.replacement}`).join(", ")}` : ""}
                {log.note ? ` — ${log.note}` : ""}
              </div>
            </div>
          ))}
        </div>
      ))}
      {grouped.length === 0 && <div style={{ ...S.caption, marginTop: 12 }}>Aucun repas validé pour l'instant.</div>}
    </div>
  );
}

function ShoppingListView({ blockName, meals, onBack }) {
  const [loops, setLoops] = useState(1);
  const [copied, setCopied] = useState(false);

  const list = useMemo(() => buildShoppingList(meals, loops), [meals, loops]);

  async function handleCopy() {
    try {
      await navigator.clipboard.writeText(shoppingListText(blockName, list, loops));
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      setCopied(false);
    }
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Nutrition
      </button>
      <div style={S.pageTitle}>Liste de courses</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>{blockName}</div>

      <div style={S.goalInputLabel}>Nombre de boucles du programme</div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <button style={S.blockChipAdd} onClick={() => setLoops((n) => Math.max(1, n - 1))}>
          <Minus size={14} />
        </button>
        <span style={{ fontSize: 18, fontWeight: 700, minWidth: 24, textAlign: "center" }}>{loops}</span>
        <button style={S.blockChipAdd} onClick={() => setLoops((n) => n + 1)}>
          <Plus size={14} />
        </button>
        <span style={S.caption}>{loops > 1 ? `boucles (${loops} fois le cycle complet)` : "boucle (le cycle complet)"}</span>
      </div>

      <div style={S.programList}>
        {list.map((item, i) => (
          <div key={i} style={S.exRow}>
            {item.text}
          </div>
        ))}
        {list.length === 0 && <div style={S.caption}>Aucun ingrédient trouvé — ajoute des détails à tes plats.</div>}
      </div>

      {list.length > 0 && (
        <button style={S.createBtn} onClick={handleCopy}>
          <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Copier la liste
        </button>
      )}
      {copied && <div style={S.exportStatus}>Liste copiée ✓ — colle-la où tu veux (Notes, WhatsApp...).</div>}
    </div>
  );
}

function NutritionView({ meals, blocks, onCreateMeal, onEditMeal, onDeleteMeal, onCreateBlock, onSetActiveBlock, onUpdateBlock, onImportCoachMealPlan, coachDisplayName, coachPhone, mealLogs, onLogMeal, onUpdateMealLog, onOpenMealHistory }) {
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const [open, setOpen] = useState(null);
  const [openDish, setOpenDish] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showNewBlock, setShowNewBlock] = useState(false);
  const [newBlockName, setNewBlockName] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [editingBlock, setEditingBlock] = useState(false);
  const [editBlockName, setEditBlockName] = useState("");
  const [editBlockCoached, setEditBlockCoached] = useState(false);
  const [editBlockCoachName, setEditBlockCoachName] = useState("");
  const [editTargetCalories, setEditTargetCalories] = useState("");
  const [editTargetProtein, setEditTargetProtein] = useState("");
  const [editTargetCarbs, setEditTargetCarbs] = useState("");
  const [editTargetFat, setEditTargetFat] = useState("");
  const [openDay, setOpenDay] = useState(1);
  const [showShoppingList, setShowShoppingList] = useState(false);
  const [loggingMeal, setLoggingMeal] = useState(null); // { mealId, status }
  const [reEditingMealId, setReEditingMealId] = useState(null);

  function getTodayLog(mealId) {
    const todayStr = new Date().toISOString().slice(0, 10);
    return [...mealLogs].reverse().find((l) => l.mealId === mealId && l.date === todayStr);
  }

  function dayNutritionSummary(day) {
    const kcal = sumMealsCalories(mealsByDay[day]);
    const macros = sumMealsMacros(mealsByDay[day]);
    if (kcal == null && !macros) return null;
    let text = "";
    if (kcal != null) {
      text += selectedBlock?.targetCalories ? `${kcal}/${selectedBlock.targetCalories} kcal` : `${kcal} kcal`;
    }
    if (macros) {
      const parts = [];
      if (macros.protein) parts.push(`P${macros.protein}${selectedBlock?.targetProtein ? `/${selectedBlock.targetProtein}` : ""}`);
      if (macros.carbs) parts.push(`G${macros.carbs}${selectedBlock?.targetCarbs ? `/${selectedBlock.targetCarbs}` : ""}`);
      if (macros.fat) parts.push(`L${macros.fat}${selectedBlock?.targetFat ? `/${selectedBlock.targetFat}` : ""}`);
      if (parts.length) text += (text ? " · " : "") + parts.join(" ");
    }
    return text || null;
  }

  function handleLogMeal(meal, status, payload) {
    const existingLog = getTodayLog(meal.id);
    if (existingLog && reEditingMealId === meal.id) {
      onUpdateMealLog(existingLog.id, { status, note: payload.note || "", changes: payload.changes || [] });
    } else {
      onLogMeal({ mealId: meal.id, mealName: meal.name, status, ...payload });
    }
    setLoggingMeal(null);
    setReEditingMealId(null);
  }

  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockMeals = meals.filter((m) => !m.deleted && m.blockId === selectedBlock?.id);

  const mealsByDay = useMemo(() => {
    const map = {};
    blockMeals.forEach((m) => {
      const d = m.day || 1;
      if (!map[d]) map[d] = [];
      map[d].push(m);
    });
    return map;
  }, [blockMeals]);
  const dayNumbers = Object.keys(mealsByDay).map(Number).sort((a, b) => a - b);
  const maxDay = dayNumbers.length ? Math.max(...dayNumbers) : 0;

  if (showShoppingList) {
    return (
      <ShoppingListView
        blockName={selectedBlock?.name || "Programme nutrition"}
        meals={blockMeals}
        onBack={() => setShowShoppingList(false)}
      />
    );
  }

  function handleCreateBlock() {
    if (!newBlockName.trim()) return;
    const id = onCreateBlock(newBlockName.trim());
    setSelectedBlockId(id);
    setNewBlockName("");
    setShowNewBlock(false);
  }

  function processImportText(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "MEALPLAN") {
      setImportStatus("error");
      setTimeout(() => setImportStatus(null), 3000);
      return;
    }
    const newBlockId = onImportCoachMealPlan(parsed.data, parsed.data.coachName);
    setSelectedBlockId(newBlockId);
    setImportStatus("ok");
    setImportText("");
    setTimeout(() => setImportStatus(null), 3000);
  }

  function handleImport() {
    processImportText(importText);
  }

  async function handlePasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStatus("error");
        setTimeout(() => setImportStatus(null), 3000);
        return;
      }
      processImportText(text);
    } catch (e) {
      setImportStatus("clipboard-error");
      setTimeout(() => setImportStatus(null), 3000);
    }
  }

  function openEditBlock() {
    setEditBlockName(selectedBlock?.name || "");
    setEditBlockCoached(!!selectedBlock?.coached);
    setEditBlockCoachName(selectedBlock?.coachName || "");
    setEditTargetCalories(selectedBlock?.targetCalories != null ? String(selectedBlock.targetCalories) : "");
    setEditTargetProtein(selectedBlock?.targetProtein != null ? String(selectedBlock.targetProtein) : "");
    setEditTargetCarbs(selectedBlock?.targetCarbs != null ? String(selectedBlock.targetCarbs) : "");
    setEditTargetFat(selectedBlock?.targetFat != null ? String(selectedBlock.targetFat) : "");
    setEditingBlock(true);
  }

  function saveEditBlock() {
    if (!editBlockName.trim() || !selectedBlock) return;
    onUpdateBlock(selectedBlock.id, {
      name: editBlockName.trim(),
      coached: editBlockCoached,
      ...(editBlockCoached && editBlockCoachName.trim() ? { coachName: editBlockCoachName.trim() } : { coachName: "" }),
      targetCalories: editTargetCalories !== "" && !isNaN(Number(editTargetCalories)) ? Number(editTargetCalories) : null,
      targetProtein: editTargetProtein !== "" && !isNaN(Number(editTargetProtein)) ? Number(editTargetProtein) : null,
      targetCarbs: editTargetCarbs !== "" && !isNaN(Number(editTargetCarbs)) ? Number(editTargetCarbs) : null,
      targetFat: editTargetFat !== "" && !isNaN(Number(editTargetFat)) ? Number(editTargetFat) : null,
    });
    setEditingBlock(false);
  }

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Nutrition</div>

      <div style={{ ...S.caption, marginBottom: 12 }}>
        Un programme nutrition regroupe plusieurs repas. Un seul programme est suivi à la fois — les autres restent en pause.
      </div>
      <button style={S.historyLinkBtn} onClick={onOpenMealHistory}>
        <TrendingUp size={14} style={{ marginRight: 5 }} />
        Voir l'historique
      </button>

      <div style={S.blockChipsRow}>
        {blocks.map((b) => (
          <button
            key={b.id}
            style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
            onClick={() => setSelectedBlockId(b.id)}
          >
            {b.active && <span style={S.activeDot} />}
            {b.coached && <GraduationCap size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}
            {b.name}
          </button>
        ))}
        {selectedBlock && (
          <button style={S.blockChipAdd} onClick={openEditBlock}>
            <Pencil size={14} />
          </button>
        )}
        <button style={S.blockChipAdd} onClick={() => setShowNewBlock((v) => !v)}>
          <Plus size={14} />
        </button>
        <button style={S.blockChipAdd} onClick={() => setShowImport((v) => !v)}>
          <Inbox size={14} />
        </button>
      </div>

      {showImport && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Reçu de {coachRef(coachDisplayName)} sur WhatsApp (plan nutrition) :</div>
          <button style={S.createBtn} onClick={handlePasteClipboard}>
            <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller et importer
          </button>
          {importStatus === "ok" && <div style={S.exportStatus}>Plan importé ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
          {importStatus === "clipboard-error" && (
            <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
          )}
          <textarea
            style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
            rows={3}
            placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
          />
          {importText && (
            <button style={S.exportBtnGhost} onClick={handleImport}>
              Importer ce texte
            </button>
          )}
        </div>
      )}

      {showNewBlock && (
        <div style={S.newBlockRow}>
          <input
            style={S.textInput}
            placeholder="Nom du programme (ex : Prise de masse)"
            value={newBlockName}
            onChange={(e) => setNewBlockName(e.target.value)}
          />
          <button style={S.goalSaveBtn} onClick={handleCreateBlock}>

          <input style={S.textInput} type="number" placeholder="Calories (kcal)" value={editTargetCalories} onChange={(e) => setEditTargetCalories(e.target.value)} />
          <div style={{ display: "flex", gap: 6 }}>
            <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Protéines (g)" value={editTargetProtein} onChange={(e) => setEditTargetProtein(e.target.value)} />
            <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Glucides (g)" value={editTargetCarbs} onChange={(e) => setEditTargetCarbs(e.target.value)} />
            <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Lipides (g)" value={editTargetFat} onChange={(e) => setEditTargetFat(e.target.value)} />

          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <button style={S.createBtn} onClick={saveEditBlock}>

            </button>
            <button style={S.exportBtnGhost} onClick={() => setEditingBlock(false)}>
              Annuler
            </button>
          </div>
        </div>
      )}

      <div style={{ height: 8 }} />

      {maxDay > 0 && (
        <div style={{ ...S.caption, marginBottom: 10 }}>
          Ce programme boucle après le Jour {maxDay} — il recommence ensuite au Jour 1.
        </div>
