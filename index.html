function LogSession({ program, blocks, sessions, goals, onSaveGoal, onCancel, onFinish }) {
  const prevSession = [...sessions]
    .filter((s) => s.programId === program.id)
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];

  const coachedBlock = blocks?.find((b) => b.id === program.blockId && b.coached) || null;

  const [startTime] = useState(() => Date.now()); // figé au montage : l'heure de début réelle
  const [elapsedSec, setElapsedSec] = useState(0);
  const [comment, setComment] = useState("");

  useEffect(() => {
    const t = setInterval(() => setElapsedSec(Math.round((Date.now() - startTime) / 1000)), 1000);
    return () => clearInterval(t);
  }, [startTime]);

  // Minuteur de repos (par exercice) : { [exId]: { endTime, notified } }
  const [restTimers, setRestTimers] = useState({});

  useEffect(() => {
    const t = setInterval(() => {
      setRestTimers((r) => {
        let changed = false;
        const next = { ...r };
        Object.entries(r).forEach(([exId, timer]) => {
          const remaining = Math.max(0, Math.round((timer.endTime - Date.now()) / 1000));
          if (remaining === 0 && !timer.notified) {
            next[exId] = { ...timer, notified: true };
            changed = true;
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          }
        });
        return changed ? next : r;
      });
    }, 500);
    return () => clearInterval(t);
  }, []);

  function startRest(exId, seconds) {
    setRestTimers((r) => ({ ...r, [exId]: { endTime: Date.now() + seconds * 1000, notified: false } }));
  }
  function cancelRest(exId) {
    setRestTimers((r) => {
      const next = { ...r };
      delete next[exId];
      return next;
    });
  }
  function restRemaining(exId) {
    const t = restTimers[exId];
    if (!t) return null;
    return Math.max(0, Math.round((t.endTime - Date.now()) / 1000));
  }

  const [goalDrafts, setGoalDrafts] = useState(() => {
    const init = {};
    program.exercises.forEach((ex) => { init[ex.id] = goals?.[ex.id] || ""; });
    return init;
  });

  const [draft, setDraft] = useState(() => {
    const init = {};
    program.exercises.filter((ex) => ex.type !== "cardio").forEach((ex) => {
      const prevSets = prevSession?.entries[ex.id];
      const n = Array.isArray(prevSets) ? prevSets.length : ex.sets;
      init[ex.id] = Array.from({ length: n }, (_, i) => ({
        reps: prevSets?.[i]?.reps ?? "",
        poids: prevSets?.[i]?.poids ?? "",
      }));
    });
    return init;
  });

  const [cardioLogs, setCardioLogs] = useState(() => {
    const init = {};
    program.exercises.filter((ex) => ex.type === "cardio").forEach((ex) => {
      if (ex.segments && ex.segments.length > 0) {
        init[ex.id] = {
          mode: "planned",
          segments: ex.segments.map((seg) => ({
            id: uid(),
            duration: String(seg.duration ?? ""),
            speed: seg.speed != null ? String(seg.speed) : "",
            incline: seg.incline != null ? String(seg.incline) : "",
          })),
        };
      } else {
        const prevEntry = prevSession?.entries[ex.id];
        const prevSeg = !Array.isArray(prevEntry) ? cardioSegments(prevEntry)[0] : null;
        init[ex.id] = {
          mode: "simple",
          running: false,
          startedAt: null,
          elapsedSeconds: 0,
          speed: "",
          incline: "",
          prevSpeed: prevSeg?.speed ?? "",
          prevIncline: prevSeg?.incline ?? "",
        };
      }
    });
    return init;
  });

  function toggleCardioTimer(exId) {
    setCardioLogs((c) => {
      const cur = c[exId];
      if (cur.running) {
        const added = Math.round((Date.now() - cur.startedAt) / 1000);
        return { ...c, [exId]: { ...cur, running: false, startedAt: null, elapsedSeconds: cur.elapsedSeconds + added } };
      }
      return { ...c, [exId]: { ...cur, running: true, startedAt: Date.now() } };
    });
  }
  function updateCardio(exId, field, value) {
    setCardioLogs((c) => ({ ...c, [exId]: { ...c[exId], [field]: value } }));
  }
  function cardioDisplaySeconds(exId) {
    const c = cardioLogs[exId];
    if (!c) return 0;
    return c.running ? c.elapsedSeconds + Math.round((Date.now() - c.startedAt) / 1000) : c.elapsedSeconds;
  }
  function updateCardioSegment(exId, segId, field, value) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: c[exId].segments.map((s) => (s.id === segId ? { ...s, [field]: value } : s)) },
    }));
  }
  function addCardioSegment(exId) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: [...c[exId].segments, { id: uid(), duration: "", speed: "", incline: "" }] },
    }));
  }
  function removeCardioSegment(exId, segId) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: c[exId].segments.filter((s) => s.id !== segId) },
    }));
  }

  function updateSet(exId, idx, field, value) {
    setDraft((d) => {
      const sets = d[exId].map((s, i) => (i === idx ? { ...s, [field]: value } : s));
      return { ...d, [exId]: sets };
    });
  }
  function addSet(exId) {
    setDraft((d) => ({ ...d, [exId]: [...d[exId], { reps: "", poids: "" }] }));
  }
  function removeSet(exId, idx) {
    setDraft((d) => ({ ...d, [exId]: d[exId].filter((_, i) => i !== idx) }));
  }

  function save() {
    const entries = {};
    Object.entries(draft).forEach(([exId, sets]) => {
      const clean = sets
        .filter((s) => s.reps !== "" && s.poids !== "")
        .map((s) => ({ reps: Number(s.reps), poids: Number(s.poids) }));
      if (clean.length) entries[exId] = clean;
    });
    Object.entries(cardioLogs).forEach(([exId, c]) => {
      if (c.mode === "planned") {
        const segments = c.segments
          .filter((s) => s.duration !== "")
          .map((s) => ({
            durationSeconds: Math.round((Number(s.duration) || 0) * 60),
            speed: s.speed !== "" ? Number(s.speed) : null,
            incline: s.incline !== "" ? Number(s.incline) : null,
          }));
        if (segments.length) entries[exId] = { type: "cardio", segments };
      } else {
        const totalSec = c.running ? c.elapsedSeconds + Math.round((Date.now() - c.startedAt) / 1000) : c.elapsedSeconds;
        if (totalSec > 0 || c.speed !== "" || c.incline !== "") {
          entries[exId] = {
            type: "cardio",
            segments: [{ durationSeconds: totalSec, speed: c.speed !== "" ? Number(c.speed) : null, incline: c.incline !== "" ? Number(c.incline) : null }],
          };
        }
      }
    });
    const blockName = blocks?.find((b) => b.id === program.blockId)?.name || "";
    onFinish({
      id: uid(),
      programId: program.id,
      programName: program.name,
      blockName,
      date: new Date(startTime).toISOString(),
      durationSeconds: Math.round((Date.now() - startTime) / 1000),
      comment: comment.trim(),
      entries,
    });
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.sessionHeadRow}>
        <div>
          <div style={S.pageTitle}>{program.name}</div>
          <div style={{ ...S.caption, marginBottom: 8 }}>
            {prevSession ? `Dernière fois : ${fmtDate(prevSession.date)}` : "Première séance sur ce programme"}
          </div>
        </div>
        <div style={S.timerBadge}>⏱ {fmtDuration(elapsedSec)}</div>
      </div>

      {program.exercises.map((ex, exIndex) => {
        if (ex.type === "cardio") {
          const c = cardioLogs[ex.id];

          if (c.mode === "planned") {
            const totalMin = c.segments.reduce((a, s) => a + (Number(s.duration) || 0), 0);
            return (
              <div key={ex.id} style={S.exerciseCard}>
                <div style={S.exerciseCardHead}>
                  <div style={S.exRowName}>{ex.superset ? "🔗 " : ""}{ex.name}</div>
                  {ex.superset && <div style={S.caption}>Superset — enchaîné sans repos</div>}
                  <div style={S.caption}>{ex.muscle}</div>
                  <div style={S.caption}>Programme : {totalMin} min au total</div>
                  {ex.note && <div style={S.exNote}>{ex.note}</div>}
                </div>

                <div style={S.setsHeader}>
                  <span style={S.setsHeaderCol}>Segment</span>
                  <span style={S.setsHeaderCol}>Min</span>
                  <span style={S.setsHeaderCol}>km/h</span>
                  <span style={S.setsHeaderCol}>Pente %</span>
                  <span style={{ width: 28 }} />
                </div>
                {c.segments.map((seg, si) => (
                  <div key={seg.id} style={S.setRow}>
                    <span style={S.setNum}>{si + 1}</span>
                    <input
                      style={S.setInput}
                      inputMode="numeric"
                      value={seg.duration}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "duration", e.target.value.replace(/[^0-9]/g, ""))}
                    />
                    <input
                      style={S.setInput}
                      inputMode="decimal"
                      value={seg.speed}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "speed", e.target.value.replace(/[^0-9.,]/g, ""))}
                    />
                    <input
                      style={S.setInput}
                      inputMode="decimal"
                      value={seg.incline}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "incline", e.target.value.replace(/[^0-9.,]/g, ""))}
                    />
                    <button style={S.setRemoveBtn} onClick={() => removeCardioSegment(ex.id, seg.id)}>
                      <Minus size={14} />
                    </button>
                  </div>
                ))}
                <button style={S.addSetBtn} onClick={() => addCardioSegment(ex.id)}>
                  <Plus size={14} /> Ajouter un segment
                </button>

                <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} readOnly={coachedBlock} coachName={coachedBlock?.coachName} />
              </div>
            );
          }

          const displaySec = cardioDisplaySeconds(ex.id);
          return (
            <div key={ex.id} style={S.exerciseCard}>
              <div style={S.exerciseCardHead}>
                <div style={S.exRowName}>{ex.superset ? "🔗 " : ""}{ex.name}</div>
                {ex.superset && <div style={S.caption}>Superset — enchaîné sans repos</div>}
                <div style={S.caption}>{ex.muscle}</div>
                {ex.note && <div style={S.exNote}>{ex.note}</div>}
              </div>

              <div style={S.cardioTimerRow}>
                <div style={S.cardioTimerDisplay}>⏱ {fmtDuration(displaySec)}</div>
                <button
                  style={c.running ? S.cardioStopBtn : S.cardioStartBtn}
                  onClick={() => toggleCardioTimer(ex.id)}
                >
                  {c.running ? "⏹ Arrêter" : "▶ Démarrer"}
                </button>
              </div>

              <div style={S.newExerciseRow}>
                <label style={S.smallLabel}>
                  Vitesse (km/h)
                  <input
                    style={S.smallInput}
                    inputMode="decimal"
                    placeholder={c.prevSpeed ? String(c.prevSpeed) : "-"}
                    value={c.speed}
                    onChange={(e) => updateCardio(ex.id, "speed", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                </label>
                <label style={S.smallLabel}>
                  Pente (%)
                  <input
                    style={S.smallInput}
                    inputMode="decimal"
                    placeholder={c.prevIncline ? String(c.prevIncline) : "-"}
                    value={c.incline}
                    onChange={(e) => updateCardio(ex.id, "incline", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                </label>
              </div>

              <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} readOnly={coachedBlock} coachName={coachedBlock?.coachName} />
            </div>
          );
        }

        const prevSets = prevSession?.entries[ex.id];

        return (
          <div key={ex.id} style={S.exerciseCard}>
            <div style={S.exerciseCardHead}>
              <div style={S.exRowName}>{ex.superset ? "🔗 " : ""}{ex.name}</div>
              {ex.superset && <div style={S.caption}>Superset — enchaîné sans repos</div>}
              <div style={S.caption}>{ex.muscle}</div>
              <div style={S.caption}>Fourchette : {ex.repMin}-{ex.repMax} reps</div>
              {ex.restSeconds ? <div style={S.caption}>Repos : {fmtRestTime(ex.restSeconds)}</div> : null}
              {ex.note && <div style={S.exNote}>{ex.note}</div>}
            </div>

            <div style={S.setsHeader}>
              <span style={S.setsHeaderCol}>Série</span>
              <span style={S.setsHeaderCol}>Reps</span>
              <span style={S.setsHeaderCol}>Poids (kg)</span>
              <span style={{ width: 28 }} />
            </div>
            {draft[ex.id].map((s, idx) => (
              <div key={idx} style={S.setRow}>
                <span style={S.setNum}>{idx + 1}</span>
                <input
                  style={S.setInput}
                  inputMode="numeric"
                  placeholder={prevSets?.[idx] ? String(prevSets[idx].reps) : "-"}
                  value={s.reps}
                  onChange={(e) => updateSet(ex.id, idx, "reps", e.target.value.replace(/[^0-9]/g, ""))}
                />
                <input
                  style={S.setInput}
                  inputMode="decimal"
                  placeholder={prevSets?.[idx] ? String(prevSets[idx].poids) : "-"}
                  value={s.poids}
                  onChange={(e) => updateSet(ex.id, idx, "poids", e.target.value.replace(/[^0-9.,]/g, ""))}
                />
                <button style={S.setRemoveBtn} onClick={() => removeSet(ex.id, idx)}>
                  <Minus size={14} />
                </button>
              </div>
            ))}
            <button style={S.addSetBtn} onClick={() => addSet(ex.id)}>
              <Plus size={14} /> Ajouter une série
            </button>

            {ex.restSeconds && !program.exercises[exIndex + 1]?.superset ? (
              <div style={S.restRow}>
                {restTimers[ex.id] ? (
                  <>
                    <div style={{ ...S.restBadge, ...(restRemaining(ex.id) === 0 ? S.restBadgeDone : {}) }}>
                      {restRemaining(ex.id) === 0 ? "✅ Repos terminé" : `⏱ ${fmtDuration(restRemaining(ex.id))}`}
                    </div>
                    <button style={S.restCancelBtn} onClick={() => cancelRest(ex.id)}>
                      {restRemaining(ex.id) === 0 ? "OK" : "Annuler"}
                    </button>
                  </>
                ) : (
                  <button style={S.restStartBtn} onClick={() => startRest(ex.id, ex.restSeconds)}>
                    ⏱ Démarrer le repos ({fmtRestTime(ex.restSeconds)})
                  </button>
                )}
              </div>
            ) : null}

            <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} readOnly={coachedBlock} coachName={coachedBlock?.coachName} />
          </div>
        );
      })}

      <div style={S.commentBox}>
        <div style={S.sectionLabel}>Ressenti de la séance</div>
        <textarea
          style={S.commentInput}
          placeholder="Mental, fatigue, sommeil, motivation... (optionnel)"
          value={comment}
          onChange={(e) => setComment(e.target.value)}
          rows={3}
        />
      </div>

      <button style={S.finishBtn} onClick={save}>
        <Check size={18} /> Terminer la séance
      </button>
      <div style={{ height: 24 }} />
    </div>
  );
}

function AthleteDetailView({ athlete, onBack, onUpdateAthlete, onDeleteAthlete }) {
  const [programForm, setProgramForm] = useState(null);
  const [viewingSession, setViewingSession] = useState(null);
  const [viewingExercise, setViewingExercise] = useState(null);
  const [showImportSession, setShowImportSession] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [justImportedSession, setJustImportedSession] = useState(null);
  const [goalDrafts, setGoalDrafts] = useState({});
  const [confirmDeleteAthlete, setConfirmDeleteAthlete] = useState(false);
  const [openProgram, setOpenProgram] = useState(null);
  const [confirmDeleteProgram, setConfirmDeleteProgram] = useState(null);

  const fakeBlocks = [{ id: "athlete-block", name: athlete.name, active: true }];

  const exerciseIndex = useMemo(() => {
    const idx = {};
    Object.entries(athlete.knownExercises || {}).forEach(([exId, def]) => {
      idx[exId] = { id: exId, ...def };
    });
    athlete.programs.forEach((p) => p.exercises.forEach((e) => (idx[e.id] = { ...e, programName: p.name })));
    return idx;
  }, [athlete.programs, athlete.knownExercises]);

  function addProgram(program) {
    const next = [...athlete.programs, { ...program, blockId: "athlete-block" }];
    onUpdateAthlete(athlete.id, { programs: next });
    setProgramForm(null);
  }
  function updateProgramForAthlete(updated) {
    const next = athlete.programs.map((p) => (p.id === updated.id ? { ...p, ...updated } : p));
    onUpdateAthlete(athlete.id, { programs: next });
    setProgramForm(null);
  }
  function deleteProgramForAthlete(id) {
    const next = athlete.programs.filter((p) => p.id !== id);
    onUpdateAthlete(athlete.id, { programs: next });
  }

  function handleExportProgram() {
    const data = { block: { name: `Programme — ${athlete.name}` }, programs: athlete.programs, coachName: "" };
    const text = programSummaryText(data.block.name, athlete.programs) + "\n" + packPayload("PROGRAM", data);
    window.location.href = buildWhatsAppLink("", text);
  }

  function processSessionImport(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "SESSION" || !parsed.data.session) {
      setImportStatus("error");
      setTimeout(() => setImportStatus(null), 2500);
      return;
    }
    const next = [...athlete.sessions, parsed.data.session];
    const nextKnown = { ...(athlete.knownExercises || {}), ...(parsed.data.exerciseNames || {}) };
    onUpdateAthlete(athlete.id, { sessions: next, knownExercises: nextKnown });
    setJustImportedSession(parsed.data.session);
    setGoalDrafts({});
    setImportStatus("ok");
    setImportText("");
    setShowImportSession(false);
    setTimeout(() => setImportStatus(null), 2500);
  }

  function handleImportSession() {
    processSessionImport(importText);
  }

  async function handlePasteSessionClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStatus("error");
        setTimeout(() => setImportStatus(null), 2500);
        return;
      }
      processSessionImport(text);
    } catch (e) {
      setImportStatus("clipboard-error");
      setTimeout(() => setImportStatus(null), 2500);
    }
  }

  function saveGoal(exId, text) {
    const next = { ...athlete.goals };
    if (text) next[exId] = text;
    else delete next[exId];
    onUpdateAthlete(athlete.id, { goals: next });
  }

  function handleExportGoals() {
    const text = goalsSummaryText(athlete.name, athlete.goals, exerciseIndex) + "\n" + packPayload("GOALS", { goals: athlete.goals });
    window.location.href = buildWhatsAppLink("", text);
  }

  if (programForm) {
    return (
      <ProgramForm
        mode={programForm.mode}
        initialProgram={programForm.program}
        defaultBlockId="athlete-block"
        blocks={fakeBlocks}
        onCancel={() => setProgramForm(null)}
        onCreate={addProgram}
        onUpdate={updateProgramForAthlete}
      />
    );
  }

  if (viewingExercise) {
    return (
      <ExerciseHistory
        exercise={viewingExercise}
        sessions={athlete.sessions}
        onBack={() => setViewingExercise(null)}
        coachGoalValue={athlete.goals[viewingExercise.id]}
        onSaveCoachGoal={(text) => saveGoal(viewingExercise.id, text)}
      />
    );
  }

  if (viewingSession) {
    return (
      <SessionDetailView
        session={viewingSession}
        exerciseIndex={exerciseIndex}
        onBack={() => setViewingSession(null)}
        onOpenExercise={(ex) => setViewingExercise(ex)}
        coachPhone=""
        onSaveCoachPhone={() => {}}
      />
    );
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Coach
      </button>
      <div style={S.pageTitle}>{athlete.name}</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        {athlete.programs.length} séance(s) au programme · {athlete.sessions.length} reçue(s)
      </div>

      <div style={S.sectionLabel}>Programme</div>
      {athlete.programs.map((p) => (
        <div key={p.id} style={S.programBlock}>
          <button style={S.programBlockHeader} onClick={() => setOpenProgram(openProgram === p.id ? null : p.id)}>
            <span style={S.programBlockTitle}>{p.name}</span>
            <span style={S.caption}>{openProgram === p.id ? "−" : "+"}</span>
          </button>
          {openProgram === p.id && (
            <div style={S.programBlockBody}>
              {p.exercises.map((ex) => (
                <button key={ex.id} style={S.exRowClickable} onClick={() => setViewingExercise(ex)}>
                  <div>
                    <div style={S.exRowName}>{ex.name}</div>
                    <div style={S.caption}>{ex.muscle}</div>
                    {ex.type !== "cardio" && (
                      <div style={S.caption}>{ex.sets}×{ex.repMin}-{ex.repMax} reps</div>
                    )}
                    {athlete.goals[ex.id] && (
                      <div style={{ ...S.caption, color: "#FFC233", marginTop: 2 }}>🎯 {athlete.goals[ex.id]}</div>
                    )}
                  </div>
                  <span style={S.caption}>Voir →</span>
                </button>
              ))}
              <button style={S.editProgramBtn} onClick={() => setProgramForm({ mode: "edit", program: p })}>
                Modifier cette séance
              </button>
              {confirmDeleteProgram === p.id ? (
                <div style={S.confirmDeleteRow}>
                  <span style={S.caption}>Supprimer « {p.name} » ?</span>
                  <button style={S.confirmDeleteBtn} onClick={() => { deleteProgramForAthlete(p.id); setConfirmDeleteProgram(null); }}>
                    Oui, supprimer
                  </button>
                  <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteProgram(null)}>
                    Annuler
                  </button>
                </div>
              ) : (
                <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteProgram(p.id)}>
                  <Trash2 size={13} /> Supprimer
                </button>
              )}
            </div>
          )}
        </div>
      ))}
      <button style={S.createBtn} onClick={() => setProgramForm({ mode: "create", program: null })}>
        <Plus size={16} /> Ajouter une séance au programme
      </button>

      {athlete.programs.length > 0 && (
        <button style={{ ...S.exportBtn, marginTop: 10 }} onClick={handleExportProgram}>
          📱 Envoyer le programme par WhatsApp
        </button>
      )}

      <div style={S.sectionLabel}>Séances reçues</div>
      <div style={S.programList}>
        {[...athlete.sessions].sort((a, b) => (a.date < b.date ? 1 : -1)).map((s) => (
          <button key={s.id} style={S.sessionLogRow} onClick={() => setViewingSession(s)}>
            <div>
              <div style={S.exRowName}>{s.programName || "Séance"}</div>
              <div style={S.caption}>{Object.keys(s.entries).length} exercices</div>
            </div>
            <span style={S.caption}>{fmtDate(s.date)}</span>
          </button>
        ))}
        {athlete.sessions.length === 0 && <div style={S.caption}>Aucune séance reçue pour l'instant.</div>}
      </div>

      {showImportSession ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Reçu de {athlete.name} sur WhatsApp :</div>
          <button style={S.createBtn} onClick={handlePasteSessionClipboard}>
            📋 Coller et importer
          </button>
          {importStatus === "ok" && <div style={S.exportStatus}>Séance importée ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
          {importStatus === "clipboard-error" && (
            <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
          )}
          <textarea
            style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
            rows={3}
            placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
          />
          {importText && (
            <button style={S.exportBtnGhost} onClick={handleImportSession}>
              Importer ce texte
            </button>
          )}
        </div>
      ) : (
        <button style={S.exportBtnGhost} onClick={() => setShowImportSession(true)}>
          📥 Importer une séance reçue
        </button>
      )}

      {justImportedSession && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>
            🎯 Séance importée — fixe l'objectif de la semaine prochaine pour chaque exercice :
          </div>
          {Object.keys(justImportedSession.entries).map((exId) => {
            const def = exerciseIndex[exId];
            return (
              <div key={exId} style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>{def?.name || exId}</div>
                <div style={S.goalInputRow}>
                  <input
                    style={S.goalInput}
                    placeholder="ex : passer à 40 kg"
                    value={goalDrafts[exId] ?? athlete.goals[exId] ?? ""}
                    onChange={(e) => setGoalDrafts((d) => ({ ...d, [exId]: e.target.value }))}
                  />
                  <button style={S.goalSaveBtn} onClick={() => saveGoal(exId, (goalDrafts[exId] ?? "").trim())}>
                    <Check size={16} />
                  </button>
                </div>
              </div>
            );
          })}
          <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
            <button style={S.exportBtn} onClick={handleExportGoals}>
              📱 Envoyer les objectifs par WhatsApp
            </button>
            <button style={S.exportBtnGhost} onClick={() => setJustImportedSession(null)}>
              Terminé
            </button>
          </div>
        </div>
      )}

      <div style={S.sectionLabel}>Objectifs</div>
      <div style={{ ...S.caption, marginBottom: 10 }}>
        Ouvre un exercice — depuis "Programme" ou depuis une "Séance reçue" (bouton "Voir la progression") — pour voir sa performance et y fixer l'objectif de la semaine prochaine.
      </div>

      {Object.keys(athlete.goals || {}).length > 0 && (
        <button style={{ ...S.exportBtn, marginTop: 4 }} onClick={handleExportGoals}>
          📱 Envoyer les objectifs par WhatsApp
        </button>
      )}

      <div style={{ marginTop: 24 }}>
        {confirmDeleteAthlete ? (
          <div style={S.confirmDeleteRow}>
            <span style={S.caption}>Supprimer le suivi « {athlete.name} » et toutes ses données ?</span>
            <button style={S.confirmDeleteBtn} onClick={() => onDeleteAthlete(athlete.id)}>
              Oui, supprimer
            </button>
            <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteAthlete(false)}>
              Annuler
            </button>
          </div>
        ) : (
          <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteAthlete(true)}>
            <Trash2 size={13} /> Supprimer ce suivi
          </button>
        )}
      </div>
    </div>
  );
}

function BottomNav({ tab, setTab }) {
  const items = [
    { id: "home", label: "Accueil", icon: Home },
    { id: "programs", label: "Programmes", icon: ListChecks },
    { id: "history", label: "Historique", icon: TrendingUp },
    { id: "coach", label: "Coach", icon: Users },
  ];
  return (
    <div style={S.nav}>
      {items.map(({ id, label, icon: Icon }) => (
        <button key={id} style={S.navBtn} onClick={() => setTab(id)}>
          <Icon size={20} strokeWidth={tab === id ? 2.4 : 1.8} color={tab === id ? "#FFC233" : "#FFFFFF"} />
          <span style={{ ...S.navLabel, color: tab === id ? "#FFC233" : "#FFFFFF" }}>{label}</span>
        </button>
      ))}
    </div>
  );
}
