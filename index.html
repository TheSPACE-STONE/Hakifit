      {blockMeals.length > 0 && (
        <button style={{ ...S.exportBtnGhost, marginBottom: 10 }} onClick={() => setShowShoppingList(true)}>
          <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Extraire la liste de courses
        </button>
      )}

      {blockMeals.length === 0 && <div style={{ ...S.caption, margin: "12px 0" }}>Pas encore de repas dans ce programme.</div>}

      {dayNumbers.map((day) => (
        <div key={day} style={S.programBlock}>
          <button style={S.programBlockHeader} onClick={() => setOpenDay(openDay === day ? null : day)}>
            <span style={S.programBlockTitle}>
              Jour {day}
              {dayNutritionSummary(day) && (
                <span style={{ ...S.caption, marginLeft: 8, color: "#FFC233" }}>{dayNutritionSummary(day)}</span>
              )}
            </span>
            <span style={S.caption}>{openDay === day ? "−" : "+"}</span>
          </button>
          {openDay === day && (
            <div style={S.programBlockBody}>
              {mealsByDay[day].map((meal) => (
                <div key={meal.id} style={S.dishRow}>
                  <button style={S.dishHeaderBtn} onClick={() => setOpen(open === meal.id ? null : meal.id)}>
                    <span style={S.exRowName}>{meal.name}</span>
                    <span style={S.caption}>{open === meal.id ? "−" : "+"}</span>
                  </button>
                  {open === meal.id && (
                    <div style={S.dishDetail}>
                      {meal.dishes.map((dish) => {
                        const key = `${meal.id}-${dish.id}`;
                        return (
                          <div key={dish.id} style={{ marginBottom: 4 }}>
                            <button style={S.dishHeaderBtn} onClick={() => setOpenDish(openDish === key ? null : key)}>
                              <span style={S.caption}>{dish.name}</span>
                              <span style={S.caption}>{openDish === key ? "−" : "+"}</span>
                            </button>
                            {openDish === key && (
                              <div style={S.dishDetail}>
                                {dish.ingredients.length === 0 && <div style={S.caption}>Aucun détail ajouté.</div>}
                                {dish.ingredients.map((ing) => (
                                  <div key={ing.id} style={S.caption}>• {ing.text}</div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                      {meal.dishes.length === 0 && <div style={S.caption}>Aucun plat dans ce repas.</div>}

                      <div style={{ marginTop: 10, paddingTop: 8, borderTop: "1px solid #2C2620" }}>
                        {(() => {
                          const todayLog = getTodayLog(meal.id);
                          const isReEditing = reEditingMealId === meal.id;
                          if (todayLog && !isReEditing) {
                            return (
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                                <div style={S.caption}>
                                  Aujourd'hui : {mealLogStatusLabel(todayLog.status)}
                                  {todayLog.changes?.length ? ` — ${todayLog.changes.map((c) => `${c.dish} → ${c.replacement}`).join(", ")}` : ""}
                                  {todayLog.note ? ` — ${todayLog.note}` : ""}
                                </div>
                                <button style={S.blockChipAdd} onClick={() => setReEditingMealId(meal.id)}>
                                  <Pencil size={12} />
                                </button>
                              </div>
                            );
                          }
                          if (loggingMeal?.mealId === meal.id) {
                            return (
                              <MealLogEditor
                                meal={meal}
                                status={loggingMeal.status}
                                initialLog={isReEditing && todayLog?.status === loggingMeal.status ? todayLog : null}
                                onConfirm={(payload) => handleLogMeal(meal, loggingMeal.status, payload)}
                                onCancel={() => { setLoggingMeal(null); setReEditingMealId(null); }}
                              />
                            );
                          }
                          return (
                            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                              <button style={S.exportBtnGhost} onClick={() => handleLogMeal(meal, "asPlanned", {})}>
                                <Check size={13} style={{ verticalAlign: "-2px", marginRight: 4 }} />Comme prévu
                              </button>
                              <button style={S.exportBtnGhost} onClick={() => setLoggingMeal({ mealId: meal.id, status: "adapted" })}>
                                <Pencil size={13} style={{ verticalAlign: "-2px", marginRight: 4 }} />Adapté
                              </button>
                              <button style={S.exportBtnGhost} onClick={() => setLoggingMeal({ mealId: meal.id, status: "restaurant" })}>
                                <Utensils size={13} style={{ verticalAlign: "-2px", marginRight: 4 }} />Restaurant
                              </button>
                              {isReEditing && (
                                <button style={S.exportBtnGhost} onClick={() => setReEditingMealId(null)}>
                                  <X size={13} style={{ verticalAlign: "-2px", marginRight: 4 }} />Annuler
                                </button>
                              )}
                            </div>
                          );
                        })()}
                      </div>

                      <button style={{ ...S.editProgramBtn, marginTop: 10 }} onClick={() => onEditMeal(meal)}>
                        Modifier ce repas
                      </button>
                      {confirmDelete === meal.id ? (
                        <div style={S.confirmDeleteRow}>
                          <span style={S.caption}>Supprimer « {meal.name} » ?</span>
                          <button style={S.confirmDeleteBtn} onClick={() => { onDeleteMeal(meal.id); setConfirmDelete(null); }}>
                            Oui, supprimer
                          </button>
                          <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(null)}>
                            Annuler
                          </button>
                        </div>
                      ) : (
                        <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(meal.id)}>
                          <Trash2 size={13} /> Supprimer
                        </button>
                      )}
                    </div>
                  )}
                </div>
              ))}
              <button style={S.editProgramBtn} onClick={() => onCreateMeal(selectedBlock?.id, day)}>
                <Plus size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Ajouter un repas au Jour {day}
              </button>
            </div>
          )}
        </div>
      ))}

      <button style={S.createBtn} onClick={() => onCreateMeal(selectedBlock?.id, maxDay + 1)}>
        <Plus size={16} /> {maxDay > 0 ? `Ajouter un Jour ${maxDay + 1}` : "Ajouter le premier jour"}
      </button>
    </div>
  );
}

function MealForm({ mode, initialMeal, defaultBlockId, defaultDay, blocks, dishLibrary, onCancel, onCreate, onUpdate }) {
  const isEdit = mode === "edit";
  const [name, setName] = useState(initialMeal?.name || "");
  const [blockId, setBlockId] = useState(initialMeal?.blockId || defaultBlockId || blocks[0]?.id);
  const [day, setDay] = useState(initialMeal?.day || defaultDay || 1);
  const [showPicker, setShowPicker] = useState(false);
  const [dishes, setDishes] = useState(() => {
    if (initialMeal) {
      return initialMeal.dishes.map((d) => ({
        id: d.id,
        name: d.name,
        calories: d.calories != null ? String(d.calories) : "",
        protein: d.protein != null ? String(d.protein) : "",
        carbs: d.carbs != null ? String(d.carbs) : "",
        fat: d.fat != null ? String(d.fat) : "",
        ingredients: (d.ingredients || []).map((ing) => ({ id: uid(), text: ing.text })),
      }));
    }
    return [blankDish()];
  });

  function pickFromLibrary(item) {
    const ingredients = item.allergens?.length ? [{ id: uid(), text: `Allergènes : ${item.allergens.join(", ")}` }] : [];
    setDishes((ds) => [
      ...ds,
      {
        id: uid(), name: item.name,
        calories: item.calories != null ? String(item.calories) : "",
        protein: item.protein != null ? String(item.protein) : "",
        carbs: item.carbs != null ? String(item.carbs) : "",
        fat: item.fat != null ? String(item.fat) : "",
        ingredients,
      },
    ]);
    setShowPicker(false);
  }

  if (showPicker) {
    return (
      <LibraryPicker
        library={dishLibrary || []}
        title="Choisir un plat"
        groupKey="category"
        onPick={pickFromLibrary}
        onCancel={() => setShowPicker(false)}
      />
    );
  }

  function updateDishName(id, value) {
    setDishes((ds) => ds.map((d) => (d.id === id ? { ...d, name: value } : d)));
  }
  function updateDishCalories(id, value) {
    setDishes((ds) => ds.map((d) => (d.id === id ? { ...d, calories: value } : d)));
  }
  function updateDishMacro(id, field, value) {
    setDishes((ds) => ds.map((d) => (d.id === id ? { ...d, [field]: value } : d)));
  }
  function addDish() {
    setDishes((ds) => [...ds, blankDish()]);
  }
  function removeDish(id) {
    setDishes((ds) => ds.filter((d) => d.id !== id));
  }
  function addIngredient(dishId) {
    setDishes((ds) => ds.map((d) => (d.id === dishId ? { ...d, ingredients: [...d.ingredients, blankIngredient()] } : d)));
  }
  function updateIngredient(dishId, ingId, value) {
    setDishes((ds) =>
      ds.map((d) => (d.id === dishId ? { ...d, ingredients: d.ingredients.map((i) => (i.id === ingId ? { ...i, text: value } : i)) } : d))
    );
  }
  function removeIngredient(dishId, ingId) {
    setDishes((ds) => ds.map((d) => (d.id === dishId ? { ...d, ingredients: d.ingredients.filter((i) => i.id !== ingId) } : d)));
  }

  const canSave = name.trim().length > 0 && dishes.length > 0 && dishes.every((d) => d.name.trim().length > 0);

  function handleSave() {
    const meal = {
      id: initialMeal?.id || uid(),
      name: name.trim(),
      blockId,
      day: Number(day) || 1,
      dishes: dishes.map((d) => ({
        id: d.id,
        name: d.name.trim(),
        ...(d.calories !== "" && d.calories != null && !isNaN(Number(d.calories)) ? { calories: Number(d.calories) } : {}),
        ...(d.protein !== "" && d.protein != null && !isNaN(Number(d.protein)) ? { protein: Number(d.protein) } : {}),
        ...(d.carbs !== "" && d.carbs != null && !isNaN(Number(d.carbs)) ? { carbs: Number(d.carbs) } : {}),
        ...(d.fat !== "" && d.fat != null && !isNaN(Number(d.fat)) ? { fat: Number(d.fat) } : {}),
        ingredients: d.ingredients.filter((i) => i.text.trim()).map((i) => ({ id: i.id, text: i.text.trim() })),
      })),
    };
    if (isEdit) onUpdate(meal);
    else onCreate(meal);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier le repas" : "Nouveau repas"}</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        {isEdit ? "Ajuste le nom, les plats ou le programme associé." : "Donne-lui un nom (ex : Petit-déjeuner) et ajoute tes plats."}
      </div>

      <div style={S.goalInputLabel}>Nom du repas</div>
      <input
        style={S.textInput}
        placeholder="ex : Petit-déjeuner, Déjeuner, Dîner..."
        value={name}
        onChange={(e) => setName(e.target.value)}
      />

      <div style={S.goalInputLabel}>Jour du cycle</div>
      <input
        style={S.textInput}
        type="number"
        min="1"
        value={day}
        onChange={(e) => setDay(e.target.value)}
      />

      {blocks.length > 1 && (
        <select style={S.selectInput} value={blockId} onChange={(e) => setBlockId(e.target.value)}>
          {blocks.map((b) => (
            <option key={b.id} value={b.id}>
              {b.name}{b.active ? " (actif)" : ""}
            </option>
          ))}
        </select>
      )}

      <div style={{ height: 6 }} />

      {dishes.map((dish, idx) => (
        <div key={dish.id} style={S.newExerciseCard}>
          <div style={S.newExerciseHead}>
            <span style={S.sectionLabel}>Plat {idx + 1}</span>
            {dishes.length > 1 && (
              <button style={S.setRemoveBtn} onClick={() => removeDish(dish.id)}>
                <Minus size={14} />
              </button>
            )}
          </div>
          <input
            style={S.textInput}
            placeholder="Type de plat (ex : Salade)"
            value={dish.name}
            onChange={(e) => updateDishName(dish.id, e.target.value)}
          />
          <input
            style={S.textInput}
            type="number"
            placeholder="Calories (optionnel)"
            value={dish.calories || ""}
            onChange={(e) => updateDishCalories(dish.id, e.target.value)}
          />
          <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
            <input
              style={{ ...S.setInput, flex: 1 }}
              type="number"
              placeholder="Protéines (g)"
              value={dish.protein || ""}
              onChange={(e) => updateDishMacro(dish.id, "protein", e.target.value)}
            />
            <input
              style={{ ...S.setInput, flex: 1 }}
              type="number"
              placeholder="Glucides (g)"
              value={dish.carbs || ""}
              onChange={(e) => updateDishMacro(dish.id, "carbs", e.target.value)}
            />
            <input
              style={{ ...S.setInput, flex: 1 }}
              type="number"
              placeholder="Lipides (g)"
              value={dish.fat || ""}
              onChange={(e) => updateDishMacro(dish.id, "fat", e.target.value)}
            />
          </div>

          {dish.ingredients.map((ing) => (
            <div key={ing.id} style={S.setRow}>
              <input
                style={{ ...S.setInput, flex: 1 }}
                placeholder="ex : 300g de salade"
                value={ing.text}
                onChange={(e) => updateIngredient(dish.id, ing.id, e.target.value)}
              />
              <button style={S.setRemoveBtn} onClick={() => removeIngredient(dish.id, ing.id)}>
                <Minus size={14} />
              </button>
            </div>
          ))}
          <button style={S.addSetBtn} onClick={() => addIngredient(dish.id)}>
            <Plus size={14} /> Ajouter un détail
          </button>
        </div>
      ))}

      <div style={{ display: "flex", gap: 8 }}>
        <button style={{ ...S.addSetBtn, flex: 1 }} onClick={addDish}>
          <Plus size={14} /> Ajouter un plat
        </button>
        <button style={{ ...S.addSetBtn, flex: 1 }} onClick={() => setShowPicker(true)}>
          <Search size={14} /> Depuis la bibliothèque
        </button>
      </div>

      <button
        style={{ ...S.finishBtn, opacity: canSave ? 1 : 0.4, marginTop: 18 }}
        disabled={!canSave}
        onClick={handleSave}
      >
        <Check size={18} /> {isEdit ? "Enregistrer les modifications" : "Créer le repas"}
      </button>
      <div style={{ height: 24 }} />
    </div>
  );
}

function GymsView({ gyms, onAdd, onUpdate, onDelete, onAddMachine, onDeleteMachine, onBack }) {
  const [showAdd, setShowAdd] = useState(false);
  const [nameDraft, setNameDraft] = useState("");
  const [addressDraft, setAddressDraft] = useState("");
  const [activeGymId, setActiveGymId] = useState(null);

  const activeGym = gyms.find((g) => g.id === activeGymId);

  if (activeGym) {
    return (
      <GymDetailView
        gym={activeGym}
        onBack={() => setActiveGymId(null)}
        onUpdate={(patch) => onUpdate(activeGym.id, patch)}
        onDelete={() => { onDelete(activeGym.id); setActiveGymId(null); }}
        onAddMachine={(m) => onAddMachine(activeGym.id, m)}
        onDeleteMachine={(m) => onDeleteMachine(activeGym.id, m)}
      />
    );
  }

  function handleAdd() {
    if (!nameDraft.trim()) return;
    onAdd(nameDraft, addressDraft);
    setNameDraft("");
    setAddressDraft("");
    setShowAdd(false);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Coach
      </button>
      <div style={S.pageTitle}>Salles de sport</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>
        Renseigne le nom, l'adresse et les machines de chaque salle, pour construire des programmes adaptés à l'équipement disponible.
      </div>

      <div style={S.programList}>
        {gyms.map((g) => (
          <button key={g.id} style={S.sessionLogRow} onClick={() => setActiveGymId(g.id)}>
            <div>
              <div style={S.exRowName}>{g.name}</div>
              <div style={S.caption}>
                {g.address ? `${g.address} · ` : ""}{g.machines.length} machine(s)
              </div>
            </div>
            <span style={S.caption}>Voir →</span>
          </button>
        ))}
        {gyms.length === 0 && <div style={S.caption}>Aucune salle enregistrée.</div>}
      </div>

      {showAdd ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom de la salle</div>
          <input style={S.textInput} placeholder="ex : Basic Fit Nation" value={nameDraft} onChange={(e) => setNameDraft(e.target.value)} />
          <div style={S.goalInputLabel}>Adresse précise</div>
          <input style={S.textInput} placeholder="ex : 12 rue de la Paix, 75002 Paris" value={addressDraft} onChange={(e) => setAddressDraft(e.target.value)} />
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <button style={S.createBtn} onClick={handleAdd}>Ajouter</button>
            <button style={S.exportBtnGhost} onClick={() => setShowAdd(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={S.createBtn} onClick={() => setShowAdd(true)}>
          <Plus size={16} /> Ajouter une salle
        </button>
      )}
    </div>
  );
}

  function handleAddMachine() {
    if (!newMachineDraft.trim()) return;
    onAddMachine(newMachineDraft);
    setNewMachineDraft("");

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>

function SettingsView({ onExportBackup, onImportBackup, onBack, coachPhone, coachDisplayName, onSaveCoachPhone, onSaveCoachDisplayName, isCoach, onSetIsCoach, myProfile, onUpdateMyProfile, gyms, myGymId, onSetMyGymId }) {
  const [backupStatus, setBackupStatus] = useState(null);
  const fileInputRef = useRef(null);
  const [nameDraft, setNameDraft] = useState(coachDisplayName || "");
  const [phoneDraft, setPhoneDraft] = useState(coachPhone || "");
  const [coachSaved, setCoachSaved] = useState(false);
  const [confirmDeleteCoach, setConfirmDeleteCoach] = useState(false);
  const [coachError, setCoachError] = useState(false);
  const [editingCoach, setEditingCoach] = useState(!coachPhone);
  const [editingMyProfile, setEditingMyProfile] = useState(false);
  const [issuesDraft, setIssuesDraft] = useState(myProfile?.issues || "");
  const [weightDraft, setWeightDraft] = useState(myProfile?.weight || "");
  const [availabilityDraft, setAvailabilityDraft] = useState(myProfile?.availability || {});
  const [allergiesDraft, setAllergiesDraft] = useState(myProfile?.allergies || "");
  const [dislikesDraft, setDislikesDraft] = useState(myProfile?.dislikes || "");
  const [favoritesDraft, setFavoritesDraft] = useState(myProfile?.favorites || "");
  const [bigEaterDraft, setBigEaterDraft] = useState(!!myProfile?.bigEater);
  const [runningSpotDraft, setRunningSpotDraft] = useState(myProfile?.runningSpot || "");
  const [gymIdDraft, setGymIdDraft] = useState(myGymId || "");

  function updateAvailabilityDay(day, value) {
    setAvailabilityDraft((a) => ({ ...a, [day]: value }));
  }

  function saveMyProfile() {
    onUpdateMyProfile({
      issues: issuesDraft.trim(),
      weight: weightDraft.trim(),
      availability: availabilityDraft,
      allergies: allergiesDraft.trim(),
      dislikes: dislikesDraft.trim(),
      favorites: favoritesDraft.trim(),
      bigEater: bigEaterDraft,
      runningSpot: runningSpotDraft.trim(),
    });
    onSetMyGymId(gymIdDraft);
    setEditingMyProfile(false);
  }

  function exportMyProfile() {
    let text = "📋 Ma fiche\n";
    const gym = gyms?.find((g) => g.id === myGymId);
    if (gym) text += `\nSalle de sport : ${gym.name}${gym.address ? ` (${gym.address})` : ""}`;
    if (myProfile?.weight) text += `\nPoids actuel : ${myProfile.weight} kg`;
    const availLines = WEEK_DAYS.filter((d) => myProfile?.availability?.[d]).map((d) => `${d} : ${myProfile.availability[d]}`);
    if (availLines.length) text += `\nDisponibilités salle :\n${availLines.join("\n")}`;
    if (myProfile?.runningSpot) text += `\nCourse à pied à proximité : ${myProfile.runningSpot}`;
    if (myProfile?.issues) text += `\nProblèmes musculaires / articulaires : ${myProfile.issues}`;
    if (myProfile?.allergies) text += `\nAllergies : ${myProfile.allergies}`;
    if (myProfile?.dislikes) text += `\nAliments évités (conviction) : ${myProfile.dislikes}`;
    if (myProfile?.favorites) text += `\nAliments préférés : ${myProfile.favorites}`;
    text += `\nGros mangeur : ${myProfile?.bigEater ? "Oui" : "Non"}`;
    text += "\n" + packPayload("MYPROFILE", { profile: myProfile });
    window.location.href = buildWhatsAppLink("", text);
  }

  const availableDaysCount = WEEK_DAYS.filter((d) => myProfile?.availability?.[d]).length;

  function handleImportClick() {
    fileInputRef.current?.click();
  }

  function handleFileChange(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        onImportBackup(data);
        setBackupStatus("imported");
      } catch (err) {
        setBackupStatus("import-error");
      }
      setTimeout(() => setBackupStatus(null), 2500);
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Accueil
      </button>
      <div style={S.pageTitle}>Paramètres</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>Gestion de tes données.</div>

      <div style={S.exportBox}>
        <div style={S.exportLabel}>Profil</div>
        <label style={S.supersetCheckRow}>
          <input type="checkbox" checked={isCoach} onChange={(e) => onSetIsCoach(e.target.checked)} />
          Je suis un coach (affiche l'onglet Coach)
        </label>
      </div>

      <div style={S.profileTopBar}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.profileTopLabel}>Ma fiche</div>
          <div style={S.profileTopValue}>
            {gyms?.find((g) => g.id === myGymId) ? `${gyms.find((g) => g.id === myGymId).name}. ` : ""}
            {myProfile?.weight ? `${myProfile.weight} kg. ` : ""}
            {availableDaysCount > 0 ? `${availableDaysCount} jour(s) dispo. ` : ""}
            {myProfile?.issues ? `Problèmes : ${myProfile.issues}. ` : ""}
            {myProfile?.allergies ? `Allergies : ${myProfile.allergies}. ` : ""}
            {!gyms?.find((g) => g.id === myGymId) && !myProfile?.weight && availableDaysCount === 0 && !myProfile?.issues && !myProfile?.allergies && "Rien de renseigné"}
          </div>
        </div>
        <button style={S.blockChipAdd} onClick={() => setEditingMyProfile(true)}>
          <Pencil size={14} />
        </button>
        <button style={S.blockChipAdd} onClick={exportMyProfile}>
          <Smartphone size={14} />
        </button>
      </div>
      {editingMyProfile && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Ma salle de sport</div>
          {gyms && gyms.length > 0 ? (
            <select style={S.selectInput} value={gymIdDraft} onChange={(e) => setGymIdDraft(e.target.value)}>
              <option value="">Non renseignée</option>
              {gyms.map((g) => (
                <option key={g.id} value={g.id}>{g.name}</option>
              ))}
            </select>
          ) : (
            <div style={{ ...S.caption, marginBottom: 8 }}>Aucune salle créée — rends-toi dans Coach → Salles de sport pour en ajouter une.</div>
          )}

          <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Poids actuel (kg)</div>
          <input style={S.textInput} type="number" placeholder="ex : 78" value={weightDraft} onChange={(e) => setWeightDraft(e.target.value)} />

          <div style={S.goalInputLabel}>Disponibilités pour la salle</div>
          {WEEK_DAYS.map((day) => (
            <div key={day} style={S.availabilityRow}>
              <span style={S.availabilityDayLabel}>{day}</span>
              <input
                style={{ ...S.textInput, flex: 1, marginBottom: 0 }}
                placeholder="ex : 18h-20h"

                onChange={(e) => updateAvailabilityDay(day, e.target.value)}

          <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Parc ou chemin pour courir à proximité</div>

          <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Problèmes musculaires / articulaires</div>
          <textarea
            style={{ ...S.commentInput, marginBottom: 8 }}
            rows={2}
            placeholder="ex : épaule droite fragile, éviter le squat profond..."
            value={issuesDraft}
            onChange={(e) => setIssuesDraft(e.target.value)}
          />
          <div style={S.goalInputLabel}>Allergies</div>
          <input style={S.textInput} placeholder="ex : arachides, lactose..." value={allergiesDraft} onChange={(e) => setAllergiesDraft(e.target.value)} />
          <div style={S.goalInputLabel}>Aliments évités par conviction</div>
          <input style={S.textInput} placeholder="ex : viande rouge, poisson..." value={dislikesDraft} onChange={(e) => setDislikesDraft(e.target.value)} />
          <div style={S.goalInputLabel}>Aliments préférés</div>
          <input style={S.textInput} placeholder="ex : pâtes, poulet..." value={favoritesDraft} onChange={(e) => setFavoritesDraft(e.target.value)} />
          <label style={S.supersetCheckRow}>
            <input type="checkbox" checked={bigEaterDraft} onChange={(e) => setBigEaterDraft(e.target.checked)} />
            Je suis un(e) gros(se) mangeur(se)
          </label>
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <button style={S.createBtn} onClick={saveMyProfile}>Enregistrer</button>
            <button style={S.exportBtnGhost} onClick={() => setEditingMyProfile(false)}>Annuler</button>
          </div>
        </div>
      )}

      <div style={S.profileTopBar}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.profileTopLabel}>Mon coach</div>
          <div style={S.profileTopValue}>
            {coachPhone ? `${coachRef(coachDisplayName)} · ${coachPhone}` : "Non renseigné"}
          </div>
        </div>
        <button style={S.blockChipAdd} onClick={() => setEditingCoach(true)}>
          <Pencil size={14} />
        </button>
      </div>
      {editingCoach && (
        <div style={S.segmentsBox}>
          <div style={{ ...S.caption, marginBottom: 10 }}>
            Renseigne-le une fois pour toutes : ça évite de le re-saisir à chaque envoi de séance ou d'objectif par WhatsApp.
          </div>
          <input
            style={S.textInput}
            placeholder="Prénom du coach"
            value={nameDraft}
            onChange={(e) => setNameDraft(e.target.value)}
          />
          <input
            style={S.textInput}
            placeholder="Numéro WhatsApp (ex : 0612345678)"
            value={phoneDraft}
            onChange={(e) => setPhoneDraft(e.target.value.replace(/[^0-9+]/g, ""))}
          />
          {coachError && (
            <div style={S.exportStatusError}>Le prénom et le numéro sont obligatoires pour enregistrer ton coach.</div>
          )}
          <div style={{ display: "flex", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
            <button
              style={S.createBtn}
              onClick={() => {
                if (!nameDraft.trim() || !phoneDraft.trim()) {
                  setCoachError(true);
                  return;
                }
                onSaveCoachPhone(phoneDraft);
                onSaveCoachDisplayName(nameDraft);
                setCoachError(false);
                setEditingCoach(false);
                setCoachSaved(true);
                setTimeout(() => setCoachSaved(false), 2000);
              }}
            >
              Enregistrer
            </button>
            <button
              style={S.exportBtnGhost}
              onClick={() => {
                setNameDraft(coachDisplayName || "");
                setPhoneDraft(coachPhone || "");
                setCoachError(false);
                setEditingCoach(false);
              }}
            >
              Annuler
            </button>
          </div>
          <button
            style={{ ...S.exportBtnGhost, marginTop: 8 }}
            onClick={() => {
              onSaveCoachPhone("");
              onSaveCoachDisplayName("");
              setNameDraft("");
              setPhoneDraft("");
              setCoachError(false);
              setEditingCoach(false);
            }}
          >
            Je n'ai pas de coach
          </button>
        </div>
      )}
      {coachSaved && <div style={S.exportStatus}>{coachRef(nameDraft)} enregistré ✓</div>}

      {coachPhone && !editingCoach && (
        confirmDeleteCoach ? (
          <div style={S.confirmDeleteRow}>
            <span style={S.caption}>Supprimer {coachRef(coachDisplayName)} ?</span>
            <button
              style={S.confirmDeleteBtn}
              onClick={() => {
                onSaveCoachPhone("");
                onSaveCoachDisplayName("");
                setNameDraft("");
                setPhoneDraft("");
                setConfirmDeleteCoach(false);
              }}
            >
              Oui, supprimer
            </button>
            <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteCoach(false)}>
              Annuler
            </button>
          </div>
        ) : (
          <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteCoach(true)}>
            <Trash2 size={13} /> Supprimer mon coach
          </button>
        )
      )}

      <div style={S.exportBox}>
        <div style={S.exportLabel}>Sauvegarde complète de l'app</div>
        <div style={{ ...S.caption, marginBottom: 10 }}>
          Exporte un fichier contenant tout — programmes, séances, objectifs — pour le garder en sécurité ou le restaurer sur un autre appareil.
        </div>
        <div style={S.exportRow}>
          <button
            style={S.exportBtn}
            onClick={() => {
              const ok = onExportBackup();
              setBackupStatus(ok ? "exported" : "export-error");
              setTimeout(() => setBackupStatus(null), 2500);
            }}
          >
            Sauvegarder
          </button>
          <button style={S.exportBtnGhost} onClick={handleImportClick}>
            Restaurer
          </button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleFileChange} />
        </div>
        {backupStatus === "exported" && <div style={S.exportStatus}>Fichier téléchargé — garde-le en lieu sûr.</div>}
        {backupStatus === "imported" && <div style={S.exportStatus}>Sauvegarde restaurée avec succès.</div>}
        {(backupStatus === "export-error" || backupStatus === "import-error") && (
          <div style={S.exportStatusError}>Échec — vérifie le fichier et réessaie.</div>
        )}
      </div>
    </div>
  );
}

function BottomNav({ tab, setTab, isCoach }) {
  const items = [
    { id: "home", label: "Accueil", icon: Home },
    { id: "programs", label: "Programmes", icon: ListChecks },
    { id: "nutrition", label: "Nutrition", icon: Apple },
    ...(isCoach ? [{ id: "coach", label: "Coach", icon: Users }] : []),
  ];
  return (
    <div style={S.nav}>
      {items.map(({ id, label, icon: Icon }) => (
        <button key={id} style={S.navBtn} onClick={() => setTab(id)}>
          <Icon size={20} strokeWidth={tab === id ? 2.4 : 1.8} color={tab === id ? "#FFC233" : "#FFFFFF"} />
          <span style={{ ...S.navLabel, color: tab === id ? "#FFC233" : "#FFFFFF" }}>{label}</span>
        </button>
      ))}
    </div>
  );
}
