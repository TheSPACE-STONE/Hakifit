  const [editingMachineName, setEditingMachineName] = useState(null);
  const [editMachineName, setEditMachineName] = useState("");
  const [editMachineMuscles, setEditMachineMuscles] = useState([]);

  function toggleNewMachineMuscle(m) {
    setNewMachineMuscles((list) => (list.includes(m) ? list.filter((x) => x !== m) : [...list, m]));
  }

  function toggleEditMachineMuscle(m) {
    setEditMachineMuscles((list) => (list.includes(m) ? list.filter((x) => x !== m) : [...list, m]));
  }

  function handleAddMachine() {
    if (!newMachineName.trim()) return;
    onAddMachine({ name: newMachineName, muscles: newMachineMuscles });
    setNewMachineName("");
    setNewMachineMuscles([]);
  }

  function openEditMachine(m) {
    setEditingMachineName(m.name);
    setEditMachineName(m.name);
    setEditMachineMuscles(m.muscles || []);
  }

  function saveEditMachine() {
    if (!editMachineName.trim()) return;
    onUpdateMachine(editingMachineName, { name: editMachineName.trim(), muscles: editMachineMuscles });
    setEditingMachineName(null);
  }

  const availableMuscles = Array.from(new Set(gym.machines.flatMap((m) => m.muscles || []))).sort();
  const filteredMachines = gym.machines.filter((m) => {
    if (muscleFilter && !(m.muscles || []).includes(muscleFilter)) return false;
    if (search.trim() && !m.name.toLowerCase().includes(search.trim().toLowerCase())) return false;
    return true;
  });

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Salles de sport
      </button>
      <div style={S.pageTitle}>{gym.name}</div>

      <div style={S.profileTopBar}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.profileTopLabel}>Infos</div>
          <div style={S.profileTopValue}>{gym.address || "Adresse non renseignée"}</div>
        </div>
        <button style={S.blockChipAdd} onClick={() => { setNameDraft(gym.name); setAddressDraft(gym.address || ""); setEditingInfo(true); }}>
          <Pencil size={14} />
        </button>
      </div>
      {editingInfo && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom de la salle</div>
          <input style={S.textInput} value={nameDraft} onChange={(e) => setNameDraft(e.target.value)} />
          <div style={S.goalInputLabel}>Adresse précise</div>
          <input style={S.textInput} value={addressDraft} onChange={(e) => setAddressDraft(e.target.value)} />
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <button style={S.createBtn} onClick={() => { onUpdate({ name: nameDraft.trim(), address: addressDraft.trim() }); setEditingInfo(false); }}>
              Enregistrer
            </button>
            <button style={S.exportBtnGhost} onClick={() => setEditingInfo(false)}>Annuler</button>
          </div>

          <div style={{ marginTop: 14, borderTop: "1px solid #332E28", paddingTop: 12 }}>
            {confirmDelete ? (
              <div style={S.confirmDeleteRow}>
                <span style={S.caption}>Supprimer « {gym.name} » ?</span>
                <button style={S.confirmDeleteBtn} onClick={onDelete}>Oui, supprimer</button>
                <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(false)}>Annuler</button>
              </div>
            ) : (
              <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(true)}>
                <Trash2 size={13} /> Supprimer cette salle
              </button>
            )}
          </div>
        </div>
      )}

      <div style={S.sectionLabel}>Ajouter une machine / un équipement</div>
      <div style={S.segmentsBox}>
        <input
          style={S.textInput}
          placeholder="ex : Presse à cuisse Panatta"
          value={newMachineName}
          onChange={(e) => setNewMachineName(e.target.value)}
        />
        <div style={S.goalInputLabel}>Groupe(s) musculaire(s) travaillé(s)</div>
        <div style={S.blockChipsRow}>
          {MUSCLE_GROUP_OPTIONS.map((m) => (
            <button
              key={m}
              style={{ ...S.blockChip, ...(newMachineMuscles.includes(m) ? S.blockChipSelected : {}) }}
              onClick={() => toggleNewMachineMuscle(m)}
            >
              {m}
            </button>
          ))}
        </div>
        <button style={{ ...S.createBtn, marginTop: 8 }} onClick={handleAddMachine}>
          <Plus size={16} /> Ajouter cette machine
        </button>
      </div>

      <div style={S.sectionLabel}>Machines / équipements de la salle</div>
      {gym.machines.length > 0 && (
        <>
          <input
            style={S.textInput}
            placeholder="Rechercher une machine..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
          {availableMuscles.length > 0 && (
            <div style={{ ...S.blockChipsRow, marginBottom: 10 }}>
              <button style={{ ...S.blockChip, ...(muscleFilter === null ? S.blockChipSelected : {}) }} onClick={() => setMuscleFilter(null)}>
                Tous
              </button>
              {availableMuscles.map((m) => (
                <button
                  key={m}
                  style={{ ...S.blockChip, ...(muscleFilter === m ? S.blockChipSelected : {}) }}
                  onClick={() => setMuscleFilter(m)}
                >
                  {m}
                </button>
              ))}
            </div>
          )}
        </>
      )}
      <div style={S.programList}>
        {filteredMachines.map((m) => (
          editingMachineName === m.name ? (
            <div key={m.name} style={S.segmentsBox}>
              <div style={S.goalInputLabel}>Nom</div>
              <input style={S.textInput} value={editMachineName} onChange={(e) => setEditMachineName(e.target.value)} />
              <div style={S.goalInputLabel}>Groupe(s) musculaire(s)</div>
              <div style={S.blockChipsRow}>
                {MUSCLE_GROUP_OPTIONS.map((mg) => (
                  <button
                    key={mg}
                    style={{ ...S.blockChip, ...(editMachineMuscles.includes(mg) ? S.blockChipSelected : {}) }}
                    onClick={() => toggleEditMachineMuscle(mg)}
                  >
                    {mg}
                  </button>
                ))}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={S.createBtn} onClick={saveEditMachine}>Enregistrer</button>
                <button style={S.exportBtnGhost} onClick={() => setEditingMachineName(null)}>Annuler</button>
              </div>
            </div>
          ) : (
            <div key={m.name} style={{ ...S.exRow, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div>
                  <div>{m.name}</div>
                  {m.muscles?.length > 0 && <div style={S.caption}>{m.muscles.join(", ")}</div>}
                </div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button style={S.blockChipAdd} onClick={() => openEditMachine(m)}>
                  <Pencil size={14} />
                </button>
                <button style={S.setRemoveBtn} onClick={() => onDeleteMachine(m.name)}>
                  <Minus size={14} />
                </button>
              </div>
            </div>
          )
        ))}
        {gym.machines.length === 0 && <div style={S.caption}>Aucune machine renseignée.</div>}
        {gym.machines.length > 0 && filteredMachines.length === 0 && <div style={S.caption}>Aucune machine ne correspond à la recherche.</div>}
      </div>
    </div>
  );
}

function ExerciseLibraryView({ library, onAdd, onUpdate, onDelete, onBack, onImportLibrary, onExportLibrary, gymMachines, gyms, collections, onAddCollection, onUpdateCollection, onDeleteCollection, onAddMachine }) {
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [form, setForm] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importCollectionId, setImportCollectionId] = useState("");
  const [newCollectionName, setNewCollectionName] = useState("");
  const [newCollectionGymId, setNewCollectionGymId] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [exportText, setExportText] = useState(null);
  const [editingCollectionId, setEditingCollectionId] = useState(null);
  const [editCollectionName, setEditCollectionName] = useState("");
  const [editCollectionGymId, setEditCollectionGymId] = useState("");
  const [creatingLibrary, setCreatingLibrary] = useState(false);
  const [quickLibName, setQuickLibName] = useState("");
  const [quickLibGymId, setQuickLibGymId] = useState("");
  const [selectedLibIds, setSelectedLibIds] = useState(null); // null = toutes

  const activeLibIds = selectedLibIds || (collections || []).map((c) => c.id);

  function collectionLabel(col) {
    if (!col) return "";
    const gym = (gyms || []).find((g) => g.id === col.gymId);
    return gym ? `${col.name} (${gym.name})` : col.name;
  }

  function toggleLib(id) {
    setSelectedLibIds((cur) => {
      const base = cur || (collections || []).map((c) => c.id);
      return base.includes(id) ? base.filter((x) => x !== id) : [...base, id];
    });
  }

  function resolveImportCollectionId() {
    if (importCollectionId === "__new__") {
      if (!newCollectionName.trim()) return null;
      return onAddCollection(newCollectionName, newCollectionGymId);
    }
    return importCollectionId || null;
  }

  function handleImport() {
    const collectionId = resolveImportCollectionId();
    const res = onImportLibrary(importText, collectionId);
    if (res.ok) {
      setImportStatus("ok");
      setImportText("");
      setImportCollectionId("");
      setNewCollectionName("");
      setNewCollectionGymId("");
      setShowImport(false);
    } else {
      setImportStatus("error");
    }
    setTimeout(() => setImportStatus(null), 2500);
  }

  const muscles = useMemo(
    () => Array.from(new Set(library.flatMap((e) => (e.muscle || "").split(",").map((m) => m.trim()).filter(Boolean)))).sort(),
    [library]
  );
  const filtered = library.filter((e) => {
    if (!activeLibIds.includes(e.collectionId)) return false;
    if (filter && !(e.muscle || "").split(",").map((m) => m.trim()).includes(filter)) return false;
    if (search.trim() && !e.name.toLowerCase().includes(search.trim().toLowerCase())) return false;
    return true;
  });

  function openEditCollection(col) {
    setEditingCollectionId(col.id);
    setEditCollectionName(col.name);
    setEditCollectionGymId(col.gymId || "");
  }

  function saveEditCollection() {
    if (!editCollectionName.trim()) return;
    onUpdateCollection(editingCollectionId, { name: editCollectionName.trim(), gymId: editCollectionGymId });
    setEditingCollectionId(null);
  }

  function createQuickLibrary() {
    if (!quickLibName.trim()) return;
    onAddCollection(quickLibName, quickLibGymId);
    setQuickLibName("");
    setQuickLibGymId("");
    setCreatingLibrary(false);
  }

  if (form) {
    return (
      <ExerciseLibraryForm
        mode={form.mode}
        initial={form.exercise}
        onCancel={() => setForm(null)}
        onCreate={(ex) => { onAdd(ex); setForm(null); }}
        onUpdate={(ex) => { onUpdate(ex); setForm(null); }}
        onDelete={(id) => { onDelete(id); setForm(null); }}
        gymMachines={gymMachines}
        gyms={gyms}
        collections={collections}
        onAddCollection={onAddCollection}
        onAddMachine={onAddMachine}
      />
    );
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Coach
      </button>
      <div style={S.pageTitle}>Bibliothèque d'exercices</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>
        Crée des exercices réutilisables (groupe musculaire, reps, repos, vidéo) pour construire tes programmes plus vite. Chaque bibliothèque peut être liée à une salle de sport.
      </div>

      <div style={S.sectionLabel}>Mes bibliothèques</div>
      {(collections || []).map((col) => (
        <div key={col.id} style={S.segmentsBox}>
          {editingCollectionId === col.id ? (
            <>
              <input style={S.textInput} placeholder="Nom de la bibliothèque" value={editCollectionName} onChange={(e) => setEditCollectionName(e.target.value)} />
              <select style={S.textInput} value={editCollectionGymId} onChange={(e) => setEditCollectionGymId(e.target.value)}>
                <option value="">Aucune salle liée</option>
                {(gyms || []).map((g) => (
                  <option key={g.id} value={g.id}>{g.name}</option>
                ))}
              </select>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={S.createBtn} onClick={saveEditCollection}>Enregistrer</button>
                <button style={S.exportBtnGhost} onClick={() => setEditingCollectionId(null)}>Annuler</button>
                <button style={S.deleteProgramBtn} onClick={() => { onDeleteCollection(col.id); setEditingCollectionId(null); }}>
                  <Trash2 size={13} />
                </button>
              </div>
            </>
          ) : (
            <button
              style={{ ...S.blockChip, width: "100%", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center", ...(activeLibIds.includes(col.id) ? S.blockChipSelected : {}) }}
              onClick={() => toggleLib(col.id)}
            >
              <div>
                <div style={S.exRowName}>{col.name}{col.gymId ? ` · ${(gyms || []).find((g) => g.id === col.gymId)?.name || ""}` : ""}</div>
                <div style={S.caption}>{library.filter((e) => e.collectionId === col.id).length} exercice(s)</div>
              </div>
              <span onClick={(e) => { e.stopPropagation(); openEditCollection(col); }} style={{ padding: 6 }}>
                <Pencil size={14} />
              </span>
            </button>
          )}
        </div>
      ))}
      {(!collections || collections.length === 0) && !creatingLibrary && (
        <div style={{ ...S.caption, marginBottom: 8 }}>Aucune bibliothèque pour l'instant.</div>
      )}
      {creatingLibrary ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom de la nouvelle bibliothèque</div>
          <input style={S.textInput} placeholder="ex : Musculation de base" value={quickLibName} onChange={(e) => setQuickLibName(e.target.value)} />
          <div style={S.goalInputLabel}>Salle de sport liée (optionnel)</div>
          <select style={S.textInput} value={quickLibGymId} onChange={(e) => setQuickLibGymId(e.target.value)}>
            <option value="">Aucune salle liée</option>
            {(gyms || []).map((g) => (
              <option key={g.id} value={g.id}>{g.name}</option>
            ))}
          </select>
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={createQuickLibrary}>Créer</button>
            <button style={S.exportBtnGhost} onClick={() => setCreatingLibrary(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.exportBtnGhost, marginBottom: 12 }} onClick={() => setCreatingLibrary(true)}>
          <Plus size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Nouvelle bibliothèque
        </button>
      )}

      {library.length > 0 && (
        <button style={{ ...S.exportBtnGhost, marginBottom: 8 }} onClick={() => setExportText(onExportLibrary(activeLibIds.length === 1 ? activeLibIds[0] : null))}>
          <Smartphone size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />
          Exporter la sélection
        </button>
      )}
      {exportText && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Texte à copier :</div>
          <textarea readOnly style={{ ...S.commentInput, marginBottom: 8 }} rows={4} value={exportText} onFocus={(e) => e.target.select()} />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={() => navigator.clipboard?.writeText(exportText)}>Copier</button>
            <button style={S.exportBtnGhost} onClick={() => setExportText(null)}>Fermer</button>
          </div>
        </div>
      )}

      {showImport ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Bibliothèque de destination</div>
          <select style={S.textInput} value={importCollectionId} onChange={(e) => setImportCollectionId(e.target.value)}>
            <option value="">Sans bibliothèque</option>
            {(collections || []).map((c) => (
              <option key={c.id} value={c.id}>{collectionLabel(c)}</option>
            ))}
            <option value="__new__">+ Nouvelle bibliothèque...</option>
          </select>
          {importCollectionId === "__new__" && (
            <>
              <div style={S.goalInputLabel}>Nom de la nouvelle bibliothèque</div>
              <input style={S.textInput} placeholder="ex : Bibliothèque de Nathan" value={newCollectionName} onChange={(e) => setNewCollectionName(e.target.value)} />
              <div style={S.goalInputLabel}>Salle de sport liée (optionnel)</div>
              <select style={S.textInput} value={newCollectionGymId} onChange={(e) => setNewCollectionGymId(e.target.value)}>
                <option value="">Aucune salle liée</option>
                {(gyms || []).map((g) => (
                  <option key={g.id} value={g.id}>{g.name}</option>
                ))}
              </select>
            </>
          )}
          <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Colle ici le texte de la bibliothèque à importer :</div>
          {importStatus === "ok" && <div style={S.exportStatus}>Bibliothèque importée ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie qu'il commence bien par ##HAKIFIT-EXERCISELIB##.</div>}
          <textarea
            style={{ ...S.commentInput, marginBottom: 8 }}
            rows={4}
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
          />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={handleImport}>Importer</button>
            <button style={S.exportBtnGhost} onClick={() => setShowImport(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.exportBtnGhost, marginBottom: 12 }} onClick={() => setShowImport(true)}>
          <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Importer une bibliothèque d'exercices
        </button>
      )}

      <div style={S.sectionLabel}>Rechercher</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <div style={{ position: "relative", flex: 1 }}>
          <Search size={15} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#8A5F58" }} />
          <input
            style={{ ...S.textInput, paddingLeft: 34, marginBottom: 0 }}
            placeholder="Rechercher un exercice dans les bibliothèques sélectionnées ci-dessus"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
        <button style={{ ...S.blockChipAdd, ...(showFilters || filter ? S.blockChipSelected : {}) }} onClick={() => setShowFilters((v) => !v)}>
          <Search size={14} style={{ marginRight: 4 }} />Filtres{filter ? " •" : ""}
        </button>
      </div>

      {showFilters && muscles.length > 0 && (
        <div style={S.blockChipsRow}>
          <button style={{ ...S.blockChip, ...(!filter ? S.blockChipSelected : {}) }} onClick={() => setFilter(null)}>
            Tous
          </button>
          {muscles.map((m) => (
            <button key={m} style={{ ...S.blockChip, ...(filter === m ? S.blockChipSelected : {}) }} onClick={() => setFilter(m)}>
              {m}
            </button>
          ))}
        </div>
      )}

      <div style={S.programList}>
        {filtered.map((ex) => {
          const col = (collections || []).find((c) => c.id === ex.collectionId);
          return (
          <button key={ex.id} style={S.sessionLogRow} onClick={() => setForm({ mode: "edit", exercise: ex })}>
            <div>
              <div style={S.exRowName}>{ex.name}</div>
              <div style={S.caption}>
                {ex.muscle}{ex.machine ? ` · ${ex.machine}` : ""}{ex.type === "cardio" ? "" : ` · ${ex.repMin}-${ex.repMax} reps${ex.restSeconds ? ` · repos ${fmtRestTime(ex.restSeconds)}` : ""}`}
                {col ? ` · ${collectionLabel(col)}` : ""}
              </div>
            </div>
          </button>
          );
        })}
        {filtered.length === 0 && <div style={S.caption}>Aucun exercice ne correspond.</div>}
      </div>

      <button
        style={S.createBtn}
        onClick={() => {
          if (!collections || collections.length === 0) { setCreatingLibrary(true); return; }
          setForm({ mode: "create", exercise: null });
        }}
      >
        <Plus size={16} /> Ajouter un exercice
      </button>
    </div>
  );
}

function ExerciseLibraryForm({ mode, initial, onCancel, onCreate, onUpdate, onDelete, gymMachines, gyms, collections, onAddCollection, onAddMachine }) {
  const isEdit = mode === "edit";
  const isCardio = initial?.type === "cardio";
  const [type, setType] = useState(isCardio ? "cardio" : "muscu");
  const [name, setName] = useState(initial?.name || "");
  const [muscles, setMuscles] = useState(() => (!isCardio && initial?.muscle ? initial.muscle.split(",").map((m) => m.trim()).filter(Boolean) : []));
  const [category, setCategory] = useState(isCardio ? (initial?.muscle || "") : "");
  const [machine, setMachine] = useState(initial?.machine || "");
  const [repMin, setRepMin] = useState(String(initial?.repMin ?? 8));
  const [repMax, setRepMax] = useState(String(initial?.repMax ?? 12));
  const [restSeconds, setRestSeconds] = useState(String(initial?.restSeconds ?? 90));
  const [youtubeUrl, setYoutubeUrl] = useState(initial?.youtubeUrl || "");
  const [note, setNote] = useState(initial?.note || "");
  const [collectionId, setCollectionId] = useState(initial?.collectionId || collections?.[0]?.id || "");
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [newLibName, setNewLibName] = useState("");
  const [newLibGymId, setNewLibGymId] = useState("");
  const [machineGymId, setMachineGymId] = useState(() => {
    if (initial?.machine) {
      const g = (gyms || []).find((gy) => (gy.machines || []).some((m) => m.name === initial.machine));
      if (g) return g.id;
    }
    const col = (collections || []).find((c) => c.id === (initial?.collectionId || collections?.[0]?.id));
    return col?.gymId || "";
  });
  const [newMachineName, setNewMachineName] = useState("");

  const selectedGymMachines = useMemo(() => {
    const g = (gyms || []).find((gy) => gy.id === machineGymId);
    return g ? [...(g.machines || [])].sort((a, b) => a.name.localeCompare(b.name, "fr")) : [];
  }, [gyms, machineGymId]);

  function toggleMuscle(m) {
    setMuscles((list) => (list.includes(m) ? list.filter((x) => x !== m) : [...list, m]));
  }

  function handleSave() {
    if (!name.trim() || !collectionId) return;
    if (type !== "cardio" && muscles.length === 0) return;
    if (collectionId === "__new__" && !newLibName.trim()) return;
    if (machine === "__new__" && !newMachineName.trim()) return;

    const finalCollectionId = collectionId === "__new__" ? onAddCollection(newLibName, newLibGymId) : collectionId;
    let finalMachine = machine;
    if (machine === "__new__") {
      onAddMachine(machineGymId, { name: newMachineName.trim(), muscles: [] });
      finalMachine = newMachineName.trim();
    }

    const ex = {
      id: initial?.id,
      name: name.trim(),
      muscle: type === "cardio" ? (category.trim() || "Cardio") : muscles.join(", "),
      ...(type === "cardio" ? { type: "cardio" } : {}),
      ...(finalMachine.trim() ? { machine: finalMachine.trim() } : {}),
      ...(type !== "cardio" ? {
        repMin: Number(repMin) || 1,
        repMax: Math.max(Number(repMax) || Number(repMin) || 1, Number(repMin) || 1),
        restSeconds: Number(restSeconds) || 0,
      } : {}),
      ...(youtubeUrl.trim() ? { youtubeUrl: youtubeUrl.trim() } : {}),
      ...(note.trim() ? { note: note.trim() } : {}),
      collectionId: finalCollectionId,
    };
    if (isEdit) onUpdate(ex);
    else onCreate(ex);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier l'exercice" : "Nouvel exercice"}</div>

      <div style={S.goalInputLabel}>Nom</div>
      <input style={S.textInput} placeholder="ex : Développé couché" value={name} onChange={(e) => setName(e.target.value)} />

      <div style={S.typeToggleRow}>
        <button
          style={{ ...S.typePill, ...(type !== "cardio" ? S.typePillActive : {}) }}
          onClick={() => setType("muscu")}
        >
          Muscu
        </button>
        <button
          style={{ ...S.typePill, ...(type === "cardio" ? S.typePillActive : {}) }}
          onClick={() => setType("cardio")}
        >
          Cardio
        </button>
      </div>

      {type === "cardio" ? (
        <>
          <div style={S.goalInputLabel}>Catégorie (optionnel — ex : Cardio, HIIT...)</div>
          <input style={S.textInput} placeholder="ex : Cardio" value={category} onChange={(e) => setCategory(e.target.value)} />
        </>
      ) : (
        <>
          <div style={S.goalInputLabel}>Groupe(s) musculaire(s)</div>
          <div style={S.blockChipsRow}>
            {MUSCLE_GROUP_OPTIONS.map((m) => (
              <button
                key={m}
                style={{ ...S.blockChip, ...(muscles.includes(m) ? S.blockChipSelected : {}) }}
                onClick={() => toggleMuscle(m)}
              >
                {m}
              </button>
            ))}
          </div>
        </>
      )}

      <div style={S.goalInputLabel}>Bibliothèque (obligatoire — chacune peut être liée à une salle)</div>
      <select style={S.textInput} value={collectionId} onChange={(e) => setCollectionId(e.target.value)}>
        {(collections || []).map((c) => {
          const gym = (gyms || []).find((g) => g.id === c.gymId);
          return <option key={c.id} value={c.id}>{gym ? `${c.name} (${gym.name})` : c.name}</option>;
        })}
        <option value="__new__">+ Nouvelle bibliothèque...</option>
      </select>
      {collectionId === "__new__" && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom de la nouvelle bibliothèque</div>
          <input style={S.textInput} placeholder="ex : Musculation de base" value={newLibName} onChange={(e) => setNewLibName(e.target.value)} />
          <div style={S.goalInputLabel}>Salle de sport liée (optionnel)</div>
          <select style={S.textInput} value={newLibGymId} onChange={(e) => setNewLibGymId(e.target.value)}>
            <option value="">Aucune salle liée</option>
            {(gyms || []).map((g) => (
              <option key={g.id} value={g.id}>{g.name}</option>
            ))}
          </select>
        </div>
      )}

      <div style={S.goalInputLabel}>Salle de sport (pour choisir une machine)</div>
      <select style={S.textInput} value={machineGymId} onChange={(e) => { setMachineGymId(e.target.value); setMachine(""); }}>
        <option value="">Choisir une salle...</option>
        {(gyms || []).map((g) => (
          <option key={g.id} value={g.id}>{g.name}</option>
        ))}
      </select>

      <div style={S.goalInputLabel}>Machine (optionnel)</div>
      <select style={S.textInput} value={machine} onChange={(e) => setMachine(e.target.value)} disabled={!machineGymId}>
        <option value="">{machineGymId ? "Aucune machine précise" : "Choisis d'abord une salle"}</option>
        {selectedGymMachines.map((m) => (
          <option key={m.name} value={m.name}>{m.name}</option>
        ))}
        {machine && machine !== "__new__" && !selectedGymMachines.some((m) => m.name === machine) && (
          <option value={machine}>{machine} (non enregistrée dans cette salle)</option>
        )}
        {machineGymId && <option value="__new__">+ Nouvelle machine...</option>}
      </select>
      {machine === "__new__" && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom de la nouvelle machine</div>
          <input style={S.textInput} placeholder="ex : Leg press" value={newMachineName} onChange={(e) => setNewMachineName(e.target.value)} />
        </div>
      )}
      <div style={{ ...S.caption, marginBottom: 8 }}>
        Choisis une salle pour voir ses machines. Pas la bonne dans la liste ? Crée-la directement ici.
      </div>

      {type !== "cardio" && (
        <>
          <div style={S.goalInputLabel}>Fourchette de répétitions</div>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Min" value={repMin} onChange={(e) => setRepMin(e.target.value)} />
            <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Max" value={repMax} onChange={(e) => setRepMax(e.target.value)} />
          </div>

          <div style={S.goalInputLabel}>Temps de repos (secondes)</div>
          <input style={S.textInput} type="number" value={restSeconds} onChange={(e) => setRestSeconds(e.target.value)} />
        </>
      )}

      <div style={S.goalInputLabel}>Lien YouTube (optionnel)</div>
      <input style={S.textInput} placeholder="https://youtube.com/..." value={youtubeUrl} onChange={(e) => setYoutubeUrl(e.target.value)} />

      <div style={S.goalInputLabel}>Commentaire (optionnel)</div>
      <input style={S.textInput} placeholder="ex : tempo lent, dropset..." value={note} onChange={(e) => setNote(e.target.value)} />

      <button
        style={{ ...S.finishBtn, opacity: name.trim() && (type === "cardio" || muscles.length > 0) ? 1 : 0.4, marginTop: 18 }}
        disabled={!name.trim() || (type !== "cardio" && muscles.length === 0)}
        onClick={handleSave}
      >
        <Check size={18} /> {isEdit ? "Enregistrer" : "Ajouter à la bibliothèque"}
      </button>

      {isEdit && (
        <div style={{ marginTop: 16 }}>
          {confirmDelete ? (
            <div style={S.confirmDeleteRow}>
              <span style={S.caption}>Supprimer « {initial.name} » de la bibliothèque ?</span>
              <button style={S.confirmDeleteBtn} onClick={() => onDelete(initial.id)}>Oui, supprimer</button>
              <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(false)}>Annuler</button>
            </div>
          ) : (
            <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(true)}>
              <Trash2 size={13} /> Supprimer de la bibliothèque
            </button>
          )}
        </div>
      )}
      <div style={{ height: 24 }} />
    </div>
  );
}
