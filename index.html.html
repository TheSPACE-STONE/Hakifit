// --- Stockage (remplace window.storage de Claude) : localStorage du navigateur, 100% local et gratuit ---
window.storage = {
  async get(key) {
    const v = localStorage.getItem("charge:" + key);
    return v !== null ? { key, value: v, shared: false } : null;
  },
  async set(key, value) {
    localStorage.setItem("charge:" + key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem("charge:" + key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage)
      .filter((k) => k.startsWith("charge:") && (!prefix || k.slice(7).startsWith(prefix)))
      .map((k) => k.slice(7));
    return { keys, prefix, shared: false };
  },
};

// --- Petit graphique en ligne (remplace recharts, pas de dépendance) ---
function MiniLineChart({ data, dataKey, height = 180 }) {
  if (!data || data.length === 0) return null;
  const values = data.map((d) => Number(d[dataKey]) || 0);
  const max = Math.max(...values);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const w = 320;
  const pad = 14;
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const points = values.map((v, i) => {
    const x = pad + i * stepX;
    const y = height - pad - ((v - min) / range) * (height - pad * 2);
    return [x, y];
  });
  const polyline = points.map((p) => p.join(",")).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none">
        {[0.25, 0.5, 0.75].map((f, i) => (
          <line key={i} x1={pad} x2={w - pad} y1={pad + f * (height - pad * 2)} y2={pad + f * (height - pad * 2)} stroke="#2A2E35" strokeDasharray="3 3" />
        ))}
        <polyline points={polyline} fill="none" stroke="#D4FF3D" strokeWidth="2.5" />
        {points.map(([x, y], i) => (
          <circle key={i} cx={x} cy={y} r="3.5" fill="#D4FF3D" />
        ))}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#8B9099", marginTop: 4 }}>
        <span>{data[0]?.date}</span>
        {data.length > 1 && <span>{data[data.length - 1]?.date}</span>}
      </div>
    </div>
  );
}

function buildSeedSessions() {
  const sessions = [];
  const today = new Date();
  const monday = new Date(today);
  monday.setDate(monday.getDate() - monday.getDay() - 62); // ~9 weeks back, aligned to a Monday-ish anchor
  const order = ["A", "B", "C"];
  const names = { A: "Haut du corps 1", B: "Jambes", C: "Haut du corps 2" };
  const durations = { A: 3300, B: 2700, C: 3000 }; // durées plausibles en secondes
  let dayOffset = 0;
  for (let week = 0; week < 3; week++) {
    order.forEach((progId, i) => {
      const date = new Date(monday);
      date.setDate(date.getDate() + dayOffset);
      date.setHours(18, 30, 0, 0); // séance type en fin de journée
      dayOffset += 2;
      const entries = {};
      Object.entries(HISTORY_SEED_RAW[progId]).forEach(([exId, weeks]) => {
        const set = weeks[week];
        if (set) {
          const [reps, poids] = set;
          entries[exId] = [{ reps, poids }, { reps, poids }, { reps, poids }];
        }
      });
      sessions.push({
        id: `seed-${progId}-${week}`,
        programId: progId,
        programName: names[progId],
        blockName: "Programme initial",
        date: date.toISOString(),
        durationSeconds: durations[progId],
        comment: "",
        entries,
      });
    });
  }
  return sessions;
}

const uid = () => Math.random().toString(36).slice(2, 10);
const fmtDate = (iso) => new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
function fmtDuration(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function fmtDurationLong(totalSeconds) {
  if (!totalSeconds) return null;
  const m = Math.round(totalSeconds / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  const rest = m % 60;
  return rest ? `${h} h ${rest} min` : `${h} h`;
}
function fmtRestTime(seconds) {
  if (!seconds) return null;
  if (seconds < 60) return `${seconds} sec`;
  const m = Math.floor(seconds / 60);
  const rest = seconds % 60;
  return rest ? `${m} min ${rest} sec` : `${m} min`;
}

// Normalise une entrée cardio en liste de segments, pour compatibilité avec
// l'ancien format (durationSeconds/speed/incline à plat, un seul segment).
function cardioSegments(entry) {
  if (!entry) return [];
  if (entry.segments) return entry.segments;
  if (entry.durationSeconds !== undefined) {
    return [{ durationSeconds: entry.durationSeconds, speed: entry.speed, incline: entry.incline }];
  }
  return [];
}

/* ---------- Export (CSV download / TSV copy for Google Sheets) ---------- */

const EXPORT_HEADERS = ["Date", "Heure", "Programme", "Séance", "Durée séance (min)", "Ressenti", "Exercice", "Type", "Série / Segment", "Reps", "Poids (kg)", "Durée exercice (min)", "Vitesse (km/h)", "Pente (%)"];

function buildExportRows(sessionsToExport, exerciseIndex) {
  const rows = [EXPORT_HEADERS];
  [...sessionsToExport]
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .forEach((s) => {
      const d = new Date(s.date);
      const dateStr = d.toLocaleDateString("fr-FR");
      const timeStr = fmtTime(s.date);
      const durMin = s.durationSeconds ? Math.round(s.durationSeconds / 60) : "";
      const exIds = Object.keys(s.entries);
      if (exIds.length === 0) {
        rows.push([dateStr, timeStr, s.blockName || "", s.programName || "", durMin, s.comment || "", "", "", "", "", "", "", "", ""]);
      }
      exIds.forEach((exId) => {
        const name = exerciseIndex[exId]?.name || exId;
        const entry = s.entries[exId];
        if (!Array.isArray(entry)) {
          // Entrée cardio : un ou plusieurs segments (durée / vitesse / pente)
          cardioSegments(entry).forEach((seg, i) => {
            rows.push([
              dateStr, timeStr, s.blockName || "", s.programName || "", durMin, s.comment || "",
              name, "Cardio", i + 1, "", "",
              seg.durationSeconds ? Math.round(seg.durationSeconds / 60) : "",
              seg.speed ?? "", seg.incline ?? "",
            ]);
          });
        } else {
          entry.forEach((set, i) => {
            rows.push([dateStr, timeStr, s.blockName || "", s.programName || "", durMin, s.comment || "", name, "Muscu", i + 1, set.reps, set.poids, "", "", ""]);
          });
        }
      });
    });
  return rows;
}

function toCSV(rows) {
  return rows
    .map((r) =>
      r
        .map((cell) => {
          const str = String(cell ?? "");
          return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
        })
        .join(",")
    )
    .join("\n");
}

function toTSV(rows) {
  return rows.map((r) => r.map((cell) => String(cell ?? "").replace(/\t/g, " ")).join("\t")).join("\n");
}

function downloadCSV(filename, csvContent) {
  try {
    const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

async function copyTSV(tsvContent) {
  try {
    await navigator.clipboard.writeText(tsvContent);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function ExportButtons({ sessions, exerciseIndex, label }) {
  const [status, setStatus] = useState(null); // 'downloaded' | 'copied' | 'error'

  function handleDownload() {
    const rows = buildExportRows(sessions, exerciseIndex);
    const ok = downloadCSV(`charge-export-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows));
    setStatus(ok ? "downloaded" : "error");
    setTimeout(() => setStatus(null), 2500);
  }

  async function handleCopy() {
    const rows = buildExportRows(sessions, exerciseIndex);
    const ok = await copyTSV(toTSV(rows));
    setStatus(ok ? "copied" : "error");
    setTimeout(() => setStatus(null), 2500);
  }

  if (sessions.length === 0) return null;

  return (
    <div style={S.exportBox}>
      <div style={S.exportLabel}>{label}</div>
      <div style={S.exportRow}>
        <button style={S.exportBtn} onClick={handleDownload}>
          Télécharger (CSV)
        </button>
        <button style={S.exportBtnGhost} onClick={handleCopy}>
          Copier (coller dans Sheets)
        </button>
      </div>
      {status === "downloaded" && <div style={S.exportStatus}>Fichier téléchargé — importe-le dans Google Sheets via Fichier → Importer.</div>}
      {status === "copied" && <div style={S.exportStatus}>Copié ! Colle directement dans une cellule Google Sheets.</div>}
      {status === "error" && <div style={S.exportStatusError}>Échec — réessaie, ou vérifie les autorisations du navigateur.</div>}
    </div>
  );
}

async function loadState() {
  let programs, sessions, goals, blocks;
  try {
    const p = await window.storage.get("programs");
    programs = p ? JSON.parse(p.value) : null;
  } catch { programs = null; }
  try {
    const s = await window.storage.get("sessions");
    sessions = s ? JSON.parse(s.value) : null;
  } catch { sessions = null; }
  try {
    const g = await window.storage.get("goals");
    goals = g ? JSON.parse(g.value) : null;
  } catch { goals = null; }
  try {
    const b = await window.storage.get("blocks");
    blocks = b ? JSON.parse(b.value) : null;
  } catch { blocks = null; }
  if (!blocks) blocks = BLOCKS_SEED;
  if (!programs) programs = PROGRAMS_SEED;
  if (!sessions) sessions = buildSeedSessions();
  if (!goals) goals = {};

  // Migration: make sure every program points to a valid block
  const validBlockIds = new Set(blocks.map((b) => b.id));
  const fallbackBlockId = blocks.find((b) => b.active)?.id || blocks[0]?.id;
  programs = programs.map((p) =>
    p.blockId && validBlockIds.has(p.blockId) ? p : { ...p, blockId: fallbackBlockId }
  );

  return { programs, sessions, goals, blocks };
}

async function saveSessions(sessions) {
  try { await window.storage.set("sessions", JSON.stringify(sessions)); } catch (e) { console.error(e); }
}
async function savePrograms(programs) {
  try { await window.storage.set("programs", JSON.stringify(programs)); } catch (e) { console.error(e); }
}
async function saveGoals(goals) {
  try { await window.storage.set("goals", JSON.stringify(goals)); } catch (e) { console.error(e); }
}
async function saveBlocks(blocks) {
  try { await window.storage.set("blocks", JSON.stringify(blocks)); } catch (e) { console.error(e); }
}

/* ---------- Root ---------- */

function App() {
  const [loading, setLoading] = useState(true);
  const [programs, setPrograms] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [goals, setGoals] = useState({});
  const [blocks, setBlocks] = useState([]);
  const [tab, setTab] = useState("home");
  const [activeProgram, setActiveProgram] = useState(null); // program object during logging
  const [historyExercise, setHistoryExercise] = useState(null);
  const [historySession, setHistorySession] = useState(null); // session object being viewed in detail
  const [programForm, setProgramForm] = useState(null); // { mode: 'create'|'edit', blockId, program }

  useEffect(() => {
    loadState().then(({ programs, sessions, goals, blocks }) => {
      setPrograms(programs);
      setSessions(sessions);
      setGoals(goals);
      setBlocks(blocks);
      setLoading(false);
    });
  }, []);

  const exerciseIndex = useMemo(() => {
    const idx = {};
    programs.forEach((p) => p.exercises.forEach((e) => (idx[e.id] = { ...e, programName: p.name })));
    return idx;
  }, [programs]);

  function finishSession(session) {
    const next = [...sessions, session];
    setSessions(next);
    saveSessions(next);
    setActiveProgram(null);
    setTab("home");
  }

  function saveGoal(exId, text) {
    setGoals((g) => {
      const next = { ...g, [exId]: text };
      if (!text) delete next[exId];
      saveGoals(next);
      return next;
    });
  }

  function addProgram(program) {
    setPrograms((p) => {
      const next = [...p, program];
      savePrograms(next);
      return next;
    });
    setProgramForm(null);
  }

  function updateProgram(updated) {
    setPrograms((p) => {
      const next = p.map((x) => (x.id === updated.id ? { ...x, ...updated } : x));
      savePrograms(next);
      return next;
    });
    setProgramForm(null);
  }

  // Suppression "douce" : la séance disparaît des listes actives mais reste
  // consultable dans l'historique (les séances passées gardent leur sens).
  function deleteProgram(id) {
    setPrograms((p) => {
      const next = p.map((x) => (x.id === id ? { ...x, deleted: true } : x));
      savePrograms(next);
      return next;
    });
  }

  function addBlock(name) {
    const block = { id: uid(), name: name.trim(), active: false };
    setBlocks((bs) => {
      const next = [...bs, block];
      saveBlocks(next);
      return next;
    });
    return block.id;
  }

  function setActiveBlock(id) {
    setBlocks((bs) => {
      const next = bs.map((b) => ({ ...b, active: b.id === id }));
      saveBlocks(next);
      return next;
    });
  }

  if (loading) {
    return (
      <div style={S.appShell}>
        <div style={S.loadingWrap}>
          <div style={S.loadingBar} />
          <div style={{ ...S.caption, marginTop: 12 }}>Chargement de tes données…</div>
        </div>
        <FontStyles />
      </div>
    );
  }

  const activeBlock = blocks.find((b) => b.active);
  const visiblePrograms = programs.filter((p) => !p.deleted && p.blockId === activeBlock?.id);

  return (
    <div style={S.appShell}>
      <FontStyles />
      <div style={S.screen}>
        {activeProgram ? (
          <LogSession
            program={activeProgram}
            blocks={blocks}
            sessions={sessions}
            goals={goals}
            onSaveGoal={saveGoal}
            onCancel={() => setActiveProgram(null)}
            onFinish={finishSession}
          />
        ) : programForm ? (
          <ProgramForm
            mode={programForm.mode}
            initialProgram={programForm.program}
            defaultBlockId={programForm.blockId}
            blocks={blocks}
            onCancel={() => setProgramForm(null)}
            onCreate={addProgram}
            onUpdate={updateProgram}
          />
        ) : historyExercise ? (
          <ExerciseHistory
            exercise={historyExercise}
            sessions={sessions}
            onBack={() => setHistoryExercise(null)}
          />
        ) : historySession ? (
          <SessionDetailView
            session={historySession}
            exerciseIndex={exerciseIndex}
            onBack={() => setHistorySession(null)}
            onOpenExercise={(ex) => setHistoryExercise(ex)}
          />
        ) : (
          <>
            {tab === "home" && (
              <HomeView
                programs={visiblePrograms}
                activeBlock={activeBlock}
                sessions={sessions}
                onStart={(p) => setActiveProgram(p)}
                onManage={() => setTab("programs")}
              />
            )}
            {tab === "programs" && (
              <ProgramsView
                programs={programs}
                blocks={blocks}
                onStart={(p) => setActiveProgram(p)}
                onCreateProgram={(blockId) => setProgramForm({ mode: "create", blockId })}
                onEditProgram={(program) => setProgramForm({ mode: "edit", program })}
                onDeleteProgram={deleteProgram}
                onCreateBlock={addBlock}
                onSetActiveBlock={setActiveBlock}
              />
            )}
            {tab === "history" && (
              <HistoryView
                programs={programs}
                blocks={blocks}
                sessions={sessions}
                exerciseIndex={exerciseIndex}
                onOpenExercise={(ex) => setHistoryExercise(ex)}
                onOpenSession={(s) => setHistorySession(s)}
              />
            )}
          </>
        )}
      </div>
      {!activeProgram && !historyExercise && !historySession && !programForm && (
        <BottomNav tab={tab} setTab={setTab} />
      )}
    </div>
  );
}

/* ---------- Home ---------- */

function HomeView({ programs, activeBlock, sessions, onStart, onManage }) {
  const sorted = [...sessions].sort((a, b) => (a.date < b.date ? 1 : -1));
  const last = sorted[0];
  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 7);
  const thisWeek = sessions.filter((s) => new Date(s.date) >= weekAgo);

  const idxInVisible = programs.findIndex((p) => p.id === last?.programId);
  const nextProgram = idxInVisible >= 0 ? programs[(idxInVisible + 1) % programs.length] : programs[0];

  return (
    <div style={S.page}>
      <div style={S.brand}>
        <div style={S.brandMark}>CHARGE.</div>
        <div style={S.caption}>
          {activeBlock ? `Programme actuel : ${activeBlock.name}` : "ton carnet de musculation"}
        </div>
      </div>

      <div style={S.statRow}>
        <div style={S.statCard}>
          <div style={S.statValue}>{thisWeek.length}</div>
          <div style={S.statLabel}>séances / 7j</div>
        </div>
      </div>

      {programs.length > 0 ? (
        <>
          <div style={S.sectionLabel}>Prochaine séance suggérée</div>
          <button style={S.heroCard} onClick={() => onStart(nextProgram)}>
            <div>
              <div style={S.heroTitle}>{nextProgram.name}</div>
              <div style={S.caption}>{nextProgram.exercises.length} exercices</div>
            </div>
            <div style={S.heroGo}>
              <Dumbbell size={22} strokeWidth={2.2} />
            </div>
          </button>

          <div style={S.sectionLabel}>Toutes les séances de ce programme</div>
          <div style={S.programList}>
            {programs.map((p) => (
              <button key={p.id} style={S.programRow} onClick={() => onStart(p)}>
                <span style={S.programRowName}>{p.name}</span>
                <span style={S.caption}>{p.exercises.length} ex.</span>
              </button>
            ))}
          </div>
        </>
      ) : (
        <div style={S.emptyStateCard}>
          <div style={{ marginBottom: 8 }}>Aucune séance active pour le moment.</div>
          <button style={S.startProgramBtn} onClick={onManage}>
            Gérer mes programmes
          </button>
        </div>
      )}

      {last && (
        <>
          <div style={S.sectionLabel}>Dernière séance</div>
          <div style={S.lastSessionCard}>
            <div style={S.lastSessionTop}>
              <span style={{ fontWeight: 700 }}>{last.programName || "Séance"}</span>
              <span style={S.caption}>{fmtDate(last.date)} · {fmtTime(last.date)}</span>
            </div>
            {last.durationSeconds && (
              <div style={{ ...S.caption, marginTop: 4 }}>Durée : {fmtDurationLong(last.durationSeconds)}</div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

/* ---------- Programs ---------- */

function ProgramsView({ programs, blocks, onStart, onCreateProgram, onEditProgram, onDeleteProgram, onCreateBlock, onSetActiveBlock }) {
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const [open, setOpen] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showNewBlock, setShowNewBlock] = useState(false);
  const [newBlockName, setNewBlockName] = useState("");

  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockPrograms = programs.filter((p) => !p.deleted && p.blockId === selectedBlock?.id);

  function handleCreateBlock() {
    if (!newBlockName.trim()) return;
    const id = onCreateBlock(newBlockName.trim());
    setSelectedBlockId(id);
    setNewBlockName("");
    setShowNewBlock(false);
  }

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Programmes d'entraînement</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>
        Un programme regroupe plusieurs séances. Un seul programme est suivi à la fois — les autres restent en pause, avec leur historique intact.
      </div>

      <div style={S.blockChipsRow}>
        {blocks.map((b) => (
          <button
            key={b.id}
            style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
            onClick={() => setSelectedBlockId(b.id)}
          >
            {b.active && <span style={S.activeDot} />}
            {b.name}
          </button>
        ))}
        <button style={S.blockChipAdd} onClick={() => setShowNewBlock((v) => !v)}>
          <Plus size={14} />
        </button>
      </div>

      {showNewBlock && (
        <div style={S.newBlockRow}>
          <input
            style={S.textInput}
            placeholder="Nom du programme (ex : Bloc force été 2026)"
            value={newBlockName}
            onChange={(e) => setNewBlockName(e.target.value)}
          />
          <button style={S.goalSaveBtn} onClick={handleCreateBlock}>
            <Check size={16} />
          </button>
        </div>
      )}

      {selectedBlock && selectedBlock.id !== activeBlock?.id && (
        <div style={S.notActiveBanner}>
          <span>Ce programme n'est pas suivi actuellement.</span>
          <button style={S.activateBtn} onClick={() => onSetActiveBlock(selectedBlock.id)}>
            Suivre ce programme
          </button>
        </div>
      )}

      <div style={{ height: 8 }} />

      {blockPrograms.length === 0 && (
        <div style={{ ...S.caption, margin: "12px 0" }}>Pas encore de séance dans ce programme.</div>
      )}

      {blockPrograms.map((p) => (
        <div key={p.id} style={S.programBlock}>
          <button style={S.programBlockHeader} onClick={() => setOpen(open === p.id ? null : p.id)}>
            <span style={S.programBlockTitle}>{p.name}</span>
            <span style={S.caption}>{open === p.id ? "−" : "+"}</span>
          </button>
          {open === p.id && (
            <div style={S.programBlockBody}>
              {p.exercises.map((ex) => (
                <div key={ex.id} style={S.exRow}>
                  <div>
                    <div style={S.exRowName}>{ex.name}</div>
                    <div style={S.caption}>{ex.muscle}</div>
                    {ex.type === "cardio" ? (
                      <div style={S.caption}>Cardio</div>
                    ) : (
                      <>
                        <div style={S.caption}>Fourchette : {ex.repMin}-{ex.repMax} reps · {ex.sets} séries</div>
                        {ex.restSeconds ? <div style={S.caption}>Repos : {fmtRestTime(ex.restSeconds)}</div> : null}
                      </>
                    )}
                    {ex.note && <div style={S.exNote}>{ex.note}</div>}
                  </div>
                </div>
              ))}
              <button style={S.startProgramBtn} onClick={() => onStart(p)}>
                Démarrer cette séance
              </button>
              <button style={S.editProgramBtn} onClick={() => onEditProgram(p)}>
                Modifier cette séance
              </button>
              {confirmDelete === p.id ? (
                <div style={S.confirmDeleteRow}>
                  <span style={S.caption}>Supprimer « {p.name} » ?</span>
                  <button style={S.confirmDeleteBtn} onClick={() => { onDeleteProgram(p.id); setConfirmDelete(null); }}>
                    Oui, supprimer
                  </button>
                  <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(null)}>
                    Annuler
                  </button>
                </div>
              ) : (
                <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(p.id)}>
                  <Trash2 size={13} /> Supprimer cette séance
                </button>
              )}
            </div>
          )}
        </div>
      ))}

      <button style={S.createBtn} onClick={() => onCreateProgram(selectedBlock?.id)}>
        <Plus size={16} /> Créer une séance dans ce programme
      </button>
    </div>
  );
}

/* ---------- Create / edit a program (séance) ---------- */

function blankExercise() {
  return { id: uid(), name: "", muscle: "", type: "muscu", repMin: "9", repMax: "12", sets: "3", restSeconds: "90", note: "", segments: [] };
}
function blankSegment() {
  return { id: uid(), duration: "", speed: "", incline: "" };
}

function ProgramForm({ mode, initialProgram, defaultBlockId, blocks, onCancel, onCreate, onUpdate }) {
  const isEdit = mode === "edit";
  const [name, setName] = useState(initialProgram?.name || "");
  const [blockId, setBlockId] = useState(initialProgram?.blockId || defaultBlockId || blocks[0]?.id);
  const [exercises, setExercises] = useState(() => {
    if (initialProgram) {
      return initialProgram.exercises.map((e) => ({
        id: e.id,
        name: e.name,
        muscle: e.muscle,
        type: e.type || "muscu",
        repMin: String(e.repMin ?? 9),
        repMax: String(e.repMax ?? 12),
        sets: String(e.sets ?? 3),
        restSeconds: String(e.restSeconds ?? 90),
        note: e.note || "",
        segments: (e.segments || []).map((seg) => ({
          id: uid(),
          duration: String(seg.duration ?? ""),
          speed: seg.speed != null ? String(seg.speed) : "",
          incline: seg.incline != null ? String(seg.incline) : "",
        })),
      }));
    }
    return [blankExercise()];
  });

  function updateExercise(id, field, value) {
    setExercises((exs) => exs.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  }
  function addExercise() {
    setExercises((exs) => [...exs, blankExercise()]);
  }
  function removeExercise(id) {
    setExercises((exs) => exs.filter((e) => e.id !== id));
  }
  function addSegment(exId) {
    setExercises((exs) => exs.map((e) => (e.id === exId ? { ...e, segments: [...e.segments, blankSegment()] } : e)));
  }
  function updateSegment(exId, segId, field, value) {
    setExercises((exs) =>
      exs.map((e) =>
        e.id === exId ? { ...e, segments: e.segments.map((s) => (s.id === segId ? { ...s, [field]: value } : s)) } : e
      )
    );
  }
  function removeSegment(exId, segId) {
    setExercises((exs) =>
      exs.map((e) => (e.id === exId ? { ...e, segments: e.segments.filter((s) => s.id !== segId) } : e))
    );
  }

  const canSave = name.trim().length > 0 && exercises.length > 0 && exercises.every((e) => e.name.trim().length > 0);

  function handleSave() {
    const program = {
      id: initialProgram?.id || uid(),
      name: name.trim(),
      blockId,
      exercises: exercises.map((e) => {
        if (e.type === "cardio") {
          const segments = (e.segments || [])
            .filter((s) => s.duration !== "")
            .map((s) => ({
              duration: Number(s.duration) || 0,
              speed: s.speed !== "" ? Number(s.speed) : null,
              incline: s.incline !== "" ? Number(s.incline) : null,
            }));
          return {
            id: e.id,
            name: e.name.trim(),
            muscle: e.muscle.trim() || "Cardio",
            type: "cardio",
            ...(segments.length ? { segments } : {}),
            ...(e.note.trim() ? { note: e.note.trim() } : {}),
          };
        }
        return {
          id: e.id,
          name: e.name.trim(),
          muscle: e.muscle.trim() || "—",
          type: "muscu",
          repMin: Number(e.repMin) || 1,
          repMax: Math.max(Number(e.repMax) || Number(e.repMin) || 1, Number(e.repMin) || 1),
          sets: Number(e.sets) || 1,
          restSeconds: Number(e.restSeconds) || 0,
          ...(e.note.trim() ? { note: e.note.trim() } : {}),
        };
      }),
    };
    if (isEdit) onUpdate(program);
    else onCreate(program);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier la séance" : "Nouvelle séance"}</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        {isEdit ? "Ajuste le nom, les exercices ou le programme associé." : "Donne-lui un nom et ajoute tes exercices."}
      </div>

      <input
        style={S.textInput}
        placeholder="Nom de la séance (ex : Push, Full body...)"
        value={name}
        onChange={(e) => setName(e.target.value)}
      />

      {blocks.length > 1 && (
        <select style={S.selectInput} value={blockId} onChange={(e) => setBlockId(e.target.value)}>
          {blocks.map((b) => (
            <option key={b.id} value={b.id}>
              {b.name}{b.active ? " (actif)" : ""}
            </option>
          ))}
        </select>
      )}

      <div style={{ height: 6 }} />

      {exercises.map((ex, idx) => (
        <div key={ex.id} style={S.newExerciseCard}>
          <div style={S.newExerciseHead}>
            <span style={S.sectionLabel}>Exercice {idx + 1}</span>
            {exercises.length > 1 && (
              <button style={S.setRemoveBtn} onClick={() => removeExercise(ex.id)}>
                <Minus size={14} />
              </button>
            )}
          </div>

          <div style={S.typeToggleRow}>
            <button
              style={{ ...S.typePill, ...(ex.type !== "cardio" ? S.typePillActive : {}) }}
              onClick={() => updateExercise(ex.id, "type", "muscu")}
            >
              Muscu
            </button>
            <button
              style={{ ...S.typePill, ...(ex.type === "cardio" ? S.typePillActive : {}) }}
              onClick={() => updateExercise(ex.id, "type", "cardio")}
            >
              Cardio
            </button>
          </div>

          <input
            style={S.textInput}
            placeholder={ex.type === "cardio" ? "Nom (ex : Vélo, Course, Corde à sauter...)" : "Nom de l'exercice"}
            value={ex.name}
            onChange={(e) => updateExercise(ex.id, "name", e.target.value)}
          />
          <input
            style={S.textInput}
            placeholder={ex.type === "cardio" ? "Catégorie (ex : Cardio, HIIT...)" : "Muscle ciblé (ex : Pectoraux)"}
            value={ex.muscle}
            onChange={(e) => updateExercise(ex.id, "muscle", e.target.value)}
          />

          {ex.type !== "cardio" && (
            <>
              <div style={S.newExerciseRow}>
                <label style={S.smallLabel}>
                  Séries
                  <input
                    style={S.smallInput}
                    inputMode="numeric"
                    value={ex.sets}
                    onChange={(e) => updateExercise(ex.id, "sets", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </label>
                <label style={S.smallLabel}>
                  Reps min
                  <input
                    style={S.smallInput}
                    inputMode="numeric"
                    value={ex.repMin}
                    onChange={(e) => updateExercise(ex.id, "repMin", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </label>
                <label style={S.smallLabel}>
                  Reps max
                  <input
                    style={S.smallInput}
                    inputMode="numeric"
                    value={ex.repMax}
                    onChange={(e) => updateExercise(ex.id, "repMax", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </label>
              </div>
              <div style={S.newExerciseRow}>
                <label style={S.smallLabel}>
                  Repos entre séries (sec)
                  <input
                    style={S.smallInput}
                    inputMode="numeric"
                    value={ex.restSeconds}
                    onChange={(e) => updateExercise(ex.id, "restSeconds", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </label>
              </div>
            </>
          )}

          {ex.type === "cardio" && (
            <div style={S.segmentsBox}>
              <div style={S.goalInputLabel}>
                Programme par intervalles (optionnel — laisse vide pour un cardio simple avec chrono libre)
              </div>
              {ex.segments.length > 0 && (
                <div style={S.setsHeader}>
                  <span style={S.setsHeaderCol}>Segment</span>
                  <span style={S.setsHeaderCol}>Min</span>
                  <span style={S.setsHeaderCol}>km/h</span>
                  <span style={S.setsHeaderCol}>Pente %</span>
                  <span style={{ width: 28 }} />
                </div>
              )}
              {ex.segments.map((seg, si) => (
                <div key={seg.id} style={S.setRow}>
                  <span style={S.setNum}>{si + 1}</span>
                  <input
                    style={S.setInput}
                    inputMode="numeric"
                    placeholder="min"
                    value={seg.duration}
                    onChange={(e) => updateSegment(ex.id, seg.id, "duration", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                  <input
                    style={S.setInput}
                    inputMode="decimal"
                    placeholder="km/h"
                    value={seg.speed}
                    onChange={(e) => updateSegment(ex.id, seg.id, "speed", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                  <input
                    style={S.setInput}
                    inputMode="decimal"
                    placeholder="%"
                    value={seg.incline}
                    onChange={(e) => updateSegment(ex.id, seg.id, "incline", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                  <button style={S.setRemoveBtn} onClick={() => removeSegment(ex.id, seg.id)}>
                    <Minus size={14} />
                  </button>
                </div>
              ))}
              <button style={S.addSetBtn} onClick={() => addSegment(ex.id)}>
                <Plus size={14} /> Ajouter un segment
              </button>
            </div>
          )}

          <input
            style={S.textInput}
            placeholder="Note (optionnel — ex : dropset, tempo...)"
            value={ex.note}
            onChange={(e) => updateExercise(ex.id, "note", e.target.value)}
          />
        </div>
      ))}

      <button style={S.addSetBtn} onClick={addExercise}>
        <Plus size={14} /> Ajouter un exercice
      </button>

      <button
        style={{ ...S.finishBtn, opacity: canSave ? 1 : 0.4, marginTop: 18 }}
        disabled={!canSave}
        onClick={handleSave}
      >
        <Check size={18} /> {isEdit ? "Enregistrer les modifications" : "Créer la séance"}
      </button>
      <div style={{ height: 24 }} />
    </div>
  );
}

/* ---------- History (list) ---------- */

function HistoryView({ programs, blocks, sessions, exerciseIndex, onOpenExercise, onOpenSession }) {
  const [selectedBlockId, setSelectedBlockId] = useState(null);
  const [mode, setMode] = useState("sessions");

  const programById = useMemo(() => {
    const idx = {};
    programs.forEach((p) => (idx[p.id] = p));
    return idx;
  }, [programs]);

  const sessionsByBlock = (blockId) => sessions.filter((s) => programById[s.programId]?.blockId === blockId);

  // ---- Niveau 1 : choisir le programme d'entraînement ----
  if (!selectedBlockId) {
    return (
      <div style={S.page}>
        <div style={S.pageTitle}>Historique</div>
        <div style={{ ...S.caption, marginBottom: 14 }}>Choisis un programme pour voir ses séances.</div>
        <div style={S.programList}>
          {blocks.map((b) => {
            const blockSessions = sessionsByBlock(b.id);
            return (
              <button key={b.id} style={S.sessionLogRow} onClick={() => setSelectedBlockId(b.id)}>
                <div>
                  <div style={S.exRowName}>
                    {b.active && <span style={S.activeDot} />} {b.name}
                  </div>
                  <div style={S.caption}>
                    {blockSessions.length} séance{blockSessions.length > 1 ? "s" : ""} enregistrée{blockSessions.length > 1 ? "s" : ""}
                  </div>
                </div>
              </button>
            );
          })}
          {blocks.length === 0 && <div style={S.caption}>Aucun programme pour l'instant.</div>}
        </div>
        <ExportButtons sessions={sessions} exerciseIndex={exerciseIndex} label="Exporter tout l'historique" />
      </div>
    );
  }

  // ---- Niveau 2 : séances (ou exercices) du programme choisi ----
  const block = blocks.find((b) => b.id === selectedBlockId);
  const blockPrograms = programs.filter((p) => !p.deleted && p.blockId === selectedBlockId);
  const blockSessions = [...sessionsByBlock(selectedBlockId)].sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={() => setSelectedBlockId(null)}>
        <ChevronLeft size={18} /> Programmes
      </button>
      <div style={S.pageTitle}>{block?.name}</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>
        {blockSessions.length} séance{blockSessions.length > 1 ? "s" : ""} enregistrée{blockSessions.length > 1 ? "s" : ""}
      </div>

      <div style={S.modeToggle}>
        <button style={{ ...S.modePill, ...(mode === "sessions" ? S.modePillActive : {}) }} onClick={() => setMode("sessions")}>
          Par séance
        </button>
        <button style={{ ...S.modePill, ...(mode === "exercises" ? S.modePillActive : {}) }} onClick={() => setMode("exercises")}>
          Par exercice
        </button>
      </div>

      {mode === "sessions" ? (
        <>
          <div style={S.programList}>
            {blockSessions.map((s) => {
              const nbExercises = Object.keys(s.entries).length;
              const tonnage = Object.values(s.entries).flat().reduce((a, set) => a + set.reps * set.poids, 0);
              return (
                <button key={s.id} style={S.sessionLogRow} onClick={() => onOpenSession(s)}>
                  <div>
                    <div style={S.exRowName}>{s.programName || "Séance"}</div>
                    <div style={S.caption}>
                      {nbExercises} exercices · {Math.round(tonnage).toLocaleString("fr-FR")} kg
                      {s.durationSeconds ? ` · ${fmtDurationLong(s.durationSeconds)}` : ""}
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={S.caption}>{fmtDate(s.date)}</div>
                    <div style={S.caption}>{fmtTime(s.date)}</div>
                  </div>
                </button>
              );
            })}
            {blockSessions.length === 0 && <div style={S.caption}>Aucune séance enregistrée dans ce programme.</div>}
          </div>
          <ExportButtons sessions={blockSessions} exerciseIndex={exerciseIndex} label={`Exporter « ${block?.name} »`} />
        </>
      ) : (
        <>
          {blockPrograms.map((p) => (
            <div key={p.id}>
              <div style={S.sectionLabel}>{p.name}</div>
              <div style={S.programList}>
                {p.exercises.map((ex) => {
                  const lastLog = [...sessions]
                    .filter((s) => s.entries[ex.id])
                    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];
                  const lastEntry = lastLog?.entries[ex.id];
                  let summary = "—";
                  if (lastEntry && !Array.isArray(lastEntry)) {
                    const totalSec = cardioSegments(lastEntry).reduce((a, seg) => a + (seg.durationSeconds || 0), 0);
                    summary = totalSec ? `${Math.round(totalSec / 60)} min` : "—";
                  } else if (lastEntry) {
                    const bestSet = lastEntry.reduce((m, s) => (s.poids > m.poids ? s : m));
                    summary = `${bestSet.poids} kg`;
                  }
                  return (
                    <button key={ex.id} style={S.programRow} onClick={() => onOpenExercise({ ...ex, programName: p.name })}>
                      <span style={S.programRowName}>{ex.name}</span>
                      <span style={S.caption}>{summary}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
          {blockPrograms.length === 0 && <div style={S.caption}>Aucune séance dans ce programme.</div>}
        </>
      )}
    </div>
  );
}

/* ---------- Session detail (one workout, seen from the history log) ---------- */

function SessionDetailView({ session, exerciseIndex, onBack, onOpenExercise }) {
  const exIds = Object.keys(session.entries);
  const tonnage = Object.values(session.entries)
    .filter(Array.isArray)
    .flat()
    .reduce((a, set) => a + set.reps * set.poids, 0);

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Historique
      </button>
      <div style={S.pageTitle}>{session.programName || "Séance"}</div>
      <div style={{ ...S.caption, marginBottom: 2 }}>
        {session.blockName ? `${session.blockName} · ` : ""}
        {new Date(session.date).toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" })} à {fmtTime(session.date)}
      </div>
      <div style={{ ...S.caption, marginBottom: 16 }}>
        {tonnage > 0 ? `${Math.round(tonnage).toLocaleString("fr-FR")} kg au total` : ""}
        {session.durationSeconds ? `${tonnage > 0 ? " · " : ""}durée ${fmtDurationLong(session.durationSeconds)}` : ""}
      </div>

      {session.comment && (
        <div style={S.commentDisplay}>
          <span style={S.goalLabel}>Ressenti — </span>
          {session.comment}
        </div>
      )}

      <div style={S.programList}>
        {exIds.map((exId) => {
          const def = exerciseIndex[exId];
          const entry = session.entries[exId];
          const isCardio = !Array.isArray(entry);
          return (
            <div key={exId} style={S.historyRow}>
              <div style={S.exRowName}>{def?.name || "Exercice supprimé"}</div>
              {isCardio ? (
                <div style={S.historySets}>
                  {cardioSegments(entry).map((seg, i) => (
                    <span key={i} style={S.setChip}>
                      {seg.durationSeconds ? fmtDurationLong(seg.durationSeconds) : "0 min"}
                      {seg.speed ? ` · ${seg.speed}km/h` : ""}
                      {seg.incline ? ` · pente ${seg.incline}%` : ""}
                    </span>
                  ))}
                </div>
              ) : (
                <div style={S.historySets}>
                  {entry.map((s, j) => (
                    <span key={j} style={S.setChip}>{s.reps}×{s.poids}kg</span>
                  ))}
                </div>
              )}
              {def && (
                <button style={S.goalEditBtn} onClick={() => onOpenExercise(def)}>
                  Voir la progression →
                </button>
              )}
            </div>
          );
        })}
        {exIds.length === 0 && <div style={S.caption}>Aucun exercice enregistré pour cette séance.</div>}
      </div>

      <ExportButtons sessions={[session]} exerciseIndex={exerciseIndex} label="Exporter cette séance" />
    </div>
  );
}

/* ---------- Exercise history detail ---------- */

function ExerciseHistory({ exercise, sessions, onBack }) {
  const isCardio = exercise.type === "cardio";

  const data = sessions
    .filter((s) => s.entries[exercise.id])
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((s) => {
      const entry = s.entries[exercise.id];
      if (isCardio) {
        const segs = cardioSegments(entry);
        const totalSec = segs.reduce((a, seg) => a + (seg.durationSeconds || 0), 0);
        return {
          date: fmtDate(s.date),
          durationMin: Math.round(totalSec / 60),
          segs,
          rawDate: s.date,
        };
      }
      const sets = entry;
      const maxPoids = Math.max(...sets.map((x) => x.poids));
      const volume = sets.reduce((a, x) => a + x.reps * x.poids, 0);
      return { date: fmtDate(s.date), maxPoids, volume, sets, rawDate: s.date };
    });

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Historique
      </button>
      <div style={S.pageTitle}>{exercise.name}</div>
      <div style={S.caption}>
        {isCardio ? exercise.muscle : `${exercise.muscle} · ${exercise.sets} × ${exercise.repMin}-${exercise.repMax} reps`}
      </div>

      {data.length > 0 ? (
        <>
          <div style={S.sectionLabel}>{isCardio ? "Durée par séance (min)" : "Charge max par séance (kg)"}</div>
          <div style={S.chartCard}>
            <MiniLineChart data={data} dataKey={isCardio ? "durationMin" : "maxPoids"} height={180} />
          </div>

          <div style={S.sectionLabel}>Détail des séances</div>
          <div style={S.programList}>
            {[...data].reverse().map((d, i) => (
              <div key={i} style={S.historyRow}>
                <div style={S.caption}>{d.date}</div>
                {isCardio ? (
                  <div style={S.historySets}>
                    {d.segs.map((seg, j) => (
                      <span key={j} style={S.setChip}>
                        {Math.round((seg.durationSeconds || 0) / 60)} min
                        {seg.speed ? ` · ${seg.speed}km/h` : ""}
                        {seg.incline ? ` · pente ${seg.incline}%` : ""}
                      </span>
                    ))}
                  </div>
                ) : (
                  <div style={S.historySets}>
                    {d.sets.map((s, j) => (
                      <span key={j} style={S.setChip}>{s.reps}×{s.poids}kg</span>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        </>
      ) : (
        <div style={{ ...S.caption, marginTop: 24 }}>Pas encore de données pour cet exercice.</div>
      )}
    </div>
  );
}

function GoalBox({ exId, goalDrafts, setGoalDrafts, onSaveGoal }) {
  const [saved, setSaved] = useState(false);
  return (
    <div style={S.goalInputBox}>
      <div style={S.goalInputLabel}>🎯 Objectif pour la semaine prochaine</div>
      <div style={S.goalInputRow}>
        <input
          style={S.goalInput}
          placeholder="ex : passer à 37,5 kg / 8 km/h"
          value={goalDrafts[exId] ?? ""}
          onChange={(e) => setGoalDrafts((d) => ({ ...d, [exId]: e.target.value }))}
        />
        <button
          style={S.goalSaveBtn}
          onClick={() => {
            onSaveGoal(exId, (goalDrafts[exId] ?? "").trim());
            setSaved(true);
            setTimeout(() => setSaved(false), 1500);
          }}
        >
          <Check size={16} />
        </button>
      </div>
      {saved && <div style={S.exportStatus}>Objectif enregistré ✓</div>}
    </div>
  );
}

function LogSession({ program, blocks, sessions, goals, onSaveGoal, onCancel, onFinish }) {
  const prevSession = [...sessions]
    .filter((s) => s.programId === program.id)
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];

  const [startTime] = useState(() => Date.now()); // figé au montage : l'heure de début réelle
  const [elapsedSec, setElapsedSec] = useState(0);
  const [comment, setComment] = useState("");

  useEffect(() => {
    const t = setInterval(() => setElapsedSec(Math.round((Date.now() - startTime) / 1000)), 1000);
    return () => clearInterval(t);
  }, [startTime]);

  // Minuteur de repos (par exercice) : { [exId]: { endTime, notified } }
  const [restTimers, setRestTimers] = useState({});

  useEffect(() => {
    const t = setInterval(() => {
      setRestTimers((r) => {
        let changed = false;
        const next = { ...r };
        Object.entries(r).forEach(([exId, timer]) => {
          const remaining = Math.max(0, Math.round((timer.endTime - Date.now()) / 1000));
          if (remaining === 0 && !timer.notified) {
            next[exId] = { ...timer, notified: true };
            changed = true;
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          }
        });
        return changed ? next : r;
      });
    }, 500);
    return () => clearInterval(t);
  }, []);

  function startRest(exId, seconds) {
    setRestTimers((r) => ({ ...r, [exId]: { endTime: Date.now() + seconds * 1000, notified: false } }));
  }
  function cancelRest(exId) {
    setRestTimers((r) => {
      const next = { ...r };
      delete next[exId];
      return next;
    });
  }
  function restRemaining(exId) {
    const t = restTimers[exId];
    if (!t) return null;
    return Math.max(0, Math.round((t.endTime - Date.now()) / 1000));
  }

  const [goalDrafts, setGoalDrafts] = useState(() => {
    const init = {};
    program.exercises.forEach((ex) => { init[ex.id] = goals?.[ex.id] || ""; });
    return init;
  });

  const [draft, setDraft] = useState(() => {
    const init = {};
    program.exercises.filter((ex) => ex.type !== "cardio").forEach((ex) => {
      const prevSets = prevSession?.entries[ex.id];
      const n = Array.isArray(prevSets) ? prevSets.length : ex.sets;
      init[ex.id] = Array.from({ length: n }, (_, i) => ({
        reps: prevSets?.[i]?.reps ?? "",
        poids: prevSets?.[i]?.poids ?? "",
      }));
    });
    return init;
  });

  const [cardioLogs, setCardioLogs] = useState(() => {
    const init = {};
    program.exercises.filter((ex) => ex.type === "cardio").forEach((ex) => {
      if (ex.segments && ex.segments.length > 0) {
        init[ex.id] = {
          mode: "planned",
          segments: ex.segments.map((seg) => ({
            id: uid(),
            duration: String(seg.duration ?? ""),
            speed: seg.speed != null ? String(seg.speed) : "",
            incline: seg.incline != null ? String(seg.incline) : "",
          })),
        };
      } else {
        const prevEntry = prevSession?.entries[ex.id];
        const prevSeg = !Array.isArray(prevEntry) ? cardioSegments(prevEntry)[0] : null;
        init[ex.id] = {
          mode: "simple",
          running: false,
          startedAt: null,
          elapsedSeconds: 0,
          speed: "",
          incline: "",
          prevSpeed: prevSeg?.speed ?? "",
          prevIncline: prevSeg?.incline ?? "",
        };
      }
    });
    return init;
  });

  function toggleCardioTimer(exId) {
    setCardioLogs((c) => {
      const cur = c[exId];
      if (cur.running) {
        const added = Math.round((Date.now() - cur.startedAt) / 1000);
        return { ...c, [exId]: { ...cur, running: false, startedAt: null, elapsedSeconds: cur.elapsedSeconds + added } };
      }
      return { ...c, [exId]: { ...cur, running: true, startedAt: Date.now() } };
    });
  }
  function updateCardio(exId, field, value) {
    setCardioLogs((c) => ({ ...c, [exId]: { ...c[exId], [field]: value } }));
  }
  function cardioDisplaySeconds(exId) {
    const c = cardioLogs[exId];
    if (!c) return 0;
    return c.running ? c.elapsedSeconds + Math.round((Date.now() - c.startedAt) / 1000) : c.elapsedSeconds;
  }
  function updateCardioSegment(exId, segId, field, value) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: c[exId].segments.map((s) => (s.id === segId ? { ...s, [field]: value } : s)) },
    }));
  }
  function addCardioSegment(exId) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: [...c[exId].segments, { id: uid(), duration: "", speed: "", incline: "" }] },
    }));
  }
  function removeCardioSegment(exId, segId) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: c[exId].segments.filter((s) => s.id !== segId) },
    }));
  }

  function updateSet(exId, idx, field, value) {
    setDraft((d) => {
      const sets = d[exId].map((s, i) => (i === idx ? { ...s, [field]: value } : s));
      return { ...d, [exId]: sets };
    });
  }
  function addSet(exId) {
    setDraft((d) => ({ ...d, [exId]: [...d[exId], { reps: "", poids: "" }] }));
  }
  function removeSet(exId, idx) {
    setDraft((d) => ({ ...d, [exId]: d[exId].filter((_, i) => i !== idx) }));
  }

  function save() {
    const entries = {};
    Object.entries(draft).forEach(([exId, sets]) => {
      const clean = sets
        .filter((s) => s.reps !== "" && s.poids !== "")
        .map((s) => ({ reps: Number(s.reps), poids: Number(s.poids) }));
      if (clean.length) entries[exId] = clean;
    });
    Object.entries(cardioLogs).forEach(([exId, c]) => {
      if (c.mode === "planned") {
        const segments = c.segments
          .filter((s) => s.duration !== "")
          .map((s) => ({
            durationSeconds: Math.round((Number(s.duration) || 0) * 60),
            speed: s.speed !== "" ? Number(s.speed) : null,
            incline: s.incline !== "" ? Number(s.incline) : null,
          }));
        if (segments.length) entries[exId] = { type: "cardio", segments };
      } else {
        const totalSec = c.running ? c.elapsedSeconds + Math.round((Date.now() - c.startedAt) / 1000) : c.elapsedSeconds;
        if (totalSec > 0 || c.speed !== "" || c.incline !== "") {
          entries[exId] = {
            type: "cardio",
            segments: [{ durationSeconds: totalSec, speed: c.speed !== "" ? Number(c.speed) : null, incline: c.incline !== "" ? Number(c.incline) : null }],
          };
        }
      }
    });
    const blockName = blocks?.find((b) => b.id === program.blockId)?.name || "";
    onFinish({
      id: uid(),
      programId: program.id,
      programName: program.name,
      blockName,
      date: new Date(startTime).toISOString(),
      durationSeconds: Math.round((Date.now() - startTime) / 1000),
      comment: comment.trim(),
      entries,
    });
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.sessionHeadRow}>
        <div>
          <div style={S.pageTitle}>{program.name}</div>
          <div style={{ ...S.caption, marginBottom: 8 }}>
            {prevSession ? `Dernière fois : ${fmtDate(prevSession.date)}` : "Première séance sur ce programme"}
          </div>
        </div>
        <div style={S.timerBadge}>⏱ {fmtDuration(elapsedSec)}</div>
      </div>

      {program.exercises.map((ex) => {
        if (ex.type === "cardio") {
          const c = cardioLogs[ex.id];

          if (c.mode === "planned") {
            const totalMin = c.segments.reduce((a, s) => a + (Number(s.duration) || 0), 0);
            return (
              <div key={ex.id} style={S.exerciseCard}>
                <div style={S.exerciseCardHead}>
                  <div style={S.exRowName}>{ex.name}</div>
                  <div style={S.caption}>{ex.muscle}</div>
                  <div style={S.caption}>Programme : {totalMin} min au total</div>
                  {ex.note && <div style={S.exNote}>{ex.note}</div>}
                </div>

                <div style={S.setsHeader}>
                  <span style={S.setsHeaderCol}>Segment</span>
                  <span style={S.setsHeaderCol}>Min</span>
                  <span style={S.setsHeaderCol}>km/h</span>
                  <span style={S.setsHeaderCol}>Pente %</span>
                  <span style={{ width: 28 }} />
                </div>
                {c.segments.map((seg, si) => (
                  <div key={seg.id} style={S.setRow}>
                    <span style={S.setNum}>{si + 1}</span>
                    <input
                      style={S.setInput}
                      inputMode="numeric"
                      value={seg.duration}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "duration", e.target.value.replace(/[^0-9]/g, ""))}
                    />
                    <input
                      style={S.setInput}
                      inputMode="decimal"
                      value={seg.speed}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "speed", e.target.value.replace(/[^0-9.,]/g, ""))}
                    />
                    <input
                      style={S.setInput}
                      inputMode="decimal"
                      value={seg.incline}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "incline", e.target.value.replace(/[^0-9.,]/g, ""))}
                    />
                    <button style={S.setRemoveBtn} onClick={() => removeCardioSegment(ex.id, seg.id)}>
                      <Minus size={14} />
                    </button>
                  </div>
                ))}
                <button style={S.addSetBtn} onClick={() => addCardioSegment(ex.id)}>
                  <Plus size={14} /> Ajouter un segment
                </button>

                <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} />
              </div>
            );
          }

          const displaySec = cardioDisplaySeconds(ex.id);
          return (
            <div key={ex.id} style={S.exerciseCard}>
              <div style={S.exerciseCardHead}>
                <div style={S.exRowName}>{ex.name}</div>
                <div style={S.caption}>{ex.muscle}</div>
                {ex.note && <div style={S.exNote}>{ex.note}</div>}
              </div>

              <div style={S.cardioTimerRow}>
                <div style={S.cardioTimerDisplay}>⏱ {fmtDuration(displaySec)}</div>
                <button
                  style={c.running ? S.cardioStopBtn : S.cardioStartBtn}
                  onClick={() => toggleCardioTimer(ex.id)}
                >
                  {c.running ? "⏹ Arrêter" : "▶ Démarrer"}
                </button>
              </div>

              <div style={S.newExerciseRow}>
                <label style={S.smallLabel}>
                  Vitesse (km/h)
                  <input
                    style={S.smallInput}
                    inputMode="decimal"
                    placeholder={c.prevSpeed ? String(c.prevSpeed) : "-"}
                    value={c.speed}
                    onChange={(e) => updateCardio(ex.id, "speed", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                </label>
                <label style={S.smallLabel}>
                  Pente (%)
                  <input
                    style={S.smallInput}
                    inputMode="decimal"
                    placeholder={c.prevIncline ? String(c.prevIncline) : "-"}
                    value={c.incline}
                    onChange={(e) => updateCardio(ex.id, "incline", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                </label>
              </div>

              <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} />
            </div>
          );
        }

        const prevSets = prevSession?.entries[ex.id];

        return (
          <div key={ex.id} style={S.exerciseCard}>
            <div style={S.exerciseCardHead}>
              <div style={S.exRowName}>{ex.name}</div>
              <div style={S.caption}>{ex.muscle}</div>
              <div style={S.caption}>Fourchette : {ex.repMin}-{ex.repMax} reps</div>
              {ex.restSeconds ? <div style={S.caption}>Repos : {fmtRestTime(ex.restSeconds)}</div> : null}
              {ex.note && <div style={S.exNote}>{ex.note}</div>}
            </div>

            <div style={S.setsHeader}>
              <span style={S.setsHeaderCol}>Série</span>
              <span style={S.setsHeaderCol}>Reps</span>
              <span style={S.setsHeaderCol}>Poids (kg)</span>
              <span style={{ width: 28 }} />
            </div>
            {draft[ex.id].map((s, idx) => (
              <div key={idx} style={S.setRow}>
                <span style={S.setNum}>{idx + 1}</span>
                <input
                  style={S.setInput}
                  inputMode="numeric"
                  placeholder={prevSets?.[idx] ? String(prevSets[idx].reps) : "-"}
                  value={s.reps}
                  onChange={(e) => updateSet(ex.id, idx, "reps", e.target.value.replace(/[^0-9]/g, ""))}
                />
                <input
                  style={S.setInput}
                  inputMode="decimal"
                  placeholder={prevSets?.[idx] ? String(prevSets[idx].poids) : "-"}
                  value={s.poids}
                  onChange={(e) => updateSet(ex.id, idx, "poids", e.target.value.replace(/[^0-9.,]/g, ""))}
                />
                <button style={S.setRemoveBtn} onClick={() => removeSet(ex.id, idx)}>
                  <Minus size={14} />
                </button>
              </div>
            ))}
            <button style={S.addSetBtn} onClick={() => addSet(ex.id)}>
              <Plus size={14} /> Ajouter une série
            </button>

            {ex.restSeconds ? (
              <div style={S.restRow}>
                {restTimers[ex.id] ? (
                  <>
                    <div style={{ ...S.restBadge, ...(restRemaining(ex.id) === 0 ? S.restBadgeDone : {}) }}>
                      {restRemaining(ex.id) === 0 ? "✅ Repos terminé" : `⏱ ${fmtDuration(restRemaining(ex.id))}`}
                    </div>
                    <button style={S.restCancelBtn} onClick={() => cancelRest(ex.id)}>
                      {restRemaining(ex.id) === 0 ? "OK" : "Annuler"}
                    </button>
                  </>
                ) : (
                  <button style={S.restStartBtn} onClick={() => startRest(ex.id, ex.restSeconds)}>
                    ⏱ Démarrer le repos ({fmtRestTime(ex.restSeconds)})
                  </button>
                )}
              </div>
            ) : null}

            <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} />
          </div>
        );
      })}

      <div style={S.commentBox}>
        <div style={S.sectionLabel}>Ressenti de la séance</div>
        <textarea
          style={S.commentInput}
          placeholder="Mental, fatigue, sommeil, motivation... (optionnel)"
          value={comment}
          onChange={(e) => setComment(e.target.value)}
          rows={3}
        />
      </div>

      <button style={S.finishBtn} onClick={save}>
        <Check size={18} /> Terminer la séance
      </button>
      <div style={{ height: 24 }} />
    </div>
  );
}
