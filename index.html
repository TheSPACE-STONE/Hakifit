       navigateurs qui ne comprennent pas dvh, la seconde (100dvh) prend le dessus
       partout ailleurs et colle à la vraie hauteur visible, sans les à-coups de

    height: 100dvh;

    color: #191715;
    border-radius: 18px;
    border-bottom-right-radius: 4px;
  }

    background: #1B1A18;

<!-- Filet de sécurité : si une erreur survient, on l'affiche à l'écran au lieu de rester bloqué sur "Chargement..." -->
<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML =
        '<pre style="color:#ff8080;background:#1B1A18;padding:16px;white-space:pre-wrap;font-size:13px;font-family:monospace;">' +
        "Erreur de chargement :\n" + (e.message || e) + "\n(ligne " + e.lineno + ")" +
        "</pre>";
    }
  });
  // Mode hors-ligne : le service worker met en cache l'app après la 1ère ouverture connectée.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>

// --- Synchronisation avec Supabase : best-effort, ne bloque et ne casse jamais l'app hors-ligne. ---
// Le localStorage reste la source instantanée (lue/écrite en premier) ; Supabase suit derrière.
let __pendingSync = {};
try { __pendingSync = JSON.parse(localStorage.getItem("charge:__pendingSync") || "{}"); } catch { __pendingSync = {}; }
function __savePendingSync() {
  try { localStorage.setItem("charge:__pendingSync", JSON.stringify(__pendingSync)); } catch { /* stockage plein ou indisponible */ }
}

async function __syncKeyToSupabase(key, value) {
  if (key.startsWith("__")) return; // pas de clés internes de synchro
  if (!supabaseClient) return;
  try {
    const { data } = await supabaseClient.auth.getSession();
    const user = data?.session?.user;
    if (!user) return;
    let parsed;
    try { parsed = JSON.parse(value); } catch { parsed = value; }
    const nowIso = new Date().toISOString();
    const { error } = await supabaseClient.from("user_data").upsert({ user_id: user.id, key, value: parsed, updated_at: nowIso });
    if (error) {
      __pendingSync[key] = value;
      __savePendingSync();
    } else {
      localStorage.setItem("charge:__syncedAt:" + key, nowIso);
      if (__pendingSync[key] !== undefined) { delete __pendingSync[key]; __savePendingSync(); }
    }
  } catch {
    __pendingSync[key] = value;
    __savePendingSync();
  }
}

async function __flushPendingSync() {
  const keys = Object.keys(__pendingSync);
  for (const k of keys) await __syncKeyToSupabase(k, __pendingSync[k]);
}
window.addEventListener("online", __flushPendingSync);

// Au démarrage (une fois connecté), on récupère ce qui existe côté serveur et on ne
// remplace le local que si le serveur est plus récent (ou si la clé n'existe pas encore ici).
async function __pullAllFromSupabase(userId) {
  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient.from("user_data").select("key, value, updated_at").eq("user_id", userId);
    if (error || !data) return;
    data.forEach((row) => {
      const localTsRaw = localStorage.getItem("charge:__syncedAt:" + row.key);
      const localTs = localTsRaw ? new Date(localTsRaw).getTime() : 0;
      const remoteTs = new Date(row.updated_at).getTime();
      const hasLocal = localStorage.getItem("charge:" + row.key) !== null;
      if (!hasLocal || remoteTs > localTs) {
        localStorage.setItem("charge:" + row.key, JSON.stringify(row.value));
        localStorage.setItem("charge:__syncedAt:" + row.key, row.updated_at);
      }
    });
  } catch { /* pas grave, on continue avec les données locales */ }
}

// Complète __pullAllFromSupabase : pousse aussi tout ce qui existe en local vers le
// serveur (données d'avant la création du compte, ou modifiées hors-ligne sur un
// autre appareil pendant que celui-ci n'écoutait pas). Sans risque à refaire à
// chaque connexion : une clé déjà à jour côté serveur est juste réécrite à l'identique.
async function __pushAllLocalToSupabase() {
  if (!supabaseClient) return;
  const keys = Object.keys(localStorage)
    .filter((k) => k.startsWith("charge:") && !k.startsWith("charge:__"))
    .map((k) => k.slice(7));
  for (const key of keys) {
    const value = localStorage.getItem("charge:" + key);
    if (value !== null) await __syncKeyToSupabase(key, value);
  }
}

// --- Petit graphique en ligne, léger et sans dépendance externe ---
function MiniLineChart({ data, dataKey, height = 180 }) {
  if (!data || data.length === 0) return null;
  const values = data.map((d) => Number(d[dataKey]) || 0);
  const max = Math.max(...values);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const w = 320;
  const pad = 14;
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const points = values.map((v, i) => {
    const x = pad + i * stepX;
    const y = height - pad - ((v - min) / range) * (height - pad * 2);
    return [x, y];
  });
  const polyline = points.map((p) => p.join(",")).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none">
        {[0.25, 0.5, 0.75].map((f, i) => (
          <line key={i} x1={pad} x2={w - pad} y1={pad + f * (height - pad * 2)} y2={pad + f * (height - pad * 2)} stroke="#332E28" strokeDasharray="3 3" />
        ))}
        <polyline points={polyline} fill="none" stroke="#FFC233" strokeWidth="2.5" />
        {points.map(([x, y], i) => (
          <circle key={i} cx={x} cy={y} r="3.5" fill="#FFC233" />
        ))}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#FFFFFF", marginTop: 4 }}>
        <span>{data[0]?.date}</span>
        {data.length > 1 && <span>{data[data.length - 1]?.date}</span>}
      </div>
    </div>
  );
}

const fmtDate = (iso) => new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });
function timeAgo(iso) {
  const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (diffMin < 1) return "à l'instant";
  if (diffMin < 60) return `il y a ${diffMin} min`;
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return `il y a ${diffH} h`;
  return `il y a ${Math.round(diffH / 24)} j`;
}
function expiresIn(iso) {
  const remainingMin = Math.round(24 * 60 - (Date.now() - new Date(iso).getTime()) / 60000);
  if (remainingMin <= 0) return "expire bientôt";
  if (remainingMin < 60) return `expire dans ${remainingMin} min`;
  return `expire dans ${Math.round(remainingMin / 60)} h`;
}
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
function fmtDuration(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function fmtDurationLong(totalSeconds) {
  if (!totalSeconds) return null;
  const m = Math.round(totalSeconds / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  const rest = m % 60;
  return rest ? `${h} h ${rest} min` : `${h} h`;
}
function toDecimal(str) {
  if (str == null || str === "") return NaN;
  return Number(String(str).replace(",", "."));
}
function fmtRestTime(seconds) {
  if (!seconds) return null;
  if (seconds < 60) return `${seconds} sec`;
  const m = Math.floor(seconds / 60);
  const rest = seconds % 60;
  return rest ? `${m} min ${rest} sec` : `${m} min`;
}

// L'eau est stockée en ml en interne (plus précis pour les ajouts rapides), affichée en litres.
function fmtLiters(ml) {

function litersToMl(l) {

// Estimation du 1RM (charge théorique pour une répétition), formule d'Épley.
// Au-delà d'une quinzaine de répétitions l'estimation devient peu fiable, mais
// reste indicative pour suivre une tendance de force dans le temps.
function estimate1RM(poids, reps) {
  const p = Number(poids) || 0;
  const r = Number(reps) || 0;
  if (r <= 0) return p;
  if (r === 1) return p;
  return p * (1 + r / 30);
}

// Normalise une entrée cardio en liste de segments, pour compatibilité avec
// l'ancien format (durationSeconds/speed/incline à plat, un seul segment).
function cardioSegments(entry) {
  if (!entry) return [];
  if (entry.segments) return entry.segments;
  if (entry.durationSeconds !== undefined) {
    return [{ durationSeconds: entry.durationSeconds, speed: entry.speed, incline: entry.incline }];
  }
  return [];
}

function downloadJSON(filename, jsonContent) {
  try {
    const blob = new Blob([jsonContent], { type: "application/json;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function packPayload(type, data) {
  return `##HAKIFIT-${type}##\n${JSON.stringify(data)}\n##END##`;
}

function unpackPayload(text) {
  const match = text.match(/##HAKIFIT-(\w+)##\s*([\s\S]*?)\s*##END##/);
  if (match) {
    // Le copier-coller mobile (autocorrection iOS notamment) peut remplacer les guillemets
    // et tirets droits par des versions typographiques, ce qui casse le JSON. On les renormalise.
    let cleaned = match[2]
      .replace(/[\u201C\u201D\u201E\u201F]/g, '"')
      .replace(/[\u2018\u2019\u201A\u201B]/g, "'")
      .replace(/[\u2013\u2014]/g, "-")
      .replace(/\u00A0/g, " ");
    try { return { type: match[1], data: JSON.parse(cleaned) }; } catch { return null; }
  }
  return null;
}

function mealPlanSummaryText(blockName, meals) {

  meals.forEach((m) => {

    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(m);
  });
  const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);
  out += `(Cycle sur ${days.length || 1} jour${days.length > 1 ? "s" : ""}, puis ça reboucle)\n`;
  days.forEach((day) => {

      (m.dishes || []).forEach((d) => {

    });

  return out;

function parseQuantityLine(text) {
  // Nouveau format : "Nom 150g" ou "Nom x2" (quantité à la fin)
  let m = text.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(kg|g|mg|l|cl|ml)\s*$/i);
  if (m) {
    const qty = parseFloat(m[2].replace(",", "."));
    if (!isNaN(qty) && m[1].trim()) return { qty, unit: m[3].toLowerCase(), rest: m[1].trim() };
  }
  m = text.match(/^(.+?)\s+x(\d+(?:[.,]\d+)?)\s*$/i);
  if (m) {
    const qty = parseFloat(m[2].replace(",", "."));
    if (!isNaN(qty) && m[1].trim()) return { qty, unit: "", rest: m[1].trim() };
  }
  // Ancien format : "150g de Nom" ou "150g Nom" (quantité en premier)
  m = text.match(/^\s*(\d+(?:[.,]\d+)?)\s*(kg|g|mg|l|cl|ml)?\b\s*(?:de\s+)?(.*)$/i);
  if (!m) return null;
  const qty = parseFloat(m[1].replace(",", "."));
  if (isNaN(qty)) return null;
  const rest = m[3].trim();
  if (!rest) return null;
  return { qty, unit: (m[2] || "").toLowerCase(), rest };
}

function estimateSessionCaloriesBurned(session, weightKg, sex) {
  if (!session || !weightKg) return null;
  const durationMin = (session.durationSeconds || 0) / 60;
  if (!durationMin) return null;
  let totalTonnage = 0;
  let totalReps = 0;
  Object.values(session.entries || {}).forEach((sets) => {
    (Array.isArray(sets) ? sets : []).forEach((s) => {
      const poids = Number(s.poids) || 0;
      const reps = Number(s.reps) || 0;
      totalTonnage += poids * reps;
      totalReps += reps;
    });
  });
  const avgLoad = totalReps > 0 ? totalTonnage / totalReps : 0;
  const intensityFactor = Math.min(1.5, Math.max(0.3, (avgLoad / weightKg) || 0.5));
  const kcalPerMin = 0.08 + 0.05 * intensityFactor; // estimation approximative, pas une mesure médicale
  const sexFactor = sex === "femme" ? 0.9 : 1;
  return Math.round(kcalPerMin * weightKg * durationMin * sexFactor);
}

function estimateStepsCaloriesBurned(steps, weightKg) {
  if (!steps || !weightKg) return 0;
  return Math.round(steps * weightKg * 0.0005);
}

function estimateBMR(weightKg, sex, heightCm) {
  if (!weightKg) return null;
  if (heightCm) {
    // Mifflin-St Jeor : plus précis, à partir du poids, de la taille et du sexe.
    // L'âge n'étant pas renseigné dans l'app, on utilise un âge moyen neutre (35 ans).
    const assumedAge = 35;
    const base = 10 * weightKg + 6.25 * heightCm - 5 * assumedAge;
    return Math.round(sex === "femme" ? base - 161 : base + 5);
  }
  // Repli si la taille n'est pas renseignée : estimation simplifiée ~20-22 kcal/kg/jour au repos
  const kcalPerKgPerDay = sex === "femme" ? 20 : 22;
  return Math.round(weightKg * kcalPerKgPerDay);
}

function computeDayCaloriesEaten(dateStr, mealLogs, allMeals) {
  const logsToday = (mealLogs || []).filter((l) => l.date === dateStr);
  let total = 0;
  let hasUnknown = false;
  let protein = 0, carbs = 0, fat = 0;
  let macrosKnownCount = 0;
  logsToday.forEach((log) => {
    if (log.status === "asPlanned") {
      const meal = (allMeals || []).find((m) => m.id === log.mealId);
      const cals = meal ? sumMealsCalories([meal]) : null;
      if (cals != null) total += cals;
      else hasUnknown = true;
      const macros = meal ? sumMealsMacros([meal]) : null;
      if (macros) {
        protein += macros.protein;
        carbs += macros.carbs;
        fat += macros.fat;
        macrosKnownCount++;
      }
    } else if (log.estimatedCalories != null) {
      total += log.estimatedCalories; // repas adapté/restaurant avec estimation manuelle
    } else {
      hasUnknown = true; // repas adapté ou au restaurant sans estimation : calories non calculables précisément
    }
  });
  return {
    total, hasUnknown, loggedCount: logsToday.length,
    protein: Math.round(protein), carbs: Math.round(carbs), fat: Math.round(fat),
    hasUnknownMacros: logsToday.length > macrosKnownCount,
  };
}

function estimateSessionSeconds(program) {
  let total = 0;
  const DEFAULT_WARMUP_SETS = 2; // séries théoriques d'échauffement si non précisé sur l'exercice
  const TRANSITION_SECONDS = 4 * 60; // temps théorique pour changer de machine et la régler (3-5 min, on prend le milieu)
  (program.exercises || []).forEach((ex) => {
    total += TRANSITION_SECONDS;
    if (ex.type === "cardio") {
      (ex.segments || []).forEach((seg) => {
        total += (toDecimal(seg.duration) || 0) * 60;
      });
    } else {
      const warmup = ex.warmupSets != null && ex.warmupSets !== "" ? Number(ex.warmupSets) : DEFAULT_WARMUP_SETS;
      const sets = (Number(ex.sets) || 1) + warmup;
      const rest = Number(ex.restSeconds) || 0;
      total += sets * 40 + sets * rest;
    }
  });
  return total;
}

function roundSecondsToQuarterHour(seconds) {
  const quarterHour = 15 * 60;
  return Math.max(quarterHour, Math.round(seconds / quarterHour) * quarterHour);
}

function ingredientGrams(ing, aliment) {
  const qtyNum = Number(String(ing.qty).replace(",", ".")) || 0;
  if (ing.unit === "unité") return qtyNum * (aliment?.unitWeight || 0);
  if (ing.unit === "kg" || ing.unit === "l") return qtyNum * 1000;
  return qtyNum; // g ou ml
}

function getActiveDishLibrary(dishLibrary, stores, dishCollections) {
  if (!stores || !stores.length) return dishLibrary || [];
  const inactiveStoreIds = new Set(stores.filter((s) => s.active === false).map((s) => s.id));
  if (!inactiveStoreIds.size) return dishLibrary || [];
  const inactiveCollectionIds = new Set(
    (dishCollections || []).filter((c) => c.storeId && inactiveStoreIds.has(c.storeId)).map((c) => c.id)
  );
  return (dishLibrary || []).filter((d) => {
    if (d.collectionId) return !inactiveCollectionIds.has(d.collectionId);
    return !d.storeId || !inactiveStoreIds.has(d.storeId); // repli pour les aliments hérités sans bibliothèque
  });
}

function computeDishTotals(ingredients, library) {
  let calories = 0, protein = 0, carbs = 0, fat = 0, hasAny = false;
  (ingredients || []).forEach((ing) => {
    const aliment = (library || []).find((a) => a.id === ing.alimentId);
    if (!aliment) return;
    const grams = ingredientGrams(ing, aliment);
    const factor = grams / 100;
    if (aliment.calories != null) { calories += aliment.calories * factor; hasAny = true; }
    if (aliment.protein != null) { protein += aliment.protein * factor; hasAny = true; }
    if (aliment.carbs != null) { carbs += aliment.carbs * factor; hasAny = true; }
    if (aliment.fat != null) { fat += aliment.fat * factor; hasAny = true; }
  });
  if (!hasAny) return null;
  return {
    calories: Math.round(calories),
    protein: Math.round(protein * 10) / 10,
    carbs: Math.round(carbs * 10) / 10,
    fat: Math.round(fat * 10) / 10,
  };
}

function sumMealsCalories(meals) {
  let total = 0;
  let hasAny = false;
  meals.forEach((meal) => {
    (meal.dishes || []).forEach((d) => {
      if (d.calories != null && !isNaN(d.calories)) {
        total += Number(d.calories);
        hasAny = true;
      }
    });
  });
  return hasAny ? total : null;
}

function sumMealsMacros(meals) {
  let protein = 0, carbs = 0, fat = 0, hasAny = false;
  meals.forEach((meal) => {
    (meal.dishes || []).forEach((d) => {
      if (d.protein != null && !isNaN(d.protein)) { protein += Number(d.protein); hasAny = true; }
      if (d.carbs != null && !isNaN(d.carbs)) { carbs += Number(d.carbs); hasAny = true; }
      if (d.fat != null && !isNaN(d.fat)) { fat += Number(d.fat); hasAny = true; }
    });
  });
  return hasAny ? { protein: Math.round(protein), carbs: Math.round(carbs), fat: Math.round(fat) } : null;
}

function buildShoppingList(meals, loops, dishLibrary, pantry, priceStoreId, dishCollections) {
  const quantified = {};
  const plain = {};

  function addItem(ing) {
    const aliment = ing.alimentId ? (dishLibrary || []).find((a) => a.id === ing.alimentId) : null;
    if (aliment) {
      const grams = ingredientGrams(ing, aliment);
      if (grams > 0) {
        const key = `g||${aliment.name.trim().toLowerCase()}`;
        if (!quantified[key]) quantified[key] = { qty: 0, unit: "g", rest: aliment.name.trim(), alimentId: aliment.id };
        quantified[key].qty += grams;
        return;
      }
    }
    const text = (ing.text || "").trim();
    if (!text) return;
    const parsed = parseQuantityLine(text);
    if (parsed) {
      const key = `${parsed.unit}||${parsed.rest.toLowerCase()}`;
      if (!quantified[key]) quantified[key] = { qty: 0, unit: parsed.unit, rest: parsed.rest, alimentId: null };
      quantified[key].qty += parsed.qty;
    } else {
      const key = text.toLowerCase();
      if (!plain[key]) plain[key] = { count: 0, text };
      plain[key].count += 1;
    }
  }

  meals.forEach((meal) => {
    (meal.dishes || []).forEach((dish) => {
      if (dish.ingredients && dish.ingredients.length) {
        dish.ingredients.forEach((ing) => addItem(ing));
      } else if (dish.name) {
        addItem({ text: dish.name });
      }
    });
  });

  // Déduction du placard : ce qui est déjà possédé (en grammes, par aliment lié) est retiré du besoin
  const pantryGrams = {};
  const pantryByName = {}; // pour les lignes non liées à la bibliothèque, on repère par nom
  (pantry || []).forEach((p) => {
    if (p.alimentId) {
      const aliment = (dishLibrary || []).find((a) => a.id === p.alimentId);
      if (!aliment) return;
      const grams = ingredientGrams(p, aliment);
      pantryGrams[p.alimentId] = (pantryGrams[p.alimentId] || 0) + grams;
      return;
    }
    if (p.name) {
      const key = p.name.trim().toLowerCase();
      pantryByName[key] = (pantryByName[key] || 0) + (Number(p.qty) || 0);
    }
  });

  // Résout le prix d'un aliment dans le magasin choisi pour cette liste : l'aliment réellement
  // utilisé dans le repas n'a pas forcément de prix (ex : choisi depuis une bibliothèque de base) ;
  // on cherche alors un aliment du MÊME NOM dans une bibliothèque liée à ce magasin précis.
  function resolvePrice(aliment) {
    if (!aliment) return { priceMin: null, priceMax: null, purchaseNote: null };
    if (priceStoreId) {
      const collectionIdsForStore = new Set(
        (dishCollections || []).filter((c) => c.storeId === priceStoreId).map((c) => c.id)
      );
      const match = (dishLibrary || []).find(
        (a) => a.name.trim().toLowerCase() === aliment.name.trim().toLowerCase() && collectionIdsForStore.has(a.collectionId)
      );
      if (match) return { priceMin: match.priceMin ?? null, priceMax: match.priceMax ?? null, purchaseNote: match.purchaseNote || null };
      return { priceMin: null, priceMax: null, purchaseNote: null }; // magasin choisi mais aucun prix connu pour cet aliment
    }
    return { priceMin: aliment.priceMin ?? null, priceMax: aliment.priceMax ?? null, purchaseNote: aliment.purchaseNote || null };
  }

  const results = [];
  Object.values(quantified).forEach((q) => {
    let total = q.qty * loops;
    let deducted = 0;
    if (q.alimentId && pantryGrams[q.alimentId]) {
      deducted = Math.min(total, pantryGrams[q.alimentId]);
      total -= deducted;
    } else if (pantryByName[q.rest.trim().toLowerCase()]) {
      deducted = Math.min(total, pantryByName[q.rest.trim().toLowerCase()]);
      total -= deducted;
    }
    if (total <= 0) return; // déjà tout en placard, rien à acheter
    const qtyStr = Number.isInteger(total) ? total : total.toFixed(1).replace(/\.0$/, "");
    const aliment = q.alimentId ? (dishLibrary || []).find((a) => a.id === q.alimentId) : null;
    const price = resolvePrice(aliment);
    results.push({
      text: q.unit ? `${q.rest} ${qtyStr}${q.unit}` : `${q.rest} ${qtyStr}`,
      qtyLabel: q.unit ? `${qtyStr} ${q.unit}` : String(qtyStr),
      name: q.rest,
      sortKey: q.rest.toLowerCase(),
      alimentId: q.alimentId,
      deductedFromPantry: deducted > 0,
      purchaseNote: price.purchaseNote,
      priceMin: price.priceMin,
      priceMax: price.priceMax,
    });
  });
  Object.values(plain).forEach((p) => {
    const total = p.count * loops;
    results.push({ text: total > 1 ? `${p.text} x${total}` : p.text, qtyLabel: total > 1 ? `x${total}` : "", name: p.text, sortKey: p.text.toLowerCase() });
  });

  return results.sort((a, b) => a.sortKey.localeCompare(b.sortKey, "fr"));
}

function mealLogStatusLabel(status) {
  if (status === "asPlanned") return "Mangé comme prévu";
  if (status === "adapted") return "Adapté";
  if (status === "restaurant") return "Restaurant";
  return status;
}

function mealLogSummaryText(logs) {
  let out = `📋 Suivi nutrition\n`;
  logs.forEach((log) => {
    out += `\n${log.date} — ${log.mealName} : ${mealLogStatusLabel(log.status)}`;
    if (log.note) out += ` (${log.note})`;
  });
  return out;
}


function sessionSummaryText(session, exerciseIndex) {
  let out = `📊 Séance : ${session.programName || "Séance"}\n`;
  out += `${new Date(session.date).toLocaleDateString("fr-FR")} à ${fmtTime(session.date)}`;
  if (session.durationSeconds) out += ` · ${fmtDurationLong(session.durationSeconds)}`;
  out += `\n`;
  Object.entries(session.entries).forEach(([exId, entry]) => {
    const name = exerciseIndex[exId]?.name || exId;
    out += `\n${name} :\n`;
    if (Array.isArray(entry)) {
      entry.forEach((s, i) => (out += `  Série ${i + 1} : ${s.repsL != null && s.repsR != null ? `${s.repsL}G/${s.repsR}D` : `${s.reps} reps`} × ${s.poids} kg${s.rpe ? ` (RPE ${s.rpe})` : ""}\n`));
    } else {
      cardioSegments(entry).forEach((seg) => {
        out += `  ${Math.round((seg.durationSeconds || 0) / 60)} min`;
        out += seg.speed ? ` · ${seg.speed} km/h` : "";
        out += seg.incline ? ` · pente ${seg.incline}%` : "";
        out += `\n`;
      });
    }
  });
  if (session.comment) out += `\nRessenti : ${session.comment}\n`;
  return out;
}

// Résumé lisible d'un objectif structuré (reps/poids par série), utilisé dans les
// aperçus et dans le texte envoyé au suivi. Reste compatible avec l'ancien format
// texte libre (encore utilisé pour le cardio).
function goalSetsSummary(goal) {
  if (!goal) return "";
  if (typeof goal === "string") return goal;
  if (goal.speed || goal.incline) {
    const n = Math.max(goal.speed?.length || 0, goal.incline?.length || 0);
    const parts = [];
    for (let i = 0; i < n; i++) {
      const sp = goal.speed?.[i];
      const inc = goal.incline?.[i];
      if (!sp && !inc) continue;
      parts.push(`${sp ? sp + " km/h" : "?"}${inc ? ` / ${inc}%` : ""}`);
    }
    return parts.join(", ");
  }
  const n = Math.max(goal.reps?.length || 0, goal.poids?.length || 0);
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = goal.reps?.[i];
    const p = goal.poids?.[i];
    if (!r && !p) continue;
    parts.push(`${r || "?"}×${p ? p + "kg" : "?"}`);
  }
  return parts.join(", ");
}

function goalsSummaryText(athleteName, goals, exerciseIndex) {
  let out = `🎯 Objectifs pour ${athleteName}\n`;
  Object.entries(goals).forEach(([exId, goal]) => {
    const text = goalSetsSummary(goal);
    if (!text) return;
    out += `\n${exerciseIndex[exId]?.name || exId} : ${text}`;
  });
  return out;
}

function buildExerciseNamesForSession(session, exerciseIndex) {
  const exerciseNames = {};
  Object.keys(session.entries).forEach((exId) => {
    const def = exerciseIndex[exId];
    if (def) {
      exerciseNames[exId] = {
        name: def.name, muscle: def.muscle, type: def.type,
        repMin: def.repMin, repMax: def.repMax, sets: def.sets,
      };
    }
  });
  return exerciseNames;
}

  async function sendFriendRequest(mode, value) {
    if (!supabaseClient || !userId) return { error: "Compte indisponible pour le moment." };
    const v = (value || "").trim();
    if (!v) return { error: "Champ vide." };
    let foundId = null;
    if (mode === "id") {
      const uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      if (!uuidRe.test(v)) return { error: "Identifiant invalide (format attendu : xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)." };
      foundId = v;
    } else {
      return { error: "Méthode d'ajout inconnue." };
    }
    if (foundId === userId) return { error: "C'est ton propre compte." };
    const { error } = await supabaseClient.from("friend_links").insert({ requester_id: userId, addressee_id: foundId, status: "pending" });
    if (error) {
      if (error.code === "23505") return { error: "Demande déjà envoyée à ce compte." };
      if (error.code === "23503") return { error: "Aucun compte ne correspond à cet identifiant." };
      return { error: error.message };

    await loadFriendsData();
    return { error: null };

    const path = `${userId}/avatar.${ext}`;

    const { data } = supabaseClient.storage.from("avatars").getPublicUrl(path);

    const { error: dbError } = await supabaseClient.from("profiles").upsert({ id: userId, avatar_url: url });
    if (dbError) return { error: dbError.message };

  async function loadMessages(friendId) {
    if (!supabaseClient || !userId || !friendId) return { error: "Compte indisponible pour le moment." };
    const myGen = (loadMessagesGenRef.current[friendId] || 0) + 1;
    loadMessagesGenRef.current[friendId] = myGen;
    const { data, error } = await supabaseClient
      .from("messages")
      .select("*")
      .or(`and(sender_id.eq.${userId},recipient_id.eq.${friendId}),and(sender_id.eq.${friendId},recipient_id.eq.${userId})`)
      .order("created_at", { ascending: true });
    if (error) return { error: error.message };
    // Si une requête plus récente a été lancée entre-temps (envoi, sondage, temps réel...),

  async function loadStoriesFeed() {
    if (!supabaseClient || !userId) return { error: "Compte indisponible pour le moment." };
    setStoriesLoading(true);
    const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
    const { data, error } = await supabaseClient
      .from("stories")
      .select("id, user_id, kind, message, created_at")
      .gte("created_at", since)
      .order("created_at", { ascending: false });
    if (error) {
      setStoriesLoading(false);

    }
    setStories(data || []);
    const authorIds = [...new Set((data || []).map((s) => s.user_id).filter((id) => id !== userId))];
    if (authorIds.length > 0) {
      const { data: profs } = await supabaseClient.from("profiles").select("id, display_name").in("id", authorIds);

        (profs || []).forEach((p) => { next[p.id] = p.display_name || next[p.id] || ""; });

  // copier-coller). On surveille les messages du coach désigné, qu'on ait ou non
  // la conversation ouverte, et on ne traite chaque message qu'une seule fois.
  useEffect(() => {
    if (!userId || !coachFriendId || !supabaseClient) return;

    async function checkCoachGoalMessages() {
      const { data, error } = await supabaseClient
        .from("messages")
        .select("id, content")
        .eq("sender_id", coachFriendId)
        .eq("recipient_id", userId)
        .order("created_at", { ascending: true });
      if (error || !data) return;
      let appliedIds = [];
      try { appliedIds = JSON.parse(localStorage.getItem("charge:appliedGoalMsgIds") || "[]"); } catch { appliedIds = []; }
      const appliedSet = new Set(appliedIds);
      let sizeBefore = appliedSet.size;
      data.forEach((m) => {
        if (appliedSet.has(m.id)) return;
        const parsed = unpackPayload(m.content);
        if (parsed && parsed.type === "GOALS") {
          importCoachGoals(parsed.data);
        }
        appliedSet.add(m.id);
      });
      if (appliedSet.size !== sizeBefore) {
        try { localStorage.setItem("charge:appliedGoalMsgIds", JSON.stringify([...appliedSet])); } catch { /* stockage plein ou indisponible */ }
      }
    }

    checkCoachGoalMessages();
    const interval = setInterval(checkCoachGoalMessages, 15000);

    const channel = supabaseClient
      .channel(`coach-goals-${userId}`)
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "messages" },
        (payload) => {
          const m = payload.new;
          if (m.sender_id === coachFriendId && m.recipient_id === userId) checkCoachGoalMessages();
        }
      )
      .subscribe();

    return () => {
      clearInterval(interval);
      supabaseClient.removeChannel(channel);
    };
  }, [userId, coachFriendId]);

  function importExerciseLibrary(text, collectionId) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "EXERCISELIB" || !Array.isArray(parsed.data.exercises)) {
      return { ok: false };
    }
    setExerciseLibrary((list) => {
      const inTargetCollection = list.filter((e) => (e.collectionId || null) === (collectionId || null));
      const byName = new Map(inTargetCollection.map((e) => [e.name.trim().toLowerCase(), e]));
      const untouched = list.filter((e) => (e.collectionId || null) !== (collectionId || null));
      parsed.data.exercises.forEach((e) => {
        if (!e.name) return;
        const key = e.name.trim().toLowerCase();
        if (byName.has(key)) {
          byName.set(key, { ...byName.get(key), ...e, collectionId: collectionId || null, id: byName.get(key).id });
        } else {
          byName.set(key, { ...e, id: uid(), collectionId: collectionId || null });
        }
      });
      const next = [...untouched, ...Array.from(byName.values())];
      saveExerciseLibrary(next);
      return next;
    });
    return { ok: true };
  }

        const key = p.name.trim().toLowerCase();
        if (byName.has(key)) {
          byName.set(key, { ...byName.get(key), ...p, collectionId: collectionId || null, id: byName.get(key).id });
        } else {
          byName.set(key, { ...p, id: uid(), collectionId: collectionId || null });
        }
      });
      const next = [...untouched, ...Array.from(byName.values())];
      savePlats(next);
      return next;
    });
    return { ok: true };
  }

function computeStreak(sessions) {
  if (!sessions.length) return 0;
  const weekKey = (d) => {
    const date = new Date(d);
    const day = (date.getDay() + 6) % 7; // 0 = lundi
    const monday = new Date(date);
    monday.setDate(date.getDate() - day);
    monday.setHours(0, 0, 0, 0);
    return monday.toISOString().slice(0, 10);
  };
  const weeksWithSessions = new Set(sessions.map((s) => weekKey(s.date)));
  let cursor = new Date();
  if (!weeksWithSessions.has(weekKey(cursor))) {
    cursor.setDate(cursor.getDate() - 7); // grace : la semaine en cours n'est pas encore "cassée"
  }
  let streak = 0;
  while (weeksWithSessions.has(weekKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 7);
  }
  return streak;
}

function computeMuscleBalance(sessions, exerciseIndex) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const counts = {};
  sessions
    .filter((s) => new Date(s.date) >= cutoff)
    .forEach((s) => {
      Object.keys(s.entries).forEach((exId) => {
        const def = exerciseIndex[exId];
        if (!def || def.type === "cardio") return;
        const muscle = def.muscle || "Autre";
        counts[muscle] = (counts[muscle] || 0) + 1;
      });
    });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = entries.length ? entries[0][1] : 1;
  return { entries, max };
}

function MealLogEditor({ meal, status, initialLog, onConfirm, onCancel }) {
  const [changes, setChanges] = useState(() => (meal.dishes || []).map((d) => {
    const existing = initialLog?.changes?.find((c) => c.dish === d.name);
    return { dish: d.name, replaced: !!existing, replacement: existing?.replacement || "" };
  }));
  const [note, setNote] = useState(initialLog?.note || "");
  const [estimatedCalories, setEstimatedCalories] = useState(initialLog?.estimatedCalories != null ? String(initialLog.estimatedCalories) : "");

  function toggleReplaced(idx) {
    setChanges((cs) => cs.map((c, i) => (i === idx ? { ...c, replaced: !c.replaced } : c)));
  }
  function updateReplacement(idx, value) {
    setChanges((cs) => cs.map((c, i) => (i === idx ? { ...c, replacement: value } : c)));
  }

  function handleConfirm() {
    const filtered = changes.filter((c) => c.replaced && c.replacement.trim()).map((c) => ({ dish: c.dish, replacement: c.replacement.trim() }));
    const calNum = Number(estimatedCalories);
    onConfirm({
      ...(filtered.length ? { changes: filtered } : {}),
      ...(note.trim() ? { note: note.trim() } : {}),
      ...(estimatedCalories !== "" && !isNaN(calNum) ? { estimatedCalories: calNum } : {}),
    });
  }

  const hasDishes = (meal.dishes || []).length > 0;

  return (
    <div style={S.segmentsBox}>
      {status === "adapted" && hasDishes && (
        <>
          <div style={{ ...S.caption, marginBottom: 6 }}>Coche les plats remplacés et précise par quoi :</div>

            <div key={idx} style={{ marginBottom: 8 }}>
              <label style={S.supersetCheckRow}>
                <input type="checkbox" checked={c.replaced} onChange={() => toggleReplaced(idx)} />
                {c.dish}
              </label>
              {c.replaced && (
                <input
                  style={S.textInput}
                  placeholder="Remplacé par..."
                  value={c.replacement}
                  onChange={(e) => updateReplacement(idx, e.target.value)}
                />
              )}
            </div>
          ))}
        </>
      )}
      <input
        style={S.textInput}
        placeholder={status === "restaurant" ? "Nom du restaurant / ce que tu as mangé (optionnel)" : "Autre précision (optionnel)"}
        value={note}
        onChange={(e) => setNote(e.target.value)}
      />
      {(status === "adapted" || status === "restaurant") && (
        <>
          <div style={S.goalInputLabel}>Estimation des calories (optionnel, améliore le Bilan journalier)</div>

            style={S.textInput}

        <button style={S.createBtn} onClick={handleConfirm}>Confirmer</button>

  );

function ProgramsView({ programs, blocks, onStart, onCreateProgram, onEditProgram, onDeleteProgram, onDuplicateProgram, onCreateBlock, onSetActiveBlock, onUpdateBlock, onDeleteBlock, onImportCoachProgram, onImportCoachGoals, onOpenHistory, onOpenPlanning, coachDisplayName, gyms }) {

  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [editingBlock, setEditingBlock] = useState(false);
  const [editBlockName, setEditBlockName] = useState("");
  const [editBlockCoached, setEditBlockCoached] = useState(false);
  const [editBlockGymId, setEditBlockGymId] = useState("");
  const [confirmDeleteBlock, setConfirmDeleteBlock] = useState(false);


  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockPrograms = programs.filter((p) => !p.deleted && p.blockId === selectedBlock?.id);

  function handleCreateBlock() {
    if (!newBlockName.trim()) return;
    const id = onCreateBlock(newBlockName.trim());
    setSelectedBlockId(id);
    setNewBlockName("");
    setShowNewBlock(false);
  }

  function processImportText(text) {
    const parsed = unpackPayload(text);
    if (!parsed) {
      setImportStatus("error");
      setTimeout(() => setImportStatus(null), 3000);
      return;
    }
    if (parsed.type === "PROGRAM") {
      const newBlockId = onImportCoachProgram(parsed.data, parsed.data.coachName);
      setSelectedBlockId(newBlockId);
      setImportStatus("program");
    } else if (parsed.type === "GOALS") {
      onImportCoachGoals(parsed.data);
      setImportStatus("goals");
    } else {
      setImportStatus("error");
    }
    setImportText("");
    setTimeout(() => setImportStatus(null), 3000);
  }

  function handleImport() {
    processImportText(importText);
  }

  async function handlePasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStatus("error");
        setTimeout(() => setImportStatus(null), 3000);
        return;
      }
      processImportText(text);
    } catch (e) {
      setImportStatus("clipboard-error");
      setTimeout(() => setImportStatus(null), 3000);
    }
  }

  function openEditBlock() {
    setEditBlockName(selectedBlock?.name || "");
    setEditBlockCoached(!!selectedBlock?.coached);
    setEditBlockGymId(selectedBlock?.gymId || "");
    setEditingBlock(true);
    setConfirmDeleteBlock(false);
  }

  function saveEditBlock() {
    if (!editBlockName.trim() || !selectedBlock) return;
    onUpdateBlock(selectedBlock.id, {
      name: editBlockName.trim(),
      coached: editBlockCoached,
      // Le nom du coach vient désormais du compte (Paramètres → Mon coach), plus besoin de le taper ici.
      ...(editBlockCoached && coachDisplayName ? { coachName: coachDisplayName } : { coachName: "" }),
      gymId: editBlockGymId || "",
    });
    setEditingBlock(false);
  }

  function handleDeleteBlock() {
    if (!selectedBlock || blocks.length <= 1) return;
    onDeleteBlock(selectedBlock.id);
    const next = blocks.find((b) => b.id !== selectedBlock.id);
    if (next) setSelectedBlockId(next.id);
    setEditingBlock(false);
    setConfirmDeleteBlock(false);
  }

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Programmes d'entraînement</div>

      <div style={{ ...S.caption, marginBottom: 10 }}>
        Un programme regroupe plusieurs séances. Un seul programme est suivi à la fois — les autres restent en pause, avec leur historique intact.
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button style={{ ...S.historyLinkBtn, flex: 1 }} onClick={onOpenHistory}>
          <TrendingUp size={14} style={{ marginRight: 5 }} />
          Voir l'historique
        </button>
        {onOpenPlanning && (
          <button style={{ ...S.historyLinkBtn, flex: 1 }} onClick={onOpenPlanning}>
            <ListChecks size={14} style={{ marginRight: 5 }} />
            Voir le planning
          </button>
        )}
      </div>

      <div style={S.blockChipsRow}>
        {blocks.map((b) => (
          <button
            key={b.id}
            style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
            onClick={() => setSelectedBlockId(b.id)}
          >
            {b.active && <span style={S.activeDot} />}
            {b.coached && <GraduationCap size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}
            {b.name}
          </button>
        ))}
        {selectedBlock && (
          <button style={S.blockChipAdd} onClick={openEditBlock}>
            <Pencil size={14} />
          </button>
        )}
        <button style={S.blockChipAdd} onClick={() => setShowNewBlock((v) => !v)}>
          <Plus size={14} />
        </button>
        <button style={S.blockChipAdd} onClick={() => setShowImport((v) => !v)}>
          <Inbox size={14} />
        </button>
      </div>

      {selectedBlock?.coached && selectedBlock?.locked && (
        <div style={{ ...S.caption, marginBottom: 10 }}>
          <Link2 size={12} style={{ verticalAlign: "-2px", marginRight: 4 }} />
          Ce programme est verrouillé par {coachRef(selectedBlock.coachName)} — non modifiable. Tu peux toujours le supprimer via le crayon ci-dessus.
        </div>
      )}

      {showImport && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>
            Reçu de {coachRef(coachDisplayName)} (programme ou objectifs) :
          </div>
          <button style={S.createBtn} onClick={handlePasteClipboard}>
            <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller et importer
          </button>
          {importStatus === "program" && <div style={S.exportStatus}>Programme importé ✓</div>}
          {importStatus === "goals" && <div style={S.exportStatus}>Objectifs mis à jour ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
          {importStatus === "clipboard-error" && (
            <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
          )}
          <textarea
            style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
            rows={3}
            placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
          />
          {importText && (
            <button style={S.exportBtnGhost} onClick={handleImport}>
              Importer ce texte
            </button>
          )}
        </div>
      )}

      {showNewBlock && (
        <div style={S.newBlockRow}>
          <input
            style={S.textInput}
            placeholder="Nom du programme (ex : Bloc force été 2026)"
            value={newBlockName}
            onChange={(e) => setNewBlockName(e.target.value)}
          />
          <button style={S.goalSaveBtn} onClick={handleCreateBlock}>
            <Check size={16} />
          </button>
        </div>
      )}

      {selectedBlock && selectedBlock.id !== activeBlock?.id && (
        <div style={S.notActiveBanner}>
          <span>Ce programme n'est pas suivi actuellement.</span>
          <button style={S.activateBtn} onClick={() => onSetActiveBlock(selectedBlock.id)}>
            Suivre ce programme
          </button>
        </div>
      )}

      {selectedBlock && editingBlock && (
        <div style={S.segmentsBox}>
          {selectedBlock.coached && selectedBlock.locked && (
            <div style={{ ...S.caption, marginBottom: 10 }}>
              Verrouillé par {coachRef(selectedBlock.coachName)} — seule la suppression est possible.
            </div>
          )}
          <div style={S.goalInputLabel}>Nom du programme</div>
          <input
            style={S.textInput}
            value={editBlockName}
            onChange={(e) => setEditBlockName(e.target.value)}
            disabled={selectedBlock.coached && selectedBlock.locked}
          />
          <label style={S.supersetCheckRow}>
            <input type="checkbox" checked={editBlockCoached} onChange={(e) => setEditBlockCoached(e.target.checked)} disabled={selectedBlock.coached && selectedBlock.locked} />
            <GraduationCap size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Ce programme est suivi par un coach (toutes ses séances demanderont un import d'objectifs avant de démarrer)
          </label>
          {editBlockCoached && (
            <div style={{ ...S.caption, marginBottom: 8 }}>
              {coachDisplayName ? `Coach : ${coachDisplayName} (choisi dans Paramètres)` : "Choisis d'abord un coach dans Paramètres pour qu'il apparaisse ici."}
            </div>
          )}

          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            {!(selectedBlock.coached && selectedBlock.locked) && (
              <button style={S.createBtn} onClick={saveEditBlock}>
                Enregistrer
              </button>
            )}
            <button style={S.exportBtnGhost} onClick={() => setEditingBlock(false)}>
              {selectedBlock.coached && selectedBlock.locked ? "Fermer" : "Annuler"}
            </button>
          </div>

          <div style={{ marginTop: 14, borderTop: "1px solid #332E28", paddingTop: 12 }}>
            {blocks.length <= 1 ? (
              <div style={S.caption}>Impossible de supprimer le seul programme restant.</div>
            ) : confirmDeleteBlock ? (
              <div style={S.confirmDeleteRow}>
                <span style={S.caption}>Supprimer « {selectedBlock?.name} » et toutes ses séances ?</span>
                <button style={S.confirmDeleteBtn} onClick={handleDeleteBlock}>
                  Oui, supprimer
                </button>
                <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteBlock(false)}>
                  Annuler
                </button>
              </div>
            ) : (
              <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteBlock(true)}>
                <Trash2 size={13} /> Supprimer ce programme
              </button>
            )}
          </div>
        </div>
      )}

      <div style={{ height: 8 }} />

      {blockPrograms.length === 0 && (
        <div style={{ ...S.caption, margin: "12px 0" }}>Pas encore de séance dans ce programme.</div>
      )}

      {blockPrograms.map((p) => (
        <div key={p.id} style={S.programBlock}>
          <button style={S.programBlockHeader} onClick={() => setOpen(open === p.id ? null : p.id)}>
            <span style={S.programBlockTitle}>
              {p.name}
              <span style={{ ...S.caption, marginLeft: 8 }}>~{fmtDurationLong(roundSecondsToQuarterHour(estimateSessionSeconds(p))) || "0 min"}</span>
            </span>
            <span style={S.caption}>{open === p.id ? "−" : "+"}</span>
          </button>
          {open === p.id && (
            <div style={S.programBlockBody}>
              {p.exercises.map((ex) => (
                <div key={ex.id} style={S.exRow}>
                  <div>
                    <div style={S.exRowName}>{ex.superset && <Link2 size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}{ex.name}</div>
                    <div style={S.caption}>{ex.muscle}</div>
                    {ex.type === "cardio" ? (
                      <div style={S.caption}>Cardio</div>
                    ) : (
                      <>
                        <div style={S.caption}>Fourchette : {ex.repMin}-{ex.repMax} reps · {ex.sets} séries</div>
                        {ex.restSeconds ? <div style={S.caption}>Repos : {fmtRestTime(ex.restSeconds)}</div> : null}
                      </>
                    )}
                    {ex.superset && <div style={S.caption}>Enchaîné avec l'exercice précédent (superset)</div>}
                    {ex.note && <div style={S.exNote}>{ex.note}</div>}
                  </div>
                </div>
              ))}
              <button style={S.startProgramBtn} onClick={() => onStart(p)}>
                Démarrer cette séance
              </button>
              {!(selectedBlock?.coached && selectedBlock?.locked) && (
                <button style={S.editProgramBtn} onClick={() => onEditProgram(p)}>
                  Modifier cette séance
                </button>
              )}
              {!(selectedBlock?.coached && selectedBlock?.locked) && (
                <button style={S.editProgramBtn} onClick={() => onDuplicateProgram(p.id)}>
                  Dupliquer cette séance
                </button>
              )}
              {confirmDelete === p.id ? (
                <div style={S.confirmDeleteRow}>
                  <span style={S.caption}>Supprimer « {p.name} » ?</span>
                  <button style={S.confirmDeleteBtn} onClick={() => { onDeleteProgram(p.id); setConfirmDelete(null); }}>
                    Oui, supprimer
                  </button>
                  <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(null)}>
                    Annuler
                  </button>
                </div>
              ) : (
                <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(p.id)}>
                  <Trash2 size={13} /> Supprimer cette séance
                </button>
              )}
            </div>
          )}
        </div>
      ))}

      <button
        style={S.createBtn}
        onClick={() => { if (!(selectedBlock?.coached && selectedBlock?.locked)) onCreateProgram(selectedBlock?.id); }}
        disabled={selectedBlock?.coached && selectedBlock?.locked}
      >
        <Plus size={16} /> Créer une séance dans ce programme
      </button>
    </div>
  );
}

/* ---------- Planning des séances (jours de la semaine assignés à un programme) ---------- */

function weekDayLabel(date) {
  return WEEK_DAYS[(date.getDay() + 6) % 7];
}

function PlanningView({ programs, blocks, onStart, onBack }) {
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockPrograms = programs.filter((p) => !p.deleted && p.blockId === selectedBlock?.id);
  const unscheduled = blockPrograms.filter((p) => !(p.scheduledDays || []).length);

  const days = Array.from({ length: 7 }, (_, i) => {
    const date = new Date();
    date.setDate(date.getDate() + i);
    const label = weekDayLabel(date);
    return {
      date,
      label,
      isToday: i === 0,
      programsToday: blockPrograms.filter((p) => (p.scheduledDays || []).includes(label)),
    };
  });

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Programmes
      </button>
      <div style={S.pageTitle}>Planning</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        Les jours prévus se règlent sur chaque séance (modifier la séance → « Jours prévus »). Ça se répète chaque semaine.
      </div>

      {blocks.length > 1 && (
        <div style={S.blockChipsRow}>
          {blocks.map((b) => (
            <button
              key={b.id}
              style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
              onClick={() => setSelectedBlockId(b.id)}
            >
              {b.active && <span style={S.activeDot} />}
              {b.name}
            </button>
          ))}
        </div>
      )}

      <div style={S.programList}>
        {days.map((d, i) => (
          <div key={i} style={S.historyRow}>
            <div style={S.caption}>
              {d.label}{d.isToday ? " (aujourd'hui)" : ""} · {fmtDate(d.date.toISOString())}
            </div>
            {d.programsToday.length > 0 ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 4 }}>
                {d.programsToday.map((p) => (
                  <button key={p.id} style={{ ...S.blockChip, textAlign: "left" }} onClick={() => onStart(p)}>
                    {p.name}
                  </button>
                ))}
              </div>
            ) : (
              <div style={{ ...S.caption, marginTop: 4 }}>Aucune séance prévue</div>
            )}
          </div>
        ))}
      </div>

      {unscheduled.length > 0 && (
        <>
          <div style={S.sectionLabel}>Sans jour assigné</div>
          <div style={{ ...S.caption, marginBottom: 8 }}>
            {unscheduled.map((p) => p.name).join(", ")}
          </div>
        </>
      )}
    </div>
  );
}

/* ---------- Create / edit a program (séance) ---------- */

function blankExercise() {
  return { id: uid(), name: "", muscle: "", machine: "", type: "muscu", repMin: "9", repMax: "12", sets: "3", warmupSets: "2", restSeconds: "90", note: "", segments: [], superset: false, unilateral: false, showRpe: true, youtubeUrl: "" };
}
function blankSegment() {
  return { id: uid(), duration: "", speed: "", incline: "" };
}

function ProgramForm({ mode, initialProgram, defaultBlockId, blocks, exerciseLibrary, gyms, onCancel, onCreate, onUpdate, onSaveToLibrary, onDelete, exerciseCollections, onAddCollection, onAddMachine }) {
  const isEdit = mode === "edit";
  const [name, setName] = useState(initialProgram?.name || "");
  const [blockId, setBlockId] = useState(initialProgram?.blockId || defaultBlockId || blocks[0]?.id);
  const [gymId, setGymId] = useState(initialProgram?.gymId || "");
  const [scheduledDays, setScheduledDays] = useState(initialProgram?.scheduledDays || []);
  function toggleScheduledDay(day) {
    setScheduledDays((list) => (list.includes(day) ? list.filter((x) => x !== day) : [...list, day]));
  }
  const linkedGym = gyms?.find((g) => g.id === gymId);
  const gymMachines = linkedGym ? linkedGym.machines.map((m) => m.name) : (gyms || []).flatMap((g) => g.machines).map((m) => m.name);
  const allMachineObjs = useMemo(() => {
    const source = linkedGym ? [linkedGym] : (gyms || []);
    const list = [];
    source.forEach((g) => (g.machines || []).forEach((m) => list.push({ ...m, gymName: g.name })));
    return list.sort((a, b) => a.name.localeCompare(b.name, "fr"));
  }, [gyms, linkedGym]);
  const [showPicker, setShowPicker] = useState(false);
  const [creatingLibraryExercise, setCreatingLibraryExercise] = useState(null); // string | null
  const [exercises, setExercises] = useState(() => {
    if (initialProgram) {
      return initialProgram.exercises.map((e) => ({
        id: e.id,
        name: e.name,
        muscle: e.muscle,
        machine: e.machine || "",
        type: e.type || "muscu",
        repMin: String(e.repMin ?? 9),
        repMax: String(e.repMax ?? 12),
        sets: String(e.sets ?? 3),
        warmupSets: String(e.warmupSets ?? 2),
        restSeconds: String(e.restSeconds ?? 90),
        chainRestSeconds: String(e.chainRestSeconds ?? ""),
        note: e.note || "",
        machineSettings: e.machineSettings || "",
        superset: !!e.superset,
        unilateral: !!e.unilateral,
        showRpe: e.showRpe !== false,
        youtubeUrl: e.youtubeUrl || "",
        segments: (e.segments || []).map((seg) => ({
          id: uid(),
          duration: String(seg.duration ?? ""),
          speed: seg.speed != null && !isNaN(seg.speed) ? String(seg.speed) : "",
          incline: seg.incline != null ? String(seg.incline) : "",
        })),
      }));
    }
    return [];
  });

  const [justAddedId, setJustAddedId] = useState(null);
  const exerciseRefs = useRef({});

  useEffect(() => {
    if (justAddedId && exerciseRefs.current[justAddedId]) {
      exerciseRefs.current[justAddedId].scrollIntoView({ behavior: "smooth", block: "start" });
      setJustAddedId(null);
    }
  }, [justAddedId, exercises]);

  function pickFromLibrary(item) {
    const newId = uid();
    const itemIsCardio = item.type === "cardio";
    setExercises((exs) => [
      ...exs,
      {
        id: newId, name: item.name, muscle: item.muscle || "", machine: item.machine || "", type: itemIsCardio ? "cardio" : "muscu",
        repMin: String(item.repMin ?? 9), repMax: String(item.repMax ?? 12), sets: "3", warmupSets: "2",
        restSeconds: String(item.restSeconds ?? 90), note: item.note || "", segments: [], superset: false,
        youtubeUrl: item.youtubeUrl || "",
      },
    ]);
    setShowPicker(false);
    setJustAddedId(newId);
  }

  const [savedToLibraryId, setSavedToLibraryId] = useState(null);
  const [confirmDeleteProgram, setConfirmDeleteProgram] = useState(false);

  if (showPicker) {
    return (
      <LibraryPicker
        library={exerciseLibrary || []}
        title="Exercices"
        groupKey="muscle"
        createLabel="exercice"
        onPick={pickFromLibrary}
        onCancel={() => setShowPicker(false)}
        onCreateNew={onSaveToLibrary ? (search) => { setShowPicker(false); setCreatingLibraryExercise(search || ""); } : undefined}
        onCreateInline={(search) => {
          setShowPicker(false);
          const newEx = { ...blankExercise(), name: (search || "").trim() };
          setExercises((exs) => [...exs, newEx]);
          setJustAddedId(newEx.id);
        }}
      />
    );
  }

  // Création d'un exercice directement dans la bibliothèque depuis la construction de séance :
  // une fois enregistré, il est aussi ajouté à la séance en cours.
  if (creatingLibraryExercise !== null) {
    return (
      <ExerciseLibraryForm
        mode="create"
        initial={{ name: creatingLibraryExercise }}
        onCancel={() => setCreatingLibraryExercise(null)}
        onCreate={(ex) => {
          onSaveToLibrary(ex);
          pickFromLibrary(ex);
          setCreatingLibraryExercise(null);
        }}
        onUpdate={() => {}}
        onDelete={() => {}}
        gymMachines={gymMachines}
        gyms={gyms}
        collections={exerciseCollections}
        onAddCollection={onAddCollection}
        onAddMachine={onAddMachine}
      />
    );
  }

  function updateExercise(id, field, value) {
    setExercises((exs) => exs.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  }
  function addExercise() {
    const newEx = blankExercise();
    setExercises((exs) => [...exs, newEx]);
    setJustAddedId(newEx.id);
  }
  function removeExercise(id) {
    setExercises((exs) => exs.filter((e) => e.id !== id));
  }
  function moveExercise(id, direction) {
    setExercises((exs) => {
      const idx = exs.findIndex((e) => e.id === id);
      const swapWith = idx + direction;
      if (swapWith < 0 || swapWith >= exs.length) return exs;
      const next = [...exs];
      [next[idx], next[swapWith]] = [next[swapWith], next[idx]];
      return next;
    });
  }
  function saveExerciseToLibrary(ex) {
    if (!ex.name.trim() || !onSaveToLibrary) return;
    onSaveToLibrary({
      name: ex.name.trim(),
      muscle: ex.muscle.trim() || "Cardio",
      ...(ex.type === "cardio" ? { type: "cardio" } : {}),
      ...(ex.machine && ex.machine.trim() ? { machine: ex.machine.trim() } : {}),
      ...(ex.type !== "cardio" ? { repMin: Number(ex.repMin) || 1, repMax: Number(ex.repMax) || 1, restSeconds: Number(ex.restSeconds) || 0 } : {}),
      ...(ex.youtubeUrl && ex.youtubeUrl.trim() ? { youtubeUrl: ex.youtubeUrl.trim() } : {}),
      ...(ex.note && ex.note.trim() ? { note: ex.note.trim() } : {}),
    });
    setSavedToLibraryId(ex.id);
    setTimeout(() => setSavedToLibraryId((cur) => (cur === ex.id ? null : cur)), 2000);
  }
  function addSegment(exId) {
    setExercises((exs) => exs.map((e) => (e.id === exId ? { ...e, segments: [...e.segments, blankSegment()] } : e)));
  }
  function updateSegment(exId, segId, field, value) {
    setExercises((exs) =>
      exs.map((e) =>
        e.id === exId ? { ...e, segments: e.segments.map((s) => (s.id === segId ? { ...s, [field]: value } : s)) } : e
      )
    );
  }
  function removeSegment(exId, segId) {
    setExercises((exs) =>
      exs.map((e) => (e.id === exId ? { ...e, segments: e.segments.filter((s) => s.id !== segId) } : e))
    );
  }

  const canSave = name.trim().length > 0 && exercises.length > 0 && exercises.every((e) => e.name.trim().length > 0);

  function handleSave() {
    const program = {
      id: initialProgram?.id || uid(),
      name: name.trim(),
      blockId,
      ...(gymId ? { gymId } : {}),
      ...(scheduledDays.length ? { scheduledDays } : {}),
      exercises: exercises.map((e, idx) => {
        if (e.type === "cardio") {
          const segments = (e.segments || [])
            .filter((s) => s.duration !== "")
            .map((s) => ({
              duration: toDecimal(s.duration) || 0,
              speed: s.speed !== "" ? toDecimal(s.speed) : null,
              incline: s.incline !== "" ? toDecimal(s.incline) : null,
            }));
          return {
            id: e.id,
            name: e.name.trim(),
            muscle: e.muscle.trim() || "Cardio",
            type: "cardio",
            ...(e.machine && e.machine.trim() ? { machine: e.machine.trim() } : {}),
            ...(segments.length ? { segments } : {}),
            ...(idx > 0 && e.superset ? { superset: true } : {}),
            ...(exercises[idx + 1]?.superset && Number(e.chainRestSeconds) > 0 ? { chainRestSeconds: Number(e.chainRestSeconds) } : {}),
            ...(e.note.trim() ? { note: e.note.trim() } : {}),
            ...(e.youtubeUrl && e.youtubeUrl.trim() ? { youtubeUrl: e.youtubeUrl.trim() } : {}),
          };
        }
        return {
          id: e.id,
          name: e.name.trim(),
          muscle: e.muscle.trim() || "—",
          type: "muscu",
          ...(e.machine && e.machine.trim() ? { machine: e.machine.trim() } : {}),
          repMin: Number(e.repMin) || 1,
          repMax: Math.max(Number(e.repMax) || Number(e.repMin) || 1, Number(e.repMin) || 1),
          sets: Number(e.sets) || 1,
          warmupSets: Number(e.warmupSets) || 0,
          restSeconds: Number(e.restSeconds) || 0,
          ...(idx > 0 && e.superset ? { superset: true } : {}),
          ...(exercises[idx + 1]?.superset && Number(e.chainRestSeconds) > 0 ? { chainRestSeconds: Number(e.chainRestSeconds) } : {}),
          ...(e.unilateral ? { unilateral: true } : {}),
          ...(e.showRpe === false ? { showRpe: false } : {}),
          ...(e.machineSettings && e.machineSettings.trim() ? { machineSettings: e.machineSettings.trim() } : {}),
          ...(e.note.trim() ? { note: e.note.trim() } : {}),
          ...(e.youtubeUrl && e.youtubeUrl.trim() ? { youtubeUrl: e.youtubeUrl.trim() } : {}),
        };
      }),
    };
    if (isEdit) onUpdate(program);
    else onCreate(program);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier la séance" : "Nouvelle séance"}</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        {isEdit ? "Ajuste le nom, les exercices ou le programme associé." : "Donne-lui un nom et ajoute tes exercices."}
      </div>

      <div style={S.profileTopBar}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.profileTopLabel}>Durée estimée</div>
          <div style={S.profileTopValue}>
            ~{fmtDurationLong(roundSecondsToQuarterHour(estimateSessionSeconds({ exercises }))) || "0 min"} (échauffement et changement de machine inclus)
          </div>
        </div>
      </div>

      <div style={S.goalInputLabel}>Nom de la séance</div>
      <input
        style={S.textInput}
        placeholder="ex : Push, Full body..."
        value={name}

/* ---------- History (list) ---------- */

function HistoryView({ programs, blocks, sessions, exerciseIndex, onOpenExercise, onOpenSession, onResetHistory, onDeleteSession, onBack }) {
  const [confirmDeleteSessionId, setConfirmDeleteSessionId] = useState(null);
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const [confirmReset, setConfirmReset] = useState(false);
  const [search, setSearch] = useState("");

  const programById = useMemo(() => {
    const idx = {};
    programs.forEach((p) => (idx[p.id] = p));
    return idx;
  }, [programs]);

  const sessionsByBlock = (blockId) => sessions.filter((s) => programById[s.programId]?.blockId === blockId);

  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockSessions = [...sessionsByBlock(selectedBlock?.id)].sort((a, b) => (a.date < b.date ? 1 : -1));

  const query = search.trim().toLowerCase();
  const searchResults = query
    ? [...sessions]
        .filter((s) =>
          Object.keys(s.entries).some((exId) => (exerciseIndex[exId]?.name || "").toLowerCase().includes(query))
        )
        .sort((a, b) => (a.date < b.date ? 1 : -1))
    : null;

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Programmes
      </button>
      <div style={S.pageTitle}>Historique</div>

      <div style={{ position: "relative", marginBottom: 8 }}>
        <Search size={15} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#8A5F58" }} />
        <input
          style={{ ...S.textInput, paddingLeft: 34, marginBottom: 0 }}
          placeholder="Rechercher un exercice (tous programmes)"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      {searchResults ? (
        <>
          <div style={{ ...S.caption, marginBottom: 12 }}>
            {searchResults.length} séance{searchResults.length > 1 ? "s" : ""} contenant « {search.trim()} »
          </div>
          <div style={S.programList}>
            {searchResults.map((s) => {
              const nbExercises = Object.keys(s.entries).length;
              return (
                <button key={s.id} style={S.sessionLogRow} onClick={() => onOpenSession(s)}>
                  <div>
                    <div style={S.exRowName}>{s.programName || "Séance"}</div>
                    <div style={S.caption}>{s.blockName ? `${s.blockName} · ` : ""}{nbExercises} exercices</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={S.caption}>{fmtDate(s.date)}</div>
                  </div>
                </button>
              );
            })}
            {searchResults.length === 0 && <div style={S.caption}>Aucune séance ne contient cet exercice.</div>}
          </div>
        </>
      ) : (
        <>
          <div style={{ ...S.caption, marginBottom: 12 }}>Choisis un programme pour voir ses séances.</div>

          <div style={S.blockChipsRow}>
            {blocks.map((b) => (
              <button
                key={b.id}
                style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
                onClick={() => setSelectedBlockId(b.id)}
              >
                {b.active && <span style={S.activeDot} />}
                {b.name}
              </button>
            ))}
            {blocks.length === 0 && <div style={S.caption}>Aucun programme pour l'instant.</div>}
          </div>

          <div style={{ ...S.caption, marginBottom: 12 }}>
            {blockSessions.length} séance{blockSessions.length > 1 ? "s" : ""} enregistrée{blockSessions.length > 1 ? "s" : ""}
          </div>

          <div style={S.programList}>
            {blockSessions.map((s) => {
              const nbExercises = Object.keys(s.entries).length;
              const tonnage = Object.values(s.entries).flat().reduce((a, set) => a + set.reps * set.poids, 0);
              return (
                <div key={s.id} style={{ ...S.sessionLogRow, cursor: "default" }}>
                  <div onClick={() => onOpenSession(s)} style={{ flex: 1, cursor: "pointer" }}>
                    <div style={S.exRowName}>{s.programName || "Séance"}</div>
                    <div style={S.caption}>
                      {nbExercises} exercices · {Math.round(tonnage).toLocaleString("fr-FR")} kg
                      {s.durationSeconds ? ` · ${fmtDurationLong(s.durationSeconds)}` : ""}
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={S.caption}>{fmtDate(s.date)}</div>
                    <div style={S.caption}>{fmtTime(s.date)}</div>
                  </div>
                  {onDeleteSession && (
                    confirmDeleteSessionId === s.id ? (
                      <div style={{ display: "flex", gap: 6, flexShrink: 0, marginLeft: 8 }}>
                        <button style={S.confirmDeleteBtn} onClick={() => { onDeleteSession(s.id); setConfirmDeleteSessionId(null); }}>Oui</button>
                        <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteSessionId(null)}>Non</button>
                      </div>
                    ) : (
                      <button style={{ ...S.setRemoveBtn, marginLeft: 8 }} onClick={() => setConfirmDeleteSessionId(s.id)}>
                        <Trash2 size={13} />
                      </button>
                    )
                  )}
                </div>
              );
            })}
            {blockSessions.length === 0 && <div style={S.caption}>Aucune séance enregistrée dans ce programme.</div>}
          </div>
        </>
      )}

      {sessions.length > 0 && (
        <div style={{ marginTop: 12 }}>
          {confirmReset ? (
            <div style={S.confirmDeleteRow}>
              <span style={S.caption}>Effacer les {sessions.length} séances enregistrées (tous programmes) ? Irréversible.</span>
              <button style={S.confirmDeleteBtn} onClick={() => { onResetHistory(); setConfirmReset(false); }}>
                Oui, tout effacer
              </button>
              <button style={S.cancelDeleteBtn} onClick={() => setConfirmReset(false)}>
                Annuler
              </button>
            </div>
          ) : (
            <button style={S.deleteProgramBtn} onClick={() => setConfirmReset(true)}>
              <Trash2 size={13} /> Effacer tout l'historique
            </button>
          )}
        </div>
      )}
    </div>
  );
}
