// --- Stockage (remplace window.storage de Claude) : localStorage du navigateur, 100% local et gratuit ---
window.storage = {
  async get(key) {
    const v = localStorage.getItem("charge:" + key);
    return v !== null ? { key, value: v, shared: false } : null;
  },
  async set(key, value) {
    localStorage.setItem("charge:" + key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem("charge:" + key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage)
      .filter((k) => k.startsWith("charge:") && (!prefix || k.slice(7).startsWith(prefix)))
      .map((k) => k.slice(7));
    return { keys, prefix, shared: false };
  },
};

// --- Petit graphique en ligne (remplace recharts, pas de dépendance) ---
function MiniLineChart({ data, dataKey, height = 180 }) {
  if (!data || data.length === 0) return null;
  const values = data.map((d) => Number(d[dataKey]) || 0);
  const max = Math.max(...values);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const w = 320;
  const pad = 14;
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const points = values.map((v, i) => {
    const x = pad + i * stepX;
    const y = height - pad - ((v - min) / range) * (height - pad * 2);
    return [x, y];
  });
  const polyline = points.map((p) => p.join(",")).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none">
        {[0.25, 0.5, 0.75].map((f, i) => (
          <line key={i} x1={pad} x2={w - pad} y1={pad + f * (height - pad * 2)} y2={pad + f * (height - pad * 2)} stroke="#332E28" strokeDasharray="3 3" />
        ))}
        <polyline points={polyline} fill="none" stroke="#FFC233" strokeWidth="2.5" />
        {points.map(([x, y], i) => (
          <circle key={i} cx={x} cy={y} r="3.5" fill="#FFC233" />
        ))}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#FFFFFF", marginTop: 4 }}>
        <span>{data[0]?.date}</span>
        {data.length > 1 && <span>{data[data.length - 1]?.date}</span>}
      </div>
    </div>
  );
}

function buildSeedSessions() {

const uid = () => Math.random().toString(36).slice(2, 10);
const fmtDate = (iso) => new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
function fmtDuration(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function fmtDurationLong(totalSeconds) {
  if (!totalSeconds) return null;
  const m = Math.round(totalSeconds / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  const rest = m % 60;
  return rest ? `${h} h ${rest} min` : `${h} h`;
}
function fmtRestTime(seconds) {
  if (!seconds) return null;
  if (seconds < 60) return `${seconds} sec`;
  const m = Math.floor(seconds / 60);
  const rest = seconds % 60;
  return rest ? `${m} min ${rest} sec` : `${m} min`;
}

// Normalise une entrée cardio en liste de segments, pour compatibilité avec
// l'ancien format (durationSeconds/speed/incline à plat, un seul segment).
function cardioSegments(entry) {
  if (!entry) return [];
  if (entry.segments) return entry.segments;
  if (entry.durationSeconds !== undefined) {
    return [{ durationSeconds: entry.durationSeconds, speed: entry.speed, incline: entry.incline }];
  }
  return [];
}

async function loadState() {
  let programs, sessions, goals, blocks, bodyweight, coachAthletes;
  try {
    const p = await window.storage.get("programs");
    programs = p ? JSON.parse(p.value) : null;
  } catch { programs = null; }
  try {
    const s = await window.storage.get("sessions");
    sessions = s ? JSON.parse(s.value) : null;
  } catch { sessions = null; }
  try {
    const g = await window.storage.get("goals");
    goals = g ? JSON.parse(g.value) : null;
  } catch { goals = null; }
  try {
    const b = await window.storage.get("blocks");
    blocks = b ? JSON.parse(b.value) : null;
  } catch { blocks = null; }
  try {
    const bw = await window.storage.get("bodyweight");
    bodyweight = bw ? JSON.parse(bw.value) : null;
  } catch { bodyweight = null; }
  try {
    const ca = await window.storage.get("coachAthletes");
    coachAthletes = ca ? JSON.parse(ca.value) : null;
  } catch { coachAthletes = null; }
  let coachPhone = "";
  try {
    const cp = await window.storage.get("coachPhone");
    coachPhone = cp ? cp.value : "";
  } catch { coachPhone = ""; }
  if (!blocks) blocks = BLOCKS_SEED;
  if (!programs) programs = PROGRAMS_SEED;
  if (!sessions) sessions = buildSeedSessions();
  if (!goals) goals = {};
  if (!bodyweight) bodyweight = [];
  if (!coachAthletes) coachAthletes = [];

  // Migration: make sure every program points to a valid block
  const validBlockIds = new Set(blocks.map((b) => b.id));
  const fallbackBlockId = blocks.find((b) => b.active)?.id || blocks[0]?.id;
  programs = programs.map((p) =>
    p.blockId && validBlockIds.has(p.blockId) ? p : { ...p, blockId: fallbackBlockId }
  );

  return { programs, sessions, goals, blocks, bodyweight, coachAthletes, coachPhone };
}

/* ---------- Sauvegarde / restauration complète ---------- */

function buildFullBackup({ programs, sessions, goals, blocks, bodyweight }) {
  return JSON.stringify(
    { app: "charge", version: 1, exportedAt: new Date().toISOString(), programs, sessions, goals, blocks, bodyweight },
    null,
    2
  );
}

function downloadJSON(filename, jsonContent) {
  try {
    const blob = new Blob([jsonContent], { type: "application/json;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

/* ---------- Échanges coach ↔ suivi (via texte WhatsApp, sans serveur) ---------- */

function packPayload(type, data) {
  return `##HAKIFIT-${type}##\n${JSON.stringify(data)}\n##END##`;
}

function unpackPayload(text) {
  const match = text.match(/##HAKIFIT-(\w+)##\s*([\s\S]*?)\s*##END##/);
  if (match) {
    try { return { type: match[1], data: JSON.parse(match[2]) }; } catch { return null; }
  }
  return null;
}

function buildWhatsAppLink(phone, text) {
  const encoded = encodeURIComponent(text);
  let digits = (phone || "").replace(/[^0-9]/g, "");
  // Un numéro français local (ex: 06XXXXXXXX, 10 chiffres) n'est pas valide pour WhatsApp,
  // qui exige le format international sans le 0 initial (ex: 336XXXXXXXX).
  if (digits.length === 10 && digits.startsWith("0")) {
    digits = "33" + digits.slice(1);
  }
  return digits ? `https://wa.me/${digits}?text=${encoded}` : `https://api.whatsapp.com/send?text=${encoded}`;
}

function programSummaryText(blockName, programs) {
  let out = `📋 Programme : ${blockName}\n`;
  programs.forEach((p, i) => {
    out += `\n${i + 1}. ${p.name}\n`;
    p.exercises.forEach((ex) => {
      if (ex.type === "cardio") {
        out += `   • ${ex.name} (cardio)\n`;
      } else {
        out += `   • ${ex.name} — ${ex.sets}×${ex.repMin}-${ex.repMax} reps${ex.restSeconds ? `, repos ${fmtRestTime(ex.restSeconds)}` : ""}\n`;
      }
    });
  });
  return out;
}

function sessionSummaryText(session, exerciseIndex) {
  let out = `📊 Séance : ${session.programName || "Séance"}\n`;
  out += `${new Date(session.date).toLocaleDateString("fr-FR")} à ${fmtTime(session.date)}`;
  if (session.durationSeconds) out += ` · ${fmtDurationLong(session.durationSeconds)}`;
  out += `\n`;
  Object.entries(session.entries).forEach(([exId, entry]) => {
    const name = exerciseIndex[exId]?.name || exId;
    out += `\n${name} :\n`;
    if (Array.isArray(entry)) {
      entry.forEach((s, i) => (out += `  Série ${i + 1} : ${s.reps} reps × ${s.poids} kg\n`));
    } else {
      cardioSegments(entry).forEach((seg) => {
        out += `  ${Math.round((seg.durationSeconds || 0) / 60)} min`;
        out += seg.speed ? ` · ${seg.speed} km/h` : "";
        out += seg.incline ? ` · pente ${seg.incline}%` : "";
        out += `\n`;
      });
    }
  });
  if (session.comment) out += `\nRessenti : ${session.comment}\n`;
  return out;
}

function goalsSummaryText(athleteName, goals, exerciseIndex) {
  let out = `🎯 Objectifs pour ${athleteName}\n`;
  Object.entries(goals).forEach(([exId, text]) => {
    if (!text) return;
    out += `\n${exerciseIndex[exId]?.name || exId} : ${text}`;
  });
  return out;
}

/* ---------- Root ---------- */

function App() {
  const [loading, setLoading] = useState(true);
  const [programs, setPrograms] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [goals, setGoals] = useState({});
  const [blocks, setBlocks] = useState([]);
  const [bodyweight, setBodyweight] = useState([]);
  const [coachAthletes, setCoachAthletes] = useState([]);
  const [coachPhone, setCoachPhone] = useState("");
  const [tab, setTab] = useState("home");
  const [activeProgram, setActiveProgram] = useState(null); // program object during logging
  const [pendingCoachedProgram, setPendingCoachedProgram] = useState(null); // program awaiting goal check before starting
  const [historyExercise, setHistoryExercise] = useState(null);
  const [historySession, setHistorySession] = useState(null); // session object being viewed in detail
  const [programForm, setProgramForm] = useState(null); // { mode: 'create'|'edit', blockId, program }
  const [showBodyweight, setShowBodyweight] = useState(false);
  const [activeAthleteId, setActiveAthleteId] = useState(null);

  useEffect(() => {
    loadState().then(({ programs, sessions, goals, blocks, bodyweight, coachAthletes, coachPhone }) => {
      setPrograms(programs);
      setSessions(sessions);
      setGoals(goals);
      setBlocks(blocks);
      setBodyweight(bodyweight);
      setCoachAthletes(coachAthletes);
      setCoachPhone(coachPhone);
      setLoading(false);
    });
  }, []);

  const exerciseIndex = useMemo(() => {
    const idx = {};
    programs.forEach((p) => p.exercises.forEach((e) => (idx[e.id] = { ...e, programName: p.name })));
    return idx;
  }, [programs]);

  function finishSession(session) {
    const next = [...sessions, session];
    setSessions(next);
    saveSessions(next);
    setActiveProgram(null);
    setTab("home");
  }

  function startProgram(p) {
    const block = blocks.find((b) => b.id === p.blockId);
    if (p.coached || block?.coached) {
      setPendingCoachedProgram(p);
    } else {
      setActiveProgram(p);
    }
  }

  function resetHistory() {
    setSessions([]);
    saveSessions([]);
  }

  function addBodyweight(entry) {
    setBodyweight((bw) => {
      const next = [...bw.filter((e) => e.date !== entry.date), entry].sort((a, b) => (a.date < b.date ? -1 : 1));
      saveBodyweight(next);
      return next;
    });
  }

  function deleteBodyweight(date) {
    setBodyweight((bw) => {
      const next = bw.filter((e) => e.date !== date);
      saveBodyweight(next);
      return next;
    });
  }

  function exportBackup() {
    const json = buildFullBackup({ programs, sessions, goals, blocks, bodyweight });
    return downloadJSON(`haki-fit-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`, json);
  }

  function importBackup(data) {
    if (data.programs) { setPrograms(data.programs); savePrograms(data.programs); }
    if (data.sessions) { setSessions(data.sessions); saveSessions(data.sessions); }
    if (data.goals) { setGoals(data.goals); saveGoals(data.goals); }
    if (data.blocks) { setBlocks(data.blocks); saveBlocks(data.blocks); }
    if (data.bodyweight) { setBodyweight(data.bodyweight); saveBodyweight(data.bodyweight); }
  }

  function saveGoal(exId, text) {
    setGoals((g) => {
      const next = { ...g, [exId]: text };
      if (!text) delete next[exId];
      saveGoals(next);
      return next;
    });
  }

  function addProgram(program) {
    setPrograms((p) => {
      const next = [...p, program];
      savePrograms(next);
      return next;
    });
    setProgramForm(null);
  }

  function updateProgram(updated) {
    setPrograms((p) => {
      const next = p.map((x) => (x.id === updated.id ? { ...x, ...updated } : x));
      savePrograms(next);
      return next;
    });
    setProgramForm(null);
  }

  // Suppression "douce" : la séance disparaît des listes actives mais reste
  // consultable dans l'historique (les séances passées gardent leur sens).
  function deleteProgram(id) {
    setPrograms((p) => {
      const next = p.map((x) => (x.id === id ? { ...x, deleted: true } : x));
      savePrograms(next);
      return next;
    });
  }

  function duplicateProgram(id) {
    setPrograms((p) => {
      const original = p.find((x) => x.id === id);
      if (!original) return p;
      const copy = {
        ...original,
        id: uid(),
        name: `${original.name} (copie)`,
        exercises: original.exercises.map((ex) => ({ ...ex, id: uid() })),
        deleted: false,
      };
      const next = [...p, copy];
      savePrograms(next);
      return next;
    });
  }

  function addBlock(name) {
    const block = { id: uid(), name: name.trim(), active: false };
    setBlocks((bs) => {
      const next = [...bs, block];
      saveBlocks(next);
      return next;
    });
    return block.id;
  }

  function setActiveBlock(id) {
    setBlocks((bs) => {
      const next = bs.map((b) => ({ ...b, active: b.id === id }));
      saveBlocks(next);
      return next;
    });
  }

  // ---- Réception d'un envoi du coach (côté suivi) ----
  function importCoachProgram(data, coachName) {
    const block = { id: uid(), name: data.block?.name || "Programme du coach", active: false, coached: true, coachName: coachName || "" };
    const importedPrograms = (data.programs || []).map((p) => ({ ...p, blockId: block.id, deleted: false }));
    setBlocks((bs) => {
      const next = [...bs, block];
      saveBlocks(next);
      return next;
    });
    setPrograms((p) => {
      const next = [...p, ...importedPrograms];
      savePrograms(next);
      return next;
    });
    return block.id;
  }

  function importCoachGoals(data) {
    setGoals((g) => {
      const next = { ...g, ...(data.goals || {}) };
      saveGoals(next);
      return next;
    });
  }

  // ---- Gestion des suivis (côté coach) ----
  function updateCoachPhone(phone) {
    setCoachPhone(phone);
    saveCoachPhone(phone);
  }

  function addAthlete(name) {
    const athlete = { id: uid(), name: name.trim(), programs: [], sessions: [], goals: {}, knownExercises: {} };
    setCoachAthletes((as) => {
      const next = [...as, athlete];
      saveCoachAthletes(next);
      return next;
    });
    return athlete.id;
  }

  function deleteAthlete(id) {
    setCoachAthletes((as) => {
      const next = as.filter((a) => a.id !== id);
      saveCoachAthletes(next);
      return next;

    setCoachAthletes((as) => {

            onCancel={() => setPendingCoachedProgram(null)}
          />
        ) : activeProgram ? (
          <LogSession
            program={activeProgram}
            blocks={blocks}
            sessions={sessions}
            goals={goals}
            onSaveGoal={saveGoal}
            onCancel={() => setActiveProgram(null)}
            onFinish={finishSession}
          />
        ) : programForm ? (
          <ProgramForm
            mode={programForm.mode}
            initialProgram={programForm.program}
            defaultBlockId={programForm.blockId}
            blocks={blocks}
            onCancel={() => setProgramForm(null)}
            onCreate={addProgram}
            onUpdate={updateProgram}
          />
        ) : historyExercise ? (
          <ExerciseHistory
            exercise={historyExercise}
            sessions={sessions}
            onBack={() => setHistoryExercise(null)}
          />
        ) : historySession ? (
          <SessionDetailView
            session={historySession}
            exerciseIndex={exerciseIndex}
            onBack={() => setHistorySession(null)}
            onOpenExercise={(ex) => setHistoryExercise(ex)}
            coachPhone={coachPhone}
            onSaveCoachPhone={updateCoachPhone}
          />
        ) : showBodyweight ? (
          <BodyweightView
            bodyweight={bodyweight}
            onAdd={addBodyweight}
            onDelete={deleteBodyweight}
            onBack={() => setShowBodyweight(false)}
          />
        ) : (
          <>
            {tab === "home" && (
              <HomeView
                programs={visiblePrograms}
                allPrograms={programs}
                activeBlock={activeBlock}
                sessions={sessions}
                bodyweight={bodyweight}
                onStart={startProgram}
                onManage={() => setTab("programs")}
                onOpenBodyweight={() => setShowBodyweight(true)}
              />
            )}
            {tab === "programs" && (
              <ProgramsView
                programs={programs}
                blocks={blocks}
                onStart={startProgram}
                onCreateProgram={(blockId) => setProgramForm({ mode: "create", blockId })}
                onEditProgram={(program) => setProgramForm({ mode: "edit", program })}
                onDeleteProgram={deleteProgram}
                onDuplicateProgram={duplicateProgram}
                onCreateBlock={addBlock}
                onSetActiveBlock={setActiveBlock}
                onImportCoachProgram={importCoachProgram}
                onImportCoachGoals={importCoachGoals}
              />
            )}
            {tab === "history" && (
              <HistoryView
                programs={programs}
                blocks={blocks}
                sessions={sessions}
                exerciseIndex={exerciseIndex}
                onOpenExercise={(ex) => setHistoryExercise(ex)}
                onOpenSession={(s) => setHistorySession(s)}
                onResetHistory={resetHistory}
                onExportBackup={exportBackup}
                onImportBackup={importBackup}
              />
            )}
            {tab === "coach" && (
              activeAthleteId ? (
                <AthleteDetailView
                  athlete={coachAthletes.find((a) => a.id === activeAthleteId)}
                  onBack={() => setActiveAthleteId(null)}

                  onDeleteAthlete={deleteAthlete}
                />
              ) : (
                <CoachView
                  athletes={coachAthletes}
                  onOpenAthlete={(id) => setActiveAthleteId(id)}
                  onAddAthlete={addAthlete}

              )

          </>
        )}
      </div>
      {!activeProgram && !pendingCoachedProgram && !historyExercise && !historySession && !programForm && !showBodyweight && (
        <BottomNav tab={tab} setTab={setTab} />
      )}
    </div>
  );
}

function computeStreak(sessions) {
  if (!sessions.length) return 0;
  const weekKey = (d) => {
    const date = new Date(d);
    const day = (date.getDay() + 6) % 7; // 0 = lundi
    const monday = new Date(date);
    monday.setDate(date.getDate() - day);
    monday.setHours(0, 0, 0, 0);
    return monday.toISOString().slice(0, 10);
  };
  const weeksWithSessions = new Set(sessions.map((s) => weekKey(s.date)));
  let cursor = new Date();
  if (!weeksWithSessions.has(weekKey(cursor))) {
    cursor.setDate(cursor.getDate() - 7); // grace : la semaine en cours n'est pas encore "cassée"
  }
  let streak = 0;
  while (weeksWithSessions.has(weekKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 7);
  }
  return streak;
}

function computeMuscleBalance(sessions, exerciseIndex) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const counts = {};
  sessions
    .filter((s) => new Date(s.date) >= cutoff)
    .forEach((s) => {
      Object.keys(s.entries).forEach((exId) => {
        const def = exerciseIndex[exId];
        if (!def || def.type === "cardio") return;
        const muscle = def.muscle || "Autre";
        counts[muscle] = (counts[muscle] || 0) + 1;
      });
    });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = entries.length ? entries[0][1] : 1;
  return { entries, max };
}

function HomeView({ programs, allPrograms, activeBlock, sessions, bodyweight, onStart, onManage, onOpenBodyweight }) {
  const sorted = [...sessions].sort((a, b) => (a.date < b.date ? 1 : -1));
  const last = sorted[0];
  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 7);
  const thisWeek = sessions.filter((s) => new Date(s.date) >= weekAgo);
  const streak = computeStreak(sessions);

  const exerciseIndex = useMemo(() => {
    const idx = {};
    allPrograms.forEach((p) => p.exercises.forEach((e) => (idx[e.id] = e)));
    return idx;
  }, [allPrograms]);
  const { entries: muscleEntries, max: muscleMax } = useMemo(
    () => computeMuscleBalance(sessions, exerciseIndex),
    [sessions, exerciseIndex]
  );

  const lastWeight = [...bodyweight].sort((a, b) => (a.date < b.date ? 1 : -1))[0];

  const idxInVisible = programs.findIndex((p) => p.id === last?.programId);
  const nextProgram = idxInVisible >= 0 ? programs[(idxInVisible + 1) % programs.length] : programs[0];

  return (
    <div style={S.page}>
      <div style={S.brand}>
        {activeBlock ? (
          <>
            <div style={S.caption}>Programme actuel :</div>
            <div style={S.pageTitle}>{activeBlock.name}</div>
          </>
        ) : (
          <div style={S.pageTitle}>ton carnet de musculation</div>
        )}
      </div>

      <div style={S.statRow}>
        <div style={S.statCard}>
          <div style={S.statValue}>{thisWeek.length}</div>
          <div style={S.statLabel}>séances / 7j</div>
        </div>
        <div style={S.statCard}>
          <div style={S.statValue}>🔥 {streak}</div>
          <div style={S.statLabel}>semaine{streak > 1 ? "s" : ""} d'affilée</div>
        </div>
      </div>

      {programs.length > 0 ? (
        <>
          <div style={S.sectionLabel}>Prochaine séance suggérée</div>
          <button style={S.heroCard} onClick={() => onStart(nextProgram)}>
            <div>
              <div style={S.heroTitle}>{nextProgram.name}</div>
              <div style={S.caption}>{nextProgram.exercises.length} exercices</div>
            </div>
            <div style={S.heroGo}>
              <Dumbbell size={22} strokeWidth={2.2} />
            </div>
          </button>

          <div style={S.sectionLabel}>Toutes les séances de ce programme</div>
          <div style={S.programList}>
            {programs.map((p) => (
              <button key={p.id} style={S.programRowGlow} onClick={() => onStart(p)}>
                <span style={S.programRowName}>{p.name}</span>
                <span style={S.caption}>{p.exercises.length} ex.</span>
              </button>
            ))}
          </div>
        </>
      ) : (
        <div style={S.emptyStateCard}>
          <div style={{ marginBottom: 8 }}>Aucune séance active pour le moment.</div>
          <button style={S.startProgramBtn} onClick={onManage}>
            Gérer mes programmes
          </button>
        </div>
      )}

      {last && (
        <>
          <div style={S.sectionLabel}>Dernière séance</div>
          <div style={S.lastSessionCard}>
            <div style={S.lastSessionTop}>
              <span style={{ fontWeight: 700 }}>{last.programName || "Séance"}</span>
              <span style={S.caption}>{fmtDate(last.date)} · {fmtTime(last.date)}</span>
            </div>
            {last.durationSeconds && (
              <div style={{ ...S.caption, marginTop: 4 }}>Durée : {fmtDurationLong(last.durationSeconds)}</div>
            )}
          </div>
        </>
      )}

      <div style={S.sectionLabel}>Poids de corps</div>
      <button style={S.bodyweightCard} onClick={onOpenBodyweight}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 18 }}>
            {lastWeight ? `${lastWeight.weight} kg` : "Pas encore de mesure"}
          </div>
          <div style={S.caption}>{lastWeight ? `Le ${fmtDate(lastWeight.date)}` : "Ajoute ta première pesée"}</div>
        </div>
        <span style={S.caption}>Voir →</span>
      </button>

      {muscleEntries.length > 0 && (
        <>
          <div style={S.sectionLabel}>Équilibre musculaire (30 derniers jours)</div>
          <div style={S.muscleBalanceCard}>
            {muscleEntries.map(([muscle, count]) => (

                </div>

          </div>
        </>
      )}
    </div>
  );

function ProgramsView({ programs, blocks, onStart, onCreateProgram, onEditProgram, onDeleteProgram, onDuplicateProgram, onCreateBlock, onSetActiveBlock, onImportCoachProgram, onImportCoachGoals }) {
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const [open, setOpen] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showNewBlock, setShowNewBlock] = useState(false);
  const [newBlockName, setNewBlockName] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState(null);

  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockPrograms = programs.filter((p) => !p.deleted && p.blockId === selectedBlock?.id);

  function handleCreateBlock() {
    if (!newBlockName.trim()) return;
    const id = onCreateBlock(newBlockName.trim());
    setSelectedBlockId(id);
    setNewBlockName("");
    setShowNewBlock(false);
  }

  function processImportText(text) {
    const parsed = unpackPayload(text);
    if (!parsed) {
      setImportStatus("error");
      setTimeout(() => setImportStatus(null), 3000);
      return;
    }
    if (parsed.type === "PROGRAM") {
      const newBlockId = onImportCoachProgram(parsed.data, parsed.data.coachName);
      setSelectedBlockId(newBlockId);
      setImportStatus("program");
    } else if (parsed.type === "GOALS") {
      onImportCoachGoals(parsed.data);
      setImportStatus("goals");
    } else {
      setImportStatus("error");
    }
    setImportText("");
    setTimeout(() => setImportStatus(null), 3000);
  }

  function handleImport() {
    processImportText(importText);
  }

  async function handlePasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStatus("error");
        setTimeout(() => setImportStatus(null), 3000);
        return;
      }
      processImportText(text);
    } catch (e) {
      setImportStatus("clipboard-error");
      setTimeout(() => setImportStatus(null), 3000);
    }
  }

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Programmes d'entraînement</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>
        Un programme regroupe plusieurs séances. Un seul programme est suivi à la fois — les autres restent en pause, avec leur historique intact.
      </div>

      <div style={S.blockChipsRow}>
        {blocks.map((b) => (
          <button
            key={b.id}
            style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
            onClick={() => setSelectedBlockId(b.id)}
          >
            {b.active && <span style={S.activeDot} />}
            {b.coached ? "🎓 " : ""}
            {b.name}
          </button>
        ))}
        <button style={S.blockChipAdd} onClick={() => setShowNewBlock((v) => !v)}>
          <Plus size={14} />
        </button>
        <button style={S.blockChipAdd} onClick={() => setShowImport((v) => !v)}>
          📥
        </button>
      </div>

      {showImport && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>
            Reçu de ton coach sur WhatsApp (programme ou objectifs) :
          </div>
          <button style={S.createBtn} onClick={handlePasteClipboard}>
            📋 Coller et importer
          </button>
          {importStatus === "program" && <div style={S.exportStatus}>Programme importé ✓</div>}
          {importStatus === "goals" && <div style={S.exportStatus}>Objectifs mis à jour ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
          {importStatus === "clipboard-error" && (
            <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
          )}
          <textarea
            style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
            rows={3}
            placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
          />
          {importText && (
            <button style={S.exportBtnGhost} onClick={handleImport}>
              Importer ce texte
            </button>
          )}
        </div>
      )}

      {showNewBlock && (
        <div style={S.newBlockRow}>
          <input
            style={S.textInput}
            placeholder="Nom du programme (ex : Bloc force été 2026)"
            value={newBlockName}
            onChange={(e) => setNewBlockName(e.target.value)}
          />
          <button style={S.goalSaveBtn} onClick={handleCreateBlock}>
            <Check size={16} />
          </button>
        </div>
      )}

      {selectedBlock && selectedBlock.id !== activeBlock?.id && (
        <div style={S.notActiveBanner}>
          <span>Ce programme n'est pas suivi actuellement.</span>
          <button style={S.activateBtn} onClick={() => onSetActiveBlock(selectedBlock.id)}>
            Suivre ce programme
          </button>
        </div>
      )}

      <div style={{ height: 8 }} />

      {blockPrograms.length === 0 && (
        <div style={{ ...S.caption, margin: "12px 0" }}>Pas encore de séance dans ce programme.</div>
      )}

      {blockPrograms.map((p) => (
        <div key={p.id} style={S.programBlock}>
          <button style={S.programBlockHeader} onClick={() => setOpen(open === p.id ? null : p.id)}>
            <span style={S.programBlockTitle}>{p.coached ? "🎓 " : ""}{p.name}</span>
            <span style={S.caption}>{open === p.id ? "−" : "+"}</span>
          </button>
          {open === p.id && (
            <div style={S.programBlockBody}>
              {p.exercises.map((ex) => (
                <div key={ex.id} style={S.exRow}>
                  <div>
                    <div style={S.exRowName}>{ex.superset ? "🔗 " : ""}{ex.name}</div>
                    <div style={S.caption}>{ex.muscle}</div>
                    {ex.type === "cardio" ? (
                      <div style={S.caption}>Cardio</div>
                    ) : (
                      <>
                        <div style={S.caption}>Fourchette : {ex.repMin}-{ex.repMax} reps · {ex.sets} séries</div>
                        {ex.restSeconds ? <div style={S.caption}>Repos : {fmtRestTime(ex.restSeconds)}</div> : null}
                      </>
                    )}
                    {ex.superset && <div style={S.caption}>Enchaîné avec l'exercice précédent (superset)</div>}
                    {ex.note && <div style={S.exNote}>{ex.note}</div>}
                  </div>
                </div>
              ))}
              <button style={S.startProgramBtn} onClick={() => onStart(p)}>
                Démarrer cette séance
              </button>
              <button style={S.editProgramBtn} onClick={() => onEditProgram(p)}>
                Modifier cette séance
              </button>
              <button style={S.editProgramBtn} onClick={() => onDuplicateProgram(p.id)}>
                Dupliquer cette séance
              </button>
              {confirmDelete === p.id ? (
                <div style={S.confirmDeleteRow}>
                  <span style={S.caption}>Supprimer « {p.name} » ?</span>
                  <button style={S.confirmDeleteBtn} onClick={() => { onDeleteProgram(p.id); setConfirmDelete(null); }}>
                    Oui, supprimer
                  </button>
                  <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(null)}>
                    Annuler
                  </button>
                </div>
              ) : (
                <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(p.id)}>
                  <Trash2 size={13} /> Supprimer cette séance
                </button>
              )}
            </div>
          )}
        </div>
      ))}

      <button style={S.createBtn} onClick={() => onCreateProgram(selectedBlock?.id)}>
        <Plus size={16} /> Créer une séance dans ce programme
      </button>
    </div>
  );
}

/* ---------- Create / edit a program (séance) ---------- */

function blankExercise() {
  return { id: uid(), name: "", muscle: "", type: "muscu", repMin: "9", repMax: "12", sets: "3", restSeconds: "90", note: "", segments: [], superset: false };
}
function blankSegment() {
  return { id: uid(), duration: "", speed: "", incline: "" };
}

function ProgramForm({ mode, initialProgram, defaultBlockId, blocks, onCancel, onCreate, onUpdate }) {
  const isEdit = mode === "edit";
  const [name, setName] = useState(initialProgram?.name || "");
  const [blockId, setBlockId] = useState(initialProgram?.blockId || defaultBlockId || blocks[0]?.id);
  const [coached, setCoached] = useState(!!initialProgram?.coached);
  const [coachName, setCoachName] = useState(initialProgram?.coachName || "");
  const [exercises, setExercises] = useState(() => {
    if (initialProgram) {
      return initialProgram.exercises.map((e) => ({
        id: e.id,
        name: e.name,
        muscle: e.muscle,
        type: e.type || "muscu",
        repMin: String(e.repMin ?? 9),
        repMax: String(e.repMax ?? 12),
        sets: String(e.sets ?? 3),
        restSeconds: String(e.restSeconds ?? 90),
        note: e.note || "",
        superset: !!e.superset,
        segments: (e.segments || []).map((seg) => ({
          id: uid(),
          duration: String(seg.duration ?? ""),
          speed: seg.speed != null ? String(seg.speed) : "",
          incline: seg.incline != null ? String(seg.incline) : "",
        })),
      }));
    }
    return [blankExercise()];
  });

  function updateExercise(id, field, value) {
    setExercises((exs) => exs.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  }
  function addExercise() {
    setExercises((exs) => [...exs, blankExercise()]);
  }
  function removeExercise(id) {
    setExercises((exs) => exs.filter((e) => e.id !== id));
  }
  function moveExercise(id, direction) {
    setExercises((exs) => {
      const idx = exs.findIndex((e) => e.id === id);
      const swapWith = idx + direction;
      if (swapWith < 0 || swapWith >= exs.length) return exs;
      const next = [...exs];
      [next[idx], next[swapWith]] = [next[swapWith], next[idx]];
      return next;
    });
  }
  function addSegment(exId) {
    setExercises((exs) => exs.map((e) => (e.id === exId ? { ...e, segments: [...e.segments, blankSegment()] } : e)));
  }
  function updateSegment(exId, segId, field, value) {
    setExercises((exs) =>
      exs.map((e) =>
        e.id === exId ? { ...e, segments: e.segments.map((s) => (s.id === segId ? { ...s, [field]: value } : s)) } : e
      )
    );
  }
  function removeSegment(exId, segId) {
    setExercises((exs) =>
      exs.map((e) => (e.id === exId ? { ...e, segments: e.segments.filter((s) => s.id !== segId) } : e))
    );
  }

  const canSave = name.trim().length > 0 && exercises.length > 0 && exercises.every((e) => e.name.trim().length > 0);

  function handleSave() {
    const program = {
      id: initialProgram?.id || uid(),
      name: name.trim(),
      blockId,
      coached,
      ...(coached && coachName.trim() ? { coachName: coachName.trim() } : {}),
      exercises: exercises.map((e, idx) => {
        if (e.type === "cardio") {
          const segments = (e.segments || [])
            .filter((s) => s.duration !== "")
            .map((s) => ({
              duration: Number(s.duration) || 0,
              speed: s.speed !== "" ? Number(s.speed) : null,
              incline: s.incline !== "" ? Number(s.incline) : null,
            }));
          return {
            id: e.id,
            name: e.name.trim(),
            muscle: e.muscle.trim() || "Cardio",
            type: "cardio",
            ...(segments.length ? { segments } : {}),
            ...(idx > 0 && e.superset ? { superset: true } : {}),
            ...(e.note.trim() ? { note: e.note.trim() } : {}),
          };
        }
        return {
          id: e.id,
          name: e.name.trim(),
          muscle: e.muscle.trim() || "—",
          type: "muscu",
          repMin: Number(e.repMin) || 1,
          repMax: Math.max(Number(e.repMax) || Number(e.repMin) || 1, Number(e.repMin) || 1),
          sets: Number(e.sets) || 1,
          restSeconds: Number(e.restSeconds) || 0,
          ...(idx > 0 && e.superset ? { superset: true } : {}),
          ...(e.note.trim() ? { note: e.note.trim() } : {}),
        };
      }),
    };
    if (isEdit) onUpdate(program);
    else onCreate(program);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier la séance" : "Nouvelle séance"}</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        {isEdit ? "Ajuste le nom, les exercices ou le programme associé." : "Donne-lui un nom et ajoute tes exercices."}
      </div>

      <div style={S.goalInputLabel}>Nom de la séance</div>

        style={S.textInput}

        <select style={S.selectInput} value={blockId} onChange={(e) => setBlockId(e.target.value)}>

            <option key={b.id} value={b.id}>

        <input
          style={S.textInput}
          placeholder="Nom du coach (optionnel)"

      {exercises.map((ex, idx) => (
        <div key={ex.id} style={S.newExerciseCard}>

            <div style={{ display: "flex", gap: 6 }}>
              <button style={S.reorderBtn} disabled={idx === 0} onClick={() => moveExercise(ex.id, -1)}>
                ↑
              </button>
              <button style={S.reorderBtn} disabled={idx === exercises.length - 1} onClick={() => moveExercise(ex.id, 1)}>
                ↓
              </button>
              {exercises.length > 1 && (
                <button style={S.setRemoveBtn} onClick={() => removeExercise(ex.id)}>
                  <Minus size={14} />
                </button>
              )}
            </div>
          </div>

          {idx > 0 && (
            <label style={S.supersetCheckRow}>
              <input
                type="checkbox"
                checked={!!ex.superset}
                onChange={(e) => updateExercise(ex.id, "superset", e.target.checked)}
              />
              🔗 Enchaîné avec l'exercice précédent (superset, pas de repos entre les deux)
            </label>
          )}

          <div style={S.typeToggleRow}>
            <button
              style={{ ...S.typePill, ...(ex.type !== "cardio" ? S.typePillActive : {}) }}
              onClick={() => updateExercise(ex.id, "type", "muscu")}
            >
              Muscu
            </button>
            <button
              style={{ ...S.typePill, ...(ex.type === "cardio" ? S.typePillActive : {}) }}
              onClick={() => updateExercise(ex.id, "type", "cardio")}
            >
              Cardio
            </button>
          </div>

          <input
            style={S.textInput}
            placeholder={ex.type === "cardio" ? "Nom (ex : Vélo, Course, Corde à sauter...)" : "Nom de l'exercice"}
            value={ex.name}
            onChange={(e) => updateExercise(ex.id, "name", e.target.value)}
          />
          <input
            style={S.textInput}
            placeholder={ex.type === "cardio" ? "Catégorie (ex : Cardio, HIIT...)" : "Muscle ciblé (ex : Pectoraux)"}
            value={ex.muscle}
            onChange={(e) => updateExercise(ex.id, "muscle", e.target.value)}
          />

          {ex.type !== "cardio" && (
            <>
              <div style={S.stackedFieldCol}>
                <label style={S.stackedLabel}>
                  Séries
                  <input
                    style={S.stackedInput}
                    inputMode="numeric"
                    value={ex.sets}
                    onChange={(e) => updateExercise(ex.id, "sets", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </label>
                <label style={S.stackedLabel}>
                  Reps min
                  <input
                    style={S.stackedInput}
                    inputMode="numeric"
                    value={ex.repMin}
                    onChange={(e) => updateExercise(ex.id, "repMin", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </label>
                <label style={S.stackedLabel}>
                  Reps max
                  <input
                    style={S.stackedInput}
                    inputMode="numeric"
                    value={ex.repMax}
                    onChange={(e) => updateExercise(ex.id, "repMax", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </label>
              </div>
              <div style={S.newExerciseRow}>
                <label style={S.smallLabel}>
                  Repos entre séries (sec)
                  <input
                    style={S.smallInput}
                    inputMode="numeric"
                    value={ex.restSeconds}
                    onChange={(e) => updateExercise(ex.id, "restSeconds", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </label>
              </div>
            </>
          )}

          {ex.type === "cardio" && (
            <div style={S.segmentsBox}>
              <div style={S.goalInputLabel}>
                Programme par intervalles (optionnel — laisse vide pour un cardio simple avec chrono libre)
              </div>
              {ex.segments.length > 0 && (
                <div style={S.setsHeader}>
                  <span style={S.setsHeaderCol}>Segment</span>
                  <span style={S.setsHeaderCol}>Min</span>
                  <span style={S.setsHeaderCol}>km/h</span>
                  <span style={S.setsHeaderCol}>Pente %</span>
                  <span style={{ width: 28 }} />
                </div>
              )}
              {ex.segments.map((seg, si) => (
                <div key={seg.id} style={S.setRow}>
                  <span style={S.setNum}>{si + 1}</span>
                  <input
                    style={S.setInput}
                    inputMode="numeric"
                    placeholder="min"
                    value={seg.duration}
                    onChange={(e) => updateSegment(ex.id, seg.id, "duration", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                  <input
                    style={S.setInput}
                    inputMode="decimal"
                    placeholder="km/h"
                    value={seg.speed}
                    onChange={(e) => updateSegment(ex.id, seg.id, "speed", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                  <input
                    style={S.setInput}
                    inputMode="decimal"
                    placeholder="%"
                    value={seg.incline}
                    onChange={(e) => updateSegment(ex.id, seg.id, "incline", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                  <button style={S.setRemoveBtn} onClick={() => removeSegment(ex.id, seg.id)}>
                    <Minus size={14} />
                  </button>
                </div>
              ))}
              <button style={S.addSetBtn} onClick={() => addSegment(ex.id)}>
                <Plus size={14} /> Ajouter un segment
              </button>
            </div>
          )}

          <input
            style={S.textInput}
            placeholder="Note (optionnel — ex : dropset, tempo...)"
            value={ex.note}
            onChange={(e) => updateExercise(ex.id, "note", e.target.value)}
          />
        </div>
      ))}

      <button style={S.addSetBtn} onClick={addExercise}>
        <Plus size={14} /> Ajouter un exercice
      </button>

      <button
        style={{ ...S.finishBtn, opacity: canSave ? 1 : 0.4, marginTop: 18 }}
        disabled={!canSave}
        onClick={handleSave}
      >
        <Check size={18} /> {isEdit ? "Enregistrer les modifications" : "Créer la séance"}
      </button>
      <div style={{ height: 24 }} />
    </div>
  );
}

/* ---------- History (list) ---------- */

function HistoryView({ programs, blocks, sessions, exerciseIndex, onOpenExercise, onOpenSession, onResetHistory, onExportBackup, onImportBackup }) {
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const [confirmReset, setConfirmReset] = useState(false);
  const [search, setSearch] = useState("");
  const [backupStatus, setBackupStatus] = useState(null);
  const fileInputRef = useRef(null);

  const programById = useMemo(() => {
    const idx = {};
    programs.forEach((p) => (idx[p.id] = p));
    return idx;
  }, [programs]);

  const sessionsByBlock = (blockId) => sessions.filter((s) => programById[s.programId]?.blockId === blockId);

  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockSessions = [...sessionsByBlock(selectedBlock?.id)].sort((a, b) => (a.date < b.date ? 1 : -1));

  const query = search.trim().toLowerCase();
  const searchResults = query
    ? [...sessions]
        .filter((s) =>
          Object.keys(s.entries).some((exId) => (exerciseIndex[exId]?.name || "").toLowerCase().includes(query))
        )
        .sort((a, b) => (a.date < b.date ? 1 : -1))
    : null;

  function handleImportClick() {
    fileInputRef.current?.click();
  }

  function handleFileChange(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        onImportBackup(data);
        setBackupStatus("imported");
      } catch (err) {
        setBackupStatus("import-error");
      }
      setTimeout(() => setBackupStatus(null), 2500);
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Historique</div>

      <input
        style={S.textInput}
        placeholder="🔍 Rechercher un exercice (tous programmes)"
        value={search}
        onChange={(e) => setSearch(e.target.value)}
      />

      {searchResults ? (
        <>
          <div style={{ ...S.caption, marginBottom: 12 }}>
            {searchResults.length} séance{searchResults.length > 1 ? "s" : ""} contenant « {search.trim()} »
          </div>
          <div style={S.programList}>
            {searchResults.map((s) => {
              const nbExercises = Object.keys(s.entries).length;
              return (
                <button key={s.id} style={S.sessionLogRow} onClick={() => onOpenSession(s)}>
                  <div>
                    <div style={S.exRowName}>{s.programName || "Séance"}</div>
                    <div style={S.caption}>{s.blockName ? `${s.blockName} · ` : ""}{nbExercises} exercices</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={S.caption}>{fmtDate(s.date)}</div>
                  </div>
                </button>
              );
            })}
            {searchResults.length === 0 && <div style={S.caption}>Aucune séance ne contient cet exercice.</div>}
          </div>
        </>
      ) : (
        <>
          <div style={{ ...S.caption, marginBottom: 12 }}>Choisis un programme pour voir ses séances.</div>

          <div style={S.blockChipsRow}>
            {blocks.map((b) => (
              <button
                key={b.id}
                style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
                onClick={() => setSelectedBlockId(b.id)}
              >
                {b.active && <span style={S.activeDot} />}
                {b.name}
              </button>
            ))}
            {blocks.length === 0 && <div style={S.caption}>Aucun programme pour l'instant.</div>}
          </div>

          <div style={{ ...S.caption, marginBottom: 12 }}>
            {blockSessions.length} séance{blockSessions.length > 1 ? "s" : ""} enregistrée{blockSessions.length > 1 ? "s" : ""}
          </div>

          <div style={S.programList}>
            {blockSessions.map((s) => {
              const nbExercises = Object.keys(s.entries).length;
              const tonnage = Object.values(s.entries).flat().reduce((a, set) => a + set.reps * set.poids, 0);
              return (
                <button key={s.id} style={S.sessionLogRow} onClick={() => onOpenSession(s)}>
                  <div>
                    <div style={S.exRowName}>{s.programName || "Séance"}</div>
                    <div style={S.caption}>
                      {nbExercises} exercices · {Math.round(tonnage).toLocaleString("fr-FR")} kg
                      {s.durationSeconds ? ` · ${fmtDurationLong(s.durationSeconds)}` : ""}
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={S.caption}>{fmtDate(s.date)}</div>
                    <div style={S.caption}>{fmtTime(s.date)}</div>
                  </div>
                </button>
              );
            })}
            {blockSessions.length === 0 && <div style={S.caption}>Aucune séance enregistrée dans ce programme.</div>}
          </div>
        </>
      )}

      <div style={S.exportBox}>
        <div style={S.exportLabel}>Sauvegarde complète de l'app</div>
        <div style={S.exportRow}>
          <button
            style={S.exportBtn}
            onClick={() => {
              const ok = onExportBackup();
              setBackupStatus(ok ? "exported" : "export-error");
              setTimeout(() => setBackupStatus(null), 2500);
            }}
          >
            💾 Sauvegarder
          </button>
          <button style={S.exportBtnGhost} onClick={handleImportClick}>
            📂 Restaurer
          </button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleFileChange} />
        </div>
        {backupStatus === "exported" && <div style={S.exportStatus}>Fichier téléchargé — garde-le en lieu sûr.</div>}
        {backupStatus === "imported" && <div style={S.exportStatus}>Sauvegarde restaurée avec succès.</div>}
        {(backupStatus === "export-error" || backupStatus === "import-error") && (
          <div style={S.exportStatusError}>Échec — vérifie le fichier et réessaie.</div>
        )}
      </div>

      {sessions.length > 0 && (
        <div style={{ marginTop: 12 }}>
          {confirmReset ? (
            <div style={S.confirmDeleteRow}>
              <span style={S.caption}>Effacer les {sessions.length} séances enregistrées (tous programmes) ? Irréversible.</span>
              <button style={S.confirmDeleteBtn} onClick={() => { onResetHistory(); setConfirmReset(false); }}>
                Oui, tout effacer
              </button>
              <button style={S.cancelDeleteBtn} onClick={() => setConfirmReset(false)}>
                Annuler
              </button>
            </div>
          ) : (
            <button style={S.deleteProgramBtn} onClick={() => setConfirmReset(true)}>
              <Trash2 size={13} /> Effacer tout l'historique
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function SessionDetailView({ session, exerciseIndex, onBack, onOpenExercise, coachPhone, onSaveCoachPhone }) {
  const exIds = Object.keys(session.entries);
  const tonnage = Object.values(session.entries)
    .filter(Array.isArray)
    .flat()
    .reduce((a, set) => a + set.reps * set.poids, 0);
  const [phoneDraft, setPhoneDraft] = useState(coachPhone || "");
  const [editingPhone, setEditingPhone] = useState(!coachPhone);

  function handleSend() {
    const exerciseNames = {};
    Object.keys(session.entries).forEach((exId) => {
      const def = exerciseIndex[exId];
      if (def) {
        exerciseNames[exId] = {
          name: def.name, muscle: def.muscle, type: def.type,
          repMin: def.repMin, repMax: def.repMax, sets: def.sets,
        };
      }
    });
    const text = sessionSummaryText(session, exerciseIndex) + "\n" + packPayload("SESSION", { session, exerciseNames });
    window.location.href = buildWhatsAppLink(phoneDraft, text);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Historique
      </button>
      <div style={S.pageTitle}>{session.programName || "Séance"}</div>
      <div style={{ ...S.caption, marginBottom: 2 }}>
        {session.blockName ? `${session.blockName} · ` : ""}
        {new Date(session.date).toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" })} à {fmtTime(session.date)}
      </div>
      <div style={{ ...S.caption, marginBottom: 16 }}>
        {tonnage > 0 ? `${Math.round(tonnage).toLocaleString("fr-FR")} kg au total` : ""}
        {session.durationSeconds ? `${tonnage > 0 ? " · " : ""}durée ${fmtDurationLong(session.durationSeconds)}` : ""}
      </div>

      {session.comment && (
        <div style={S.commentDisplay}>
          <span style={S.goalLabel}>Ressenti — </span>
          {session.comment}
        </div>
      )}

      <div style={S.programList}>
        {exIds.map((exId) => {
          const def = exerciseIndex[exId];
          const entry = session.entries[exId];
          const isCardio = !Array.isArray(entry);
          return (
            <div key={exId} style={S.historyRow}>
              <div style={S.exRowName}>{def?.name || "Exercice supprimé"}</div>
              {isCardio ? (
                <div style={S.historySets}>
                  {cardioSegments(entry).map((seg, i) => (
                    <span key={i} style={S.setChip}>
                      {seg.durationSeconds ? fmtDurationLong(seg.durationSeconds) : "0 min"}
                      {seg.speed ? ` · ${seg.speed}km/h` : ""}
                      {seg.incline ? ` · pente ${seg.incline}%` : ""}
                    </span>
                  ))}
                </div>
              ) : (
                <div style={S.historySets}>
                  {entry.map((s, j) => (
                    <span key={j} style={S.setChip}>{s.reps}×{s.poids}kg</span>
                  ))}
                </div>
              )}
              {def && (
                <button style={S.goalEditBtn} onClick={() => onOpenExercise(def)}>
                  Voir la progression →
                </button>
              )}
            </div>
          );
        })}
        {exIds.length === 0 && <div style={S.caption}>Aucun exercice enregistré pour cette séance.</div>}
      </div>

      <div style={S.exportBox}>
        <div style={S.exportLabel}>Envoyer à mon coach</div>
        {editingPhone ? (
          <div style={S.goalInputRow}>
            <input
              style={S.goalInput}
              placeholder="Ex : 0612345678 ou 33612345678"
              value={phoneDraft}
              onChange={(e) => setPhoneDraft(e.target.value.replace(/[^0-9+]/g, ""))}
            />
            <button
              style={S.goalSaveBtn}
              onClick={() => { onSaveCoachPhone(phoneDraft); setEditingPhone(false); }}
            >
              <Check size={16} />
            </button>
          </div>
        ) : (
          <div style={{ ...S.caption, marginBottom: 8 }}>
            Coach : {coachPhone} <button style={S.goalEditBtn} onClick={() => setEditingPhone(true)}>modifier</button>
          </div>
        )}
        {editingPhone && (
          <div style={{ ...S.caption, marginBottom: 8 }}>
            Numéro français : tu peux taper avec ou sans le 0 initial, les deux fonctionnent. Pour un autre pays, indique l'indicatif (ex : 44 pour le Royaume-Uni).
          </div>
        )}
        <button style={S.exportBtn} onClick={handleSend}>
          📱 Envoyer cette séance par WhatsApp
        </button>
      </div>
    </div>
  );
}

function BodyweightView({ bodyweight, onAdd, onDelete, onBack }) {
  const [weight, setWeight] = useState("");
  const sorted = [...bodyweight].sort((a, b) => (a.date < b.date ? -1 : 1));
  const chartData = sorted.map((e) => ({ date: fmtDate(e.date), weight: e.weight }));

  function handleAdd() {
    const val = Number(String(weight).replace(",", "."));
    if (!val) return;
    onAdd({ date: new Date().toISOString().slice(0, 10), weight: val });
    setWeight("");
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Retour
      </button>
      <div style={S.pageTitle}>Poids de corps</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>Une pesée par jour, écrasée si tu la refais.</div>

      <div style={S.goalInputRow}>
        <input
          style={S.goalInput}
          inputMode="decimal"
          placeholder="Poids aujourd'hui (kg)"
          value={weight}
          onChange={(e) => setWeight(e.target.value.replace(/[^0-9.,]/g, ""))}
        />
        <button style={S.goalSaveBtn} onClick={handleAdd}>
          <Check size={16} />
        </button>
      </div>

      {chartData.length > 1 && (
        <>
          <div style={S.sectionLabel}>Évolution</div>
          <div style={S.chartCard}>
            <MiniLineChart data={chartData} dataKey="weight" height={180} />
          </div>
        </>
      )}

      <div style={S.sectionLabel}>Historique</div>
      <div style={S.programList}>
        {[...sorted].reverse().map((e) => (
          <div key={e.date} style={S.sessionLogRow}>
            <span>{fmtDate(e.date)}</span>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontWeight: 700 }}>{e.weight} kg</span>
              <button style={S.setRemoveBtn} onClick={() => onDelete(e.date)}>
                <Minus size={14} />
              </button>
            </div>
          </div>
        ))}
        {sorted.length === 0 && <div style={S.caption}>Aucune pesée enregistrée.</div>}
      </div>
    </div>
  );
}


function ExerciseHistory({ exercise, sessions, onBack, coachGoalValue, onSaveCoachGoal }) {
  const isCardio = exercise.type === "cardio";
  const [goalDraft, setGoalDraft] = useState(coachGoalValue || "");
  const [goalSaved, setGoalSaved] = useState(false);

  const data = sessions
    .filter((s) => s.entries[exercise.id])
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((s) => {
      const entry = s.entries[exercise.id];
      if (isCardio) {
        const segs = cardioSegments(entry);
        const totalSec = segs.reduce((a, seg) => a + (seg.durationSeconds || 0), 0);
        return {
          date: fmtDate(s.date),
          durationMin: Math.round(totalSec / 60),
          segs,
          rawDate: s.date,
        };
      }
      const sets = entry;
      const maxPoids = Math.max(...sets.map((x) => x.poids));
      const volume = sets.reduce((a, x) => a + x.reps * x.poids, 0);
      return { date: fmtDate(s.date), maxPoids, volume, sets, rawDate: s.date };
    });

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Historique
      </button>
      <div style={S.pageTitle}>{exercise.name}</div>
      <div style={S.caption}>
        {isCardio ? exercise.muscle : `${exercise.muscle} · ${exercise.sets} × ${exercise.repMin}-${exercise.repMax} reps`}
      </div>

      {data.length > 0 ? (
        <>
          <div style={S.sectionLabel}>{isCardio ? "Durée par séance (min)" : "Charge max par séance (kg)"}</div>
          <div style={S.chartCard}>
            <MiniLineChart data={data} dataKey={isCardio ? "durationMin" : "maxPoids"} height={180} />
          </div>

          <div style={S.sectionLabel}>Détail des séances</div>
          <div style={S.programList}>
            {[...data].reverse().map((d, i) => (
              <div key={i} style={S.historyRow}>
                <div style={S.caption}>{d.date}</div>
                {isCardio ? (
                  <div style={S.historySets}>
                    {d.segs.map((seg, j) => (
                      <span key={j} style={S.setChip}>
                        {Math.round((seg.durationSeconds || 0) / 60)} min
                        {seg.speed ? ` · ${seg.speed}km/h` : ""}
                        {seg.incline ? ` · pente ${seg.incline}%` : ""}
                      </span>
                    ))}
                  </div>
                ) : (
                  <div style={S.historySets}>
                    {d.sets.map((s, j) => (
                      <span key={j} style={S.setChip}>{s.reps}×{s.poids}kg</span>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        </>
      ) : (
        <div style={{ ...S.caption, marginTop: 24 }}>Pas encore de données pour cet exercice.</div>
      )}

      {onSaveCoachGoal && (
        <div style={S.goalInputBox}>
          <div style={S.goalInputLabel}>🎯 Objectif pour la semaine prochaine</div>
          <div style={S.goalInputRow}>
            <input
              style={S.goalInput}

}

function ImportGoalsPrompt({ program, coachName, onImportGoals, onContinue, onCancel }) {
  const [manualText, setManualText] = useState("");
  const [status, setStatus] = useState(null);

  function processText(text) {
    const parsed = unpackPayload(text);
    if (parsed && parsed.type === "GOALS") {
      onImportGoals(parsed.data);
      setStatus("ok");
      setTimeout(() => onContinue(), 900);
    } else {
      setStatus("error");
    }
  }

  async function handlePaste() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setStatus("clipboard-error");
        return;
      }
      processText(text);
    } catch (e) {
      setStatus("clipboard-error");
    }
  }

  function handleManualImport() {
    processText(manualText);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{program.name}</div>
      <div style={{ ...S.caption, marginBottom: 16 }}>Programme suivi par {coachName || "ton coach"}</div>

      <div style={S.segmentsBox}>
        <div style={S.goalInputLabel}>🎯 As-tu reçu de nouveaux objectifs de ton coach pour cette séance ?</div>
        <button style={S.createBtn} onClick={handlePaste}>
          📋 Coller les objectifs
        </button>
        {status === "ok" && <div style={S.exportStatus}>Objectifs importés ✓</div>}
        {status === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
        {status === "clipboard-error" && (
          <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
        )}
        <textarea
          style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
          rows={3}
          placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
          value={manualText}
          onChange={(e) => setManualText(e.target.value)}
        />
        {manualText && (
          <button style={S.exportBtnGhost} onClick={handleManualImport}>
            Importer ce texte
          </button>
        )}
      </div>

      <button style={S.startProgramBtn} onClick={onContinue}>
        Continuer sans importer
      </button>
    </div>
  );
}
