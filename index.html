  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML =
        '<pre style="color:#ff8080;background:#1B1A18;padding:16px;white-space:pre-wrap;font-size:13px;font-family:monospace;">' +
        "Erreur de chargement :\n" + (e.message || e) + "\n(ligne " + e.lineno + ")" +
        "</pre>";
    }
  });
  // Mode hors-ligne : le service worker met en cache l'app après la 1ère ouverture connectée.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>

// --- Stockage (remplace window.storage de Claude) : localStorage du navigateur, 100% local et gratuit ---
window.storage = {
  async get(key) {
    const v = localStorage.getItem("charge:" + key);
    return v !== null ? { key, value: v, shared: false } : null;
  },
  async set(key, value) {
    localStorage.setItem("charge:" + key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem("charge:" + key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage)
      .filter((k) => k.startsWith("charge:") && (!prefix || k.slice(7).startsWith(prefix)))
      .map((k) => k.slice(7));
    return { keys, prefix, shared: false };
  },
};

// --- Petit graphique en ligne (remplace recharts, pas de dépendance) ---
function MiniLineChart({ data, dataKey, height = 180 }) {
  if (!data || data.length === 0) return null;
  const values = data.map((d) => Number(d[dataKey]) || 0);
  const max = Math.max(...values);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const w = 320;
  const pad = 14;
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const points = values.map((v, i) => {
    const x = pad + i * stepX;
    const y = height - pad - ((v - min) / range) * (height - pad * 2);
    return [x, y];
  });
  const polyline = points.map((p) => p.join(",")).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none">
        {[0.25, 0.5, 0.75].map((f, i) => (
          <line key={i} x1={pad} x2={w - pad} y1={pad + f * (height - pad * 2)} y2={pad + f * (height - pad * 2)} stroke="#332E28" strokeDasharray="3 3" />
        ))}
        <polyline points={polyline} fill="none" stroke="#FFC233" strokeWidth="2.5" />
        {points.map(([x, y], i) => (
          <circle key={i} cx={x} cy={y} r="3.5" fill="#FFC233" />
        ))}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#FFFFFF", marginTop: 4 }}>
        <span>{data[0]?.date}</span>
        {data.length > 1 && <span>{data[data.length - 1]?.date}</span>}
      </div>
    </div>
  );
}

function coachRef(name, fallback = "ton coach") {
  return name && name.trim() ? `Coach ${name.trim()}` : fallback;
}
const fmtDate = (iso) => new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
function fmtDuration(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function fmtDurationLong(totalSeconds) {
  if (!totalSeconds) return null;
  const m = Math.round(totalSeconds / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  const rest = m % 60;
  return rest ? `${h} h ${rest} min` : `${h} h`;
}
function toDecimal(str) {
  if (str == null || str === "") return NaN;
  return Number(String(str).replace(",", "."));
}
function fmtRestTime(seconds) {
  if (!seconds) return null;
  if (seconds < 60) return `${seconds} sec`;
  const m = Math.floor(seconds / 60);
  const rest = seconds % 60;
  return rest ? `${m} min ${rest} sec` : `${m} min`;
}

// Normalise une entrée cardio en liste de segments, pour compatibilité avec
// l'ancien format (durationSeconds/speed/incline à plat, un seul segment).
function cardioSegments(entry) {
  if (!entry) return [];
  if (entry.segments) return entry.segments;
  if (entry.durationSeconds !== undefined) {
    return [{ durationSeconds: entry.durationSeconds, speed: entry.speed, incline: entry.incline }];
  }
  return [];
}

function buildFullBackup({ programs, sessions, goals, blocks, nutritionBlocks, meals }) {

    { app: "charge", version: 1, exportedAt: new Date().toISOString(), programs, sessions, goals, blocks, nutritionBlocks, meals },

function downloadJSON(filename, jsonContent) {
  try {
    const blob = new Blob([jsonContent], { type: "application/json;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

/* ---------- Échanges coach ↔ suivi (via texte WhatsApp, sans serveur) ---------- */

function packPayload(type, data) {
  return `##HAKIFIT-${type}##\n${JSON.stringify(data)}\n##END##`;
}

function unpackPayload(text) {
  const match = text.match(/##HAKIFIT-(\w+)##\s*([\s\S]*?)\s*##END##/);
  if (match) {
    try { return { type: match[1], data: JSON.parse(match[2]) }; } catch { return null; }
  }
  return null;
}

function buildWhatsAppLink(phone, text) {
  const encoded = encodeURIComponent(text);
  let digits = (phone || "").replace(/[^0-9]/g, "");
  // Un numéro français local (ex: 06XXXXXXXX, 10 chiffres) n'est pas valide pour WhatsApp,
  // qui exige le format international sans le 0 initial (ex: 336XXXXXXXX).
  if (digits.length === 10 && digits.startsWith("0")) {
    digits = "33" + digits.slice(1);
  }
  return digits ? `https://wa.me/${digits}?text=${encoded}` : `https://api.whatsapp.com/send?text=${encoded}`;
}

  let out = `📋 Programme : ${blockName}\n`;
  programs.forEach((p, i) => {
    out += `\n${i + 1}. ${p.name}\n`;
    p.exercises.forEach((ex) => {
      if (ex.type === "cardio") {
        out += `   • ${ex.name} (cardio)\n`;
      } else {
        out += `   • ${ex.name} — ${ex.sets}×${ex.repMin}-${ex.repMax} reps${ex.restSeconds ? `, repos ${fmtRestTime(ex.restSeconds)}` : ""}\n`;
      }
    });
  });
  return out;
}

function mealPlanSummaryText(blockName, meals) {

  const byDay = {};
  meals.forEach((m) => {

    byDay[d].push(m);
  });
  const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);
  out += `(Cycle sur ${days.length || 1} jour${days.length > 1 ? "s" : ""}, puis ça reboucle)\n`;
  days.forEach((day) => {

    byDay[day].forEach((m) => {

        if (d.ingredients && d.ingredients.length) {
          out += ` (${d.ingredients.map((ing) => ing.text).join(", ")})`;
        }
        out += `\n`;
      });
    });
  });
  return out;
}

function parseQuantityLine(text) {
  const m = text.match(/^\s*(\d+(?:[.,]\d+)?)\s*(kg|g|mg|l|cl|ml)?\b\s*(.*)$/i);
  if (!m) return null;
  const qty = parseFloat(m[1].replace(",", "."));
  if (isNaN(qty)) return null;
  const rest = m[3].trim();
  if (!rest) return null;
  return { qty, unit: (m[2] || "").toLowerCase(), rest };
}

function estimateSessionSeconds(program) {
  let total = 0;
  const DEFAULT_WARMUP_SETS = 2; // séries théoriques d'échauffement si non précisé sur l'exercice
  const TRANSITION_SECONDS = 4 * 60; // temps théorique pour changer de machine et la régler (3-5 min, on prend le milieu)
  (program.exercises || []).forEach((ex) => {
    total += TRANSITION_SECONDS;
    if (ex.type === "cardio") {
      (ex.segments || []).forEach((seg) => {
        total += (toDecimal(seg.duration) || 0) * 60;
      });
    } else {
      const warmup = ex.warmupSets != null && ex.warmupSets !== "" ? Number(ex.warmupSets) : DEFAULT_WARMUP_SETS;
      const sets = (Number(ex.sets) || 1) + warmup;
      const rest = Number(ex.restSeconds) || 0;
      total += sets * 40 + sets * rest;
    }
  });
  return total;
}

function roundSecondsToQuarterHour(seconds) {
  const quarterHour = 15 * 60;
  return Math.max(quarterHour, Math.round(seconds / quarterHour) * quarterHour);
}

function sumMealsCalories(meals) {
  let total = 0;
  let hasAny = false;
  meals.forEach((meal) => {
    (meal.dishes || []).forEach((d) => {
      if (d.calories != null && !isNaN(d.calories)) {
        total += Number(d.calories);
        hasAny = true;
      }
    });
  });
  return hasAny ? total : null;
}

function sumMealsMacros(meals) {
  let protein = 0, carbs = 0, fat = 0, hasAny = false;
  meals.forEach((meal) => {
    (meal.dishes || []).forEach((d) => {
      if (d.protein != null && !isNaN(d.protein)) { protein += Number(d.protein); hasAny = true; }
      if (d.carbs != null && !isNaN(d.carbs)) { carbs += Number(d.carbs); hasAny = true; }
      if (d.fat != null && !isNaN(d.fat)) { fat += Number(d.fat); hasAny = true; }
    });
  });
  return hasAny ? { protein: Math.round(protein), carbs: Math.round(carbs), fat: Math.round(fat) } : null;
}

function buildShoppingList(meals, loops) {
  const quantified = {};
  const plain = {};

  function addItem(rawText) {
    const text = (rawText || "").trim();
    if (!text) return;
    const parsed = parseQuantityLine(text);
    if (parsed) {
      const key = `${parsed.unit}||${parsed.rest.toLowerCase()}`;
      if (!quantified[key]) quantified[key] = { qty: 0, unit: parsed.unit, rest: parsed.rest };
      quantified[key].qty += parsed.qty;
    } else {
      const key = text.toLowerCase();
      if (!plain[key]) plain[key] = { count: 0, text };
      plain[key].count += 1;
    }
  }

  meals.forEach((meal) => {
    (meal.dishes || []).forEach((dish) => {
      if (dish.ingredients && dish.ingredients.length) {
        dish.ingredients.forEach((ing) => addItem(ing.text));
      } else if (dish.name) {
        addItem(dish.name);
      }
    });
  });

  const results = [];
  Object.values(quantified).forEach((q) => {
    const total = q.qty * loops;
    const qtyStr = Number.isInteger(total) ? total : total.toFixed(1).replace(/\.0$/, "");
    results.push({ text: q.unit ? `${qtyStr}${q.unit} ${q.rest}` : `${qtyStr} ${q.rest}`, sortKey: q.rest.toLowerCase() });
  });
  Object.values(plain).forEach((p) => {
    const total = p.count * loops;
    results.push({ text: total > 1 ? `${p.text} x${total}` : p.text, sortKey: p.text.toLowerCase() });
  });

  return results.sort((a, b) => a.sortKey.localeCompare(b.sortKey, "fr"));
}

function shoppingListText(blockName, list, loops) {
  let out = `🛒 Liste de courses : ${blockName}\n(pour ${loops} boucle${loops > 1 ? "s" : ""} du programme)\n\n`;
  list.forEach((item) => {
    out += `- ${item.text}\n`;
  });
  return out;
}

function mealLogStatusLabel(status) {
  if (status === "asPlanned") return "Mangé comme prévu";
  if (status === "adapted") return "Adapté";
  if (status === "restaurant") return "Restaurant";
  return status;
}

function mealLogSummaryText(logs) {

}


function sessionSummaryText(session, exerciseIndex) {
  let out = `📊 Séance : ${session.programName || "Séance"}\n`;
  out += `${new Date(session.date).toLocaleDateString("fr-FR")} à ${fmtTime(session.date)}`;
  if (session.durationSeconds) out += ` · ${fmtDurationLong(session.durationSeconds)}`;
  out += `\n`;
  Object.entries(session.entries).forEach(([exId, entry]) => {
    const name = exerciseIndex[exId]?.name || exId;
    out += `\n${name} :\n`;
    if (Array.isArray(entry)) {
      entry.forEach((s, i) => (out += `  Série ${i + 1} : ${s.repsL != null && s.repsR != null ? `${s.repsL}G/${s.repsR}D` : `${s.reps} reps`} × ${s.poids} kg\n`));
    } else {
      cardioSegments(entry).forEach((seg) => {
        out += `  ${Math.round((seg.durationSeconds || 0) / 60)} min`;
        out += seg.speed ? ` · ${seg.speed} km/h` : "";
        out += seg.incline ? ` · pente ${seg.incline}%` : "";
        out += `\n`;
      });
    }
  });
  if (session.comment) out += `\nRessenti : ${session.comment}\n`;
  return out;
}

function goalsSummaryText(athleteName, goals, exerciseIndex) {
  let out = `🎯 Objectifs pour ${athleteName}\n`;
  Object.entries(goals).forEach(([exId, text]) => {
    if (!text) return;
    out += `\n${exerciseIndex[exId]?.name || exId} : ${text}`;
  });
  return out;
}

function buildExerciseNamesForSession(session, exerciseIndex) {
  const exerciseNames = {};
  Object.keys(session.entries).forEach((exId) => {
    const def = exerciseIndex[exId];
    if (def) {
      exerciseNames[exId] = {
        name: def.name, muscle: def.muscle, type: def.type,
        repMin: def.repMin, repMax: def.repMax, sets: def.sets,
      };
    }
  });
  return exerciseNames;
}

function computeStreak(sessions) {
  if (!sessions.length) return 0;
  const weekKey = (d) => {
    const date = new Date(d);
    const day = (date.getDay() + 6) % 7; // 0 = lundi
    const monday = new Date(date);
    monday.setDate(date.getDate() - day);
    monday.setHours(0, 0, 0, 0);
    return monday.toISOString().slice(0, 10);
  };
  const weeksWithSessions = new Set(sessions.map((s) => weekKey(s.date)));
  let cursor = new Date();
  if (!weeksWithSessions.has(weekKey(cursor))) {
    cursor.setDate(cursor.getDate() - 7); // grace : la semaine en cours n'est pas encore "cassée"
  }
  let streak = 0;
  while (weeksWithSessions.has(weekKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 7);
  }
  return streak;
}

function computeMuscleBalance(sessions, exerciseIndex) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const counts = {};
  sessions
    .filter((s) => new Date(s.date) >= cutoff)
    .forEach((s) => {
      Object.keys(s.entries).forEach((exId) => {
        const def = exerciseIndex[exId];
        if (!def || def.type === "cardio") return;
        const muscle = def.muscle || "Autre";
        counts[muscle] = (counts[muscle] || 0) + 1;
      });
    });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = entries.length ? entries[0][1] : 1;
  return { entries, max };
}

function MealLogEditor({ meal, status, initialLog, onConfirm, onCancel }) {
  const [changes, setChanges] = useState(() => (meal.dishes || []).map((d) => {
    const existing = initialLog?.changes?.find((c) => c.dish === d.name);
    return { dish: d.name, replaced: !!existing, replacement: existing?.replacement || "" };
  }));
  const [note, setNote] = useState(initialLog?.note || "");

  function toggleReplaced(idx) {
    setChanges((cs) => cs.map((c, i) => (i === idx ? { ...c, replaced: !c.replaced } : c)));
  }
  function updateReplacement(idx, value) {
    setChanges((cs) => cs.map((c, i) => (i === idx ? { ...c, replacement: value } : c)));
  }

  function handleConfirm() {
    const filtered = changes.filter((c) => c.replaced && c.replacement.trim()).map((c) => ({ dish: c.dish, replacement: c.replacement.trim() }));
    onConfirm({ ...(filtered.length ? { changes: filtered } : {}), ...(note.trim() ? { note: note.trim() } : {}) });
  }

  const hasDishes = (meal.dishes || []).length > 0;

  return (
    <div style={S.segmentsBox}>
      {status === "adapted" && hasDishes && (
        <>
          <div style={{ ...S.caption, marginBottom: 6 }}>Coche les plats remplacés et précise par quoi :</div>
          {changes.map((c, idx) => (
            <div key={idx} style={{ marginBottom: 8 }}>
              <label style={S.supersetCheckRow}>
                <input type="checkbox" checked={c.replaced} onChange={() => toggleReplaced(idx)} />
                {c.dish}
              </label>
              {c.replaced && (
                <input
                  style={S.textInput}
                  placeholder="Remplacé par..."
                  value={c.replacement}
                  onChange={(e) => updateReplacement(idx, e.target.value)}
                />
              )}
            </div>
          ))}
        </>
      )}
      <input
        style={S.textInput}
        placeholder={status === "restaurant" ? "Nom du restaurant / ce que tu as mangé (optionnel)" : "Autre précision (optionnel)"}
        value={note}
        onChange={(e) => setNote(e.target.value)}
      />
      <div style={{ display: "flex", gap: 8 }}>
        <button style={S.createBtn} onClick={handleConfirm}>Confirmer</button>
        <button style={S.exportBtnGhost} onClick={onCancel}>Annuler</button>
      </div>
    </div>
  );
}

          <div style={S.caption}>{stepGoal ? `Objectif : ${stepGoal} pas` : "Objectif : non renseigné"}</div>
          {todaySteps != null && (
            <div style={{ ...S.caption, marginTop: 2 }}>
              Aujourd'hui : {todaySteps} pas{stepGoal ? (todaySteps >= Number(stepGoal) ? " — objectif atteint ✓" : "") : ""}
            </div>
          )}
        </button>
        <input
          style={S.stepsQuickInput}
          type="number"
          placeholder="0"
          value={stepsDraft}
          onChange={(e) => setStepsDraft(e.target.value)}
          onBlur={handleQuickLogSteps}
          onKeyDown={(e) => { if (e.key === "Enter") { handleQuickLogSteps(); e.target.blur(); } }}
        />
      </div>

      <div style={S.homeCategoryLabel}>Pesée</div>
      <div style={{ ...S.heroCard, marginBottom: 14 }}>
        <button style={S.heroTapArea} onClick={onOpenWeight}>
          <div style={S.heroTitle}>Poids</div>
          <div style={S.caption}>{latestWeight ? `Dernière pesée : ${latestWeight} kg` : "Aucune pesée"}</div>
        </button>
        <input
          style={S.stepsQuickInput}
          type="number"
          placeholder={latestWeight ? String(latestWeight) : "0"}
          value={weightDraft}
          onChange={(e) => setWeightDraft(e.target.value)}
          onBlur={handleQuickLogWeight}
          onKeyDown={(e) => { if (e.key === "Enter") { handleQuickLogWeight(); e.target.blur(); } }}
        />
      </div>
    </div>
  );
}

/* ---------- Programs ---------- */

function ProgramsView({ programs, blocks, onStart, onCreateProgram, onEditProgram, onDeleteProgram, onDuplicateProgram, onCreateBlock, onSetActiveBlock, onUpdateBlock, onDeleteBlock, onImportCoachProgram, onImportCoachGoals, onOpenHistory, coachDisplayName }) {
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const [open, setOpen] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showNewBlock, setShowNewBlock] = useState(false);
  const [newBlockName, setNewBlockName] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [editingBlock, setEditingBlock] = useState(false);
  const [editBlockName, setEditBlockName] = useState("");
  const [editBlockCoached, setEditBlockCoached] = useState(false);
  const [editBlockCoachName, setEditBlockCoachName] = useState("");
  const [confirmDeleteBlock, setConfirmDeleteBlock] = useState(false);


  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockPrograms = programs.filter((p) => !p.deleted && p.blockId === selectedBlock?.id);

  function handleCreateBlock() {
    if (!newBlockName.trim()) return;
    const id = onCreateBlock(newBlockName.trim());
    setSelectedBlockId(id);
    setNewBlockName("");
    setShowNewBlock(false);
  }

  function processImportText(text) {
    const parsed = unpackPayload(text);
    if (!parsed) {
      setImportStatus("error");
      setTimeout(() => setImportStatus(null), 3000);
      return;
    }
    if (parsed.type === "PROGRAM") {
      const newBlockId = onImportCoachProgram(parsed.data, parsed.data.coachName);
      setSelectedBlockId(newBlockId);
      setImportStatus("program");
    } else if (parsed.type === "GOALS") {
      onImportCoachGoals(parsed.data);
      setImportStatus("goals");
    } else {
      setImportStatus("error");
    }
    setImportText("");
    setTimeout(() => setImportStatus(null), 3000);
  }

  function handleImport() {
    processImportText(importText);
  }

  async function handlePasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStatus("error");
        setTimeout(() => setImportStatus(null), 3000);
        return;
      }
      processImportText(text);
    } catch (e) {
      setImportStatus("clipboard-error");
      setTimeout(() => setImportStatus(null), 3000);
    }
  }

  function openEditBlock() {
    setEditBlockName(selectedBlock?.name || "");
    setEditBlockCoached(!!selectedBlock?.coached);
    setEditBlockCoachName(selectedBlock?.coachName || "");
    setEditingBlock(true);
    setConfirmDeleteBlock(false);
  }

  function saveEditBlock() {
    if (!editBlockName.trim() || !selectedBlock) return;
    onUpdateBlock(selectedBlock.id, {
      name: editBlockName.trim(),
      coached: editBlockCoached,
      ...(editBlockCoached && editBlockCoachName.trim() ? { coachName: editBlockCoachName.trim() } : { coachName: "" }),
    });
    setEditingBlock(false);
  }

  function handleDeleteBlock() {
    if (!selectedBlock || blocks.length <= 1) return;
    onDeleteBlock(selectedBlock.id);
    const next = blocks.find((b) => b.id !== selectedBlock.id);
    if (next) setSelectedBlockId(next.id);
    setEditingBlock(false);
    setConfirmDeleteBlock(false);
  }

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Programmes d'entraînement</div>

      <div style={{ ...S.caption, marginBottom: 10 }}>
        Un programme regroupe plusieurs séances. Un seul programme est suivi à la fois — les autres restent en pause, avec leur historique intact.
      </div>
      <button style={S.historyLinkBtn} onClick={onOpenHistory}>
        <TrendingUp size={14} style={{ marginRight: 5 }} />
        Voir l'historique
      </button>

      <div style={S.blockChipsRow}>
        {blocks.map((b) => (
          <button
            key={b.id}
            style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
            onClick={() => setSelectedBlockId(b.id)}
          >
            {b.active && <span style={S.activeDot} />}
            {b.coached && <GraduationCap size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}
            {b.name}
          </button>
        ))}
        {selectedBlock && (
          <button style={S.blockChipAdd} onClick={openEditBlock}>
            <Pencil size={14} />
          </button>
        )}
        <button style={S.blockChipAdd} onClick={() => setShowNewBlock((v) => !v)}>
          <Plus size={14} />
        </button>
        <button style={S.blockChipAdd} onClick={() => setShowImport((v) => !v)}>
          <Inbox size={14} />
        </button>
      </div>

      {showImport && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>
            Reçu de {coachRef(coachDisplayName)} sur WhatsApp (programme ou objectifs) :
          </div>
          <button style={S.createBtn} onClick={handlePasteClipboard}>
            <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller et importer
          </button>
          {importStatus === "program" && <div style={S.exportStatus}>Programme importé ✓</div>}
          {importStatus === "goals" && <div style={S.exportStatus}>Objectifs mis à jour ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
          {importStatus === "clipboard-error" && (
            <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
          )}
          <textarea
            style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
            rows={3}
            placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
          />
          {importText && (
            <button style={S.exportBtnGhost} onClick={handleImport}>
              Importer ce texte
            </button>
          )}
        </div>
      )}

      {showNewBlock && (
        <div style={S.newBlockRow}>
          <input
            style={S.textInput}
            placeholder="Nom du programme (ex : Bloc force été 2026)"
            value={newBlockName}
            onChange={(e) => setNewBlockName(e.target.value)}
          />
          <button style={S.goalSaveBtn} onClick={handleCreateBlock}>
            <Check size={16} />
          </button>
        </div>
      )}

      {selectedBlock && selectedBlock.id !== activeBlock?.id && (
        <div style={S.notActiveBanner}>
          <span>Ce programme n'est pas suivi actuellement.</span>
          <button style={S.activateBtn} onClick={() => onSetActiveBlock(selectedBlock.id)}>
            Suivre ce programme
          </button>
        </div>
      )}

      {selectedBlock && editingBlock && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom du programme</div>
          <input
            style={S.textInput}
            value={editBlockName}
            onChange={(e) => setEditBlockName(e.target.value)}
          />
          <label style={S.supersetCheckRow}>
            <input type="checkbox" checked={editBlockCoached} onChange={(e) => setEditBlockCoached(e.target.checked)} />
            <GraduationCap size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Ce programme est suivi par un coach (toutes ses séances demanderont un import d'objectifs avant de démarrer)
          </label>
          {editBlockCoached && (
            <input
              style={S.textInput}
              placeholder="Nom du coach (optionnel)"
              value={editBlockCoachName}
              onChange={(e) => setEditBlockCoachName(e.target.value)}
            />
          )}
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <button style={S.createBtn} onClick={saveEditBlock}>
              Enregistrer
            </button>
            <button style={S.exportBtnGhost} onClick={() => setEditingBlock(false)}>
              Annuler
            </button>
          </div>

          <div style={{ marginTop: 14, borderTop: "1px solid #332E28", paddingTop: 12 }}>
            {blocks.length <= 1 ? (
              <div style={S.caption}>Impossible de supprimer le seul programme restant.</div>
            ) : confirmDeleteBlock ? (
              <div style={S.confirmDeleteRow}>
                <span style={S.caption}>Supprimer « {selectedBlock?.name} » et toutes ses séances ?</span>
                <button style={S.confirmDeleteBtn} onClick={handleDeleteBlock}>
                  Oui, supprimer
                </button>
                <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteBlock(false)}>
                  Annuler
                </button>
              </div>
            ) : (
              <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteBlock(true)}>
                <Trash2 size={13} /> Supprimer ce programme
              </button>
            )}
          </div>
        </div>
      )}

      <div style={{ height: 8 }} />

      {blockPrograms.length === 0 && (
        <div style={{ ...S.caption, margin: "12px 0" }}>Pas encore de séance dans ce programme.</div>
      )}

      {blockPrograms.map((p) => (
        <div key={p.id} style={S.programBlock}>
          <button style={S.programBlockHeader} onClick={() => setOpen(open === p.id ? null : p.id)}>
            <span style={S.programBlockTitle}>
              {p.name}
              <span style={{ ...S.caption, marginLeft: 8 }}>~{fmtDurationLong(roundSecondsToQuarterHour(estimateSessionSeconds(p))) || "0 min"}</span>
            </span>
            <span style={S.caption}>{open === p.id ? "−" : "+"}</span>
          </button>
          {open === p.id && (
            <div style={S.programBlockBody}>
              {p.exercises.map((ex) => (
                <div key={ex.id} style={S.exRow}>
                  <div>
                    <div style={S.exRowName}>{ex.superset && <Link2 size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}{ex.name}</div>
                    <div style={S.caption}>{ex.muscle}</div>
                    {ex.type === "cardio" ? (
                      <div style={S.caption}>Cardio</div>
                    ) : (
                      <>
                        <div style={S.caption}>Fourchette : {ex.repMin}-{ex.repMax} reps · {ex.sets} séries</div>
                        {ex.restSeconds ? <div style={S.caption}>Repos : {fmtRestTime(ex.restSeconds)}</div> : null}
                      </>
                    )}
                    {ex.superset && <div style={S.caption}>Enchaîné avec l'exercice précédent (superset)</div>}
                    {ex.note && <div style={S.exNote}>{ex.note}</div>}
                  </div>
                </div>
              ))}
              <button style={S.startProgramBtn} onClick={() => onStart(p)}>
                Démarrer cette séance
              </button>
              <button style={S.editProgramBtn} onClick={() => onEditProgram(p)}>
                Modifier cette séance
              </button>
              <button style={S.editProgramBtn} onClick={() => onDuplicateProgram(p.id)}>
                Dupliquer cette séance
              </button>
              {confirmDelete === p.id ? (
                <div style={S.confirmDeleteRow}>
                  <span style={S.caption}>Supprimer « {p.name} » ?</span>
                  <button style={S.confirmDeleteBtn} onClick={() => { onDeleteProgram(p.id); setConfirmDelete(null); }}>
                    Oui, supprimer
                  </button>
                  <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(null)}>
                    Annuler
                  </button>
                </div>
              ) : (
                <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(p.id)}>
                  <Trash2 size={13} /> Supprimer cette séance
                </button>
              )}
            </div>
          )}
        </div>
      ))}

      <button style={S.createBtn} onClick={() => onCreateProgram(selectedBlock?.id)}>
        <Plus size={16} /> Créer une séance dans ce programme
      </button>
    </div>
  );
}

/* ---------- Create / edit a program (séance) ---------- */

function blankExercise() {
  return { id: uid(), name: "", muscle: "", machine: "", type: "muscu", repMin: "9", repMax: "12", sets: "3", warmupSets: "2", restSeconds: "90", note: "", segments: [], superset: false, unilateral: false, youtubeUrl: "" };
}
function blankSegment() {
  return { id: uid(), duration: "", speed: "", incline: "" };
}

function ProgramForm({ mode, initialProgram, defaultBlockId, blocks, exerciseLibrary, gymMachines, onCancel, onCreate, onUpdate, onSaveToLibrary }) {
  const isEdit = mode === "edit";
  const [name, setName] = useState(initialProgram?.name || "");
  const [blockId, setBlockId] = useState(initialProgram?.blockId || defaultBlockId || blocks[0]?.id);
  const [showPicker, setShowPicker] = useState(false);
  const [exercises, setExercises] = useState(() => {
    if (initialProgram) {
      return initialProgram.exercises.map((e) => ({
        id: e.id,
        name: e.name,
        muscle: e.muscle,
        machine: e.machine || "",
        type: e.type || "muscu",
        repMin: String(e.repMin ?? 9),
        repMax: String(e.repMax ?? 12),
        sets: String(e.sets ?? 3),
        warmupSets: String(e.warmupSets ?? 2),
        restSeconds: String(e.restSeconds ?? 90),
        note: e.note || "",
        superset: !!e.superset,
        unilateral: !!e.unilateral,
        youtubeUrl: e.youtubeUrl || "",
        segments: (e.segments || []).map((seg) => ({
          id: uid(),
          duration: String(seg.duration ?? ""),
          speed: seg.speed != null && !isNaN(seg.speed) ? String(seg.speed) : "",
          incline: seg.incline != null ? String(seg.incline) : "",
        })),
      }));
    }
    return [];
  });

  const [justAddedId, setJustAddedId] = useState(null);
  const exerciseRefs = useRef({});

  useEffect(() => {
    if (justAddedId && exerciseRefs.current[justAddedId]) {
      exerciseRefs.current[justAddedId].scrollIntoView({ behavior: "smooth", block: "start" });
      setJustAddedId(null);
    }
  }, [justAddedId, exercises]);

  function pickFromLibrary(item) {
    const newId = uid();
    setExercises((exs) => [
      ...exs,
      {
        id: newId, name: item.name, muscle: item.muscle || "", machine: item.machine || "", type: "muscu",
        repMin: String(item.repMin ?? 9), repMax: String(item.repMax ?? 12), sets: "3", warmupSets: "2",
        restSeconds: String(item.restSeconds ?? 90), note: "", segments: [], superset: false,
        youtubeUrl: item.youtubeUrl || "",
      },
    ]);
    setShowPicker(false);
    setJustAddedId(newId);
  }

  const [savedToLibraryId, setSavedToLibraryId] = useState(null);

  if (showPicker) {
    return (
      <LibraryPicker
        library={exerciseLibrary || []}
        title="Choisir un exercice"
        groupKey="muscle"
        onPick={pickFromLibrary}
        onCancel={() => setShowPicker(false)}
      />
    );
  }

  function updateExercise(id, field, value) {
    setExercises((exs) => exs.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  }
  function addExercise() {
    const newEx = blankExercise();
    setExercises((exs) => [...exs, newEx]);
    setJustAddedId(newEx.id);
  }
  function removeExercise(id) {
    setExercises((exs) => exs.filter((e) => e.id !== id));
  }
  function moveExercise(id, direction) {
    setExercises((exs) => {
      const idx = exs.findIndex((e) => e.id === id);
      const swapWith = idx + direction;
      if (swapWith < 0 || swapWith >= exs.length) return exs;
      const next = [...exs];
      [next[idx], next[swapWith]] = [next[swapWith], next[idx]];
      return next;
    });
  }
  function saveExerciseToLibrary(ex) {
    if (!ex.name.trim() || !onSaveToLibrary) return;
    onSaveToLibrary({
      name: ex.name.trim(),
      muscle: ex.muscle.trim() || "Cardio",
      ...(ex.machine && ex.machine.trim() ? { machine: ex.machine.trim() } : {}),
      ...(ex.type !== "cardio" ? { repMin: Number(ex.repMin) || 1, repMax: Number(ex.repMax) || 1, restSeconds: Number(ex.restSeconds) || 0 } : {}),
      ...(ex.youtubeUrl && ex.youtubeUrl.trim() ? { youtubeUrl: ex.youtubeUrl.trim() } : {}),
    });
    setSavedToLibraryId(ex.id);
    setTimeout(() => setSavedToLibraryId((cur) => (cur === ex.id ? null : cur)), 2000);
  }
  function addSegment(exId) {
    setExercises((exs) => exs.map((e) => (e.id === exId ? { ...e, segments: [...e.segments, blankSegment()] } : e)));
  }
  function updateSegment(exId, segId, field, value) {
    setExercises((exs) =>
      exs.map((e) =>
        e.id === exId ? { ...e, segments: e.segments.map((s) => (s.id === segId ? { ...s, [field]: value } : s)) } : e
      )
    );
  }
  function removeSegment(exId, segId) {
    setExercises((exs) =>
      exs.map((e) => (e.id === exId ? { ...e, segments: e.segments.filter((s) => s.id !== segId) } : e))
    );
  }

  const canSave = name.trim().length > 0 && exercises.length > 0 && exercises.every((e) => e.name.trim().length > 0);

  function handleSave() {
    const program = {
      id: initialProgram?.id || uid(),
      name: name.trim(),
      blockId,
      exercises: exercises.map((e, idx) => {
        if (e.type === "cardio") {
          const segments = (e.segments || [])
            .filter((s) => s.duration !== "")
            .map((s) => ({
              duration: toDecimal(s.duration) || 0,
              speed: s.speed !== "" ? toDecimal(s.speed) : null,
              incline: s.incline !== "" ? toDecimal(s.incline) : null,
            }));
          return {
            id: e.id,
            name: e.name.trim(),
            muscle: e.muscle.trim() || "Cardio",
            type: "cardio",
            ...(e.machine && e.machine.trim() ? { machine: e.machine.trim() } : {}),
            ...(segments.length ? { segments } : {}),
            ...(idx > 0 && e.superset ? { superset: true } : {}),
            ...(e.note.trim() ? { note: e.note.trim() } : {}),
            ...(e.youtubeUrl && e.youtubeUrl.trim() ? { youtubeUrl: e.youtubeUrl.trim() } : {}),
          };
        }
        return {
          id: e.id,
          name: e.name.trim(),
          muscle: e.muscle.trim() || "—",
          type: "muscu",
          ...(e.machine && e.machine.trim() ? { machine: e.machine.trim() } : {}),
          repMin: Number(e.repMin) || 1,
          repMax: Math.max(Number(e.repMax) || Number(e.repMin) || 1, Number(e.repMin) || 1),
          sets: Number(e.sets) || 1,
          warmupSets: Number(e.warmupSets) || 0,
          restSeconds: Number(e.restSeconds) || 0,
          ...(idx > 0 && e.superset ? { superset: true } : {}),
          ...(e.unilateral ? { unilateral: true } : {}),
          ...(e.note.trim() ? { note: e.note.trim() } : {}),
          ...(e.youtubeUrl && e.youtubeUrl.trim() ? { youtubeUrl: e.youtubeUrl.trim() } : {}),
        };
      }),
    };
    if (isEdit) onUpdate(program);
    else onCreate(program);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier la séance" : "Nouvelle séance"}</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        {isEdit ? "Ajuste le nom, les exercices ou le programme associé." : "Donne-lui un nom et ajoute tes exercices."}
      </div>

      <div style={S.profileTopBar}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.profileTopLabel}>Durée estimée</div>
          <div style={S.profileTopValue}>
            ~{fmtDurationLong(roundSecondsToQuarterHour(estimateSessionSeconds({ exercises }))) || "0 min"} (échauffement et changement de machine inclus)
          </div>
        </div>
      </div>

      {gymMachines?.length > 0 && (
        <datalist id="gym-machines-datalist">
          {gymMachines.map((m) => <option key={m} value={m} />)}
        </datalist>
      )}

      <div style={S.goalInputLabel}>Nom de la séance</div>
      <input
        style={S.textInput}
        placeholder="ex : Push, Full body..."
        value={name}
        onChange={(e) => setName(e.target.value)}
      />

      {blocks.length > 1 && (
        <select style={S.selectInput} value={blockId} onChange={(e) => setBlockId(e.target.value)}>
          {blocks.map((b) => (
            <option key={b.id} value={b.id}>
              {b.name}{b.active ? " (actif)" : ""}
            </option>
          ))}
        </select>
      )}

      <div style={{ height: 6 }} />

      {exercises.map((ex, idx) => (
        <div key={ex.id} ref={(el) => { exerciseRefs.current[ex.id] = el; }} style={S.newExerciseCard}>
          <div style={S.newExerciseHead}>
            <span style={S.sectionLabel}>Exercice {idx + 1}</span>
            <div style={{ display: "flex", gap: 6 }}>
              <button style={S.reorderBtn} disabled={idx === 0} onClick={() => moveExercise(ex.id, -1)}>
                ↑
              </button>
              <button style={S.reorderBtn} disabled={idx === exercises.length - 1} onClick={() => moveExercise(ex.id, 1)}>
                ↓
              </button>
              {onSaveToLibrary && (
                <button
                  style={S.reorderBtn}
                  disabled={!ex.name.trim()}
                  onClick={() => saveExerciseToLibrary(ex)}
                  title="Enregistrer dans la bibliothèque"
                >
                  {savedToLibraryId === ex.id ? <Check size={14} /> : <Inbox size={14} />}
                </button>
              )}
              {exercises.length > 1 && (
                <button style={S.setRemoveBtn} onClick={() => removeExercise(ex.id)}>
                  <Minus size={14} />
                </button>
              )}
            </div>
          </div>

          {idx > 0 && (
            <label style={S.supersetCheckRow}>
              <input
                type="checkbox"
                checked={!!ex.superset}
                onChange={(e) => updateExercise(ex.id, "superset", e.target.checked)}
              />
              <Link2 size={13} style={{ verticalAlign: "-2px", marginRight: 4 }} />Enchaîné avec l'exercice précédent (superset, pas de repos entre les deux)
            </label>
          )}

          {ex.type !== "cardio" && (
            <label style={S.supersetCheckRow}>
              <input
                type="checkbox"
                checked={!!ex.unilateral}
                onChange={(e) => updateExercise(ex.id, "unilateral", e.target.checked)}
              />
              Exercice unilatéral (reps gauche / droite séparées pendant la séance)
            </label>
          )}

          <div style={S.typeToggleRow}>
            <button

function HistoryView({ programs, blocks, sessions, exerciseIndex, onOpenExercise, onOpenSession, onResetHistory, onBack }) {
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const [confirmReset, setConfirmReset] = useState(false);
  const [search, setSearch] = useState("");

  const programById = useMemo(() => {
    const idx = {};
    programs.forEach((p) => (idx[p.id] = p));
    return idx;
  }, [programs]);

  const sessionsByBlock = (blockId) => sessions.filter((s) => programById[s.programId]?.blockId === blockId);

  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockSessions = [...sessionsByBlock(selectedBlock?.id)].sort((a, b) => (a.date < b.date ? 1 : -1));

  const query = search.trim().toLowerCase();
  const searchResults = query
    ? [...sessions]
        .filter((s) =>
          Object.keys(s.entries).some((exId) => (exerciseIndex[exId]?.name || "").toLowerCase().includes(query))
        )
        .sort((a, b) => (a.date < b.date ? 1 : -1))
    : null;

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Programmes
      </button>
      <div style={S.pageTitle}>Historique</div>

      <div style={{ position: "relative", marginBottom: 8 }}>
        <Search size={15} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#8A5F58" }} />
        <input
          style={{ ...S.textInput, paddingLeft: 34, marginBottom: 0 }}
          placeholder="Rechercher un exercice (tous programmes)"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      {searchResults ? (
        <>
          <div style={{ ...S.caption, marginBottom: 12 }}>
            {searchResults.length} séance{searchResults.length > 1 ? "s" : ""} contenant « {search.trim()} »
          </div>
          <div style={S.programList}>
            {searchResults.map((s) => {
              const nbExercises = Object.keys(s.entries).length;
              return (
                <button key={s.id} style={S.sessionLogRow} onClick={() => onOpenSession(s)}>
                  <div>
                    <div style={S.exRowName}>{s.programName || "Séance"}</div>
                    <div style={S.caption}>{s.blockName ? `${s.blockName} · ` : ""}{nbExercises} exercices</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={S.caption}>{fmtDate(s.date)}</div>
                  </div>
                </button>
              );
            })}
            {searchResults.length === 0 && <div style={S.caption}>Aucune séance ne contient cet exercice.</div>}
          </div>
        </>
      ) : (
        <>
          <div style={{ ...S.caption, marginBottom: 12 }}>Choisis un programme pour voir ses séances.</div>

          <div style={S.blockChipsRow}>
            {blocks.map((b) => (
              <button
                key={b.id}
                style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
                onClick={() => setSelectedBlockId(b.id)}
              >
                {b.active && <span style={S.activeDot} />}
                {b.name}
              </button>
            ))}
            {blocks.length === 0 && <div style={S.caption}>Aucun programme pour l'instant.</div>}
          </div>

          <div style={{ ...S.caption, marginBottom: 12 }}>
            {blockSessions.length} séance{blockSessions.length > 1 ? "s" : ""} enregistrée{blockSessions.length > 1 ? "s" : ""}
          </div>

          <div style={S.programList}>
            {blockSessions.map((s) => {
              const nbExercises = Object.keys(s.entries).length;
              const tonnage = Object.values(s.entries).flat().reduce((a, set) => a + set.reps * set.poids, 0);
              return (
                <button key={s.id} style={S.sessionLogRow} onClick={() => onOpenSession(s)}>
                  <div>
                    <div style={S.exRowName}>{s.programName || "Séance"}</div>

                      {nbExercises} exercices · {Math.round(tonnage).toLocaleString("fr-FR")} kg

                  </div>

                    <div style={S.caption}>{fmtDate(s.date)}</div>
                    <div style={S.caption}>{fmtTime(s.date)}</div>
                  </div>
                </button>
              );
            })}
            {blockSessions.length === 0 && <div style={S.caption}>Aucune séance enregistrée dans ce programme.</div>}
          </div>
        </>
      )}

      {sessions.length > 0 && (
        <div style={{ marginTop: 12 }}>
          {confirmReset ? (
            <div style={S.confirmDeleteRow}>
              <span style={S.caption}>Effacer les {sessions.length} séances enregistrées (tous programmes) ? Irréversible.</span>

                Oui, tout effacer

function ExerciseHistory({ exercise, sessions, onBack, coachGoalValue, onSaveCoachGoal }) {
  const isCardio = exercise.type === "cardio";
  const [goalDraft, setGoalDraft] = useState(coachGoalValue || "");
  const [goalSaved, setGoalSaved] = useState(false);

  const data = sessions
    .filter((s) => s.entries[exercise.id])
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((s) => {
      const entry = s.entries[exercise.id];
      if (isCardio) {
        const segs = cardioSegments(entry);
        const totalSec = segs.reduce((a, seg) => a + (seg.durationSeconds || 0), 0);
        return {
          date: fmtDate(s.date),
          durationMin: Math.round(totalSec / 60),
          segs,
          rawDate: s.date,
        };
      }
      const sets = entry;
      const maxPoids = Math.max(...sets.map((x) => x.poids));
      const volume = sets.reduce((a, x) => a + x.reps * x.poids, 0);
      return { date: fmtDate(s.date), maxPoids, volume, sets, rawDate: s.date };
    });

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Historique
      </button>
      <div style={S.pageTitle}>{exercise.name}</div>
      <div style={S.caption}>
        {isCardio ? exercise.muscle : `${exercise.muscle} · ${exercise.sets} × ${exercise.repMin}-${exercise.repMax} reps`}
      </div>

      {data.length > 0 ? (
        <>
          <div style={S.sectionLabel}>{isCardio ? "Durée par séance (min)" : "Charge max par séance (kg)"}</div>
          <div style={S.chartCard}>
            <MiniLineChart data={data} dataKey={isCardio ? "durationMin" : "maxPoids"} height={180} />
          </div>

          <div style={S.sectionLabel}>Détail des séances</div>
          <div style={S.programList}>
            {[...data].reverse().map((d, i) => (
              <div key={i} style={S.historyRow}>
                <div style={S.caption}>{d.date}</div>
                {isCardio ? (
                  <div style={S.historySets}>
                    {d.segs.map((seg, j) => (
                      <span key={j} style={S.setChip}>
                        {Math.round((seg.durationSeconds || 0) / 60)} min
                        {seg.speed ? ` · ${seg.speed}km/h` : ""}
                        {seg.incline ? ` · pente ${seg.incline}%` : ""}
                      </span>
                    ))}
                  </div>
                ) : (
                  <div style={S.historySets}>
                    {d.sets.map((s, j) => (
                      <span key={j} style={S.setChip}>{s.repsL != null && s.repsR != null ? `${s.repsL}G/${s.repsR}D×` : `${s.reps}×`}{s.poids}kg</span>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        </>
      ) : (
        <div style={{ ...S.caption, marginTop: 24 }}>Pas encore de données pour cet exercice.</div>
      )}

      {onSaveCoachGoal && (
        <div style={S.goalInputBox}>
          <div style={S.goalInputLabel}><Target size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Objectif pour la semaine prochaine</div>
          <div style={S.goalInputRow}>
            <input
              style={S.goalInput}
              placeholder="ex : passer à 40 kg"
              value={goalDraft}
              onChange={(e) => setGoalDraft(e.target.value)}
            />
            <button
              style={S.goalSaveBtn}
              onClick={() => {
                onSaveCoachGoal(goalDraft.trim());
                setGoalSaved(true);
                setTimeout(() => setGoalSaved(false), 1500);
              }}
            >
              <Check size={16} />
            </button>
          </div>
          {goalSaved && <div style={S.exportStatus}>Objectif enregistré ✓</div>}
        </div>
      )}
    </div>
  );
}

function ImportGoalsPrompt({ program, coachName, onImportGoals, onContinue, onCancel }) {
  const [manualText, setManualText] = useState("");
  const [status, setStatus] = useState(null);

  function processText(text) {
    const parsed = unpackPayload(text);
    if (parsed && parsed.type === "GOALS") {
      onImportGoals(parsed.data);
      setStatus("ok");
      setTimeout(() => onContinue(), 900);
    } else {
      setStatus("error");
    }
  }

  async function handlePaste() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setStatus("clipboard-error");
        return;
      }
      processText(text);
    } catch (e) {
      setStatus("clipboard-error");
    }
  }

  function handleManualImport() {
    processText(manualText);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{program.name}</div>
      <div style={{ ...S.caption, marginBottom: 16 }}>Programme suivi par {coachRef(coachName)}</div>

      <div style={S.segmentsBox}>
        <div style={S.goalInputLabel}><Target size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />As-tu reçu de nouveaux objectifs de {coachRef(coachName)} pour cette séance ?</div>
        <button style={S.createBtn} onClick={handlePaste}>
          <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller les objectifs
        </button>
        {status === "ok" && <div style={S.exportStatus}>Objectifs importés ✓</div>}
        {status === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
        {status === "clipboard-error" && (
          <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
        )}
        <textarea
          style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
          rows={3}
          placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
          value={manualText}
          onChange={(e) => setManualText(e.target.value)}
        />
        {manualText && (
          <button style={S.exportBtnGhost} onClick={handleManualImport}>
            Importer ce texte
          </button>
        )}
      </div>

      <button style={S.startProgramBtn} onClick={onContinue}>
        Continuer sans importer
      </button>
    </div>
  );
}

function GoalBox({ exId, goalDrafts, setGoalDrafts, onSaveGoal, readOnly, coachName }) {
  const [saved, setSaved] = useState(false);

  if (readOnly) {
    return (
      <div style={S.goalInputBox}>
        <div style={S.goalInputLabel}><Target size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Objectif fixé par {coachRef(coachName)}</div>
        <div style={{ color: "#FFFFFF", fontSize: 13.5 }}>
          {goalDrafts[exId] ? goalDrafts[exId] : "Pas encore d'objectif reçu pour cet exercice."}
        </div>
      </div>
    );
  }

  return (
    <div style={S.goalInputBox}>
      <div style={S.goalInputLabel}><Target size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Objectif pour la semaine prochaine</div>
      <div style={S.goalInputRow}>
        <input
          style={S.goalInput}
          placeholder="ex : passer à 37,5 kg / 8 km/h"
          value={goalDrafts[exId] ?? ""}
          onChange={(e) => setGoalDrafts((d) => ({ ...d, [exId]: e.target.value }))}
        />
        <button
          style={S.goalSaveBtn}
          onClick={() => {
            onSaveGoal(exId, (goalDrafts[exId] ?? "").trim());
            setSaved(true);
            setTimeout(() => setSaved(false), 1500);
          }}
        >
          <Check size={16} />
        </button>
      </div>
      {saved && <div style={S.exportStatus}>Objectif enregistré ✓</div>}
    </div>
  );
}

function LogSession({ program, blocks, sessions, goals, onSaveGoal, onCancel, onFinish }) {
  const prevSession = [...sessions]
    .filter((s) => s.programId === program.id)
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];

  const coachedBlock = blocks?.find((b) => b.id === program.blockId && b.coached) || null;

  const savedSessionRef = useRef(null);
  if (savedSessionRef.current === null) {
    savedSessionRef.current = false;
    try {
      const raw = localStorage.getItem("charge:activeSessionState");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.programId === program.id) savedSessionRef.current = parsed;
      }
    } catch { savedSessionRef.current = false; }
  }
  const resumed = savedSessionRef.current || null;

  const [startTime] = useState(() => resumed?.startTime || Date.now()); // figé au montage : l'heure de début réelle
  const [elapsedSec, setElapsedSec] = useState(0);
  const [comment, setComment] = useState(() => resumed?.comment || "");

  useEffect(() => {
    const t = setInterval(() => setElapsedSec(Math.round((Date.now() - startTime) / 1000)), 1000);
    return () => clearInterval(t);
  }, [startTime]);

  // Minuteur de repos (par exercice) : { [exId]: { endTime, notified } }
  const [restTimers, setRestTimers] = useState(() => resumed?.restTimers || {});

  useEffect(() => {
    const t = setInterval(() => {
      setRestTimers((r) => {
        let changed = false;
        const next = { ...r };
        Object.entries(r).forEach(([exId, timer]) => {
          const remaining = Math.max(0, Math.round((timer.endTime - Date.now()) / 1000));
          if (remaining === 0 && !timer.notified) {
            next[exId] = { ...timer, notified: true };
            changed = true;
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          }
        });
        return changed ? next : r;
      });
    }, 500);
    return () => clearInterval(t);
  }, []);

  function startRest(exId, seconds) {
    setRestTimers((r) => ({ ...r, [exId]: { endTime: Date.now() + seconds * 1000, notified: false } }));
  }
  function cancelRest(exId) {
    setRestTimers((r) => {
      const next = { ...r };
      delete next[exId];
      return next;
    });
  }
  function restRemaining(exId) {
    const t = restTimers[exId];
    if (!t) return null;
    return Math.max(0, Math.round((t.endTime - Date.now()) / 1000));
  }

  const [goalDrafts, setGoalDrafts] = useState(() => {
    if (resumed?.goalDrafts) return resumed.goalDrafts;
    const init = {};
    program.exercises.forEach((ex) => { init[ex.id] = goals?.[ex.id] || ""; });
    return init;
  });

  const [draft, setDraft] = useState(() => {
    if (resumed?.draft) return resumed.draft;
    const init = {};
    program.exercises.filter((ex) => ex.type !== "cardio").forEach((ex) => {
      const prevSets = prevSession?.entries[ex.id];
      const n = Array.isArray(prevSets) ? prevSets.length : ex.sets;
      init[ex.id] = Array.from({ length: n }, (_, i) => ({
        reps: prevSets?.[i]?.reps ?? "",
        repsL: prevSets?.[i]?.repsL ?? "",
        repsR: prevSets?.[i]?.repsR ?? "",
        poids: prevSets?.[i]?.poids ?? "",
      }));
    });
    return init;
  });

  const [cardioLogs, setCardioLogs] = useState(() => {
    if (resumed?.cardioLogs) return resumed.cardioLogs;
    const init = {};
    program.exercises.filter((ex) => ex.type === "cardio").forEach((ex) => {
      if (ex.segments && ex.segments.length > 0) {
        init[ex.id] = {
          mode: "planned",
          segments: ex.segments.map((seg) => ({
            id: uid(),
            duration: String(seg.duration ?? ""),
            speed: seg.speed != null && !isNaN(seg.speed) ? String(seg.speed) : "",
            incline: seg.incline != null ? String(seg.incline) : "",
          })),
        };
      } else {
        const prevEntry = prevSession?.entries[ex.id];
        const prevSeg = !Array.isArray(prevEntry) ? cardioSegments(prevEntry)[0] : null;
        init[ex.id] = {
          mode: "simple",
          running: false,
          startedAt: null,
          elapsedSeconds: 0,
          speed: "",
          incline: "",
          prevSpeed: prevSeg?.speed ?? "",
          prevIncline: prevSeg?.incline ?? "",
        };
      }
    });
    return init;
  });

  // Sauvegarde continue de la progression pour survivre à une mise en arrière-plan / fermeture accidentelle.
  useEffect(() => {
    try {
      localStorage.setItem("charge:activeSessionState", JSON.stringify({
        programId: program.id,
        startTime,
        draft,
        cardioLogs,
        comment,
        restTimers,
        goalDrafts,
      }));
    } catch { /* stockage indisponible : tant pis, pas bloquant */ }
  }, [program.id, startTime, draft, cardioLogs, comment, restTimers, goalDrafts]);

  function clearSavedSessionState() {
    try { localStorage.removeItem("charge:activeSessionState"); } catch { /* rien à faire */ }
  }

  function toggleCardioTimer(exId) {
    setCardioLogs((c) => {
      const cur = c[exId];
      if (cur.running) {
        const added = Math.round((Date.now() - cur.startedAt) / 1000);
        return { ...c, [exId]: { ...cur, running: false, startedAt: null, elapsedSeconds: cur.elapsedSeconds + added } };
      }
      return { ...c, [exId]: { ...cur, running: true, startedAt: Date.now() } };
    });
  }
  function updateCardio(exId, field, value) {
    setCardioLogs((c) => ({ ...c, [exId]: { ...c[exId], [field]: value } }));
  }
  function cardioDisplaySeconds(exId) {
    const c = cardioLogs[exId];
    if (!c) return 0;
    return c.running ? c.elapsedSeconds + Math.round((Date.now() - c.startedAt) / 1000) : c.elapsedSeconds;
  }
  function updateCardioSegment(exId, segId, field, value) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: c[exId].segments.map((s) => (s.id === segId ? { ...s, [field]: value } : s)) },
    }));
  }
  function addCardioSegment(exId) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: [...c[exId].segments, { id: uid(), duration: "", speed: "", incline: "" }] },
    }));
  }
  function removeCardioSegment(exId, segId) {
    setCardioLogs((c) => ({
      ...c,
      [exId]: { ...c[exId], segments: c[exId].segments.filter((s) => s.id !== segId) },
    }));
  }

  function updateSet(exId, idx, field, value) {
    setDraft((d) => {
      const sets = d[exId].map((s, i) => (i === idx ? { ...s, [field]: value } : s));
      return { ...d, [exId]: sets };
    });
  }
  function addSet(exId) {
    setDraft((d) => ({ ...d, [exId]: [...d[exId], { reps: "", repsL: "", repsR: "", poids: "" }] }));
  }
  function removeSet(exId, idx) {
    setDraft((d) => ({ ...d, [exId]: d[exId].filter((_, i) => i !== idx) }));
  }

  function save() {
    const entries = {};
    Object.entries(draft).forEach(([exId, sets]) => {
      const ex = program.exercises.find((e) => e.id === exId);
      const clean = ex?.unilateral
        ? sets
            .filter((s) => s.repsL !== "" && s.repsR !== "" && s.poids !== "")
            .map((s) => ({ repsL: Number(s.repsL), repsR: Number(s.repsR), reps: Math.round((Number(s.repsL) + Number(s.repsR)) / 2), poids: Number(s.poids) }))
        : sets
            .filter((s) => s.reps !== "" && s.poids !== "")
            .map((s) => ({ reps: Number(s.reps), poids: Number(s.poids) }));
      if (clean.length) entries[exId] = clean;
    });
    Object.entries(cardioLogs).forEach(([exId, c]) => {
      if (c.mode === "planned") {
        const segments = c.segments
          .filter((s) => s.duration !== "")
          .map((s) => ({
            durationSeconds: Math.round((toDecimal(s.duration) || 0) * 60),
            speed: s.speed !== "" ? toDecimal(s.speed) : null,
            incline: s.incline !== "" ? toDecimal(s.incline) : null,
          }));
        if (segments.length) entries[exId] = { type: "cardio", segments };
      } else {
        const totalSec = c.running ? c.elapsedSeconds + Math.round((Date.now() - c.startedAt) / 1000) : c.elapsedSeconds;
        if (totalSec > 0 || c.speed !== "" || c.incline !== "") {
          entries[exId] = {
            type: "cardio",
            segments: [{ durationSeconds: totalSec, speed: c.speed !== "" ? toDecimal(c.speed) : null, incline: c.incline !== "" ? toDecimal(c.incline) : null }],
          };
        }
      }
    });
    const blockName = blocks?.find((b) => b.id === program.blockId)?.name || "";
    clearSavedSessionState();
    onFinish({
      id: uid(),
      programId: program.id,
      programName: program.name,
      blockName,
      date: new Date(startTime).toISOString(),
      durationSeconds: Math.round((Date.now() - startTime) / 1000),
      comment: comment.trim(),
      entries,
    });
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={() => { clearSavedSessionState(); onCancel(); }}>
        <X size={18} /> Annuler
      </button>
      <div style={S.sessionHeadRow}>
        <div>
          <div style={S.pageTitle}>{program.name}</div>
          <div style={{ ...S.caption, marginBottom: 8 }}>
            {prevSession ? `Dernière fois : ${fmtDate(prevSession.date)}` : "Première séance sur ce programme"}
          </div>
        </div>
        <div style={S.timerBadge}><Timer size={15} style={{ verticalAlign: "-3px", marginRight: 4 }} />{fmtDuration(elapsedSec)}</div>
      </div>

      {program.exercises.map((ex, exIndex) => {
        if (ex.type === "cardio") {
          const c = cardioLogs[ex.id];

          if (c.mode === "planned") {
            const totalMin = c.segments.reduce((a, s) => a + (toDecimal(s.duration) || 0), 0);
            return (
              <div key={ex.id} style={S.exerciseCard}>
                <div style={S.exerciseCardHead}>
                  <div style={S.exRowName}>{ex.superset && <Link2 size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}{ex.name}</div>
                  {ex.superset && <div style={S.caption}>Superset — enchaîné sans repos</div>}
                  <div style={S.caption}>{ex.muscle}</div>
                  <div style={S.caption}>Programme : {totalMin} min au total</div>
                  {ex.note && <div style={S.exNote}>{ex.note}</div>}
                  {ex.youtubeUrl && (
                    <a href={ex.youtubeUrl} target="_blank" rel="noopener noreferrer" style={S.youtubeLink}>
                      <Play size={12} style={{ verticalAlign: "-2px", marginRight: 4 }} />Voir la vidéo
                    </a>
                  )}
                </div>

                <div style={S.setsHeader}>
                  <span style={S.setsHeaderCol}>Segment</span>
                  <span style={S.setsHeaderCol}>Min</span>
                  <span style={S.setsHeaderCol}>km/h</span>
                  <span style={S.setsHeaderCol}>Pente %</span>
                  <span style={{ width: 28 }} />
                </div>
                {c.segments.map((seg, si) => (
                  <div key={seg.id} style={S.setRow}>
                    <span style={S.setNum}>{si + 1}</span>
                    <input
                      style={S.setInput}
                      inputMode="numeric"
                      value={seg.duration}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "duration", e.target.value.replace(/[^0-9]/g, ""))}
                    />
                    <input
                      style={S.setInput}
                      inputMode="decimal"
                      value={seg.speed}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "speed", e.target.value.replace(/[^0-9.,]/g, ""))}
                    />
                    <input
                      style={S.setInput}
                      inputMode="decimal"
                      value={seg.incline}
                      onChange={(e) => updateCardioSegment(ex.id, seg.id, "incline", e.target.value.replace(/[^0-9.,]/g, ""))}
                    />
                    <button style={S.setRemoveBtn} onClick={() => removeCardioSegment(ex.id, seg.id)}>
                      <Minus size={14} />
                    </button>
                  </div>
                ))}
                <button style={S.addSetBtn} onClick={() => addCardioSegment(ex.id)}>
                  <Plus size={14} /> Ajouter un segment
                </button>

                <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} readOnly={coachedBlock} coachName={coachedBlock?.coachName} />
              </div>
            );
          }

          const displaySec = cardioDisplaySeconds(ex.id);
          return (
            <div key={ex.id} style={S.exerciseCard}>
              <div style={S.exerciseCardHead}>
                <div style={S.exRowName}>{ex.superset && <Link2 size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}{ex.name}</div>
                {ex.superset && <div style={S.caption}>Superset — enchaîné sans repos</div>}
                <div style={S.caption}>{ex.muscle}</div>
                {ex.note && <div style={S.exNote}>{ex.note}</div>}
                {ex.youtubeUrl && (
                  <a href={ex.youtubeUrl} target="_blank" rel="noopener noreferrer" style={S.youtubeLink}>
                    <Play size={12} style={{ verticalAlign: "-2px", marginRight: 4 }} />Voir la vidéo
                  </a>
                )}
              </div>

              <div style={S.cardioTimerRow}>
                <div style={S.cardioTimerDisplay}><Timer size={17} style={{ verticalAlign: "-3px", marginRight: 4 }} />{fmtDuration(displaySec)}</div>
                <button
                  style={c.running ? S.cardioStopBtn : S.cardioStartBtn}
                  onClick={() => toggleCardioTimer(ex.id)}
                >
                  {c.running ? <><Square size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Arrêter</> : <><Play size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Démarrer</>}
                </button>
              </div>

              <div style={S.newExerciseRow}>
                <label style={S.smallLabel}>
                  Vitesse (km/h)
                  <input
                    style={S.smallInput}
                    inputMode="decimal"
                    placeholder={c.prevSpeed ? String(c.prevSpeed) : "-"}
                    value={c.speed}
                    onChange={(e) => updateCardio(ex.id, "speed", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                </label>
                <label style={S.smallLabel}>
                  Pente (%)
                  <input
                    style={S.smallInput}
                    inputMode="decimal"
                    placeholder={c.prevIncline ? String(c.prevIncline) : "-"}
                    value={c.incline}
                    onChange={(e) => updateCardio(ex.id, "incline", e.target.value.replace(/[^0-9.,]/g, ""))}
                  />
                </label>
              </div>

              <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} readOnly={coachedBlock} coachName={coachedBlock?.coachName} />
            </div>
          );
        }

        const prevSets = prevSession?.entries[ex.id];

        return (
          <div key={ex.id} style={S.exerciseCard}>
            <div style={S.exerciseCardHead}>
              <div style={S.exRowName}>{ex.superset && <Link2 size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}{ex.name}</div>
              {ex.superset && <div style={S.caption}>Superset — enchaîné sans repos</div>}
              <div style={S.caption}>{ex.muscle}</div>
              <div style={S.caption}>Fourchette : {ex.repMin}-{ex.repMax} reps</div>
              {ex.restSeconds ? <div style={S.caption}>Repos : {fmtRestTime(ex.restSeconds)}</div> : null}
              {ex.note && <div style={S.exNote}>{ex.note}</div>}
              {ex.youtubeUrl && (
                <a href={ex.youtubeUrl} target="_blank" rel="noopener noreferrer" style={S.youtubeLink}>
                  <Play size={12} style={{ verticalAlign: "-2px", marginRight: 4 }} />Voir la vidéo
                </a>
              )}
            </div>

            <div style={S.setsHeader}>
              <span style={S.setsHeaderCol}>Série</span>
              {ex.unilateral ? (
                <>
                  <span style={S.setsHeaderCol}>G</span>
                  <span style={S.setsHeaderCol}>D</span>
                </>
              ) : (
                <span style={S.setsHeaderCol}>Reps</span>
              )}
              <span style={S.setsHeaderCol}>Poids (kg)</span>
              <span style={{ width: 28 }} />
            </div>
            {draft[ex.id].map((s, idx) => (
              <div key={idx} style={S.setRow}>
                <span style={S.setNum}>{idx + 1}</span>
                {ex.unilateral ? (
                  <>
                    <input
                      style={S.setInput}
                      inputMode="numeric"
                      placeholder={prevSets?.[idx] ? String(prevSets[idx].repsL ?? prevSets[idx].reps) : "-"}
                      value={s.repsL}
                      onChange={(e) => updateSet(ex.id, idx, "repsL", e.target.value.replace(/[^0-9]/g, ""))}
                    />
                    <input
                      style={S.setInput}
                      inputMode="numeric"
                      placeholder={prevSets?.[idx] ? String(prevSets[idx].repsR ?? prevSets[idx].reps) : "-"}
                      value={s.repsR}
                      onChange={(e) => updateSet(ex.id, idx, "repsR", e.target.value.replace(/[^0-9]/g, ""))}
                    />
                  </>
                ) : (
                  <input
                    style={S.setInput}
                    inputMode="numeric"
                    placeholder={prevSets?.[idx] ? String(prevSets[idx].reps) : "-"}
                    value={s.reps}
                    onChange={(e) => updateSet(ex.id, idx, "reps", e.target.value.replace(/[^0-9]/g, ""))}
                  />
                )}
                <input
                  style={S.setInput}
                  inputMode="decimal"
                  placeholder={prevSets?.[idx] ? String(prevSets[idx].poids) : "-"}
                  value={s.poids}
                  onChange={(e) => updateSet(ex.id, idx, "poids", e.target.value.replace(/[^0-9.,]/g, ""))}
                />
                <button style={S.setRemoveBtn} onClick={() => removeSet(ex.id, idx)}>
                  <Minus size={14} />
                </button>
              </div>
            ))}
            <button style={S.addSetBtn} onClick={() => addSet(ex.id)}>
              <Plus size={14} /> Ajouter une série
            </button>

            {ex.restSeconds && !program.exercises[exIndex + 1]?.superset ? (
              <div style={S.restRow}>
                {restTimers[ex.id] ? (
                  <>
                    <div style={{ ...S.restBadge, ...(restRemaining(ex.id) === 0 ? S.restBadgeDone : {}) }}>
                      {restRemaining(ex.id) === 0 ? <><CheckCircle2 size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Repos terminé</> : <><Timer size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />{fmtDuration(restRemaining(ex.id))}</>}
                    </div>
                    <button style={S.restCancelBtn} onClick={() => cancelRest(ex.id)}>
                      {restRemaining(ex.id) === 0 ? "OK" : "Annuler"}
                    </button>
                  </>
                ) : (
                  <button style={S.restStartBtn} onClick={() => startRest(ex.id, ex.restSeconds)}>
                    <Timer size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Démarrer le repos ({fmtRestTime(ex.restSeconds)})
                  </button>
                )}
              </div>
            ) : null}

            <GoalBox exId={ex.id} goalDrafts={goalDrafts} setGoalDrafts={setGoalDrafts} onSaveGoal={onSaveGoal} readOnly={coachedBlock} coachName={coachedBlock?.coachName} />
          </div>
        );
      })}

      <div style={S.commentBox}>
        <div style={S.sectionLabel}>Ressenti de la séance</div>
        <textarea
          style={S.commentInput}
          placeholder="Mental, fatigue, sommeil, motivation... (optionnel)"
          value={comment}
          onChange={(e) => setComment(e.target.value)}
          rows={3}
        />
      </div>

      <button style={S.finishBtn} onClick={save}>
        <Check size={18} /> Terminer la séance
      </button>
      <div style={{ height: 24 }} />
    </div>
  );
}
