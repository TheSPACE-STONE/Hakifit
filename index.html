      ))}
      {grouped.length === 0 && <div style={{ ...S.caption, marginTop: 12 }}>Aucun repas validé pour l'instant.</div>}
    </div>
  );
}

function ShoppingListView({ blockName, meals, onBack, dishLibrary, pantry, onAddPantryItem, onRemovePantryItem, stores, dishCollections }) {
  const [loops, setLoops] = useState(1);
  const [copied, setCopied] = useState(false);
  const [showPantry, setShowPantry] = useState(false);
  const [pickingPantry, setPickingPantry] = useState(false);
  const [pendingPantryPick, setPendingPantryPick] = useState(null);
  const [pendingQty, setPendingQty] = useState("100");
  const [pendingUnit, setPendingUnit] = useState("g");
  const [priceStoreId, setPriceStoreId] = useState("");
  const [hiddenItems, setHiddenItems] = useState({});
  const [pantryDrafts, setPantryDrafts] = useState({});
  const [importedList, setImportedList] = useState(null); // liste reçue d'une autre personne
  const [showListImport, setShowListImport] = useState(false);
  const [listImportText, setListImportText] = useState("");
  const [listImportStatus, setListImportStatus] = useState(null);
  const [exportListText, setExportListText] = useState(null);

  const myPantry = pantry || [];
  const list = useMemo(
    () => buildShoppingList(meals, loops, dishLibrary, myPantry, priceStoreId, dishCollections),
    [meals, loops, dishLibrary, myPantry, priceStoreId, dishCollections]
  );

  // Fusionne la liste locale avec une liste importée (autre personne du foyer) :
  // les aliments identiques voient leurs quantités additionnées plutôt que dupliquées.
  const mergedList = useMemo(() => {
    if (!importedList) return list;
    const byKey = new Map();
    [...list, ...importedList].forEach((item) => {
      const key = item.sortKey;
      if (!byKey.has(key)) { byKey.set(key, { ...item }); return; }
      const cur = byKey.get(key);
      const a = parseFloat(String(cur.qtyLabel).replace(",", "."));
      const b = parseFloat(String(item.qtyLabel).replace(",", "."));
      const unit = String(cur.qtyLabel).replace(/[0-9.,\s]/g, "");
      const unitB = String(item.qtyLabel).replace(/[0-9.,\s]/g, "");
      if (!isNaN(a) && !isNaN(b) && unit === unitB) {
        const sum = Math.round((a + b) * 10) / 10;
        byKey.set(key, { ...cur, qtyLabel: unit ? `${sum} ${unit}`.trim() : String(sum), text: `${cur.name} ${sum}${unit}` });
      } else {
        byKey.set(key, { ...cur, qtyLabel: `${cur.qtyLabel} + ${item.qtyLabel}` });
      }
    });
    return Array.from(byKey.values()).sort((x, y) => x.sortKey.localeCompare(y.sortKey, "fr"));
  }, [list, importedList]);

  const visibleList = mergedList.filter((item) => !hiddenItems[item.sortKey]);

  function commitPantryDraft(item) {
    const key = item.alimentId || `name:${item.sortKey}`;
    const raw = (pantryDrafts[key] ?? "").trim();
    const existing = item.alimentId
      ? myPantry.find((p) => p.alimentId === item.alimentId)
      : myPantry.find((p) => !p.alimentId && (p.name || "").trim().toLowerCase() === item.sortKey);
    if (!raw) {
      if (existing) onRemovePantryItem?.(existing.id);
      return;
    }
    const m = raw.match(/^([0-9]+(?:[.,][0-9]+)?)\s*(.*)$/);
    if (!m) return;
    const qty = m[1].replace(",", ".");
    const unit = (m[2] || "g").trim() || "g";
    if (existing) onRemovePantryItem?.(existing.id);
    if (item.alimentId) onAddPantryItem?.({ alimentId: item.alimentId, qty, unit });
    else onAddPantryItem?.({ name: item.name, qty, unit });
  }

  function handleExportList() {
    setExportListText(packPayload("SHOPLIST", { blockName, loops, items: visibleList.map(({ text, qtyLabel, name, sortKey }) => ({ text, qtyLabel, name, sortKey })) }));
  }

  function handleImportList() {
    const parsed = unpackPayload(listImportText);
    if (!parsed || parsed.type !== "SHOPLIST" || !Array.isArray(parsed.data.items)) {
      setListImportStatus("error");
      setTimeout(() => setListImportStatus(null), 2500);
      return;
    }
    setImportedList(parsed.data.items);
    setListImportStatus("ok");
    setListImportText("");
    setShowListImport(false);
    setTimeout(() => setListImportStatus(null), 2500);
  }

  const priceRange = useMemo(() => {
    let min = 0, max = 0, hasAny = false;
    list.forEach((item) => {
      if (item.priceMin != null) { min += item.priceMin; hasAny = true; }
      if (item.priceMax != null) { max += item.priceMax; hasAny = true; }
    });
    return hasAny ? { min: Math.round(min * 100) / 100, max: Math.round(max * 100) / 100 } : null;
  }, [list]);

  async function handleCopy() {
    try {
      await navigator.clipboard.writeText(shoppingListText(blockName, list, loops));
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      setCopied(false);
    }
  }

  function confirmPantryPick() {
    if (!pendingPantryPick) return;
    onAddPantryItem({ alimentId: pendingPantryPick.id, qty: pendingQty, unit: pendingUnit });
    setPendingPantryPick(null);
  }

  if (pickingPantry) {
    return (
      <LibraryPicker
        library={dishLibrary || []}
        title="Choisir un aliment déjà présent"
        groupKey="category"
        onPick={(item) => {
          setPickingPantry(false);
          setPendingPantryPick(item);
          setPendingQty(item.unitWeight != null ? "1" : "100");
          setPendingUnit(item.unitWeight != null ? "unité" : "g");
        }}
        onCancel={() => setPickingPantry(false)}
      />
    );
  }

  if (pendingPantryPick) {
    return (
      <div style={S.page}>
        <button style={S.backBtn} onClick={() => setPendingPantryPick(null)}>
          <X size={18} /> Annuler
        </button>
        <div style={S.pageTitle}>{pendingPantryPick.name}</div>
        <div style={{ ...S.caption, marginBottom: 14 }}>Quelle quantité as-tu déjà dans ton placard ?</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input style={{ ...S.textInput, flex: 1 }} type="number" value={pendingQty} onChange={(e) => setPendingQty(e.target.value)} />
          <select style={{ ...S.selectInput, width: 110 }} value={pendingUnit} onChange={(e) => setPendingUnit(e.target.value)}>
            <option value="g">grammes</option>
            {pendingPantryPick.unitWeight != null && <option value="unité">unité(s)</option>}
          </select>
        </div>
        <button style={{ ...S.finishBtn, marginTop: 14 }} onClick={confirmPantryPick}>
          <Check size={18} /> Ajouter au placard
        </button>
      </div>
    );
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Nutrition
      </button>
      <div style={S.pageTitle}>Liste de courses</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>{blockName}</div>

      {stores?.length > 0 && (
        <>
          <div style={S.goalInputLabel}>Magasin (pour estimer le prix)</div>
          <select style={S.textInput} value={priceStoreId} onChange={(e) => setPriceStoreId(e.target.value)}>
            <option value="">Prix par défaut de chaque aliment</option>
            {stores.map((s) => (
              <option key={s.id} value={s.id}>{s.name}{s.city ? ` (${s.city})` : ""}</option>
            ))}
          </select>
        </>
      )}

      <div style={S.goalInputLabel}>Nombre de boucles du programme</div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <button style={S.blockChipAdd} onClick={() => setLoops((n) => Math.max(1, n - 1))}>
          <Minus size={14} />
        </button>
        <span style={{ fontSize: 18, fontWeight: 700, minWidth: 24, textAlign: "center" }}>{loops}</span>
        <button style={S.blockChipAdd} onClick={() => setLoops((n) => n + 1)}>
          <Plus size={14} />
        </button>
        <span style={S.caption}>{loops > 1 ? `boucles (${loops} fois le cycle complet)` : "boucle (le cycle complet)"}</span>
      </div>

      {onAddPantryItem && (
        <button style={{ ...S.exportBtnGhost, marginBottom: 8 }} onClick={() => setShowPantry((v) => !v)}>
          <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />
          Mon placard{myPantry.length > 0 ? ` (${myPantry.length})` : ""}
        </button>
      )}
      {showPantry && onAddPantryItem && (
        <div style={S.segmentsBox}>
          <div style={{ ...S.caption, marginBottom: 8 }}>
            Ce que tu as déjà est déduit automatiquement de la liste ci-dessous.
          </div>
          {myPantry.map((p) => {
            const aliment = (dishLibrary || []).find((a) => a.id === p.alimentId);
            return (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <span>{aliment?.name || "Aliment supprimé"} — {p.qty}{p.unit === "unité" ? " unité(s)" : p.unit}</span>
                <button style={S.setRemoveBtn} onClick={() => onRemovePantryItem(p.id)}>
                  <Minus size={14} />
                </button>
              </div>
            );
          })}
          {myPantry.length === 0 && <div style={{ ...S.caption, marginBottom: 8 }}>Rien renseigné pour l'instant.</div>}
          <button style={S.createBtn} onClick={() => setPickingPantry(true)}>
            <Plus size={16} /> Ajouter ce que j'ai déjà
          </button>
        </div>
      )}

      {priceRange && (
        <div style={{ ...S.programRowGlow, marginBottom: 14 }}>
          <div>
            <span style={S.programRowName}>
              {priceRange.min === priceRange.max ? `${priceRange.min} €` : `${priceRange.min} € — ${priceRange.max} €`}
            </span>
            <div style={S.caption}>Prix théorique estimé pour cette liste</div>
          </div>
        </div>
      )}

      {visibleList.length > 0 && (
        <div style={S.shopHeaderRow}>
          <span style={{ ...S.shopColQty, ...S.shopHeaderCell }}>Quantité</span>
          <span style={{ ...S.shopColName, ...S.shopHeaderCell }}>Aliment</span>
          <span style={{ ...S.shopColPantry, ...S.shopHeaderCell }}>Placard</span>
          <span style={{ width: 30 }} />
        </div>
      )}
      <div style={S.programList}>
        {visibleList.map((item, i) => {
          const pantryKey = item.alimentId || `name:${item.sortKey}`;
          const pantryEntry = item.alimentId
            ? myPantry.find((p) => p.alimentId === item.alimentId)
            : myPantry.find((p) => !p.alimentId && (p.name || "").trim().toLowerCase() === item.sortKey);
          return (
            <div key={i} style={S.shopRow}>
              <div style={S.shopRowMain}>
                <span style={S.shopColQty}>{item.qtyLabel || "—"}</span>
                <span style={S.shopColName}>{item.name}</span>
                <span style={S.shopColPantry}>
                  <input
                    style={S.shopPantryInput}
                    placeholder="reste"
                    value={pantryDrafts[pantryKey] ?? (pantryEntry ? `${pantryEntry.qty}${pantryEntry.unit || ""}` : "")}
                    onChange={(e) => setPantryDrafts((d) => ({ ...d, [pantryKey]: e.target.value }))}
                    onBlur={() => commitPantryDraft(item)}
                  />
                </span>
                <button style={S.setRemoveBtn} title="Retirer de la liste" onClick={() => setHiddenItems((h) => ({ ...h, [item.sortKey]: true }))}>
                  <Minus size={14} />
                </button>
              </div>
              {(item.deductedFromPantry || item.purchaseNote || item.priceMin != null) && (
                <div style={S.caption}>
                  {item.deductedFromPantry ? "Déduit de ton placard. " : ""}
                  {item.priceMin != null ? `${item.priceMin === item.priceMax ? `${item.priceMin} €` : `${item.priceMin}-${item.priceMax} €`}. ` : ""}
                  {item.purchaseNote || ""}
                </div>
              )}
            </div>
          );
        })}
        {visibleList.length === 0 && <div style={S.caption}>Aucun ingrédient trouvé — ajoute des détails à tes plats.</div>}
      </div>
      {Object.keys(hiddenItems).length > 0 && (
        <button style={{ ...S.exportBtnGhost, marginBottom: 10 }} onClick={() => setHiddenItems({})}>
          Réafficher les {Object.keys(hiddenItems).length} aliment(s) retiré(s)
        </button>
      )}

      {visibleList.length > 0 && (
        <button style={S.createBtn} onClick={handleCopy}>
          <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Copier la liste
        </button>
      )}
      {copied && <div style={S.exportStatus}>Liste copiée ✓ — colle-la où tu veux.</div>}

      <div style={{ ...S.sectionLabel, marginTop: 18 }}>Partager avec quelqu'un d'autre</div>
      <div style={{ ...S.caption, marginBottom: 8 }}>
        Si plusieurs personnes du foyer suivent chacune leur nutrition, la personne qui fait les courses peut importer les autres listes ici : les aliments identiques sont automatiquement additionnés.
      </div>
      {importedList && (
        <div style={{ ...S.caption, marginBottom: 8, color: "#FFC233" }}>
          Une liste extérieure est fusionnée avec la tienne.{" "}
          <button style={S.blockChipAdd} onClick={() => setImportedList(null)}>Retirer</button>
        </div>
      )}
      {visibleList.length > 0 && (
        <button style={{ ...S.exportBtnGhost, marginBottom: 8 }} onClick={handleExportList}>
          <Smartphone size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Extraire cette liste (à envoyer)
        </button>
      )}
      {exportListText && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Texte à copier :</div>
          <textarea readOnly style={{ ...S.commentInput, marginBottom: 8 }} rows={4} value={exportListText} onFocus={(e) => e.target.select()} />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={() => navigator.clipboard?.writeText(exportListText)}>Copier</button>
            <button style={S.exportBtnGhost} onClick={() => setExportListText(null)}>Fermer</button>
          </div>
        </div>
      )}
      {showListImport ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Colle ici la liste reçue :</div>
          {listImportStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — il doit commencer par ##HAKIFIT-SHOPLIST##.</div>}
          <textarea style={{ ...S.commentInput, marginBottom: 8 }} rows={4} value={listImportText} onChange={(e) => setListImportText(e.target.value)} />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={handleImportList}>Fusionner</button>
            <button style={S.exportBtnGhost} onClick={() => setShowListImport(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={S.exportBtnGhost} onClick={() => setShowListImport(true)}>
          <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Importer une autre liste
        </button>
      )}
      {listImportStatus === "ok" && <div style={S.exportStatus}>Listes fusionnées ✓</div>}
      <div style={{ height: 24 }} />
    </div>
  );
}

function NutritionView({ meals, blocks, onCreateMeal, onEditMeal, onDeleteMeal, onCreateBlock, onSetActiveBlock, onUpdateBlock, onDeleteBlock, onImportCoachMealPlan, coachDisplayName, coachPhone, mealLogs, onLogMeal, onUpdateMealLog, onOpenMealHistory, dishLibrary, onOpenBilan, pantry, onAddPantryItem, onRemovePantryItem, stores, dishCollections }) {
  const activeBlock = blocks.find((b) => b.active);
  const [selectedBlockId, setSelectedBlockId] = useState(activeBlock?.id || blocks[0]?.id);
  const [open, setOpen] = useState(null);
  const [openDish, setOpenDish] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showNewBlock, setShowNewBlock] = useState(false);
  const [newBlockName, setNewBlockName] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [editingBlock, setEditingBlock] = useState(false);
  const [confirmDeleteBlock, setConfirmDeleteBlock] = useState(false);
  const [editBlockName, setEditBlockName] = useState("");
  const [editBlockCoached, setEditBlockCoached] = useState(false);
  const [editTargetCalories, setEditTargetCalories] = useState("");
  const [editTargetProtein, setEditTargetProtein] = useState("");
  const [editTargetCarbs, setEditTargetCarbs] = useState("");
  const [editTargetFat, setEditTargetFat] = useState("");
  const [openDay, setOpenDay] = useState(1);
  const [showShoppingList, setShowShoppingList] = useState(false);
  const [loggingMeal, setLoggingMeal] = useState(null); // { mealId, status }
  const [reEditingMealId, setReEditingMealId] = useState(null);

  function getTodayLog(mealId) {
    const todayStr = new Date().toISOString().slice(0, 10);
    return [...mealLogs].reverse().find((l) => l.mealId === mealId && l.date === todayStr);
  }

  function dayNutritionSummary(day) {
    const kcal = sumMealsCalories(mealsByDay[day]);
    const macros = sumMealsMacros(mealsByDay[day]);
    if (kcal == null && !macros) return null;
    let text = "";
    if (kcal != null) {
      text += selectedBlock?.targetCalories ? `${kcal}/${selectedBlock.targetCalories} kcal` : `${kcal} kcal`;
    }
    if (macros) {
      const parts = [];
      if (macros.protein) parts.push(`P${macros.protein}${selectedBlock?.targetProtein ? `/${selectedBlock.targetProtein}` : ""}`);
      if (macros.carbs) parts.push(`G${macros.carbs}${selectedBlock?.targetCarbs ? `/${selectedBlock.targetCarbs}` : ""}`);
      if (macros.fat) parts.push(`L${macros.fat}${selectedBlock?.targetFat ? `/${selectedBlock.targetFat}` : ""}`);
      if (parts.length) text += (text ? " · " : "") + parts.join(" ");
    }
    return text || null;
  }

  function handleLogMeal(meal, status, payload) {
    const existingLog = getTodayLog(meal.id);
    if (existingLog && reEditingMealId === meal.id) {
      onUpdateMealLog(existingLog.id, { status, note: payload.note || "", changes: payload.changes || [] });
    } else {
      onLogMeal({ mealId: meal.id, mealName: meal.name, status, ...payload });
    }
    setLoggingMeal(null);
    setReEditingMealId(null);
  }

  const selectedBlock = blocks.find((b) => b.id === selectedBlockId) || activeBlock;
  const blockMeals = meals.filter((m) => !m.deleted && m.blockId === selectedBlock?.id);

  const mealsByDay = useMemo(() => {
    const map = {};
    blockMeals.forEach((m) => {
      const d = m.day || 1;
      if (!map[d]) map[d] = [];
      map[d].push(m);
    });
    return map;
  }, [blockMeals]);
  const dayNumbers = Object.keys(mealsByDay).map(Number).sort((a, b) => a - b);
  const maxDay = dayNumbers.length ? Math.max(...dayNumbers) : 0;

  if (showShoppingList) {
    return (
      <ShoppingListView
        blockName={selectedBlock?.name || "Programme nutrition"}
        meals={blockMeals}
        onBack={() => setShowShoppingList(false)}
        dishLibrary={dishLibrary}
        pantry={pantry}
        onAddPantryItem={onAddPantryItem}
        onRemovePantryItem={onRemovePantryItem}
        stores={stores}
        dishCollections={dishCollections}
      />
    );
  }

  function handleCreateBlock() {
    if (!newBlockName.trim()) return;
    const id = onCreateBlock(newBlockName.trim());
    setSelectedBlockId(id);
    setNewBlockName("");
    setShowNewBlock(false);
  }

  function processImportText(text) {
    const parsed = unpackPayload(text);
    if (!parsed || parsed.type !== "MEALPLAN") {
      setImportStatus("error");
      setTimeout(() => setImportStatus(null), 3000);
      return;
    }
    const newBlockId = onImportCoachMealPlan(parsed.data, parsed.data.coachName);
    setSelectedBlockId(newBlockId);
    setImportStatus("ok");
    setImportText("");
    setTimeout(() => setImportStatus(null), 3000);
  }

  function handleImport() {
    processImportText(importText);
  }

  async function handlePasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) {
        setImportStatus("error");
        setTimeout(() => setImportStatus(null), 3000);
        return;
      }
      processImportText(text);
    } catch (e) {
      setImportStatus("clipboard-error");
      setTimeout(() => setImportStatus(null), 3000);
    }
  }

  function openEditBlock() {
    setEditBlockName(selectedBlock?.name || "");
    setEditBlockCoached(!!selectedBlock?.coached);
    setEditTargetCalories(selectedBlock?.targetCalories != null ? String(selectedBlock.targetCalories) : "");
    setEditTargetProtein(selectedBlock?.targetProtein != null ? String(selectedBlock.targetProtein) : "");
    setEditTargetCarbs(selectedBlock?.targetCarbs != null ? String(selectedBlock.targetCarbs) : "");
    setEditTargetFat(selectedBlock?.targetFat != null ? String(selectedBlock.targetFat) : "");
    setEditingBlock(true);
  }

  function saveEditBlock() {
    if (!editBlockName.trim() || !selectedBlock) return;
    onUpdateBlock(selectedBlock.id, {
      name: editBlockName.trim(),
      coached: editBlockCoached,
      ...(editBlockCoached && coachDisplayName ? { coachName: coachDisplayName } : { coachName: "" }),
      targetCalories: editTargetCalories !== "" && !isNaN(Number(editTargetCalories)) ? Number(editTargetCalories) : null,
      targetProtein: editTargetProtein !== "" && !isNaN(Number(editTargetProtein)) ? Number(editTargetProtein) : null,
      targetCarbs: editTargetCarbs !== "" && !isNaN(Number(editTargetCarbs)) ? Number(editTargetCarbs) : null,
      targetFat: editTargetFat !== "" && !isNaN(Number(editTargetFat)) ? Number(editTargetFat) : null,
    });
    setEditingBlock(false);
  }

  function handleDeleteBlock() {
    if (!selectedBlock || blocks.length <= 1) return;
    onDeleteBlock(selectedBlock.id);
    const next = blocks.find((b) => b.id !== selectedBlock.id);
    if (next) setSelectedBlockId(next.id);
    setEditingBlock(false);
    setConfirmDeleteBlock(false);
  }

  return (
    <div style={S.page}>
      <div style={S.pageTitle}>Nutrition</div>

      <div style={{ ...S.caption, marginBottom: 12 }}>
        Un programme nutrition regroupe plusieurs repas. Un seul programme est suivi à la fois — les autres restent en pause.
      </div>
      <button style={S.historyLinkBtn} onClick={onOpenMealHistory}>
        <TrendingUp size={14} style={{ marginRight: 5 }} />
        Voir l'historique
      </button>
      {onOpenBilan && (
        <button style={{ ...S.historyLinkBtn, marginLeft: 8 }} onClick={onOpenBilan}>
          <Flame size={14} style={{ marginRight: 5 }} />
          Voir le Bilan journalier
        </button>
      )}

      <div style={S.blockChipsRow}>
        {blocks.map((b) => (
          <button
            key={b.id}
            style={{ ...S.blockChip, ...(selectedBlockId === b.id ? S.blockChipSelected : {}) }}
            onClick={() => setSelectedBlockId(b.id)}
          >
            {b.active && <span style={S.activeDot} />}
            {b.coached && <GraduationCap size={13} style={{ verticalAlign: "-2px", marginRight: 2 }} />}
            {b.name}
          </button>
        ))}
        {selectedBlock && (
          <button style={S.blockChipAdd} onClick={openEditBlock}>
            <Pencil size={14} />
          </button>
        )}
        <button style={S.blockChipAdd} onClick={() => setShowNewBlock((v) => !v)}>
          <Plus size={14} />
        </button>
        <button style={S.blockChipAdd} onClick={() => setShowImport((v) => !v)}>
          <Inbox size={14} />
        </button>
      </div>

      {selectedBlock?.coached && selectedBlock?.locked && (
        <div style={{ ...S.caption, marginBottom: 10 }}>
          <Link2 size={12} style={{ verticalAlign: "-2px", marginRight: 4 }} />
          Ce plan nutrition est verrouillé par {coachRef(selectedBlock.coachName)} — non modifiable. Tu peux toujours le supprimer via le crayon ci-dessus.
        </div>
      )}

      {showImport && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Reçu de {coachRef(coachDisplayName)} (plan nutrition) :</div>
          <button style={S.createBtn} onClick={handlePasteClipboard}>
            <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Coller et importer
          </button>
          {importStatus === "ok" && <div style={S.exportStatus}>Plan importé ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie que tu as bien copié le bon message.</div>}
          {importStatus === "clipboard-error" && (
            <div style={S.exportStatusError}>Impossible de lire le presse-papier — colle le texte manuellement ci-dessous.</div>
          )}
          <textarea
            style={{ ...S.commentInput, marginTop: 10, marginBottom: 8 }}
            rows={3}
            placeholder="...ou colle ici manuellement si le bouton ne fonctionne pas"
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
          />
          {importText && (
            <button style={S.exportBtnGhost} onClick={handleImport}>
              Importer ce texte
            </button>
          )}
        </div>
      )}

      {showNewBlock && (
        <div style={S.newBlockRow}>
          <input
            style={S.textInput}
            placeholder="Nom du programme (ex : Prise de masse)"
            value={newBlockName}
            onChange={(e) => setNewBlockName(e.target.value)}
          />
          <button style={S.goalSaveBtn} onClick={handleCreateBlock}>
            <Check size={16} />
          </button>
        </div>
      )}

      {selectedBlock && selectedBlock.id !== activeBlock?.id && (
        <div style={S.notActiveBanner}>
          <span>Ce programme n'est pas suivi actuellement.</span>
          <button style={S.activateBtn} onClick={() => onSetActiveBlock(selectedBlock.id)}>
            Suivre ce programme
          </button>
        </div>
      )}

      {editingBlock && (
        <div style={S.segmentsBox}>
          {selectedBlock?.coached && selectedBlock?.locked && (
            <div style={{ ...S.caption, marginBottom: 10 }}>
              Verrouillé par {coachRef(selectedBlock.coachName)} — seule la suppression est possible.
            </div>
          )}
          <div style={S.goalInputLabel}>Nom du programme</div>
          <input
            style={S.textInput}
            value={editBlockName}
            onChange={(e) => setEditBlockName(e.target.value)}
            disabled={selectedBlock?.coached && selectedBlock?.locked}
          />
          <label style={S.supersetCheckRow}>
            <input type="checkbox" checked={editBlockCoached} onChange={(e) => setEditBlockCoached(e.target.checked)} disabled={selectedBlock?.coached && selectedBlock?.locked} />
            <GraduationCap size={13} style={{ verticalAlign: "-2px", marginRight: 4 }} />
            Ce programme est suivi par un coach
          </label>
          {editBlockCoached && (
            <div style={{ ...S.caption, marginBottom: 8 }}>
              {coachDisplayName ? `Coach : ${coachDisplayName} (choisi dans Paramètres)` : "Choisis d'abord un coach dans Paramètres pour qu'il apparaisse ici."}
            </div>
          )}

          {!(selectedBlock?.coached && selectedBlock?.locked) && (
            <>
              <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Objectif quotidien (optionnel)</div>
              <input style={S.textInput} type="number" placeholder="Calories (kcal)" value={editTargetCalories} onChange={(e) => setEditTargetCalories(e.target.value)} />
              <div style={{ display: "flex", gap: 6 }}>
                <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Protéines (g)" value={editTargetProtein} onChange={(e) => setEditTargetProtein(e.target.value)} />
                <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Glucides (g)" value={editTargetCarbs} onChange={(e) => setEditTargetCarbs(e.target.value)} />
                <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Lipides (g)" value={editTargetFat} onChange={(e) => setEditTargetFat(e.target.value)} />
              </div>
            </>
          )}

          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            {!(selectedBlock?.coached && selectedBlock?.locked) && (
              <button style={S.createBtn} onClick={saveEditBlock}>
                Enregistrer
              </button>
            )}
            <button style={S.exportBtnGhost} onClick={() => setEditingBlock(false)}>
              {selectedBlock?.coached && selectedBlock?.locked ? "Fermer" : "Annuler"}
            </button>
          </div>

          <div style={{ marginTop: 14, borderTop: "1px solid #332E28", paddingTop: 12 }}>
            {blocks.length <= 1 ? (
              <div style={S.caption}>Impossible de supprimer le seul plan restant.</div>
            ) : confirmDeleteBlock ? (
              <div style={S.confirmDeleteRow}>
                <span style={S.caption}>Supprimer « {selectedBlock?.name} » et tous ses repas ?</span>
                <button style={S.confirmDeleteBtn} onClick={handleDeleteBlock}>
                  Oui, supprimer
                </button>
                <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteBlock(false)}>
                  Annuler
                </button>
              </div>
            ) : (
              <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteBlock(true)}>
                <Trash2 size={13} /> Supprimer ce plan nutrition entier
              </button>
            )}
          </div>
        </div>
      )}

      <div style={{ height: 8 }} />

      {maxDay > 0 && (
        <div style={{ ...S.caption, marginBottom: 10 }}>
          Ce programme boucle après le Jour {maxDay} — il recommence ensuite au Jour 1.
        </div>
      )}

      {blockMeals.length > 0 && (
        <button style={{ ...S.exportBtnGhost, marginBottom: 10 }} onClick={() => setShowShoppingList(true)}>
          <Clipboard size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Extraire la liste de courses
        </button>
      )}

      {blockMeals.length === 0 && <div style={{ ...S.caption, margin: "12px 0" }}>Pas encore de repas dans ce programme.</div>}

      {dayNumbers.map((day) => (
        <div key={day} style={S.programBlock}>
          <button style={S.programBlockHeader} onClick={() => setOpenDay(openDay === day ? null : day)}>
            <span style={S.programBlockTitle}>
              Jour {day}
              {dayNutritionSummary(day) && (
                <span style={{ ...S.caption, marginLeft: 8, color: "#FFC233" }}>{dayNutritionSummary(day)}</span>
              )}
            </span>
            <span style={S.caption}>{openDay === day ? "−" : "+"}</span>
          </button>
          {openDay === day && (
            <div style={S.programBlockBody}>
              {mealsByDay[day].map((meal) => (
                <div key={meal.id} style={S.dishRow}>
                  <button style={S.dishHeaderBtn} onClick={() => setOpen(open === meal.id ? null : meal.id)}>
                    <span style={S.exRowName}>{meal.name}</span>
                    <span style={S.caption}>{open === meal.id ? "−" : "+"}</span>
                  </button>
                  {open === meal.id && (
                    <div style={S.dishDetail}>
                      {meal.dishes.map((dish) => {
                        const key = `${meal.id}-${dish.id}`;
                        return (
                          <div key={dish.id} style={{ marginBottom: 4 }}>
                            <button style={S.dishHeaderBtn} onClick={() => setOpenDish(openDish === key ? null : key)}>
                              <span style={S.caption}>{dish.name}</span>
                              <span style={S.caption}>{openDish === key ? "−" : "+"}</span>
                            </button>
                            {openDish === key && (
                              <div style={S.dishDetail}>
                                {dish.ingredients.length === 0 && <div style={S.caption}>Aucun détail ajouté.</div>}
                                {dish.ingredients.map((ing) => (
                                  <div key={ing.id} style={S.caption}>• {ing.text}</div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                      {meal.dishes.length === 0 && <div style={S.caption}>Aucun plat dans ce repas.</div>}

                      <div style={{ marginTop: 10, paddingTop: 8, borderTop: "1px solid #2C2620" }}>
                        {(() => {
                          const todayLog = getTodayLog(meal.id);
                          const isReEditing = reEditingMealId === meal.id;
                          if (todayLog && !isReEditing) {
                            return (
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                                <div style={S.caption}>
                                  Aujourd'hui : {mealLogStatusLabel(todayLog.status)}
                                  {todayLog.changes?.length ? ` — ${todayLog.changes.map((c) => `${c.dish} → ${c.replacement}`).join(", ")}` : ""}
                                  {todayLog.note ? ` — ${todayLog.note}` : ""}
                                </div>
                                <button style={S.blockChipAdd} onClick={() => setReEditingMealId(meal.id)}>
                                  <Pencil size={12} />
                                </button>
                              </div>
                            );
                          }
                          if (loggingMeal?.mealId === meal.id) {
                            return (
                              <MealLogEditor
                                meal={meal}
                                status={loggingMeal.status}
                                initialLog={isReEditing && todayLog?.status === loggingMeal.status ? todayLog : null}
                                onConfirm={(payload) => handleLogMeal(meal, loggingMeal.status, payload)}
                                onCancel={() => { setLoggingMeal(null); setReEditingMealId(null); }}
                              />
                            );
                          }
                          return (
                            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                              <button style={{ ...S.exportBtnGhost, minWidth: 0, padding: "9px 4px" }} onClick={() => handleLogMeal(meal, "asPlanned", {})}>
                                Comme prévu
                              </button>
                              <button style={{ ...S.exportBtnGhost, minWidth: 0, padding: "9px 4px" }} onClick={() => setLoggingMeal({ mealId: meal.id, status: "adapted" })}>
                                Adapté
                              </button>
                              <button style={{ ...S.exportBtnGhost, minWidth: 0, padding: "9px 4px" }} onClick={() => setLoggingMeal({ mealId: meal.id, status: "restaurant" })}>
                                Restaurant
                              </button>
                              {isReEditing && (
                                <button style={{ ...S.exportBtnGhost, minWidth: 0, padding: "9px 4px" }} onClick={() => setReEditingMealId(null)}>
                                  Annuler
                                </button>
                              )}
                            </div>
                          );
                        })()}
                      </div>

                      {!(selectedBlock?.coached && selectedBlock?.locked) && (
                        <button style={{ ...S.editProgramBtn, marginTop: 10 }} onClick={() => onEditMeal(meal)}>
                          Modifier ce repas
                        </button>
                      )}
                      {confirmDelete === meal.id ? (
                        <div style={S.confirmDeleteRow}>
                          <span style={S.caption}>Supprimer « {meal.name} » ?</span>
                          <button style={S.confirmDeleteBtn} onClick={() => { onDeleteMeal(meal.id); setConfirmDelete(null); }}>
                            Oui, supprimer
                          </button>
                          <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(null)}>
                            Annuler
                          </button>
                        </div>
                      ) : (
                        <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(meal.id)}>
                          <Trash2 size={13} /> Supprimer
                        </button>
                      )}
                    </div>
                  )}
                </div>
              ))}
              {!(selectedBlock?.coached && selectedBlock?.locked) && (
                <button style={S.editProgramBtn} onClick={() => onCreateMeal(selectedBlock?.id, day)}>
                  <Plus size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Ajouter un repas au Jour {day}
                </button>
              )}
            </div>
          )}
        </div>
      ))}

      {!(selectedBlock?.coached && selectedBlock?.locked) && (
        <button style={S.createBtn} onClick={() => onCreateMeal(selectedBlock?.id, maxDay + 1)}>
          <Plus size={16} /> {maxDay > 0 ? `Ajouter un Jour ${maxDay + 1}` : "Ajouter le premier jour"}
        </button>
      )}
    </div>
  );
}

function MealForm({ mode, initialMeal, defaultBlockId, defaultDay, blocks, dishLibrary, onCancel, onCreate, onUpdate, onAddToDishLibrary, stores, dishCollections, plats }) {
  const isEdit = mode === "edit";
  const [name, setName] = useState(initialMeal?.name || "");
  const [blockId, setBlockId] = useState(initialMeal?.blockId || defaultBlockId || blocks[0]?.id);
  const [day, setDay] = useState(initialMeal?.day || defaultDay || 1);
  const [showPicker, setShowPicker] = useState(false);
  const [pickingIngredient, setPickingIngredient] = useState(null); // {dishId, ingId} | null
  const [pendingPick, setPendingPick] = useState(null); // aliment choisi, en attente de quantité (ajout rapide d'un plat)
  const [pendingQty, setPendingQty] = useState("100");
  const [pendingUnit, setPendingUnit] = useState("g");
  const [creatingNewName, setCreatingNewName] = useState(null); // string | null
  const [pickingPlat, setPickingPlat] = useState(false);
  const [dishes, setDishes] = useState(() => {
    function matchAliment(itemName) {
      if (!itemName) return null;
      const found = (dishLibrary || []).find((a) => a.name.trim().toLowerCase() === itemName.trim().toLowerCase());
      return found ? found.id : null;
    }
    if (initialMeal) {
      return initialMeal.dishes.map((d) => ({
        id: d.id,
        name: d.name,
        ingredients: (d.ingredients || []).map((ing) => {
          if (ing.qty !== undefined || ing.item !== undefined) {
            const item = ing.item || "";
            return { id: uid(), alimentId: ing.alimentId || matchAliment(item), qty: ing.qty || "", unit: ing.unit || "g", item };
          }
          const parsed = parseQuantityLine(ing.text || "");
          return parsed
            ? { id: uid(), alimentId: matchAliment(parsed.rest), qty: String(parsed.qty), unit: parsed.unit || "g", item: parsed.rest }
            : { id: uid(), alimentId: matchAliment(ing.text || ""), qty: "", unit: "g", item: ing.text || "" };
        }),
      }));
    }
    return [];
  });

  function linkIngredientToAliment(dishId, ingId, aliment) {
    setDishes((ds) =>
      ds.map((d) =>
        d.id === dishId
          ? { ...d, ingredients: d.ingredients.map((i) => (i.id === ingId ? { ...i, alimentId: aliment.id, item: aliment.name } : i)) }
          : d
      )
    );
  }

  function handlePickFromPicker(item) {
    if (pickingPlat) {
    return (
      <LibraryPicker
        library={plats || []}
        title="Choisir un plat"
        groupKey="category"
        onPick={(plat) => {
          setDishes((ds) => [
            ...ds,
            {
              id: uid(),
              name: plat.name,
              ingredients: (plat.components || []).map((comp) => {
                const aliment = (dishLibrary || []).find((a) => a.id === comp.alimentId);
                return { id: uid(), alimentId: comp.alimentId, item: aliment?.name || "", qty: String(comp.qty ?? "100"), unit: comp.unit || "g" };
              }),
            },
          ]);
          setPickingPlat(false);
        }}
        onCancel={() => setPickingPlat(false)}
      />
    );
  }

  if (pickingIngredient) {
      linkIngredientToAliment(pickingIngredient.dishId, pickingIngredient.ingId, item);
      setPickingIngredient(null);
      return;
    }
    setPendingPick(item);
    setPendingQty(item.unitWeight != null ? "1" : "100");
    setPendingUnit(item.unitWeight != null ? "unité" : "g");
    setShowPicker(false);
  }

  function confirmPendingPick() {
    if (!pendingPick) return;
    const ingredients = [{ id: uid(), alimentId: pendingPick.id, qty: pendingQty, unit: pendingUnit === "unité" ? "unité" : "g", item: pendingPick.name }];
    setDishes((ds) => [...ds, { id: uid(), name: pendingPick.name, ingredients }]);
    setPendingPick(null);
  }

  if (showPicker) {
    return (
      <LibraryPicker
        library={getActiveDishLibrary(dishLibrary, stores, dishCollections)}
        title="Aliments"
        groupKey="category"
        onPick={handlePickFromPicker}
        onCancel={() => setShowPicker(false)}
        onCreateNew={onAddToDishLibrary ? (search) => { setShowPicker(false); setCreatingNewName(search || ""); } : undefined}
      />
    );
  }

  if (pickingIngredient) {
    return (
      <LibraryPicker
        library={getActiveDishLibrary(dishLibrary, stores, dishCollections)}
        title="Aliments"
        groupKey="category"
        onPick={handlePickFromPicker}
        onCancel={() => setPickingIngredient(null)}
        onCreateNew={onAddToDishLibrary ? (search) => { setPickingIngredient(null); setCreatingNewName(search || ""); } : undefined}
      />
    );
  }

  if (creatingNewName !== null) {
    return (
      <DishLibraryForm
        mode="create"
        initial={{ name: creatingNewName }}
        onCancel={() => setCreatingNewName(null)}
        onCreate={(dish) => {
          const saved = { ...dish, id: uid() };
          onAddToDishLibrary(saved);
          setCreatingNewName(null);
          handlePickFromPicker(saved);
        }}
        onUpdate={() => {}}
        onDelete={() => {}}
        existingCategories={Array.from(new Set((dishLibrary || []).map((d) => d.category).filter(Boolean)))}
      />
    );
  }

  if (pendingPick) {
    return (
      <div style={S.page}>
        <button style={S.backBtn} onClick={() => setPendingPick(null)}>
          <X size={18} /> Annuler
        </button>
        <div style={S.pageTitle}>{pendingPick.name}</div>
        <div style={{ ...S.caption, marginBottom: 14 }}>Quelle quantité as-tu consommée ?</div>

        <div style={{ display: "flex", gap: 8 }}>
          <input
            style={{ ...S.textInput, flex: 1 }}
            type="number"
            value={pendingQty}
            onChange={(e) => setPendingQty(e.target.value)}
          />
          <select style={{ ...S.selectInput, width: 110 }} value={pendingUnit} onChange={(e) => setPendingUnit(e.target.value)}>
            <option value="g">grammes</option>
            {pendingPick.unitWeight != null && <option value="unité">unité(s)</option>}
          </select>
        </div>
        {pendingUnit === "unité" && (
          <div style={{ ...S.caption, marginBottom: 10 }}>1 unité ≈ {pendingPick.unitWeight}g</div>
        )}

        <button style={{ ...S.finishBtn, marginTop: 14 }} onClick={confirmPendingPick}>
          <Check size={18} /> Ajouter au repas
        </button>
      </div>
    );
  }

  function updateDishName(id, value) {
    setDishes((ds) => ds.map((d) => (d.id === id ? { ...d, name: value } : d)));
  }
  function addDish() {
    setDishes((ds) => [...ds, blankDish()]);
  }
  function removeDish(id) {
    setDishes((ds) => ds.filter((d) => d.id !== id));
  }
  function addIngredient(dishId) {
    setDishes((ds) => ds.map((d) => (d.id === dishId ? { ...d, ingredients: [...d.ingredients, blankIngredient()] } : d)));
  }
  function updateIngredient(dishId, ingId, field, value) {
    setDishes((ds) =>
      ds.map((d) => (d.id === dishId ? { ...d, ingredients: d.ingredients.map((i) => (i.id === ingId ? { ...i, [field]: value } : i)) } : d))
    );
  }
  function removeIngredient(dishId, ingId) {
    setDishes((ds) => ds.map((d) => (d.id === dishId ? { ...d, ingredients: d.ingredients.filter((i) => i.id !== ingId) } : d)));
  }

  const canSave = name.trim().length > 0 && dishes.length > 0 && dishes.every((d) => d.name.trim().length > 0);

  function handleSave() {
    const meal = {
      id: initialMeal?.id || uid(),
      name: name.trim(),
      blockId,
      day: Number(day) || 1,
      dishes: dishes.map((d) => {
        const totals = computeDishTotals(d.ingredients, dishLibrary);
        const originalDish = initialMeal?.dishes.find((od) => od.id === d.id);
        const fallback = !totals && originalDish
          ? {
              ...(originalDish.calories != null ? { calories: originalDish.calories } : {}),
              ...(originalDish.protein != null ? { protein: originalDish.protein } : {}),
              ...(originalDish.carbs != null ? { carbs: originalDish.carbs } : {}),
              ...(originalDish.fat != null ? { fat: originalDish.fat } : {}),
            }
          : {};
        return {
          id: d.id,
          name: d.name.trim(),
          ...(totals || fallback),
          ingredients: d.ingredients
            .filter((i) => i.item.trim())
            .map((i) => {
              const item = i.item.trim();
              const qtyNum = Number(String(i.qty).replace(",", "."));
              const text = i.qty !== "" && !isNaN(qtyNum) && qtyNum > 0
                ? (i.unit === "unité" ? `${item} x${qtyNum}` : `${item} ${qtyNum}${i.unit}`)
                : item;
              return { id: i.id, text, alimentId: i.alimentId || null, qty: i.qty, unit: i.unit, item };
            }),
        };
      }),
    };
    if (isEdit) onUpdate(meal);
    else onCreate(meal);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier le repas" : "Nouveau repas"}</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        {isEdit ? "Ajuste le nom, les plats ou le programme associé." : "Donne-lui un nom (ex : Petit-déjeuner) et ajoute tes plats."}
      </div>

      <div style={S.goalInputLabel}>Nom du repas</div>
      <input
        style={S.textInput}
        placeholder="ex : Petit-déjeuner, Déjeuner, Dîner..."
        value={name}
        onChange={(e) => setName(e.target.value)}
      />

      <div style={S.goalInputLabel}>Jour du cycle</div>
      <input
        style={S.textInput}
        type="number"
        min="1"
        value={day}
        onChange={(e) => setDay(e.target.value)}
      />

      {blocks.length > 1 && (
        <select style={S.selectInput} value={blockId} onChange={(e) => setBlockId(e.target.value)}>
          {blocks.map((b) => (
            <option key={b.id} value={b.id}>
              {b.name}{b.active ? " (actif)" : ""}
            </option>
          ))}
        </select>
      )}

      <div style={{ height: 6 }} />

      {dishes.map((dish, idx) => {
        const totals = computeDishTotals(dish.ingredients, dishLibrary);
        return (
        <div key={dish.id} style={S.newExerciseCard}>
          <div style={S.newExerciseHead}>
            <span style={S.sectionLabel}>Plat {idx + 1}</span>
            {dishes.length > 1 && (
              <button style={S.setRemoveBtn} onClick={() => removeDish(dish.id)}>
                <Minus size={14} />
              </button>
            )}
          </div>
          <input
            style={S.textInput}
            placeholder="Type de plat (ex : Salade)"
            value={dish.name}
            onChange={(e) => updateDishName(dish.id, e.target.value)}
          />

          {dish.ingredients.map((ing) => (
            <div key={ing.id} style={S.setRow}>
              <input
                style={{ ...S.setInput, width: 56 }}
                type="number"
                placeholder="Qté"
                value={ing.qty}
                onChange={(e) => updateIngredient(dish.id, ing.id, "qty", e.target.value)}
              />
              <select
                style={{ ...S.setInput, width: 68 }}
                value={ing.unit}
                onChange={(e) => updateIngredient(dish.id, ing.id, "unit", e.target.value)}
              >
                <option value="g">g</option>
                <option value="kg">kg</option>
                <option value="ml">ml</option>
                <option value="l">l</option>
                <option value="unité">unité</option>
              </select>
              <button
                style={{ ...S.setInput, flex: 1, textAlign: "left", color: ing.alimentId ? "#FFFFFF" : "#8A8378" }}
                onClick={() => setPickingIngredient({ dishId: dish.id, ingId: ing.id })}
              >
                {ing.item || "Aliments"}
              </button>
              <button style={S.setRemoveBtn} onClick={() => removeIngredient(dish.id, ing.id)}>
                <Minus size={14} />
              </button>
            </div>
          ))}
          <button style={S.addSetBtn} onClick={() => addIngredient(dish.id)}>
            <Plus size={14} /> Ajouter un détail
          </button>

          {totals && (
            <div style={{ ...S.caption, marginTop: 8 }}>
              Calculé : {totals.calories} kcal · P{totals.protein} G{totals.carbs} L{totals.fat}
            </div>
          )}
        </div>
        );
      })}

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button style={{ ...S.addSetBtn, flex: 1 }} onClick={() => setShowPicker(true)}>
          <Plus size={14} /> Ajouter un aliment
        </button>
        <button style={{ ...S.addSetBtn, flex: 1 }} onClick={() => setPickingPlat(true)}>
          <Utensils size={14} /> Ajouter un plat
        </button>
      </div>
      <button style={{ ...S.exportBtnGhost, marginTop: 8 }} onClick={addDish}>
        <Plus size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Composer un plat à la main
      </button>

      <button
        style={{ ...S.finishBtn, opacity: canSave ? 1 : 0.4, marginTop: 18 }}
        disabled={!canSave}
        onClick={handleSave}
      >
        <Check size={18} /> {isEdit ? "Enregistrer les modifications" : "Créer le repas"}
      </button>
      <div style={{ height: 24 }} />
    </div>
  );
}

      <GymDetailView

        onUpdate={(patch) => onUpdate(activeGym.id, patch)}
        onDelete={() => { onDelete(activeGym.id); setActiveGymId(null); }}
        onAddMachine={(m) => onAddMachine(activeGym.id, m)}

  return (

      <div style={S.programList}>
        {gyms.map((g) => (
          <button key={g.id} style={S.sessionLogRow} onClick={() => setActiveGymId(g.id)}>
            <div>
              <div style={S.exRowName}>{g.name}</div>

                {g.address ? `${g.address} · ` : ""}{g.machines.length} machine(s)

        ))}
        {gyms.length === 0 && <div style={S.caption}>Aucune salle enregistrée.</div>}

      {showAdd ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom de la salle</div>

          <div style={S.goalInputLabel}>Adresse précise</div>
          <input style={S.textInput} placeholder="ex : 12 rue de la Paix, 75002 Paris" value={addressDraft} onChange={(e) => setAddressDraft(e.target.value)} />

      ) : (
        <button style={S.createBtn} onClick={() => setShowAdd(true)}>
          <Plus size={16} /> Ajouter une salle
        </button>
      )}
    </div>
  );
}

function StoresView({ stores, onAdd, onUpdate, onDelete, onBack }) {

  const [cityDraft, setCityDraft] = useState("");

  const [websiteDraft, setWebsiteDraft] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editCity, setEditCity] = useState("");
  const [editAddress, setEditAddress] = useState("");
  const [editWebsite, setEditWebsite] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  function handleAdd() {
    if (!nameDraft.trim()) return;
    onAdd(nameDraft, cityDraft, addressDraft, websiteDraft);
    setNameDraft("");
    setCityDraft("");
    setAddressDraft("");
    setWebsiteDraft("");
    setShowAdd(false);
  }

  function openEdit(store) {
    setEditingId(store.id);
    setEditName(store.name);
    setEditCity(store.city || "");
    setEditAddress(store.address || "");
    setEditWebsite(store.website || "");
    setConfirmDeleteId(null);

    if (!editName.trim()) return;
    onUpdate(editingId, { name: editName.trim(), city: editCity.trim(), address: editAddress.trim(), website: editWebsite.trim() });

  }

  function mapsUrl(store) {
    const q = encodeURIComponent(store.address ? `${store.address}${store.city ? ", " + store.city : ""}` : `${store.name} ${store.city || ""}`);
    return `https://www.google.com/maps/search/?api=1&query=${q}`;

      <div style={S.programList}>
        {stores.map((s) => (
          <div key={s.id} style={S.exRow}>
            {editingId === s.id ? (
              <div style={S.segmentsBox}>
                <input style={S.textInput} placeholder="Nom du magasin" value={editName} onChange={(e) => setEditName(e.target.value)} />
                <input style={S.textInput} placeholder="Ville" value={editCity} onChange={(e) => setEditCity(e.target.value)} />
                <input style={S.textInput} placeholder="Adresse précise (ex : 12 rue Henri Giffard, 87280 Limoges)" value={editAddress} onChange={(e) => setEditAddress(e.target.value)} />
                <input style={S.textInput} placeholder="Site du drive (ex : https://www.leclercdrive.fr/...)" value={editWebsite} onChange={(e) => setEditWebsite(e.target.value)} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button style={S.createBtn} onClick={saveEdit}>Enregistrer</button>
                  <button style={S.exportBtnGhost} onClick={() => setEditingId(null)}>Annuler</button>
                </div>
                <div style={{ marginTop: 10, borderTop: "1px solid #332E28", paddingTop: 10 }}>
                  {confirmDeleteId === s.id ? (
                    <div style={S.confirmDeleteRow}>
                      <span style={S.caption}>Supprimer « {s.name} » ?</span>
                      <button style={S.confirmDeleteBtn} onClick={() => { onDelete(s.id); setEditingId(null); }}>Oui, supprimer</button>
                      <button style={S.cancelDeleteBtn} onClick={() => setConfirmDeleteId(null)}>Annuler</button>

                    <button style={S.deleteProgramBtn} onClick={() => setConfirmDeleteId(s.id)}>
                      <Trash2 size={13} /> Supprimer ce magasin

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ opacity: s.active === false ? 0.5 : 1 }}>
                  <div style={S.exRowName}>{s.name}</div>
                  <div style={S.caption}>{s.city || ""}{s.city ? " · " : ""}{s.active === false ? "Inactif (masqué à la composition)" : "Actif"}</div>
                  {s.address && (
                    <a href={mapsUrl(s)} target="_blank" rel="noopener noreferrer" style={S.youtubeLink}>
                      <ChevronRight size={12} style={{ verticalAlign: "-2px", marginRight: 2 }} />{s.address} — itinéraire
                    </a>
                  )}
                  {s.website && (
                    <div>
                      <a href={s.website} target="_blank" rel="noopener noreferrer" style={S.youtubeLink}>
                        <Smartphone size={12} style={{ verticalAlign: "-2px", marginRight: 2 }} />Site du drive
                      </a>
                    </div>
                  )}
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <button style={S.blockChipAdd} onClick={() => onUpdate(s.id, { active: s.active === false })}>
                    {s.active === false ? <X size={14} /> : <Check size={14} />}
                  </button>
                  <button style={S.blockChipAdd} onClick={() => openEdit(s)}>
                    <Pencil size={14} />
                  </button>
                </div>
              </div>
            )}
          </div>
        ))}
        {stores.length === 0 && <div style={S.caption}>Aucun magasin enregistré.</div>}
      </div>

      {showAdd ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom du magasin</div>
          <input style={S.textInput} placeholder="ex : Carrefour, Leclerc..." value={nameDraft} onChange={(e) => setNameDraft(e.target.value)} />
          <div style={S.goalInputLabel}>Ville</div>
          <input style={S.textInput} placeholder="ex : Lyon" value={cityDraft} onChange={(e) => setCityDraft(e.target.value)} />
          <div style={S.goalInputLabel}>Adresse précise (optionnel — pour l'itinéraire)</div>
          <input style={S.textInput} placeholder="ex : 12 rue Henri Giffard, 87280 Limoges" value={addressDraft} onChange={(e) => setAddressDraft(e.target.value)} />
          <div style={S.goalInputLabel}>Site du drive (optionnel)</div>
          <input style={S.textInput} placeholder="ex : https://www.leclercdrive.fr/..." value={websiteDraft} onChange={(e) => setWebsiteDraft(e.target.value)} />
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <button style={S.createBtn} onClick={handleAdd}>Ajouter</button>
            <button style={S.exportBtnGhost} onClick={() => setShowAdd(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.createBtn, marginTop: 10 }} onClick={() => setShowAdd(true)}>
          <Plus size={16} /> Ajouter un magasin
        </button>
      )}
    </div>
  );
}
