const ALLERGEN_OPTIONS = ["Gluten", "Lactose", "Œuf", "Arachide", "Fruits à coque", "Soja", "Poisson", "Crustacés", "Sésame"];
const MUSCLE_GROUP_OPTIONS = ["Pectoraux", "Dos", "Épaules", "Biceps", "Triceps", "Avant-bras", "Quadriceps", "Ischio-jambiers", "Fessiers", "Mollets", "Abdominaux", "Trapèzes"];
const WEEK_DAYS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
const MEASUREMENT_TYPES = [
  { key: "taille", label: "Tour de taille" },
  { key: "poitrine", label: "Tour de poitrine" },
  { key: "hanches", label: "Tour de hanches" },
  { key: "bras", label: "Tour de bras" },
  { key: "cuisse", label: "Tour de cuisse" },
  { key: "mollet", label: "Tour de mollet" },
];

function DishLibraryView({ library, onAdd, onUpdate, onDelete, onBack, onImportLibrary, onExportLibrary, stores, collections, onAddCollection, onUpdateCollection, onDeleteCollection }) {
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [excludeAllergens, setExcludeAllergens] = useState([]);
  const [form, setForm] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importCollectionId, setImportCollectionId] = useState("");
  const [newCollectionName, setNewCollectionName] = useState("");
  const [newCollectionStoreId, setNewCollectionStoreId] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [exportText, setExportText] = useState(null);
  const [editingCollectionId, setEditingCollectionId] = useState(null);
  const [editCollectionName, setEditCollectionName] = useState("");
  const [editCollectionStoreId, setEditCollectionStoreId] = useState("");
  const [creatingLibrary, setCreatingLibrary] = useState(false);
  const [quickLibName, setQuickLibName] = useState("");
  const [quickLibStoreId, setQuickLibStoreId] = useState("");
  const [selectedLibIds, setSelectedLibIds] = useState(null); // null = toutes

  const activeLibIds = selectedLibIds || (collections || []).map((c) => c.id);

  function collectionLabel(col) {
    if (!col) return "";
    const store = (stores || []).find((s) => s.id === col.storeId);
    return store ? `${col.name} (${store.name})` : col.name;
  }

  function toggleLib(id) {
    setSelectedLibIds((cur) => {
      const base = cur || (collections || []).map((c) => c.id);
      return base.includes(id) ? base.filter((x) => x !== id) : [...base, id];
    });
  }

  function resolveImportCollectionId() {
    if (importCollectionId === "__new__") {
      if (!newCollectionName.trim()) return null;
      return onAddCollection(newCollectionName, newCollectionStoreId);
    }
    return importCollectionId || null;
  }

  function handleImport() {
    const collectionId = resolveImportCollectionId();
    const res = onImportLibrary(importText, collectionId);
    if (res.ok) {
      setImportStatus("ok");
      setImportText("");
      setImportCollectionId("");
      setNewCollectionName("");
      setNewCollectionStoreId("");
      setShowImport(false);
    } else {
      setImportStatus("error");
    }
    setTimeout(() => setImportStatus(null), 2500);
  }

  const categories = useMemo(() => Array.from(new Set(library.map((d) => d.category).filter(Boolean))).sort(), [library]);
  const filtered = library.filter((d) => {
    if (!activeLibIds.includes(d.collectionId)) return false;
    if (filter && d.category !== filter) return false;
    if (search.trim() && !d.name.toLowerCase().includes(search.trim().toLowerCase())) return false;
    if (excludeAllergens.length && d.allergens?.some((a) => excludeAllergens.includes(a))) return false;
    return true;
  });

  function toggleExclude(a) {
    setExcludeAllergens((list) => (list.includes(a) ? list.filter((x) => x !== a) : [...list, a]));
  }

  function openEditCollection(col) {
    setEditingCollectionId(col.id);
    setEditCollectionName(col.name);
    setEditCollectionStoreId(col.storeId || "");
  }

  function saveEditCollection() {
    if (!editCollectionName.trim()) return;
    onUpdateCollection(editingCollectionId, { name: editCollectionName.trim(), storeId: editCollectionStoreId });
    setEditingCollectionId(null);
  }

  function createQuickLibrary() {
    if (!quickLibName.trim()) return;
    onAddCollection(quickLibName, quickLibStoreId);
    setQuickLibName("");
    setQuickLibStoreId("");
    setCreatingLibrary(false);
  }

  if (form) {
    return (
      <DishLibraryForm
        mode={form.mode}
        initial={form.dish}
        onCancel={() => setForm(null)}
        onCreate={(d) => { onAdd(d); setForm(null); }}
        onUpdate={(d) => { onUpdate(d); setForm(null); }}
        onDelete={(id) => { onDelete(id); setForm(null); }}
        stores={stores}
        collections={collections}
        existingCategories={Array.from(new Set((library || []).map((d) => d.category).filter(Boolean)))}
      />
    );
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Coach
      </button>
      <div style={S.pageTitle}>Aliments</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>
        Renseigne les valeurs pour 100g afin que les quantités soient calculées automatiquement dans tes repas. Chaque bibliothèque peut être liée à un magasin, pour avoir les mêmes aliments avec des prix différents selon où tu achètes.
      </div>

      <div style={S.sectionLabel}>Mes bibliothèques</div>
      {(collections || []).map((col) => (
        <div key={col.id} style={S.segmentsBox}>
          {editingCollectionId === col.id ? (
            <>
              <input style={S.textInput} placeholder="Nom de la bibliothèque" value={editCollectionName} onChange={(e) => setEditCollectionName(e.target.value)} />
              <select style={S.textInput} value={editCollectionStoreId} onChange={(e) => setEditCollectionStoreId(e.target.value)}>
                <option value="">Aucun magasin lié</option>
                {(stores || []).map((s) => (
                  <option key={s.id} value={s.id}>{s.name}{s.city ? ` (${s.city})` : ""}</option>
                ))}
              </select>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={S.createBtn} onClick={saveEditCollection}>Enregistrer</button>
                <button style={S.exportBtnGhost} onClick={() => setEditingCollectionId(null)}>Annuler</button>
                <button style={S.deleteProgramBtn} onClick={() => { onDeleteCollection(col.id); setEditingCollectionId(null); }}>
                  <Trash2 size={13} />
                </button>
              </div>
            </>
          ) : (
            <button
              style={{ ...S.blockChip, width: "100%", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center", ...(activeLibIds.includes(col.id) ? S.blockChipSelected : {}) }}
              onClick={() => toggleLib(col.id)}
            >
              <div>
                <div style={S.exRowName}>{col.name}{col.storeId ? ` · ${(stores || []).find((s) => s.id === col.storeId)?.name || ""}` : ""}</div>
                <div style={S.caption}>{library.filter((d) => d.collectionId === col.id).length} aliment(s)</div>
              </div>
              <span onClick={(e) => { e.stopPropagation(); openEditCollection(col); }} style={{ padding: 6 }}>
                <Pencil size={14} />
              </span>
            </button>
          )}
        </div>
      ))}
      {(!collections || collections.length === 0) && !creatingLibrary && (
        <div style={{ ...S.caption, marginBottom: 8 }}>Aucune bibliothèque pour l'instant.</div>
      )}
      {creatingLibrary ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom de la nouvelle bibliothèque</div>
          <input style={S.textInput} placeholder="ex : Aliments de base" value={quickLibName} onChange={(e) => setQuickLibName(e.target.value)} />
          <div style={S.goalInputLabel}>Magasin lié (optionnel)</div>
          <select style={S.textInput} value={quickLibStoreId} onChange={(e) => setQuickLibStoreId(e.target.value)}>
            <option value="">Aucun magasin lié</option>
            {(stores || []).map((s) => (
              <option key={s.id} value={s.id}>{s.name}{s.city ? ` (${s.city})` : ""}</option>
            ))}
          </select>
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={createQuickLibrary}>Créer</button>
            <button style={S.exportBtnGhost} onClick={() => setCreatingLibrary(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.exportBtnGhost, marginBottom: 12 }} onClick={() => setCreatingLibrary(true)}>
          <Plus size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Nouvelle bibliothèque
        </button>
      )}

      {library.length > 0 && (
        <button style={{ ...S.exportBtnGhost, marginBottom: 8 }} onClick={() => setExportText(onExportLibrary(activeLibIds.length === 1 ? activeLibIds[0] : null))}>
          <Smartphone size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />
          Exporter la sélection
        </button>
      )}
      {exportText && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Texte à copier :</div>
          <textarea readOnly style={{ ...S.commentInput, marginBottom: 8 }} rows={4} value={exportText} onFocus={(e) => e.target.select()} />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={() => navigator.clipboard?.writeText(exportText)}>Copier</button>
            <button style={S.exportBtnGhost} onClick={() => setExportText(null)}>Fermer</button>
          </div>
        </div>
      )}

      {showImport ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Bibliothèque de destination</div>
          <select style={S.textInput} value={importCollectionId} onChange={(e) => setImportCollectionId(e.target.value)}>
            <option value="">Sans bibliothèque</option>
            {(collections || []).map((c) => (
              <option key={c.id} value={c.id}>{collectionLabel(c)}</option>
            ))}
            <option value="__new__">+ Nouvelle bibliothèque...</option>
          </select>
          {importCollectionId === "__new__" && (
            <>
              <div style={S.goalInputLabel}>Nom de la nouvelle bibliothèque</div>
              <input style={S.textInput} placeholder="ex : E.Leclerc Limoges Nord" value={newCollectionName} onChange={(e) => setNewCollectionName(e.target.value)} />
              <div style={S.goalInputLabel}>Magasin lié (optionnel)</div>
              <select style={S.textInput} value={newCollectionStoreId} onChange={(e) => setNewCollectionStoreId(e.target.value)}>
                <option value="">Aucun magasin lié</option>
                {(stores || []).map((s) => (
                  <option key={s.id} value={s.id}>{s.name}{s.city ? ` (${s.city})` : ""}</option>
                ))}
              </select>
            </>
          )}
          <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Colle ici le texte de la bibliothèque à importer :</div>
          {importStatus === "ok" && <div style={S.exportStatus}>Bibliothèque importée ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie qu'il commence bien par ##HAKIFIT-DISHLIB##.</div>}
          <textarea
            style={{ ...S.commentInput, marginBottom: 8 }}
            rows={4}
            value={importText}
            onChange={(e) => setImportText(e.target.value)}
          />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={handleImport}>Importer</button>
            <button style={S.exportBtnGhost} onClick={() => setShowImport(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.exportBtnGhost, marginBottom: 12 }} onClick={() => setShowImport(true)}>
          <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Importer une bibliothèque d'aliments
        </button>
      )}

      <div style={S.sectionLabel}>Rechercher</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <div style={{ position: "relative", flex: 1 }}>
          <Search size={15} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#8A5F58" }} />
          <input
            style={{ ...S.textInput, paddingLeft: 34, marginBottom: 0 }}
            placeholder="Rechercher un aliment dans les bibliothèques sélectionnées ci-dessus"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        </div>
        <button style={{ ...S.blockChipAdd, ...(showFilters || filter || excludeAllergens.length ? S.blockChipSelected : {}) }} onClick={() => setShowFilters((v) => !v)}>
          <Search size={14} style={{ marginRight: 4 }} />Filtres{(filter || excludeAllergens.length) ? " •" : ""}
        </button>
      </div>

      {showFilters && (
        <>
          {categories.length > 0 && (
            <div style={S.blockChipsRow}>
              <button style={{ ...S.blockChip, ...(!filter ? S.blockChipSelected : {}) }} onClick={() => setFilter(null)}>
                Tous
              </button>
              {categories.map((c) => (
                <button key={c} style={{ ...S.blockChip, ...(filter === c ? S.blockChipSelected : {}) }} onClick={() => setFilter(c)}>
                  {c}
                </button>
              ))}
            </div>
          )}

          <div style={S.goalInputLabel}>Masquer les plats contenant :</div>
          <div style={S.blockChipsRow}>
            {ALLERGEN_OPTIONS.map((a) => (
              <button
                key={a}
                style={{ ...S.blockChip, ...(excludeAllergens.includes(a) ? S.blockChipSelected : {}) }}
                onClick={() => toggleExclude(a)}
              >
                {a}
              </button>
            ))}
          </div>
        </>
      )}

      <div style={S.programList}>
        {filtered.map((d) => {
          const store = (stores || []).find((s) => s.id === d.storeId);
          const col = (collections || []).find((c) => c.id === d.collectionId);
          return (
          <button key={d.id} style={S.sessionLogRow} onClick={() => setForm({ mode: "edit", dish: d })}>
            <div>
              <div style={S.exRowName}>{d.name}</div>
              <div style={S.caption}>
                {d.category}{d.calories ? ` · ${d.calories} kcal` : ""}{(d.protein || d.carbs || d.fat) ? ` (P${d.protein || 0}/G${d.carbs || 0}/L${d.fat || 0})` : ""}{d.allergens?.length ? ` · Allergènes : ${d.allergens.join(", ")}` : ""}
                {d.priceMin != null ? ` · ${d.priceMin === d.priceMax ? `${d.priceMin} €` : `${d.priceMin}-${d.priceMax} €`}` : ""}
                {col ? ` · ${collectionLabel(col)}` : store ? ` · ${store.name}` : ""}
              </div>
            </div>
          </button>
          );
        })}
        {filtered.length === 0 && <div style={S.caption}>Aucun aliment ne correspond.</div>}
      </div>

      <button
        style={S.createBtn}
        onClick={() => {
          if (!collections || collections.length === 0) { setCreatingLibrary(true); return; }
          setForm({ mode: "create", dish: null });
        }}
      >
        <Plus size={16} /> Ajouter un aliment
      </button>
    </div>
  );
}

function DishLibraryForm({ mode, initial, onCancel, onCreate, onUpdate, onDelete, stores, collections, existingCategories }) {
  const isEdit = mode === "edit";
  const [name, setName] = useState(initial?.name || "");
  const [category, setCategory] = useState(initial?.category || "");
  const [addingCategory, setAddingCategory] = useState(false);
  const [newCategoryDraft, setNewCategoryDraft] = useState("");
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState("");
  const videoRef = useRef(null);
  const scanStopRef = useRef(null);

  const categoryOptions = useMemo(() => {
    const base = ["Viande", "Poisson", "Œufs et produits laitiers", "Féculent", "Légume", "Fruit", "Légumineuse", "Oléagineux", "Matière grasse", "Épicerie", "Condiment", "Boisson"];
    const merged = new Set([...base, ...(existingCategories || [])]);
    if (initial?.category) merged.add(initial.category);
    return Array.from(merged).filter(Boolean).sort((a, b) => a.localeCompare(b, "fr"));
  }, [existingCategories, initial]);

  function stopBarcodeScan() {
    if (scanStopRef.current) { scanStopRef.current(); scanStopRef.current = null; }
    setScanning(false);
  }

  async function startBarcodeScan() {
    setScanError("");
    if (!("BarcodeDetector" in window)) {
      setScanError("Le scan de code-barres n'est pas supporté par ce navigateur. Saisis le code à la main.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      setScanning(true);
      const detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"] });
      let stopped = false;
      scanStopRef.current = () => {
        stopped = true;
        stream.getTracks().forEach((t) => t.stop());
      };
      setTimeout(async () => {
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play().catch(() => {});
        }
        const tick = async () => {
          if (stopped || !videoRef.current) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes && codes.length) {
              setBarcode(codes[0].rawValue);
              stopBarcodeScan();
              return;
            }
          } catch { /* image non exploitable sur cette frame, on retente */ }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }, 0);
    } catch {
      setScanError("Accès à la caméra refusé ou indisponible.");
      setScanning(false);
    }
  }

  useEffect(() => () => stopBarcodeScan(), []);
  const [collectionId, setCollectionId] = useState(initial?.collectionId || collections?.[0]?.id || "");
  const [calories, setCalories] = useState(initial?.calories != null ? String(initial.calories) : "");
  const [protein, setProtein] = useState(initial?.protein != null ? String(initial.protein) : "");
  const [carbs, setCarbs] = useState(initial?.carbs != null ? String(initial.carbs) : "");
  const [fat, setFat] = useState(initial?.fat != null ? String(initial.fat) : "");
  const [unitWeight, setUnitWeight] = useState(initial?.unitWeight != null ? String(initial.unitWeight) : "");
  const [allergens, setAllergens] = useState(initial?.allergens || []);
  const [barcode, setBarcode] = useState(initial?.barcode || "");
  const [priceMin, setPriceMin] = useState(initial?.priceMin != null ? String(initial.priceMin) : (initial?.price != null ? String(initial.price) : ""));
  const [priceMax, setPriceMax] = useState(initial?.priceMax != null ? String(initial.priceMax) : (initial?.price != null ? String(initial.price) : ""));
  const [purchaseNote, setPurchaseNote] = useState(initial?.purchaseNote || "");
  const [storeId, setStoreId] = useState(initial?.storeId || "");
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [priceLookup, setPriceLookup] = useState(null); // { loading, error, min, max, count } | null

  function toggleAllergen(a) {
    setAllergens((list) => (list.includes(a) ? list.filter((x) => x !== a) : [...list, a]));
  }

  async function lookupOnlinePrice() {
    if (!barcode.trim()) return;
    const selectedStore = stores?.find((s) => s.id === storeId);
    const city = selectedStore?.city?.trim().toLowerCase() || "";
    setPriceLookup({ loading: true });
    try {
      const res = await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${encodeURIComponent(barcode.trim())}&size=100`);
      if (!res.ok) throw new Error("Réponse invalide");
      const data = await res.json();
      let items = data?.items || [];
      if (city) {
        const filtered = items.filter((it) => {
          const loc = it.location || {};
          const locText = `${loc.city || ""} ${loc.name || ""}`.toLowerCase();
          return locText.includes(city);
        });
        if (filtered.length) items = filtered;
      }
      if (!items.length) {
        setPriceLookup({ loading: false, error: "Aucun prix trouvé pour ce code-barres dans la base communautaire." });
        return;
      }
      const values = items.map((it) => Number(it.price)).filter((v) => !isNaN(v));
      const min = Math.min(...values);
      const max = Math.max(...values);
      const currency = items[0]?.currency || "";
      setPriceLookup({ loading: false, min, max, count: values.length, currency, filteredByCity: !!city && items !== data.items });
    } catch (e) {
      setPriceLookup({ loading: false, error: "Impossible de contacter la base de prix (connexion ou service indisponible)." });
    }
  }

  function handleSave() {
    if (!name.trim() || !collectionId || !category.trim()) return;
    if ([calories, protein, carbs, fat].some((v) => v === "" || isNaN(Number(v)))) return;
    const dish = {
      id: initial?.id, name: name.trim(), category: category.trim(), allergens, collectionId,
      ...(calories !== "" && !isNaN(Number(calories)) ? { calories: Number(calories) } : {}),
      ...(protein !== "" && !isNaN(Number(protein)) ? { protein: Number(protein) } : {}),
      ...(carbs !== "" && !isNaN(Number(carbs)) ? { carbs: Number(carbs) } : {}),
      ...(fat !== "" && !isNaN(Number(fat)) ? { fat: Number(fat) } : {}),
      ...(unitWeight !== "" && !isNaN(Number(unitWeight)) ? { unitWeight: Number(unitWeight) } : {}),
      ...(barcode.trim() ? { barcode: barcode.trim() } : {}),
      ...(priceMin !== "" && !isNaN(Number(priceMin)) ? { priceMin: Number(priceMin) } : {}),
      ...(priceMax !== "" && !isNaN(Number(priceMax)) ? { priceMax: Number(priceMax) } : {}),
      ...(purchaseNote.trim() ? { purchaseNote: purchaseNote.trim() } : {}),
      ...(storeId ? { storeId } : {}),
    };
    if (isEdit) onUpdate(dish);
    else onCreate(dish);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier l'aliment" : "Nouvel aliment"}</div>

      <div style={S.goalInputLabel}>Nom</div>
      <input style={S.textInput} placeholder="ex : Blanc de poulet, Riz blanc..." value={name} onChange={(e) => setName(e.target.value)} />

      <div style={S.goalInputLabel}>Catégorie (obligatoire — sert de filtre dans la bibliothèque)</div>
      {addingCategory ? (
        <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
          <input
            style={{ ...S.textInput, marginBottom: 0, flex: 1 }}
            placeholder="Nom de la nouvelle catégorie"
            value={newCategoryDraft}
            onChange={(e) => setNewCategoryDraft(e.target.value)}
          />
          <button
            style={S.goalSaveBtn}
            onClick={() => { if (newCategoryDraft.trim()) { setCategory(newCategoryDraft.trim()); } setAddingCategory(false); setNewCategoryDraft(""); }}
          >
            <Check size={16} />
          </button>
        </div>
      ) : (
        <select
          style={S.textInput}
          value={category}
          onChange={(e) => { if (e.target.value === "__new__") { setAddingCategory(true); } else { setCategory(e.target.value); } }}
        >
          <option value="">— Choisir une catégorie —</option>
          {categoryOptions.map((c) => <option key={c} value={c}>{c}</option>)}
          <option value="__new__">+ Nouvelle catégorie...</option>
        </select>
      )}

      <div style={S.goalInputLabel}>Bibliothèque (obligatoire — chaque bibliothèque peut avoir son propre prix)</div>
      <select style={S.textInput} value={collectionId} onChange={(e) => setCollectionId(e.target.value)}>
        {(collections || []).map((c) => {
          const store = (stores || []).find((s) => s.id === c.storeId);
          return <option key={c.id} value={c.id}>{store ? `${c.name} (${store.name})` : c.name}</option>;
        })}
      </select>

      <div style={S.goalInputLabel}>Calories pour 100g (obligatoire)</div>
      <input style={S.textInput} type="number" placeholder="ex : 165" value={calories} onChange={(e) => setCalories(e.target.value)} />

      <div style={S.goalInputLabel}>Macros pour 100g (g) — obligatoire</div>
      <div style={{ display: "flex", gap: 6 }}>
        <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Protéines" value={protein} onChange={(e) => setProtein(e.target.value)} />
        <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Glucides" value={carbs} onChange={(e) => setCarbs(e.target.value)} />
        <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="Lipides" value={fat} onChange={(e) => setFat(e.target.value)} />
      </div>

      <div style={S.goalInputLabel}>Poids moyen d'une pièce (g) — optionnel</div>
      <div style={{ ...S.caption, marginBottom: 6 }}>
        À remplir uniquement pour les aliments qu'on compte à la pièce plutôt qu'on ne pèse (1 œuf, 1 pomme, 1 yaourt...).
        Cela permet ensuite d'écrire « 2 œufs » au lieu de « 100 g d'œuf » dans un repas.
      </div>
      <input style={S.textInput} type="number" placeholder="ex : 50 pour un œuf" value={unitWeight} onChange={(e) => setUnitWeight(e.target.value)} />

      <div style={S.goalInputLabel}>Code-barres (optionnel)</div>
      <div style={{ display: "flex", gap: 6 }}>
        <input style={{ ...S.textInput, marginBottom: 0, flex: 1 }} placeholder="ex : 3017624010701" value={barcode} onChange={(e) => setBarcode(e.target.value)} />
        <button style={S.blockChipAdd} onClick={startBarcodeScan} title="Scanner avec la caméra">
          <Search size={14} />
        </button>
      </div>
      {scanError && <div style={{ ...S.caption, color: "#FF4433", marginTop: 4 }}>{scanError}</div>}
      {scanning && (
        <div style={{ marginTop: 8 }}>
          <video ref={videoRef} style={{ width: "100%", borderRadius: 8, background: "#000" }} playsInline muted />
          <button style={{ ...S.exportBtnGhost, marginTop: 6 }} onClick={stopBarcodeScan}>Arrêter le scan</button>
        </div>
      )}

      <div style={S.goalInputLabel}>Prix théorique (fourchette basse - haute)</div>
      <div style={{ display: "flex", gap: 6 }}>
        <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="ex : 2.80" value={priceMin} onChange={(e) => setPriceMin(e.target.value)} />
        <input style={{ ...S.setInput, flex: 1 }} type="number" placeholder="ex : 3.90" value={priceMax} onChange={(e) => setPriceMax(e.target.value)} />
      </div>

      <div style={S.goalInputLabel}>Magasin de référence</div>
      <select style={S.textInput} value={storeId} onChange={(e) => setStoreId(e.target.value)}>
        <option value="">Non précisé</option>
        {(stores || []).map((s) => (
          <option key={s.id} value={s.id}>{s.name}{s.city ? ` (${s.city})` : ""}</option>
        ))}
      </select>

      <div style={S.goalInputLabel}>Instruction d'achat (optionnel — ex : cas particulier, achat par lot)</div>
      <input style={S.textInput} placeholder="ex : Vendu par boîte de 6, prendre une boîte entière" value={purchaseNote} onChange={(e) => setPurchaseNote(e.target.value)} />

      {barcode.trim() && (
        <>
          <button style={{ ...S.exportBtnGhost, marginTop: 8 }} onClick={lookupOnlinePrice} disabled={priceLookup?.loading}>
            <Search size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />
            {priceLookup?.loading ? "Recherche..." : "Rechercher un prix en ligne"}
          </button>
          {priceLookup && !priceLookup.loading && (
            priceLookup.error ? (
              <div style={{ ...S.caption, marginTop: 6, color: "#FFC233" }}>{priceLookup.error}</div>
            ) : (
              <div style={{ ...S.caption, marginTop: 6 }}>
                Trouvé entre {priceLookup.min} et {priceLookup.max} {priceLookup.currency} ({priceLookup.count} relevé(s){priceLookup.filteredByCity ? ", filtré par ville" : ", toutes localisations"}).
                Données communautaires (Open Prices / Open Food Facts), couverture non garantie.
                <button
                  style={{ ...S.exportBtnGhost, marginTop: 6, display: "block" }}
                  onClick={() => { setPriceMin(String(priceLookup.min)); setPriceMax(String(priceLookup.max)); }}
                >
                  Utiliser cette fourchette
                </button>
              </div>
            )
          )}
        </>
      )}

      <div style={S.goalInputLabel}>Allergènes présents</div>
      <div style={S.blockChipsRow}>
        {ALLERGEN_OPTIONS.map((a) => (
          <button
            key={a}
            style={{ ...S.blockChip, ...(allergens.includes(a) ? S.blockChipSelected : {}) }}
            onClick={() => toggleAllergen(a)}
          >
            {a}
          </button>
        ))}
      </div>

      <button style={{ ...S.finishBtn, opacity: name.trim() ? 1 : 0.4, marginTop: 18 }} disabled={!name.trim()} onClick={handleSave}>
        <Check size={18} /> {isEdit ? "Enregistrer" : "Ajouter à la bibliothèque"}
      </button>

      {isEdit && (
        <div style={{ marginTop: 16 }}>
          {confirmDelete ? (
            <div style={S.confirmDeleteRow}>
              <span style={S.caption}>Supprimer « {initial.name} » de la bibliothèque ?</span>
              <button style={S.confirmDeleteBtn} onClick={() => onDelete(initial.id)}>Oui, supprimer</button>
              <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(false)}>Annuler</button>
            </div>
          ) : (
            <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(true)}>
              <Trash2 size={13} /> Supprimer de la bibliothèque
            </button>
          )}
        </div>
      )}
      <div style={{ height: 24 }} />
    </div>
  );
}

function PlatLibraryView({ plats, dishLibrary, onAdd, onUpdate, onDelete, onBack, onImportLibrary, onExportLibrary, onAddToDishLibrary, stores, dishCollections, collections, onAddCollection, onUpdateCollection, onDeleteCollection }) {
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [form, setForm] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [importCollectionId, setImportCollectionId] = useState("");
  const [newCollectionName, setNewCollectionName] = useState("");
  const [importStatus, setImportStatus] = useState(null);
  const [exportText, setExportText] = useState(null);
  const [editingCollectionId, setEditingCollectionId] = useState(null);
  const [editCollectionName, setEditCollectionName] = useState("");
  const [creatingLibrary, setCreatingLibrary] = useState(false);
  const [quickLibName, setQuickLibName] = useState("");
  const [selectedLibIds, setSelectedLibIds] = useState(null); // null = toutes

  const activeLibIds = selectedLibIds || (collections || []).map((c) => c.id);

  function collectionLabel(col) {
    return col ? col.name : "";
  }

  function toggleLib(id) {
    setSelectedLibIds((cur) => {
      const base = cur || (collections || []).map((c) => c.id);
      return base.includes(id) ? base.filter((x) => x !== id) : [...base, id];
    });
  }

  function resolveImportCollectionId() {
    if (importCollectionId === "__new__") {
      if (!newCollectionName.trim()) return null;
      return onAddCollection(newCollectionName);
    }
    return importCollectionId || null;
  }

  function handleImport() {
    const collectionId = resolveImportCollectionId();
    const res = onImportLibrary(importText, collectionId);
    if (res.ok) {
      setImportStatus("ok");
      setImportText("");
      setImportCollectionId("");
      setNewCollectionName("");
      setShowImport(false);
    } else {
      setImportStatus("error");
    }
    setTimeout(() => setImportStatus(null), 2500);
  }

  const categories = useMemo(() => Array.from(new Set(plats.map((p) => p.category).filter(Boolean))).sort(), [plats]);
  const filtered = plats.filter((p) => {
    if (!activeLibIds.includes(p.collectionId)) return false;
    if (filter && p.category !== filter) return false;
    if (search.trim() && !p.name.toLowerCase().includes(search.trim().toLowerCase())) return false;
    return true;
  });

  function openEditCollection(col) {
    setEditingCollectionId(col.id);
    setEditCollectionName(col.name);
  }

  function saveEditCollection() {
    if (!editCollectionName.trim()) return;
    onUpdateCollection(editingCollectionId, { name: editCollectionName.trim() });
    setEditingCollectionId(null);
  }

  function createQuickLibrary() {
    if (!quickLibName.trim()) return;
    onAddCollection(quickLibName);
    setQuickLibName("");
    setCreatingLibrary(false);
  }

  if (form) {
    return (
      <PlatLibraryForm
        mode={form.mode}
        initial={form.plat}
        dishLibrary={dishLibrary}
        onAddToDishLibrary={onAddToDishLibrary}
        onCancel={() => setForm(null)}
        onCreate={(p) => { onAdd(p); setForm(null); }}
        onUpdate={(p) => { onUpdate(p); setForm(null); }}
        onDelete={(id) => { onDelete(id); setForm(null); }}
        collections={collections}
        stores={stores}
        dishCollections={dishCollections}
      />
    );
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Coach
      </button>
      <div style={S.pageTitle}>Plats</div>
      <div style={{ ...S.caption, marginBottom: 12 }}>
        Des plats composés de plusieurs aliments (ex : "Riz au poulet") à réutiliser d'un coup dans tes repas.
      </div>

      <div style={S.sectionLabel}>Mes bibliothèques</div>
      {(collections || []).map((col) => (
        <div key={col.id} style={S.segmentsBox}>
          {editingCollectionId === col.id ? (
            <>
              <input style={S.textInput} placeholder="Nom de la bibliothèque" value={editCollectionName} onChange={(e) => setEditCollectionName(e.target.value)} />
              <div style={{ display: "flex", gap: 8 }}>
                <button style={S.createBtn} onClick={saveEditCollection}>Enregistrer</button>
                <button style={S.exportBtnGhost} onClick={() => setEditingCollectionId(null)}>Annuler</button>
                <button style={S.deleteProgramBtn} onClick={() => { onDeleteCollection(col.id); setEditingCollectionId(null); }}>
                  <Trash2 size={13} />
                </button>
              </div>
            </>
          ) : (
            <button
              style={{ ...S.blockChip, width: "100%", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center", ...(activeLibIds.includes(col.id) ? S.blockChipSelected : {}) }}
              onClick={() => toggleLib(col.id)}
            >
              <div>
                <div style={S.exRowName}>{col.name}</div>
                <div style={S.caption}>{plats.filter((p) => p.collectionId === col.id).length} plat(s)</div>
              </div>
              <span onClick={(e) => { e.stopPropagation(); openEditCollection(col); }} style={{ padding: 6 }}>
                <Pencil size={14} />
              </span>
            </button>
          )}
        </div>
      ))}
      {(!collections || collections.length === 0) && !creatingLibrary && (
        <div style={{ ...S.caption, marginBottom: 8 }}>Aucune bibliothèque pour l'instant.</div>
      )}
      {creatingLibrary ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Nom de la nouvelle bibliothèque</div>
          <input style={S.textInput} placeholder="ex : Plats de la semaine" value={quickLibName} onChange={(e) => setQuickLibName(e.target.value)} />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={createQuickLibrary}>Créer</button>
            <button style={S.exportBtnGhost} onClick={() => setCreatingLibrary(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.exportBtnGhost, marginBottom: 12 }} onClick={() => setCreatingLibrary(true)}>
          <Plus size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Nouvelle bibliothèque
        </button>
      )}

      {plats.length > 0 && (
        <button style={{ ...S.exportBtnGhost, marginBottom: 8 }} onClick={() => setExportText(onExportLibrary(activeLibIds.length === 1 ? activeLibIds[0] : null))}>
          <Smartphone size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />
          Exporter la sélection
        </button>
      )}
      {exportText && (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Texte à copier :</div>
          <textarea readOnly style={{ ...S.commentInput, marginBottom: 8 }} rows={4} value={exportText} onFocus={(e) => e.target.select()} />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={() => navigator.clipboard?.writeText(exportText)}>Copier</button>
            <button style={S.exportBtnGhost} onClick={() => setExportText(null)}>Fermer</button>
          </div>
        </div>
      )}
      {showImport ? (
        <div style={S.segmentsBox}>
          <div style={S.goalInputLabel}>Bibliothèque de destination</div>
          <select style={S.textInput} value={importCollectionId} onChange={(e) => setImportCollectionId(e.target.value)}>
            <option value="">Sans bibliothèque</option>
            {(collections || []).map((c) => (
              <option key={c.id} value={c.id}>{collectionLabel(c)}</option>
            ))}
            <option value="__new__">+ Nouvelle bibliothèque...</option>
          </select>
          {importCollectionId === "__new__" && (
            <>
              <div style={S.goalInputLabel}>Nom de la nouvelle bibliothèque</div>
              <input style={S.textInput} placeholder="ex : Bibliothèque de Nathan" value={newCollectionName} onChange={(e) => setNewCollectionName(e.target.value)} />
            </>
          )}
          <div style={{ ...S.goalInputLabel, marginTop: 10 }}>Colle ici le texte de la bibliothèque à importer :</div>
          {importStatus === "ok" && <div style={S.exportStatus}>Bibliothèque importée ✓</div>}
          {importStatus === "error" && <div style={S.exportStatusError}>Texte non reconnu — vérifie qu'il commence bien par ##HAKIFIT-PLATLIB##.</div>}
          <textarea style={{ ...S.commentInput, marginBottom: 8 }} rows={4} value={importText} onChange={(e) => setImportText(e.target.value)} />
          <div style={{ display: "flex", gap: 8 }}>
            <button style={S.createBtn} onClick={handleImport}>Importer</button>
            <button style={S.exportBtnGhost} onClick={() => setShowImport(false)}>Annuler</button>
          </div>
        </div>
      ) : (
        <button style={{ ...S.exportBtnGhost, marginBottom: 12 }} onClick={() => setShowImport(true)}>
          <Inbox size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Importer une bibliothèque de plats
        </button>
      )}

      <div style={S.sectionLabel}>Rechercher</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <div style={{ position: "relative", flex: 1 }}>
          <Search size={15} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#8A5F58" }} />
          <input style={{ ...S.textInput, paddingLeft: 34, marginBottom: 0 }} placeholder="Rechercher un plat dans les bibliothèques sélectionnées ci-dessus" value={search} onChange={(e) => setSearch(e.target.value)} />
        </div>
        <button style={{ ...S.blockChipAdd, ...(showFilters || filter ? S.blockChipSelected : {}) }} onClick={() => setShowFilters((v) => !v)}>
          <Search size={14} style={{ marginRight: 4 }} />Filtres{filter ? " •" : ""}
        </button>
      </div>
      {showFilters && categories.length > 0 && (
        <div style={S.blockChipsRow}>
          <button style={{ ...S.blockChip, ...(!filter ? S.blockChipSelected : {}) }} onClick={() => setFilter(null)}>Tous</button>
          {categories.map((c) => (
            <button key={c} style={{ ...S.blockChip, ...(filter === c ? S.blockChipSelected : {}) }} onClick={() => setFilter(c)}>{c}</button>
          ))}
        </div>
      )}

      <div style={S.programList}>
        {filtered.map((p) => {
          const totals = computeDishTotals(p.components, dishLibrary);
          const col = (collections || []).find((c) => c.id === p.collectionId);
          return (
            <button key={p.id} style={S.sessionLogRow} onClick={() => setForm({ mode: "edit", plat: p })}>
              <div>
                <div style={S.exRowName}>{p.name}</div>
                <div style={S.caption}>
                  {p.category}{totals ? ` · ${totals.calories} kcal (P${totals.protein}/G${totals.carbs}/L${totals.fat})` : ""} · {p.components.length} aliment(s)
                  {col ? ` · ${collectionLabel(col)}` : ""}
                </div>
              </div>
            </button>
          );
        })}
        {filtered.length === 0 && <div style={S.caption}>Aucun plat ne correspond.</div>}
      </div>

      <button
        style={S.createBtn}
        onClick={() => {
          if (!collections || collections.length === 0) { setCreatingLibrary(true); return; }
          setForm({ mode: "create", plat: null });
        }}
      >
        <Plus size={16} /> Ajouter un plat
      </button>
    </div>
  );
}

function PlatLibraryForm({ mode, initial, dishLibrary, onAddToDishLibrary, onCancel, onCreate, onUpdate, onDelete, collections, stores, dishCollections }) {
  const isEdit = mode === "edit";
  const [name, setName] = useState(initial?.name || "");
  const [category, setCategory] = useState(initial?.category || "");
  const [collectionId, setCollectionId] = useState(initial?.collectionId || collections?.[0]?.id || "");
  const [pickingComponent, setPickingComponent] = useState(false);
  const [creatingNewName, setCreatingNewName] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [components, setComponents] = useState(() =>
    (initial?.components || []).map((c) => {
      const aliment = dishLibrary.find((a) => a.id === c.alimentId);
      return { id: uid(), alimentId: c.alimentId, item: aliment?.name || c.item || "", qty: String(c.qty ?? "100"), unit: c.unit || "g" };
    })
  );

  function addComponent() {
    setComponents((cs) => [...cs, { id: uid(), alimentId: null, item: "", qty: "100", unit: "g" }]);
  }
  function updateComponent(id, field, value) {
    setComponents((cs) => cs.map((c) => (c.id === id ? { ...c, [field]: value } : c)));
  }
  function removeComponent(id) {
    setComponents((cs) => cs.filter((c) => c.id !== id));
  }
  function linkComponent(aliment) {
    setComponents((cs) => cs.map((c) => (c.id === pickingComponent ? { ...c, alimentId: aliment.id, item: aliment.name } : c)));
    setPickingComponent(false);
  }

  if (pickingComponent) {
    return (
      <LibraryPicker
        library={getActiveDishLibrary(dishLibrary, stores, dishCollections)}
        title="Aliments"
        groupKey="category"
        onPick={linkComponent}
        onCancel={() => setPickingComponent(false)}
        onCreateNew={onAddToDishLibrary ? (search) => { setPickingComponent(false); setCreatingNewName(search || ""); } : undefined}
      />
    );
  }

  if (creatingNewName !== null) {
    return (
      <DishLibraryForm
        mode="create"
        initial={{ name: creatingNewName }}
        onCancel={() => setCreatingNewName(null)}
        onCreate={(dish) => {
          const saved = { ...dish, id: uid() };
          onAddToDishLibrary(saved);
          setCreatingNewName(null);
          linkComponent(saved);
        }}
        onUpdate={() => {}}
        onDelete={() => {}}
        existingCategories={Array.from(new Set((dishLibrary || []).map((d) => d.category).filter(Boolean)))}
      />
    );
  }

  const totals = computeDishTotals(components, dishLibrary);

  function handleSave() {
    if (!name.trim() || components.length === 0 || !collectionId) return;
    const plat = {
      id: initial?.id,
      name: name.trim(),
      category: category.trim(),
      collectionId,
      components: components.filter((c) => c.alimentId).map((c) => ({ alimentId: c.alimentId, qty: c.qty, unit: c.unit })),
    };
    if (isEdit) onUpdate(plat);
    else onCreate(plat);
  }

  const canSave = name.trim().length > 0 && components.some((c) => c.alimentId) && !!collectionId;

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onCancel}>
        <X size={18} /> Annuler
      </button>
      <div style={S.pageTitle}>{isEdit ? "Modifier le plat" : "Nouveau plat"}</div>

      <div style={S.goalInputLabel}>Nom du plat</div>
      <input style={S.textInput} placeholder="ex : Riz au poulet" value={name} onChange={(e) => setName(e.target.value)} />

      <div style={S.goalInputLabel}>Bibliothèque (obligatoire)</div>
      <select style={S.textInput} value={collectionId} onChange={(e) => setCollectionId(e.target.value)}>
        {(collections || []).map((c) => (
          <option key={c.id} value={c.id}>{c.name}</option>
        ))}
      </select>

      <div style={S.goalInputLabel}>Catégorie</div>
      <input style={S.textInput} placeholder="ex : Plat principal" value={category} onChange={(e) => setCategory(e.target.value)} />

      <div style={S.goalInputLabel}>Composition</div>
      {components.map((c) => (
        <div key={c.id} style={S.setRow}>
          <input style={{ ...S.setInput, width: 56 }} type="number" placeholder="Qté" value={c.qty} onChange={(e) => updateComponent(c.id, "qty", e.target.value)} />
          <select style={{ ...S.setInput, width: 68 }} value={c.unit} onChange={(e) => updateComponent(c.id, "unit", e.target.value)}>
            <option value="g">g</option>
            <option value="kg">kg</option>
            <option value="ml">ml</option>
            <option value="l">l</option>
            <option value="unité">unité</option>
          </select>
          <button style={{ ...S.setInput, flex: 1, textAlign: "left", color: c.alimentId ? "#FFFFFF" : "#8A8378" }} onClick={() => setPickingComponent(c.id)}>
            {c.item || "Aliments"}
          </button>
          <button style={S.setRemoveBtn} onClick={() => removeComponent(c.id)}>
            <Minus size={14} />
          </button>
        </div>
      ))}
      <button style={S.addSetBtn} onClick={addComponent}>
        <Plus size={14} /> Ajouter un aliment
      </button>

      {totals ? (
        <div style={S.platTotalsBox}>
          <div style={S.platTotalsMain}>{totals.calories} kcal</div>
          <div style={S.platTotalsMacros}>
            Protéines {totals.protein} g · Glucides {totals.carbs} g · Lipides {totals.fat} g
          </div>
        </div>
      ) : (
        <div style={{ ...S.caption, marginTop: 10 }}>
          Ajoute des aliments (avec leurs valeurs nutritionnelles) pour voir le total du plat.
        </div>
      )}

      <button style={{ ...S.finishBtn, opacity: canSave ? 1 : 0.4, marginTop: 18 }} disabled={!canSave} onClick={handleSave}>
        <Check size={18} /> {isEdit ? "Enregistrer les modifications" : "Créer le plat"}
      </button>

      {isEdit && onDelete && (
        <div style={{ marginTop: 16, borderTop: "1px solid #332E28", paddingTop: 12 }}>
          {confirmDelete ? (
            <div style={S.confirmDeleteRow}>
              <span style={S.caption}>Supprimer « {name} » ?</span>
              <button style={S.confirmDeleteBtn} onClick={() => onDelete(initial.id)}>Oui, supprimer</button>
              <button style={S.cancelDeleteBtn} onClick={() => setConfirmDelete(false)}>Annuler</button>
            </div>
          ) : (
            <button style={S.deleteProgramBtn} onClick={() => setConfirmDelete(true)}>
              <Trash2 size={13} /> Supprimer ce plat
            </button>
          )}
        </div>
      )}
      <div style={{ height: 24 }} />
    </div>
  );
}

const AVATAR_COLORS = ["#FFC233", "#FF4433", "#7ED957", "#5B9BFF", "#C77DFF", "#FF9F45"];
function avatarColor(name) {
  const s = (name || "?").trim() || "?";
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function Avatar({ name, url, size = 36 }) {
  const initial = (name || "?").trim().charAt(0).toUpperCase() || "?";
  if (url) {
    return (
      <img
        src={url}
        alt={name || "Avatar"}
        style={{ width: size, height: size, borderRadius: "50%", objectFit: "cover", flexShrink: 0, display: "block" }}
      />
    );
  }
  return (
    <div
      style={{
        width: size, height: size, borderRadius: "50%", background: avatarColor(name),
        color: "#191715", display: "flex", alignItems: "center", justifyContent: "center",
        fontWeight: 800, fontSize: Math.round(size * 0.42), flexShrink: 0,
      }}
    >
      {initial}
    </div>
  );
}

}

function ChatView({ friendId, friendName, friendAvatarUrl, myUserId, messages, onLoadMessages, onSendMessage, onBack }) {
  const [draft, setDraft] = useState("");
  const [error, setError] = useState("");
  const [pendingMessages, setPendingMessages] = useState([]); // affichage immédiat, avant confirmation serveur
  const scrollRef = useRef(null);

  useEffect(() => {
    if (!friendId) return;
    async function refresh() {
      const res = await onLoadMessages(friendId);
      if (res?.error) setError(res.error);
      else setError("");
    }
    refresh();

    // Temps réel : dès qu'un message est inséré des deux côtés de cette conversation,
    // on recharge immédiatement au lieu d'attendre le prochain sondage.
    let channel = null;
    if (supabaseClient) {
      channel = supabaseClient
        .channel(`messages-${myUserId}-${friendId}`)
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "messages" },
          (payload) => {
            const m = payload.new;
            // On ignore l'écho de nos propres messages : l'envoi (sendChatMessage) recharge
            // déjà la conversation directement. Déclencher un second rechargement ici créait
            // une course : si cette réponse-ci revenait après coup avec une lecture pas encore
            // à jour, elle effaçait le message qu'on venait d'envoyer.
            if (m.sender_id === friendId && m.recipient_id === myUserId) {
              refresh();
            }
          }
        )
        .subscribe();
    }

    // Sondage de secours (au cas où le temps réel ne serait pas activé sur ce projet).
    const interval = setInterval(refresh, 15000);
    return () => {
      clearInterval(interval);
      if (channel && supabaseClient) supabaseClient.removeChannel(channel);
    };
  }, [friendId]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, pendingMessages]);

  // Dès qu'un message confirmé par le serveur (même contenu, même expéditeur) apparaît
  // dans "messages", on peut retirer sa version locale en attente.
  useEffect(() => {
    if (pendingMessages.length === 0) return;
    setPendingMessages((list) => list.filter((p) => !messages.some((m) => m.sender_id === myUserId && m.content === p.content && m.created_at >= p.created_at)));
  }, [messages]);

  async function handleSend() {
    if (!draft.trim()) return;
    const text = draft;
    setDraft("");
    // Affichage immédiat : le message apparaît tout de suite dans la conversation,
    // sans dépendre du temps de réponse du serveur ni d'un rechargement.
    const localId = `local-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const optimistic = { id: localId, sender_id: myUserId, recipient_id: friendId, content: text, created_at: new Date().toISOString(), pending: true };
    setPendingMessages((list) => [...list, optimistic]);
    const res = await onSendMessage(friendId, text);
    if (res?.error) {
      setError(res.error);
      setDraft(text); // on remet le texte si l'envoi a échoué, pour ne pas le perdre
      setPendingMessages((list) => list.map((p) => (p.id === localId ? { ...p, failed: true, pending: false } : p)));
    } else {
      setError("");
    }
  }

  const allMessages = [...messages, ...pendingMessages];

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Social
      </button>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
        <Avatar name={friendName} url={friendAvatarUrl} size={32} />
        <div style={S.pageTitle}>{friendName}</div>
      </div>
      {error && <div style={{ ...S.caption, color: "#FF4433", marginBottom: 8 }}>{error}</div>}

      <div ref={scrollRef} style={{ ...S.programList, maxHeight: "55vh", overflowY: "auto", marginBottom: 12, gap: 4 }}>
        {allMessages.map((m, i) => {
          const prev = allMessages[i - 1];
          const showDate = !prev || new Date(prev.created_at).toDateString() !== new Date(m.created_at).toDateString();
          const isMine = m.sender_id === myUserId;
          return (
            <div key={m.id}>
              {showDate && (
                <div style={{ textAlign: "center", margin: "10px 0" }}>
                  <span style={S.caption}>
                    {new Date(m.created_at).toLocaleDateString("fr-FR", { weekday: "long", day: "2-digit", month: "short" })}
                  </span>
                </div>
              )}
              <div style={{ display: "flex", flexDirection: "column", alignItems: isMine ? "flex-end" : "flex-start" }}>
                <div
                  className={isMine ? "chat-bubble chat-bubble-sent" : "chat-bubble chat-bubble-received"}
                  style={{ padding: "10px 14px", maxWidth: "78%", fontSize: 15, ...(m.pending ? { opacity: 0.55 } : {}), ...(m.failed ? { border: "1px solid #FF4433" } : {}) }}
                >
                  {m.content}
                </div>
                <span style={{ ...S.caption, fontSize: 10.5, marginTop: 2, marginRight: isMine ? 4 : 0, marginLeft: isMine ? 0 : 4 }}>
                  {m.failed ? "Échec de l'envoi" : m.pending ? "Envoi..." : fmtTime(m.created_at)}
                </span>
              </div>
            </div>
          );
        })}
        {allMessages.length === 0 && <div style={S.caption}>Aucun message pour l'instant.</div>}
      </div>

      <div style={S.goalInputRow}>
        <input
          style={S.goalInput}
          placeholder="Écrire un message..."
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") handleSend(); }}
        />
        <button style={S.goalSaveBtn} onClick={handleSend}>
          <Check size={16} />
        </button>
      </div>
    </div>
  );
}

      allergies: allergiesDraft.trim(),

  function exportMyProfile() {

    if (gym) text += `\nSalle de sport : ${gym.name}${gym.address ? ` (${gym.address})` : ""}`;

    const availLines = WEEK_DAYS.filter((d) => myProfile?.availability?.[d]).map((d) => `${d} : ${myProfile.availability[d]}`);
    if (availLines.length) text += `\nDisponibilités salle :\n${availLines.join("\n")}`;
    if (myProfile?.runningSpot) text += `\nCourse à pied à proximité : ${myProfile.runningSpot}`;
    if (myProfile?.issues) text += `\nProblèmes musculaires / articulaires : ${myProfile.issues}`;
    if (myProfile?.allergies) text += `\nAllergies : ${myProfile.allergies}`;

    text += `\nGros mangeur : ${myProfile?.bigEater ? "Oui" : "Non"}`;
    text += "\n" + packPayload("MYPROFILE", { profile: myProfile });
    onShareText(text);

  const availableDaysCount = WEEK_DAYS.filter((d) => myProfile?.availability?.[d]).length;

  function handleImportClick() {
    fileInputRef.current?.click();

    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        onImportBackup(data);
        setBackupStatus("imported");
      } catch (err) {
        setBackupStatus("import-error");

      setTimeout(() => setBackupStatus(null), 2500);

/* ---------- Bilan journalier ---------- */

function DailyBalanceView({ sessions, meals, mealLogs, stepLogs, myProfile, coachDisplayName, coachFriendId, onSendToCoach, nutritionBlocks, onBack }) {
  const todayStr = new Date().toISOString().slice(0, 10);
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const weightKg = Number(myProfile?.weight) || 0;
  const sex = myProfile?.sex || "";
  const heightCm = Number(myProfile?.heightCm) || 0;
  const activeNutritionBlock = (nutritionBlocks || []).find((b) => b.active);
  const hasNutritionTargets = !!(activeNutritionBlock && (activeNutritionBlock.targetCalories || activeNutritionBlock.targetProtein || activeNutritionBlock.targetCarbs || activeNutritionBlock.targetFat));

  function computeDay(dateStr) {
    const sessionsThatDay = sessions.filter((s) => s.date.slice(0, 10) === dateStr);
    let burnedWorkout = 0;
    let hasWorkoutEstimate = false;
    sessionsThatDay.forEach((s) => {
      const c = estimateSessionCaloriesBurned(s, weightKg, sex);
      if (c != null) {
        burnedWorkout += c;
        hasWorkoutEstimate = true;
      }
    });
    const stepsLog = stepLogs.find((l) => l.date === dateStr);
    const steps = stepsLog?.steps || 0;
    const burnedSteps = estimateStepsCaloriesBurned(steps, weightKg);
    const burnedBMR = estimateBMR(weightKg, sex, heightCm) || 0;
    const eaten = computeDayCaloriesEaten(dateStr, mealLogs, meals);
    const totalBurned = burnedWorkout + burnedSteps + burnedBMR;
    return {
      dateStr, sessionsCount: sessionsThatDay.length, burnedWorkout, hasWorkoutEstimate,
      steps, burnedSteps, burnedBMR, totalBurned,
      eaten: eaten.total, eatenHasUnknown: eaten.hasUnknown, eatenLoggedCount: eaten.loggedCount,
      eatenProtein: eaten.protein, eatenCarbs: eaten.carbs, eatenFat: eaten.fat, eatenHasUnknownMacros: eaten.hasUnknownMacros,
      balance: eaten.total - totalBurned,
    };
  }

  const day = computeDay(selectedDate);

  const historyDates = useMemo(() => {
    const set = new Set();
    sessions.forEach((s) => set.add(s.date.slice(0, 10)));
    stepLogs.forEach((l) => set.add(l.date));
    mealLogs.forEach((l) => set.add(l.date));
    return Array.from(set).sort((a, b) => (a < b ? 1 : -1)).slice(0, 30);
  }, [sessions, stepLogs, mealLogs]);

  function summaryText(dateStr, dayData) {
    let out = `📊 Bilan du ${fmtDate(dateStr)}\n`;
    out += `Calories dépensées (estimation) : ${dayData.totalBurned} kcal (dont ${dayData.burnedBMR} kcal métabolisme de base, ${dayData.burnedSteps} kcal via ${dayData.steps} pas)\n`;
    out += `Calories mangées${dayData.eatenHasUnknown ? " (partiel, repas adaptés/restaurant non comptés)" : ""} : ${dayData.eaten} kcal\n`;
    out += `Bilan : ${dayData.balance > 0 ? "+" : ""}${dayData.balance} kcal\n`;
    return out;
  }

  function sendDay() {
    const text = summaryText(selectedDate, day) + "\nEnvoyé depuis Haki fit";
    onSendToCoach(text);
  }

  function sendWeek() {
    const last7 = historyDates.slice(0, 7).length ? historyDates.slice(0, 7) : [selectedDate];
    let out = `📊 Bilan de la semaine (${last7.length} jour(s))\n\n`;
    let totalBurned = 0, totalEaten = 0;
    last7.forEach((d) => {
      const dd = computeDay(d);
      totalBurned += dd.totalBurned;
      totalEaten += dd.eaten;
      out += `${fmtDate(d)} : ${dd.eaten} mangées / ${dd.totalBurned} dépensées\n`;
    });
    out += `\nTotal : ${totalEaten} kcal mangées / ${totalBurned} kcal dépensées (${totalEaten - totalBurned > 0 ? "+" : ""}${totalEaten - totalBurned})`;
    onSendToCoach(out);
  }

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>
        <ChevronLeft size={18} /> Accueil
      </button>
      <div style={S.pageTitle}>Bilan journalier</div>
      <div style={{ ...S.caption, marginBottom: 14 }}>
        Estimation approximative des calories dépensées (séances + pas) comparées aux calories mangées. Ce n'est pas une mesure médicale précise.
      </div>

      {(!weightKg) && (
        <div style={{ ...S.caption, marginBottom: 10, color: "#FFC233" }}>
          Renseigne ton poids (et ton sexe) dans Ma fiche pour une estimation plus juste.
        </div>
      )}

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <button style={S.dayNavBtn} onClick={() => setSelectedDate((d) => new Date(new Date(d).getTime() - 86400000).toISOString().slice(0, 10))}>
          <ChevronLeft size={16} />
        </button>
        <span style={S.dayNavLabel}>{fmtDate(selectedDate)}{selectedDate === todayStr ? " (aujourd'hui)" : ""}</span>
        <button style={S.dayNavBtn} disabled={selectedDate >= todayStr} onClick={() => setSelectedDate((d) => new Date(new Date(d).getTime() + 86400000).toISOString().slice(0, 10))}>
          <ChevronRight size={16} />
        </button>
      </div>

      <div style={{ ...S.programRowGlow, flexDirection: "column", alignItems: "stretch", gap: 8, marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between" }}>
          <span style={S.caption}>Dépensées</span>
          <span style={{ fontWeight: 700 }}>{day.totalBurned} kcal</span>
        </div>
        <div style={{ ...S.caption, marginTop: -4 }}>
          {day.burnedBMR} kcal métabolisme de base · {day.sessionsCount > 0 ? `${day.sessionsCount} séance(s)` : "Aucune séance"} · {day.steps} pas ({day.burnedSteps} kcal)
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
          <span style={S.caption}>Mangées</span>
          <span style={{ fontWeight: 700 }}>{day.eaten} kcal</span>
        </div>
        {day.eatenHasUnknown && (
          <div style={{ ...S.caption, marginTop: -4 }}>Certains repas adaptés ou au restaurant ne sont pas comptés précisément.</div>
        )}
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: "1px solid #332E28" }}>
          <span style={{ fontWeight: 700 }}>Bilan</span>
          <span style={{ fontWeight: 700, color: day.balance > 0 ? "#FFC233" : "#FFFFFF" }}>
            {day.balance > 0 ? "+" : ""}{day.balance} kcal
          </span>
        </div>
      </div>

      {hasNutritionTargets && (
        <div style={{ ...S.programRowGlow, flexDirection: "column", alignItems: "stretch", gap: 8, marginBottom: 14 }}>
          <span style={{ fontWeight: 700 }}>Objectifs nutritionnels</span>
          {activeNutritionBlock.targetCalories && (
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={S.caption}>Calories</span>
              <span style={{ fontWeight: 700, color: day.eaten > activeNutritionBlock.targetCalories ? "#FFC233" : "#FFFFFF" }}>
                {day.eaten} / {activeNutritionBlock.targetCalories} kcal
              </span>
            </div>
          )}
          {activeNutritionBlock.targetProtein && (
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={S.caption}>Protéines</span>
              <span style={{ fontWeight: 700 }}>{day.eatenProtein} / {activeNutritionBlock.targetProtein} g</span>
            </div>
          )}
          {activeNutritionBlock.targetCarbs && (
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={S.caption}>Glucides</span>
              <span style={{ fontWeight: 700 }}>{day.eatenCarbs} / {activeNutritionBlock.targetCarbs} g</span>
            </div>
          )}
          {activeNutritionBlock.targetFat && (
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={S.caption}>Lipides</span>
              <span style={{ fontWeight: 700 }}>{day.eatenFat} / {activeNutritionBlock.targetFat} g</span>
            </div>
          )}
          {day.eatenHasUnknownMacros && (
            <div style={{ ...S.caption, marginTop: -4 }}>
              Repas adaptés/restaurant : protéines/glucides/lipides non comptés (seules les calories peuvent être estimées manuellement).
            </div>
          )}
        </div>
      )}

      {activeNutritionBlock && !hasNutritionTargets && (
        <div style={{ ...S.caption, marginBottom: 14 }}>
          Définis des objectifs caloriques/macros dans Nutrition → {activeNutritionBlock.name} pour voir ta progression ici.
        </div>
      )}

      {coachFriendId ? (
        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <button style={{ ...S.exportBtn, flex: 1 }} onClick={sendDay}>
            <Users size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Envoyer ce jour à {coachRef(coachDisplayName, "mon coach")}
          </button>
          <button style={{ ...S.exportBtn, flex: 1 }} onClick={sendWeek}>
            <Users size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Envoyer la semaine
          </button>
        </div>
      ) : (
        <div style={{ ...S.caption, marginBottom: 16 }}>
          Choisis un coach dans Paramètres pour pouvoir lui envoyer ce bilan.
        </div>
      )}

      <div style={S.sectionLabel}>Historique</div>
      <div style={S.programList}>
        {historyDates.map((d) => {
          const dd = computeDay(d);
          return (
            <button key={d} style={S.sessionLogRow} onClick={() => setSelectedDate(d)}>
              <div>
                <div style={S.exRowName}>{fmtDate(d)}</div>
                <div style={S.caption}>{dd.eaten} mangées / {dd.totalBurned} dépensées</div>
              </div>
              <span style={{ fontWeight: 700, color: dd.balance > 0 ? "#FFC233" : "#FFFFFF" }}>
                {dd.balance > 0 ? "+" : ""}{dd.balance}
              </span>
            </button>
          );
        })}
        {historyDates.length === 0 && <div style={S.caption}>Aucune donnée pour l'instant.</div>}
      </div>
    </div>
  );
}
